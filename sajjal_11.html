/* ============== كشف تحديث جديد للنظام ============== */
/* بما إن التطبيق مستضاف كملف واحد على GitHub Pages، بنتحقق دوريًا من النسخة المنشورة فعليًا على السيرفر
   ولو لقينا رقم نسخة مختلف عن اللي شغال حاليًا في المتصفح، نظهر بانر تحديث فوق كل الصفحات */
let _updateAvailable=false;
/* اختبار سرعة الإنترنت — بيقيس زمن الاستجابة وسرعة التنزيل الفعلية باستخدام خدمة اختبار سرعة عامة وموثوقة (Cloudflare) */
async function runSpeedTest(){
  const stBtn=byId('btn-speedtest');
  if(stBtn){ stBtn.textContent='⏳'; stBtn.style.pointerEvents='none'; }
  byId('modal-root').innerHTML=`
  <div class="overlay" id="overlay">
    <div class="modal" style="max-width:340px;text-align:center;">
      <div class="modal-head"><h3>📶 اختبار سرعة الإنترنت</h3><button class="icon-btn" id="modal-close">✕</button></div>
      <div id="speedtest-body" style="padding:16px 0;font-size:14px;font-weight:700;color:var(--ink-soft);">⏳ جارٍ قياس زمن الاستجابة وسرعة التنزيل…</div>
    </div>
  </div>`;
  state.modalOpen=true;
  const close=()=>{
    byId('modal-root').innerHTML=''; state.modalOpen=false;
    if(stBtn){ stBtn.textContent='📶'; stBtn.style.pointerEvents=''; }
  };
  byId('modal-close').addEventListener('click',close);
  byId('overlay').addEventListener('click',e=>{ if(e.target.id==='overlay')close(); });
  try{
    const pingStart=performance.now();
    await fetch('https://speed.cloudflare.com/cdn-cgi/trace',{cache:'no-store',mode:'cors'});
    const ping=Math.round(performance.now()-pingStart);
    const dlStart=performance.now();
    const res=await fetch('https://speed.cloudflare.com/__down?bytes=3000000',{cache:'no-store',mode:'cors'});
    const buf=await res.arrayBuffer();
    const dlSec=Math.max((performance.now()-dlStart)/1000,0.05);
    const mbps=((buf.byteLength*8)/1e6)/dlSec;
    const quality=mbps>15?'⚡ ممتازة':mbps>5?'✅ جيدة':mbps>1?'🟡 متوسطة':'🔴 بطيئة';
    const body=byId('speedtest-body');
    if(body)body.innerHTML=`
      <div style="font-size:32px;font-weight:900;color:var(--accent-dark);">${mbps.toFixed(1)} <span style="font-size:14px;">Mbps</span></div>
      <div style="margin-top:4px;font-size:15px;font-weight:800;">${quality}</div>
      <div style="margin-top:10px;font-size:13px;color:var(--ink-soft);">🏓 زمن الاستجابة: ${ping} ms</div>`;
  }catch(e){
    const body=byId('speedtest-body');
    if(body)body.innerHTML=`<div style="color:var(--danger);font-weight:700;">⚠️ تعذّر قياس السرعة — تأكد من اتصالك بالإنترنت</div>`;
  }
  if(stBtn){ stBtn.textContent='📶'; stBtn.style.pointerEvents=''; }
}
async function checkForAppUpdate(){
  try{
    const res=await fetch(window.location.pathname+'?_v='+Date.now(),{cache:'no-store'});
    if(!res.ok)return;
    const html=await res.text();
    const m=html.match(/const\s+APP_VERSION\s*=\s*'([^']+)'/);
    if(m&&m[1]&&m[1]!==APP_VERSION&&!_updateAvailable){
      _updateAvailable=true;
      /* لو فيه نافذة مفتوحة أو المستخدم بيكتب في خانة دلوقتي، منعملش render() فوري عشان منمسحش اللي
         لسه بيكتبه من غير ما يتحفظ — بنكتفي بتنبيه خفيف (toast) مايلمسش أي بيانات، وبانر التحديث
         هيظهر لوحده تلقائيًا أول ما أي render طبيعي يحصل بعد كده (حفظ، تنقل بين صفحات...) */
      const active=document.activeElement;
      const busy=state.modalOpen||(active&&(active.tagName==='INPUT'||active.tagName==='TEXTAREA'));
      if(busy)toast('🔄 يوجد تحديث جديد للنظام — هيظهر تلقائيًا أول ما تخلّص شغلك الحالي');
      else render();
    }
  }catch(e){ /* تجاهل أخطاء الشبكة أثناء الفحص — هنحاول تاني في المرة الجاية */ }
}
function updateBannerHtml(){
  if(!_updateAvailable)return'';
  return `<div class="app-update-banner" id="app-update-banner">
    🔄 يوجد تحديث جديد للنظام — <button type="button" id="btn-app-update-reload">اضغط هنا للتحميل</button>
  </div>`;
}
function historyLoadingBannerHtml(){
  if(state.allHistoryLoaded===false||state.allServiceHistoryLoaded===false){
    return `<div class="app-update-banner" id="app-history-banner" style="background:#B5651D;">
    🔄 جارٍ تحميل الأرشيف الكامل في الخلفية بسبب البحث… البيانات الحديثة (آخر ${FAST_BOOT_MONTHS===1?'شهر':FAST_BOOT_MONTHS+' شهور'}) شغالة دلوقتي، والبحث في السجل القديم هيبقى متاح خلال ثواني
  </div>`;
  }
  return'';
}
setTimeout(checkForAppUpdate,4000);
/* شريط الإصدار — ثابت وظاهر في كل صفحات النظام (شاشة الدخول والتطبيق)، مصدره الوحيد ثوابت APP_NAME/APP_VERSION/APP_BUILD فوق */
(function(){ const vb=document.getElementById('version-bar'); if(vb)vb.textContent=`${APP_NAME} — V${APP_VERSION} — B${APP_BUILD}`; })();
setInterval(checkForAppUpdate,5*60*1000);
/* ============== مزامنة تلقائية دورية للطلبات ============== */
/* المشكلة: زر "↻ تحديث" كان بيحدّث بس لما حد يدوس عليه بنفسه، فلو حد تاني سجّل طلب جديد
   مكانش بيظهر عندي غير لو دوست تحديث بإيدي — حتى لو سبت الصفحة مفتوحة لوحدها لفترة طويلة.
   الحل: نداء fullRefresh() بشكل صامت (من غير toast) بشكل دوري، وكمان لما المستخدم يرجع
   للتاب بعد ما يكون كان في تاب/برنامج تاني، بشرط يكون مسجل دخول ومفيش نافذة (مودال) مفتوحة
   حاليًا عشان منقطعش عليه وهو بيكتب/يعدّل حاجة. */
/* بتشتغل كل دقيقة طول ما التاب فاتح ومسجل دخول */
let _autoRefreshInFlight=false;
/* تنبيه ضعف الاتصال — بدون أي طلب شبكة إضافي خالص: بنقيس زمن نفس عملية المزامنة الصامتة اللي أصلًا
   بتحصل كل دقيقة، فلو استغرقت وقت طويل (أو فشلت) بشكل متكرر، نظهر تنبيه هادئ فوق الصفحة تلقائيًا،
   من غير ما تحتاج تدخلي "فحص السرعة" بنفسك ومن غير أي تحميل إضافي على النظام */
const SLOW_CONNECTION_MS=6000;
let _slowStreak=0,_failStreak=0;
function setConnectionQuality(q){
  if(state.connectionQuality===q)return;
  state.connectionQuality=q;
  render();
}
async function silentAutoRefresh(){
  if(_autoRefreshInFlight)return;
  if(!state.currentUser||state.modalOpen)return;
  if(document.hidden)return;
  if(!navigator.onLine){ setConnectionQuality('offline'); return; }
  /* لو المستخدم دلوقتي بيكتب في أي خانة (ملاحظات، مكان تسكين، بحث...)، نأجّل التحديث الصامت للدورة
     الجاية — عشان التحديث (اللي بيعيد بناء الصفحة كاملة) ما يمسحش اللي لسه بيكتبه ولسه ما اتحفظش */
  const active=document.activeElement;
  if(active&&(active.tagName==='INPUT'||active.tagName==='TEXTAREA'))return;
  _autoRefreshInFlight=true;
  const startedAt=performance.now();
  try{
    await fullRefresh();
    const elapsed=performance.now()-startedAt;
    _failStreak=0;
    if(elapsed>SLOW_CONNECTION_MS){ _slowStreak++; if(_slowStreak>=2)setConnectionQuality('slow'); }
    else{ _slowStreak=0; setConnectionQuality('good'); }
    render();
  }catch(e){
    /* تجاهل أخطاء الشبكة أثناء المزامنة الصامتة — هنحاول تاني في المرة الجاية، بس لو تكررت الأخطاء
       نظهر تنبيه ضعف اتصال بدل ما نسيب المستخدم من غير أي إشارة إن فيه مشكلة */
    _failStreak++; if(_failStreak>=2)setConnectionQuality('slow');
  }
  _autoRefreshInFlight=false;
}
setInterval(silentAutoRefresh,60*1000);
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){ checkForAppUpdate(); silentAutoRefresh(); }
});
window.addEventListener('focus',()=>{ silentAutoRefresh(); });
/* تسجيل Service Worker — لتفعيل التثبيت كتطبيق (PWA) */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
/* اختصارات لوحة المفاتيح: F2 لفتح شاشة "تسجيل طلب جديد"، / أو Ctrl+K للبحث الفوري، ؟ لعرض قائمة الاختصارات، ESC لإغلاق أي نافذة (مودال) مفتوحة */
document.addEventListener('keydown',(e)=>{
  const typingInField=['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.isContentEditable;
  if(e.key==='F2'){
    if(state.modalOpen||!state.currentUser||!canAddOrders())return;
    e.preventDefault();
    openOrderModal();
  }else if(!typingInField&&(e.key==='/'||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'))){
    if(state.modalOpen||!state.currentUser)return;
    e.preventDefault();
    if(state.view!=='registry'){ state.view='registry'; render(); }
    const si=byId('registry-search-input');
    if(si){ si.focus(); si.select(); }
  }else if(!typingInField&&e.key==='?'){
    if(state.modalOpen||!state.currentUser)return;
    e.preventDefault();
    openShortcutsModal();
  }else if(e.key==='Escape'){
    if(document.getElementById('col-filter-dropdown')){ closeColumnFilterDropdown(); return; }
    if(!state.modalOpen)return;
    e.preventDefault();
    byId('modal-root').innerHTML='';
    state.modalOpen=false;
  }
});
document.addEventListener('click',()=>{ closeColumnFilterDropdown(); });
if(new URLSearchParams(window.location.search).get('track')==='1'){ bootTrackPage(); } else { boot(); }
</script>
