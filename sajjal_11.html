/* نفس إصلاح loadMonthOrThrow بالظبط، لكن لجدول الخدمات الإضافية — بترمي خطأ صريح لو التحميل فشل فعليًا،
   بدل ما ترجّع [] بصمت وتخلي أي حفظ لاحق يمسح شهر كامل من الخدمات بالغلط */
async function loadServiceMonthOrThrow(m){
  const r=await fetch(`${SB_URL}/rest/v1/sajjal_store?key=eq.${encodeURIComponent('service-orders:'+m)}&select=value`,{headers:SB_HDR});
  if(!r.ok)throw new Error('تعذّر تحميل بيانات شهر الخدمات '+m+' (HTTP '+r.status+')');
  const d=await r.json();
  if(!d||!d.length)return [];
  return d[0].value?JSON.parse(d[0].value):[];
}
async function saveServiceMonth(m,list){
  return await storageSetRetry('service-orders:'+m,JSON.stringify(list),true);
}
function serviceMonthKeyOf(so){
  return (so.date||'').slice(0,7)||new Date(so.createdAt||Date.now()).toISOString().slice(0,7);
}
/* ترقية آمنة تلقائية لمرة واحدة: لو لقى الفهرس الشهري فاضي والنسخة القديمة (ملف واحد) فيها بيانات،
   يقسمها على شهور ويحفظها بالنظام الجديد. النسخة القديمة بتفضل موجودة زي ما هي (مش بتتمسح) كنسخة أمان احتياطية،
   وبكده مفيش أي احتمال ضياع بيانات حتى لو حصل أي خطأ أثناء الترقية. */
async function migrateServiceOrdersIfNeeded(){
  try{
    const idx=await loadServiceIndex();
    if(idx.length)return;
    const legacy=await sbGet('service-orders');
    if(!legacy||!legacy.value)return;
    const list=JSON.parse(legacy.value);
    if(!Array.isArray(list)||!list.length)return;
    const byMonth={};
    list.forEach(so=>{
      const mk=so.monthKey||serviceMonthKeyOf(so);
      (byMonth[mk]=byMonth[mk]||[]).push({...so,monthKey:mk});
    });
    const months=Object.keys(byMonth).sort();
    for(const m of months){ await saveServiceMonth(m,byMonth[m]); }
    await saveServiceIndex(months);
  }catch(e){ console.error('service orders migration failed',e); }
}
async function loadAllServiceOrders(){
  await migrateServiceOrdersIfNeeded();
  const idx=await loadServiceIndex(); state.serviceMonthIndex=idx;
  if(!idx.length)return [];
  const lists=await Promise.all(idx.map(m=>loadServiceMonth(m)));
  return lists.flat();
}
const FAST_BOOT_SERVICE_MONTHS=1;
async function loadRecentServiceOrders(){
  await migrateServiceOrdersIfNeeded();
  const idx=await loadServiceIndex(); state.serviceMonthIndex=idx;
  if(!idx.length){ state._loadedServiceMonths=new Set(); return []; }
  const recent=[...idx].sort().slice(-FAST_BOOT_SERVICE_MONTHS);
  const lists=await Promise.all(recent.map(m=>loadServiceMonth(m)));
  state._loadedServiceMonths=new Set(recent);
  return lists.flat();
}
async function loadRemainingServiceOrdersInBackground(){
  const idx=state.serviceMonthIndex||[];
  const loaded=state._loadedServiceMonths||new Set();
  const remaining=idx.filter(m=>!loaded.has(m));
  if(!remaining.length){ state.allServiceHistoryLoaded=true; return; }
  state.allServiceHistoryLoaded=false;
  try{
    const lists=await Promise.all(remaining.map(m=>loadServiceMonth(m)));
    const extra=lists.flat();
    state.serviceOrders=[...state.serviceOrders,...extra];
    remaining.forEach(m=>loaded.add(m));
    state._loadedServiceMonths=loaded;
  }catch(e){}
  state.allServiceHistoryLoaded=true;
  render();
}
async function ensureServiceMonthIndexed(monthKey){
  let idx=state.serviceMonthIndex&&state.serviceMonthIndex.length?state.serviceMonthIndex:await loadServiceIndex();
  if(!idx.includes(monthKey)){ idx=[...idx,monthKey].sort(); await saveServiceIndex(idx); state.serviceMonthIndex=idx; }
}
async function addServiceOrder(payload,silent){
  const now=Date.now();
  const monthKey=serviceMonthKeyOf({date:payload.date,createdAt:now});
  const newSO={id:genId(),createdAt:now,monthKey,lastEditedBy:currentUserName(),lastEditedAt:nowIso(),...payload};
  await ensureServiceMonthIndexed(monthKey);
  let fresh;
  try{ fresh=await loadServiceMonthOrThrow(monthKey); }
  catch(e){ toast('تعذّر الحفظ (مشكلة اتصال) — حاول تاني بعد ثواني','error',6000); return false; }
  const ok=await saveServiceMonth(monthKey,[...fresh,newSO]);
  if(ok){ state.serviceOrders=[...state.serviceOrders,newSO]; addAudit(`إضافة خدمة ${newSO.receiptNo||''}`); render(); if(!silent)toast('تم تسجيل الخدمة'); }
  else toast(saveFailMsg('خطأ في الحفظ'),'error');
  return ok;
}
async function updateServiceOrder(id,patch,msg){
  const so=state.serviceOrders.find(x=>x.id===id);
  if(!so){ toast('السجل غير موجود','error'); return false; }
  const monthKey=so.monthKey||serviceMonthKeyOf(so);
  const changes=describeChanges(so,patch);
  let fresh;
  try{ fresh=await loadServiceMonthOrThrow(monthKey); }
  catch(e){ toast('تعذّر تحميل بيانات الشهر للتأكد قبل الحفظ (مشكلة اتصال) — حاول تاني','error',6000); return false; }
  const auditPatch={lastEditedBy:currentUserName(),lastEditedAt:nowIso()};
  const updated=fresh.map(x=>x.id===id?{...x,...patch,...auditPatch}:x);
  const ok=await saveServiceMonth(monthKey,updated);
  if(ok){
    state.serviceOrders=state.serviceOrders.map(x=>x.id===id?{...x,...patch,...auditPatch}:x);
    addAudit(`تعديل خدمة ${patch.receiptNo||so.receiptNo||''}${changes?' — '+changes:''}`);
    render(); if(msg)toast(msg);
  } else toast(saveFailMsg('خطأ في الحفظ'),'error');
  return ok;
}
async function deleteServiceOrder(id,silent){
  const so=state.serviceOrders.find(x=>x.id===id);
  if(!so)return false;
  const monthKey=so.monthKey||serviceMonthKeyOf(so);
  let fresh;
  try{ fresh=await loadServiceMonthOrThrow(monthKey); }
  catch(e){ if(!silent)toast('تعذّر الحذف (مشكلة اتصال) — حاول تاني','error',5000); return false; }
  const ok=await saveServiceMonth(monthKey,fresh.filter(x=>x.id!==id));
  if(ok){
    state.serviceOrders=state.serviceOrders.filter(x=>x.id!==id);
    /* addAudit دايمًا (حتى لو silent) عشان يفضل فيه أثر واضح في سجل التدقيق لأي حذف تلقائي —
       بس التراجع (Undo) وتنبيه الشاشة بيتشالوا لو silent، عشان الحذف التلقائي (زي مزامنة الخدمات
       المرتبطة بطلب فاكيوم) ميضايقش المستخدم بتنبيهات مالهاش لازمة */
    addAudit(`حذف خدمة ${so.receiptNo||''}${silent?' (تلقائي)':''}`);
    if(!silent){
      render();
      state.lastDeletedService=so;
      toastWithAction('تم حذف السجل','تراجع',restoreDeletedService);
    }
  }
  else if(!silent) toast('خطأ في الحذف','error');
  return ok;
}
async function restoreDeletedService(){
  const so=state.lastDeletedService;
  if(!so){ toast('لا يوجد شيء للتراجع عنه','error'); return; }
  state.lastDeletedService=null;
  const monthKey=so.monthKey||serviceMonthKeyOf(so);
  await ensureServiceMonthIndexed(monthKey);
  let fresh;
  try{ fresh=await loadServiceMonthOrThrow(monthKey); }
  catch(e){ toast('تعذّر استرجاع السجل (مشكلة اتصال) — حاول تاني','error',5000); return; }
  const ok=await saveServiceMonth(monthKey,[...fresh,so]);
  if(!ok){ toast('تعذّر استرجاع السجل','error'); return; }
  state.serviceOrders=[...state.serviceOrders,so];
  addAudit(`استرجاع خدمة محذوفة ${so.receiptNo||''}`);
  render();
  toast('تم استرجاع السجل بنجاح');
}

/* ==============================================================================================
   إصلاح حرج (30 أغسطس 2026): كل دوال "اقرأ بيانات الشهر، عدّل عليها، احفظها تاني" (تعديل طلب، حذف،
   إرسال واتساب، إلخ...) كانت بتستخدم loadMonth() العادية، واللي بترجّع [] بصمت لو فشل التحميل لأي سبب
   (نت بطيء، مشكلة مؤقتة في الاتصال بقاعدة البيانات...) — فلو التحميل فشل في نفس لحظة حفظ تعديل بسيط،
   الكود كان بيحفظ [] (شهر فاضي) فوق الشهر كله، وده بيمسح كل طلبات الشهر ده فعليًا! ده السبب اللي وراه
   اختفاء كل الطلبات فجأة. loadMonthOrThrow() بترمي خطأ صريح لو التحميل فشل فعلاً (نت/سيرفر)، بدل ما
   ترجّع [] بصمت، عشان أي عملية حفظ حرجة توقف فورًا وتنبّه المستخدم بدل ما تدمّر بيانات موجودة فعلاً */
async function loadMonthOrThrow(m){
  const r=await fetch(`${SB_URL}/rest/v1/sajjal_store?key=eq.${encodeURIComponent('orders:'+m)}&select=value`,{headers:SB_HDR});
  if(!r.ok)throw new Error('تعذّر تحميل بيانات الشهر '+m+' (HTTP '+r.status+')');
  const d=await r.json();
  if(!d||!d.length)return []; // الشهر ده فعلاً لسه مفيهوش أي طلبات — مش فشل، ده رد ناجح وصحيح
  return d[0].value?JSON.parse(d[0].value):[];
}

/* ============== تحميل خفيف عند فتح البرنامج — بيجيب بس آخر 3 شهور فورًا (سريع)، وبعدين يكمّل تحميل باقي
   الأرشيف القديم في الخلفية من غير ما يعطّل الشغل. النتيجة: فتح البرنامج بيبقى سريع من أول لحظة حتى لو
   تراكمت سنين من البيانات، وبرضو البحث/التقارير بتفضل شغالة على كل التاريخ بمجرد ما يخلص التحميل الخلفي ============== */
const FAST_BOOT_MONTHS=1;
async function loadRecentOrders(){
  const idx=await loadIndex(); state.monthIndex=idx;
  if(!idx.length){ state._loadedMonths=new Set(); return []; }
  const recent=[...idx].sort().slice(-FAST_BOOT_MONTHS);
  const lists=await Promise.all(recent.map(m=>loadMonth(m)));
  state._loadedMonths=new Set(recent);
  return lists.flat();
}
/* بيتنادى من أي مربع بحث (رقم السند/الاسم/الجوال) في أي صفحة — أول مرة حد يكتب حاجة، يشغّل تحميل باقي
   الأرشيف القديم في الخلفية (مرة واحدة بس لكل جلسة)، عشان البحث يقدر يوصل لأي طلب قديم مهما كان تاريخه.
   بترجّع Promise يتخلّص (resolve) لما التحميل يخلص، عشان أي كود حرج (زي التحقق من تكرار رقم السند) يقدر
   ينتظره فعليًا بدل ما يشتغل على بيانات ناقصة (آخر شهر بس) */
let _fullHistoryLoadTriggered=false;
let _fullHistoryLoadPromise=null;
function triggerFullHistoryLoadIfNeeded(){
  if(state.allHistoryLoaded===true)return Promise.resolve();
  if(!_fullHistoryLoadTriggered){
    _fullHistoryLoadTriggered=true;
    _fullHistoryLoadPromise=Promise.all([loadRemainingOrdersInBackground(),loadRemainingServiceOrdersInBackground()])
      .finally(()=>{ _fullHistoryLoadPromise=null; });
  }
  return _fullHistoryLoadPromise||Promise.resolve();
}
async function loadRemainingOrdersInBackground(){
  const idx=state.monthIndex||[];
  const loaded=state._loadedMonths||new Set();
  const remaining=idx.filter(m=>!loaded.has(m));
  if(!remaining.length){ state.allHistoryLoaded=true; return; }
  state.allHistoryLoaded=false;
  render();
  try{
    const lists=await Promise.all(remaining.map(m=>loadMonth(m)));
    const extra=lists.flat();
    state.orders=[...state.orders,...extra];
    remaining.forEach(m=>loaded.add(m));
    state._loadedMonths=loaded;
  }catch(e){}
  state.allHistoryLoaded=true;
  render();
}

function genId(){ return 'o_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); }

async function addOrder(payload){
  const now=Date.now();
  const monthKey=new Date(now).toISOString().slice(0,7);
  const newOrder={id:genId(),createdAt:now,monthKey,createdBy:currentUserName(),
    lastEditedBy:currentUserName(), lastEditedAt:nowIso(),
    ...payload};
  let idx=state.monthIndex.length?state.monthIndex:await loadIndex();
  if(!idx.includes(monthKey)){ idx=[...idx,monthKey].sort(); await saveIndex(idx); state.monthIndex=idx; }
  let fresh;
  try{ fresh=await loadMonthOrThrow(monthKey); }
  catch(e){ toast('تعذّر التأكد من بيانات الشهر قبل الحفظ (مشكلة اتصال) — حاول تاني بعد ثواني','error',6000); return false; }
  const ok=await saveMonth(monthKey,[...fresh,newOrder]);
  if(ok){ state.orders=[...state.orders,newOrder]; addAudit(`إضافة طلب ${newOrder.receiptNo||''}`); render(); toast('تم تسجيل الطلب'); }
  else toast(saveFailMsg('خطأ في الحفظ'),'error');
  return ok;
}
async function updateOrder(id,patch,msg,opts){
  const order=state.orders.find(o=>o.id===id);
  if(!order){ toast('الطلب غير موجود','error'); return false; }
  /* مهلة الـ5 دقائق مقصودة بس للتعديلات العامة على الطلب (زي بيانات العميل)، مش لكتابة الكمية المصنعة —
     دي ليها صلاحية مستقلة خاصة بيها (canEditQtyMfg) بتحكمها لوحدها، فمينفعش نفس المهلة تمنعها كمان */
  if(!(opts&&opts.bypassSelfEditWindow)&&!canEditOwnOrder(order)){ toast('التعديل مقفول — الطلب ده مش من تسجيلك، تواصل مع المسؤول لفتح التعديل','error',5000); return false; }
  const changes=describeChanges(order,patch);
  const auditPatch={ lastEditedBy:currentUserName(), lastEditedAt:nowIso() };
  let fresh;
  try{ fresh=await loadMonthOrThrow(order.monthKey); }
  catch(e){ toast('تعذّر تحميل بيانات الشهر للتأكد قبل الحفظ (مشكلة اتصال) — حاول تاني بعد ثواني','error',6000); return false; }
  const updated=fresh.map(o=>o.id===id?{...o,...patch,...auditPatch}:o);
  const ok=await saveMonth(order.monthKey,updated);
  if(ok){
    state.orders=state.orders.map(o=>o.id===id?{...o,...patch,...auditPatch}:o);
    addAudit(`تعديل طلب ${patch.receiptNo||order.receiptNo||''}${changes?' — '+changes:''}`);
    render(); if(msg)toast(msg);
  } else toast(saveFailMsg('خطأ في الحفظ'),'error');
  return ok;
}
/* ============== الأرشفة التلقائية للطلبات المسلَّمة القديمة — لتخفيف حِمل جدول سجل الطلبات مع تراكم البيانات بمرور الوقت ============== */
async function archiveOldDeliveredOrders(){
  const toArchive=state.orders.filter(isArchivable);
  if(!toArchive.length){ toast('لا توجد طلبات قابلة للأرشفة حاليًا'); return; }
  toast('جارٍ الأرشفة…');
  const byMonth={};
  toArchive.forEach(o=>{ (byMonth[o.monthKey]=byMonth[o.monthKey]||[]).push(o.id); });
  const idSet=new Set(toArchive.map(o=>o.id));
  let allOk=true;
  for(const mk of Object.keys(byMonth)){
    let fresh;
    try{ fresh=await loadMonthOrThrow(mk); }
    catch(e){ allOk=false; continue; }
    const updated=fresh.map(o=>idSet.has(o.id)?{...o,archived:true,archivedAt:nowIso()}:o);
    const ok=await saveMonth(mk,updated);
    if(!ok)allOk=false;
  }
  state.orders=state.orders.map(o=>idSet.has(o.id)?{...o,archived:true,archivedAt:nowIso()}:o);
  addAudit(`أرشفة تلقائية لـ ${toArchive.length} طلب مُسلَّم أقدم من ${ARCHIVE_AFTER_DAYS} يوم`);
  render();
  toast(allOk?`تمت أرشفة ${toArchive.length} طلب بنجاح`:'تمت الأرشفة جزئيًا — حدث خطأ في بعض الأشهر','ok',4000);
}

  let n=(mobile||'').replace(/[^0-9]/g,'');
  if(n.startsWith('00966'))n=n.slice(2);
  if(n.startsWith('966'))return n;
  if(n.startsWith('0'))n=n.slice(1);
  return '966'+n;
}

async function deleteOrderById(id){
  const order=state.orders.find(o=>o.id===id);
  if(!order)return false;
  let fresh;
  try{ fresh=await loadMonthOrThrow(order.monthKey); }
  catch(e){ toast('تعذّر الحذف (مشكلة اتصال) — حاول تاني','error',5000); return false; }
  const ok=await saveMonth(order.monthKey,fresh.filter(o=>o.id!==id));
  if(ok){
    state.orders=state.orders.filter(o=>o.id!==id);
    addAudit(`حذف طلب ${order.receiptNo||''}`);
    /* حذف الخدمات الإضافية المرتبطة تلقائيًا (حشو لوز / تقعيم تمور) — تُحفظ نسخة منها للتراجع */
    let linked=[];
    if(order.processingType==='فاكيوم'&&order.receiptNo){
      linked=state.serviceOrders.filter(so=>so.receiptNo===order.receiptNo&&(so.serviceSource||'manual')==='auto');
      for(const so of linked) await deleteServiceOrder(so.id,true);
      if(linked.length) addAudit(`حذف ${linked.length} خدمة إضافية مرتبطة برقم ${order.receiptNo}`);
    }

async function restoreDeletedOrder(){
  const d=state.lastDeletedOrder;
  if(!d){ toast('لا يوجد شيء للتراجع عنه','error'); return; }
  state.lastDeletedOrder=null;
  let fresh;

  catch(e){ toast('تعذّر استرجاع الطلب (مشكلة اتصال) — حاول تاني','error',5000); return; }
  const ok=await saveMonth(d.order.monthKey,[...fresh,d.order]);
  if(!ok){ toast('تعذّر استرجاع الطلب','error'); return; }
  state.orders=[...state.orders,d.order];
  if(d.linked&&d.linked.length){
    const byMonth={};
    d.linked.forEach(so=>{ const mk=so.monthKey||serviceMonthKeyOf(so); (byMonth[mk]=byMonth[mk]||[]).push(so); });
    for(const mk of Object.keys(byMonth)){
      await ensureServiceMonthIndexed(mk);
      try{
        const freshSO=await loadServiceMonthOrThrow(mk);
        await saveServiceMonth(mk,[...freshSO,...byMonth[mk]]);
      }catch(e){ toast('تعذّر استرجاع بعض الخدمات المرتبطة (مشكلة اتصال)','error',5000); }
    }

/* التحديث اليدوي (زر ↻ تحديث) — بيحدّث بس الشهر الحالي والي قبله (فين بيحصل 95% من التغييرات الحقيقية:
   طلبات جديدة، تغيير حالة، تصنيع...)، مش كل تاريخ المصنع من الأول؛ ده بيخلي الزر سريع دايمًا
   حتى لو تراكمت سنين من البيانات، بدل ما يرجع لأداء بطيء زي التحميل الأول قبل تحسين الإقلاع السريع */
async function fullRefresh(){
  const idx=await loadIndex(); state.monthIndex=idx;
  const now=new Date();
  const months=[now.toISOString().slice(0,7),new Date(now.getFullYear(),now.getMonth()-1,1).toISOString().slice(0,7)];
  const toRefresh=idx.filter(m=>months.includes(m));
  if(toRefresh.length){
    const lists=await Promise.all(toRefresh.map(m=>loadMonth(m)));
    const merged=state.orders.filter(o=>!toRefresh.includes(o.monthKey));
    lists.forEach(l=>l.forEach(o=>merged.push(o)));
    state.orders=merged;
    const loaded=state._loadedMonths||new Set();
    toRefresh.forEach(m=>loaded.add(m));
    state._loadedMonths=loaded;
  }
  const svcIdx=await loadServiceIndex(); state.serviceMonthIndex=svcIdx;
  const svcToRefresh=svcIdx.filter(m=>months.includes(m));
  if(svcToRefresh.length){
    const svcLists=await Promise.all(svcToRefresh.map(m=>loadServiceMonth(m)));
    const svcMerged=state.serviceOrders.filter(so=>!svcToRefresh.includes(so.monthKey));
    svcLists.forEach(l=>l.forEach(so=>svcMerged.push(so)));
    state.serviceOrders=svcMerged;
    const svcLoaded=state._loadedServiceMonths||new Set();
    svcToRefresh.forEach(m=>svcLoaded.add(m));
    state._loadedServiceMonths=svcLoaded;
  }
  state.lastSync=nowTimeStr();
}

/* الطلب "متأخر" يُحتسب في التحذيرات والإحصائيات طالما لم تُسجَّل له كمية مصنعة بعد ولم يُسلَّم —
   بمجرد ما يتسجل رقم في الكمية المصنعة، الطلب يخرج من عداد المتأخرة تلقائيًا حتى لو لسه ما اتسلمش (نفس منطق المستعجلة) */
function isOverdue(o){
  if(!o.date||o.status==='تم التسليم'||(o.qtyMfg||'').toString().trim())return false;
  const created=new Date(o.date);
  const diff=(Date.now()-created.getTime())/(1000*60*60*24);
  return diff>25;
}
/* الطلب "مستعجل" يُحتسب في التحذيرات والإحصائيات طالما لم تُسجَّل له كمية مصنعة بعد ولم يُسلَّم —
   بمجرد ما يتسجل رقم في الكمية المصنعة، الطلب يخرج من عداد المستعجلة تلقائيًا حتى لو لسه ما اتسلمش */
/* الكمية المستلمة الإجمالية للسند — تجمع الكمية الأساسية مع كل الطلبات الإضافية المرتبطة بنفس السند
   (لو العميل قسّم الكمية على أكتر من حجم عبوة/كرتون) */
function orderTotalQtyCartons(o){
  const base=Number(o.qtyCartons)||0;
  const extra=(o.extraItems||[]).reduce((s,it)=>s+(Number(it.qtyCartons)||0),0);
  return base+extra;
}
function isUrgentPending(o){
  return !!o.urgent&&o.status!=='تم التسليم'&&!(o.qtyMfg||'').toString().trim();
}
function arabicDaysLabel(n){
  if(n<=0)return'أقل من يوم';
  if(n===1)return'يوم واحد';
  if(n===2)return'يومين';
  if(n<=10)return`${n} أيام`;
  return`${n} يوم`;
}
function overdueBadge(o){
  if(!isOverdue(o))return'';
  const daysSince=Math.floor((Date.now()-new Date(o.date).getTime())/(1000*60*60*24));
  return`<span class="overdue-badge"><span class="warn-icon">⚠️</span>متأخر منذ ${arabicDaysLabel(daysSince-25)}</span>`;
}
/* تنبيه مبكر — الطلب قارب على التأخير (بين 18 و25 يوم) ولم يُسلَّم ولم تُسجَّل له كمية مصنعة بعد */
function isNearingDelay(o){
  if(!o.date||o.status==='تم التسليم'||(o.qtyMfg||'').toString().trim())return false;
  const diff=(Date.now()-new Date(o.date).getTime())/(1000*60*60*24);
  return diff>=18&&diff<=25;
}
function nearingDelayBadge(o){
  if(!isNearingDelay(o))return'';
  const daysSince=Math.floor((Date.now()-new Date(o.date).getTime())/(1000*60*60*24));
  const remaining=Math.max(0,25-daysSince);
  return`<span class="nearing-badge"><span class="warn-icon">🟡</span>متبقي ${arabicDaysLabel(remaining)} على التأخير</span>`;
}

/* ترتيب مواقع التسكين: الصف الأول ثم العمود — 1-1, 1-2, 1-3, 2-1, 2-2... */
function parsePlacement(loc){
  const m=(loc||'').trim().match(/^(\d+)\s*-\s*(\d+)$/);
  if(!m)return{row:9999,col:9999};
  return{row:parseInt(m[1],10),col:parseInt(m[2],10)};
}
function sortByPlacement(list){
  return [...list].sort((a,b)=>{
    const pa=parsePlacement(a.placementLocation),pb=parsePlacement(b.placementLocation);
    if(pa.row!==pb.row)return pa.row-pb.row;
    return pa.col-pb.col;
  });
}
/* عدد الأيام منذ تاريخ التصنيع إن وُجد، وإلا منذ تاريخ استلام الطلب */
function daysInWarehouse(o){
  const refDate=o.mfgDate||o.date;
  if(!refDate)return 0;
  const created=new Date(refDate);
  return Math.max(0,Math.floor((Date.now()-created.getTime())/(1000*60*60*24)));
}
/* طلب "راكد" في المستودع — موجود بالمستودع (له موقع تسكين) ولسه ما اتسلّمش، وعدّى عليه 25 يوم أو أكتر بدون خروج */
const STAGNANT_WAREHOUSE_DAYS=25;
function isStagnantInWarehouse(o){
  if(!(o.placementLocation||'').trim()||o.status==='تم التسليم')return false;
  return daysInWarehouse(o)>=STAGNANT_WAREHOUSE_DAYS;
}
/* أرشفة تلقائية — طلب "قابل للأرشفة" لو اتسلّم فعلاً وعدّى على تاريخه أكتر من 6 شهور، ولسه مش مؤرشف */
const ARCHIVE_AFTER_DAYS=180;
function isArchivable(o){
  if(o.archived||o.status!=='تم التسليم'||!o.date)return false;
  const diff=(Date.now()-new Date(o.date).getTime())/(1000*60*60*24);
  return diff>ARCHIVE_AFTER_DAYS;
}
/* نجمة حمراء صغيرة تظهر أعلى يسار رقم السند لو فيه ملاحظة و/أو تسعير محفوظ من "حاسبة الأسعار" لهذا السند */
function receiptPricingNoteBadge(o){

  if(!pc)return'';

}
/* عداد صغير: عدد الأيام بدون تصنيع (من تاريخ الطلب لحد الآن)، ولو تم التصنيع يتجمّد على عدد الأيام التي استغرقها */
function daysWithoutMfgBadge(o){
  if(!o||!o.date)return'';
  const start=new Date(o.date);
  if(isNaN(start))return'';
  if((o.qtyMfg||'').toString().trim()){
    const end=o.mfgDate?new Date(o.mfgDate):new Date();
    const days=Math.max(0,Math.floor((end.getTime()-start.getTime())/(1000*60*60*24)));
    return `<div class="days-counter days-counter-done">✓ استغرق ${days} يوم للتصنيع</div>`;
  }
  const days=Math.max(0,Math.floor((Date.now()-start.getTime())/(1000*60*60*24)));
  const cls=days>25?'days-counter-danger':(days>=18?'days-counter-warn':'days-counter-ok');
  return `<div class="days-counter ${cls}">${days} يوم بدون تصنيع</div>`;
}
/* عرض الكمية المستلمة بشارة صفراء */
function qtyReceivedHtml(o){

/* عرض الكمية المصنعة (للقراءة فقط) — أكبر وبولد، مع تاريخ التصنيع تحتها إن وُجد */
/* لو طلب الفاكيوم ده مرتبط برقم سند خدمة إضافية (تقعيم تمور / حشو لوز...) اتسلَّمت بالفعل من قسم الخدمات،
   بنجيب الكمية والتاريخ اللي كتبهم قسم الخدمات عشان نعرضهم كمعلومة فوق خانة "الكمية المصنعة" الخاصة
   بالفاكيوم — من غير ما نملأ خانة الفاكيوم نفسها، لأن قسم الفاكيوم بيكتب رقمه هو بنفسه */
function linkedServiceMfgInfo(o){
  if(o.processingType!=='فاكيوم'||!(o.receiptNo||'').trim())return[];
  return state.serviceOrders.filter(so=>so.receiptNo===o.receiptNo&&so.status==='تم التسليم'&&(so.qtyMfg||'').toString().trim())
    .map(so=>({qty:so.qtyMfg,date:so.mfgDate||so.statusDate||so.date,type:so.serviceType||''}));
}
function linkedServiceMfgHtml(o){
  const infos=linkedServiceMfgInfo(o);
  if(!infos.length)return'';
  return infos.map(inf=>`<div class="qty-mfg-service-note">📥 تم تصنيع ${escapeHtml(inf.qty)}${inf.type?` (${escapeHtml(inf.type)})`:''}<div class="qty-mfg-date" style="color:#1F6FA8;">من الخدمات الإضافية · ${inf.date?formatDate(inf.date):'—'}</div></div>`).join('');
}
function qtyMfgDisplayHtml(o){
  const svcNote=linkedServiceMfgHtml(o);

    return `${svcNote}<span class="qty-mfg-empty">لم تُكتب بعد</span>`;

  const statusLine=(o.status==='جاهز للتسليم'||o.status==='تم التسليم')&&o.statusDate
    ?`<div class="qty-mfg-date" style="color:#2F7A4D;">${statusLabel(o.status)} · ${formatDate(o.statusDate)}</div>`:'';
  return `${svcNote}<span class="qty-mfg-display">${escapeHtml(o.qtyMfg)}</span>${mfgLine}${statusLine}`;
}
/* خانة الكمية المصنعة القابلة للتعديل — تُستخدم فقط في صفحة سجل الطلبات */

  if((o.status==='جاهز للتسليم'||o.status==='تم التسليم')&&o.statusDate)statusLine+=`<div class="qty-mfg-date" style="color:#2F7A4D;">${statusLabel(o.status)} · ${formatDate(o.statusDate)}</div>`;

/* لما يكون الطلب فيه أكتر من صنف (extraItems) في الدبس أو العجينة، بنعرض خانة كمية مصنعة مستقلة
   لكل صنف (بدل خانة واحدة)، عشان حاسبة الأسعار تقدر تحسب كل صنف على حدة بحجمه ووزنه الصحيح */
function qtyMfgEditableHtmlMulti(o){
  if(!(o.extraItems&&o.extraItems.length)||!(o.processingType==='دبس'||o.processingType==='عجينة')){

    ...o.extraItems.map((it,i)=>({label:`${it.packageSize||'—'} / ${it.cartonSize||'—'}`,idx:i,qtyMfg:it.qtyMfg,mfgDate:it.mfgDate,clearedAt:it.qtyMfgClearedAt}))];
  return `${svcNote}<div class="qty-mfg-multi">${items.map(item=>{

      ${item.qtyMfg&&item.mfgDate?`<div class="qty-mfg-date" style="color:#2F7A4D;">✓ تم التصنيع · ${formatDate(item.mfgDate)}</div>`:(!item.qtyMfg&&item.clearedAt?`<div class="qty-mfg-date" style="color:var(--danger);">🗑️ تم المسح · ${formatDate(item.clearedAt)}</div>`:'')}

}

/* مسح فلتر واحد بس من شريط الفلاتر الحالية، حسب نوعه ونطاقه (سجل الطلبات أو صفحة تصنيع معيّنة) */
function clearOneActiveFilter(scope,type,col){
  const isProd=scope.startsWith('production-');
  const view=isProd?scope.replace('production-',''):null;
  if(type==='search'){
    if(scope==='registry')state.registrySearchTerm='';
    else if(isProd){ state.productionSearchTerm=state.productionSearchTerm||{}; state.productionSearchTerm[view]=''; }
  }else if(type==='card'){
    if(scope==='registry')state.registryFilter='all';
    else if(isProd){ state.productionFilter=state.productionFilter||{}; state.productionFilter[view]='all'; }
  }else if(type==='status'){
    if(scope==='registry')state.registryStatusFilter='all';
  }else if(type==='archived'){
    if(scope==='registry')state.registryShowArchived=false;
  }else if(type==='period'){
    if(scope==='registry')state.registryPeriod='3';
    else if(isProd){ state.productionPeriod=state.productionPeriod||{}; state.productionPeriod[view]=undefined; }
  }else if(type==='duration'){
    if(scope==='registry')state.registryDurationFilter='';
    else if(scope==='warehouse')state.warehouseDurationFilter='';
    else if(isProd){ state.productionDurationFilter=state.productionDurationFilter||{}; state.productionDurationFilter[view]=''; }
  }else if(type==='column'){
    if(scope==='registry'){ if(state.columnFilters.registry)delete state.columnFilters.registry[col]; }
    else if(scope==='warehouse'){ if(state.columnFilters.warehouse)delete state.columnFilters.warehouse[col]; }
    else if(isProd){ if(state.columnFilters['production-'+view])delete state.columnFilters['production-'+view][col]; }
  }
}
function clearAllActiveFilters(scope){
  const isProd=scope.startsWith('production-');
  const view=isProd?scope.replace('production-',''):null;
  if(scope==='registry'){
    state.registrySearchTerm=''; state.registryFilter='all'; state.registryStatusFilter='all';
    state.registryShowArchived=false; state.registryDurationFilter=''; state.columnFilters.registry={};
  }else if(scope==='warehouse'){
    state.warehouseSearchTerm=''; state.warehouseFilter='remaining'; state.warehouseDurationFilter='';
    state.columnFilters.warehouse={};
  }else if(isProd){
    state.productionSearchTerm=state.productionSearchTerm||{}; state.productionSearchTerm[view]='';
    state.productionFilter=state.productionFilter||{}; state.productionFilter[view]='all';
    state.productionDurationFilter=state.productionDurationFilter||{}; state.productionDurationFilter[view]='';
    state.columnFilters['production-'+view]={};
  }
}

/* أيقونة نخلة متحركة مع عذق تمر يتمايل — تُستخدم في شاشة "جاري التحميل" الأولى عند فتح النظام */

    <g transform="rotate(${ang} 58 68)">
      <path d="M58,68 C78,58 100,56 118,62 C100,66 80,70 58,68 Z" fill="${frondColors[i]}"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum"
        values="-6 58 68;6 58 68;-6 58 68" dur="2.3s" begin="${(i*0.12).toFixed(2)}s" repeatCount="indefinite"/>
    </g>`).join('');
  return `<svg class="palm-loader-svg" viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg">

}

/* التاريخ الميلادي والهجري لليوم — يُستخدم أعلى الشريط الجانبي تحت اسم المصنع */
function todayGregorianStr(){
  const d=new Date();
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}
function todayHijriStr(){
  const d=new Date();
  try{ return d.toLocaleDateString('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'numeric',year:'numeric'}); }
  catch(e){ try{ return d.toLocaleDateString('ar-SA-u-ca-islamic',{day:'numeric',month:'numeric',year:'numeric'}); }catch(e2){ return '—'; } }
}

/* ============== render dispatcher ============== */
function captureFocus(){
  const el=document.activeElement;
  if(!el||!['INPUT','TEXTAREA','SELECT'].includes(el.tagName))return null;
  return {
    id:el.id||null,
    cls:el.className||'',
    dataId:el.dataset?el.dataset.id:null,
    selStart:(typeof el.selectionStart==='number')?el.selectionStart:null,
    selEnd:(typeof el.selectionEnd==='number')?el.selectionEnd:null
  };
}
function restoreFocus(saved){
  if(!saved)return;
  let el=null;
  if(saved.id)el=byId(saved.id);
  if(!el&&saved.dataId&&saved.cls){
    const firstCls=saved.cls.split(' ').filter(Boolean)[0];
    if(firstCls)el=document.querySelector(`.${firstCls}[data-id="${saved.dataId}"]`);
  }
  if(!el)return;
  try{
    el.focus();
    if(saved.selStart!==null&&el.setSelectionRange)el.setSelectionRange(saved.selStart,saved.selEnd);
  }catch(e){}
}
/* شاشة تحميل هيكلية (Skeleton) بدل رسالة نصية بسيطة */
function skeletonHtml(){
  const chip=`<div class="skel skel-chip"></div>`;
  const row=`<div class="skel skel-row"></div>`;
  return `<div class="page-head"><div class="skel skel-title"></div></div>
    <div class="stats">${chip}${chip}${chip}${chip}</div>
    <div class="card card-pad" style="margin-top:16px;">
      ${row}${row}${row}${row}${row}
    </div>`;
}
function render(){
  if(!state.currentUser)return;
  const savedFocus=captureFocus();
  /* body tinting */
  document.body.className='';
  if(PAGE_BODY_CLASS[state.view])document.body.classList.add(PAGE_BODY_CLASS[state.view]);
  if(typeof updateOnlineStatus==='function')updateOnlineStatus();
  renderSidebar();
  const main=byId('main');
  if(!state.loaded){ main.innerHTML=skeletonHtml(); return; }
  if(state.view==='audit'&&!isAdmin())state.view='dashboard';
  if(state.view==='customers'&&!isAdmin())state.view='dashboard';
  if(state.view==='reports'&&!isAdmin())state.view='dashboard';
  if(state.view==='pricing'&&!employeeCanAccess('pricing'))state.view='dashboard';
  if(state.view){ try{ localStorage.setItem('sajjal-last-view',state.view); }catch(e){} }
  let pageHtml='';
  if(state.view==='dashboard')   pageHtml=renderDashboard();
  else if(state.view==='registry')  pageHtml=renderRegistry();
  else if(state.view==='services')  pageHtml=renderServices();
  else if(state.view==='settings')  pageHtml=renderSettings();
  else if(state.view==='audit')     pageHtml=renderAudit();
  else if(state.view==='customers') pageHtml=renderCustomers();
  else if(state.view==='warehouse') pageHtml=renderWarehouse();
  else if(state.view==='pricing')   pageHtml=renderPricingPage();
  else if(state.view==='reports')   pageHtml=renderReports();
  else if(state.view==='about')     pageHtml=renderAbout();
  else pageHtml=renderProduction(state.view);
  main.innerHTML=updateBannerHtml()+historyLoadingBannerHtml()+renderTopbar()+pageHtml;
  attachViewEvents();
  restoreFocus(savedFocus);
  scheduleSaveUserFilters();
}

function findOrderByReceiptNo(receiptNo){
  const rn=(receiptNo||'').toString().trim();
  if(!rn)return null;
  return state.orders.find(o=>(o.receiptNo||'').toString().trim().toLowerCase()===rn.toLowerCase())||null;
}
function renderPricingPage(){
  const rn=state.calcReceiptNo||'';
  const order=findOrderByReceiptNo(rn);
  const saved=(state.receiptPricing||{})[rn.trim()]||null;
  const f=state.calcForm||{};
  const val=(field,fallbackFromOrder)=>{
    if(f[field]!=null)return f[field];
    if(saved&&saved[field]!=null)return saved[field];
    if(fallbackFromOrder!=null)return fallbackFromOrder;
    return '';
  };
  const pieceSizeVal=val('pieceSize',order?order.packageSize:'');
  const cartonSizeVal=val('cartonSize',order?order.cartonSize:'');
  /* الكمية المصنعة لازم تعكس حالة السند الحية دايمًا، مش نسخة قديمة محفوظة من حساب سابق —
     لو السند موجود، قيمته الحالية (حتى لو فاضية بعد ما اتمسحت) هي الأساس؛ الحساب المحفوظ قديمًا
     بيتستخدم بس لو مفيش سند مطابق أصلاً (سند محذوف مثلاً) */
  const qtyMfgVal=f.qtyMfg!=null?f.qtyMfg:(order?(order.qtyMfg||''):(saved&&saved.qtyMfg!=null?saved.qtyMfg:''));
  const isDibs=(order?order.processingType==='دبس':false)||/^[jm]/i.test(rn.trim());
  const isDough=(order?order.processingType==='عجينة':false)||/^p/i.test(rn.trim());
  const isVacuum=(order?order.processingType==='فاكيوم':false)||/^v/i.test(rn.trim());
  const dibsTable=getDibsWeightTable();
  const doughTable=getDoughWeightTable();
  const vacuumTable=getVacuumWeightTable();
  /* مطابقة صف من الجدول: لازم حجم العبوة وحجم الكرتون (وزن الكرتون) يطابقوا مع بعض نفس الصف بالظبط.
     حجم/وزن الكرتون بييجي أحيانًا بصيغة فيها حروف زي "K 8" بدل "8"، فبنستخرج الرقم منها بس قبل المقارنة.
     لو صف في الجدول مالوش اسم حجم عبوة (زي بعض صفوف العجينة)، بيتطابق بوزن الكرتون بس */
  const matchWeightRow=(table)=>matchWeightRowIn(table,pieceSizeVal,cartonSizeVal);
  const dibsTableMatch=isDibs?matchWeightRow(dibsTable):null;
  const doughTableMatch=isDough?matchWeightRow(doughTable):null;
  const vacuumTableMatch=isVacuum?matchWeightRow(vacuumTable):null;
  const isPerKiloType=isDibs;
  const priceNoTaxVal=val('priceNoTax',
    (isDibs&&dibsTableMatch)?dibsTableMatch.pricePerKilo:
    (isDough&&doughTableMatch)?doughTableMatch.priceCarton:
    (isVacuum&&vacuumTableMatch)?vacuumTableMatch.priceCarton:'');
  const cartonWeightVal=(f.cartonWeight!=null?f.cartonWeight:(saved&&saved.cartonWeight!=null?saved.cartonWeight:(saved&&saved.kilos!=null?saved.kilos:
    (dibsTableMatch?dibsTableMatch.weight:''))));
  const totalWeightKgNum=(Number(qtyMfgVal)||0)*(Number(cartonWeightVal)||0);
  const priceWithTaxNum=(Number(priceNoTaxVal)||0)*1.15;
  let baseTotalNum=isPerKiloType
    ?totalWeightKgNum*priceWithTaxNum
    :(Number(qtyMfgVal)||0)*priceWithTaxNum;
  /* لو السند فيه أصناف إضافية (extraItems) وله كمية مصنعة خاصة بيه، بنحسب سعر كل صنف على حدة بحجمه ووزنه
     الصحيح من نفس الجدول، وبنجمعهم على السعر الأساسي — بس للدبس والعجينة (اللي بيتسعّروا بجدول أوزان) */
  const extraItemsPriced=[];
  if((isDibs||isDough)&&order&&order.extraItems&&order.extraItems.length){
    order.extraItems.forEach((it,i)=>{
      const itQty=Number(it.qtyMfg)||0;
      if(!itQty)return;
      const itTable=isDibs?dibsTable:doughTable;
      const itMatch=matchWeightRowIn(itTable,it.packageSize,it.cartonSize);
      if(!itMatch)return;
      const itPriceNoTax=isDibs?itMatch.pricePerKilo:itMatch.priceCarton;
      const itPriceWithTax=(Number(itPriceNoTax)||0)*1.15;
      const itTotal=isDibs?(itQty*(Number(itMatch.weight)||0)*itPriceWithTax):(itQty*itPriceWithTax);
      extraItemsPriced.push({label:`${it.packageSize||'—'} / ${it.cartonSize||'—'}`,qty:itQty,total:itTotal});
      baseTotalNum+=itTotal;
    });
  }
  /* خدمة إضافية مرتبطة بنفس رقم السند (تقعيم/فرز/تعقيم/فرشاة/حشو لوز...) — بتأثر على السعر النهائي حسب نوعها */
  const linkedService=findLinkedServiceOrder(rn);
  const vacuumSvcExtra=(order&&order.vacuumServices)?order.vacuumServices.filter(s=>s!=='سحب هواء'):[];
  const extraServiceType=linkedService?(linkedService.serviceType||''):(vacuumSvcExtra[0]||'');
  const extraCartonKg=Number(cartonWeightVal)||Number(numOnlyStr(cartonSizeVal))||0;
  const extraEffect=extraServiceEffect(extraServiceType,extraCartonKg,qtyMfgVal,extraCartonKg);
  let totalNum=baseTotalNum;
  if(extraEffect){
    if(extraEffect.mode==='replace')totalNum=extraEffect.amount;
    else if(extraEffect.mode==='add')totalNum=baseTotalNum+extraEffect.amount;
    else if(extraEffect.mode==='unknown')totalNum=0;
  }
  /* الحد الأدنى لتحصيل الطلب 100 ريال — لو الإجمالي أقل من 100 (زي حالة أقل من 3 كراتين موز) يُحسب بـ 100 ريال
     (الحد الأدنى ده مبيتطبقش على حالة "حشو لوز" ولا على حالة "خدمة غير معروفة السعر") */
  const finalTotalNum=extraEffect&&(extraEffect.mode==='replace'||extraEffect.mode==='unknown')
    ?totalNum
    :(totalNum>0?Math.max(totalNum,100):0);
  const notesVal=val('notes','');
  const customerName=order?order.customerName:(saved?saved.customerName:'');

  const list=Object.keys(state.receiptPricing||{})
    .map(k=>({receiptNo:k,...state.receiptPricing[k]}))
    .sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));

  const dibsPriceEditMode=!!state.dibsTableEditMode;
  const dibsPriceDraft=state.dibsTableEditDraft||{};
  const extraSvcPriceEditMode=!!state.extraSvcTableEditMode;
  const extraSvcPriceDraft=state.extraSvcTableEditDraft||{};
  const extraSvcRatesNow=getExtraServiceRates();

    <div class="check-row" style="margin-bottom:8px;">
      <input type="checkbox" id="extra-svc-price-edit-toggle" ${extraSvcPriceEditMode?'checked':''}>
      <label for="extra-svc-price-edit-toggle">✏️ تعديل الأسعار</label>
    </div>
    <div style="width:100%;overflow-x:auto;">
    <table style="width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed;">
      <colgroup><col style="width:38%;"><col style="width:31%;"><col style="width:31%;"></colgroup>
      <thead><tr>
        <th style="text-align:right;border-bottom:2px solid var(--border);padding:5px 4px;">الخدمة</th>
        <th style="text-align:right;border-bottom:2px solid var(--border);padding:5px 4px;">بدون</th>

      </tr></thead>

        ${[
          {id:'A',label:'تقعيم/فرز',row:extraSvcRatesNow.A},

          return `<tr>

/* فلتر مدة سجل العمليات — افتراضيًا يعرض آخر يومين بس، عشان الجدول يفضل خفيف */
const AUDIT_PERIOD_OPTIONS=[
  {value:'2d',label:'آخر يومين',days:2},
  {value:'week',label:'أسبوع',days:7},
  {value:'month',label:'شهر',days:30},
  {value:'2m',label:'شهرين',days:60},
  {value:'3m',label:'3 أشهر',days:90},
];
function renderAudit(){
  const allLog=state.auditLog||[];
  const term=(state.auditSearchTerm||'').trim().toLowerCase();
  const period=state.auditPeriod||'2d';
  const opt=AUDIT_PERIOD_OPTIONS.find(p=>p.value===period)||AUDIT_PERIOD_OPTIONS[0];
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-opt.days); cutoff.setHours(0,0,0,0);
  const byPeriod=allLog.filter(l=>l.time&&new Date(l.time)>=cutoff);
  const log=term?byPeriod.filter(l=>
    (l.action||'').toLowerCase().includes(term)||
    (l.user||'').toLowerCase().includes(term)
  ):byPeriod;
  return`
  <div class="page-head">
    <div><h1 class="page-title">📜 سجل العمليات</h1><div class="page-desc">كل إضافة أو تعديل أو حذف لطلب، مع اسم من قام بها والتوقيت</div></div>
    ${isAdmin()?`<div class="toolbar"><button class="btn btn-ghost btn-sm" id="btn-clear-audit-log" style="color:var(--danger);border-color:var(--danger);">🗑️ مسح السجل بالكامل</button></div>`:''}
  </div>

  <div class="toolbar search-toolbar-sticky">
    ${searchBoxHtml('audit-search-input','ابحث بالمستخدم أو نوع العملية…',state.auditSearchTerm)}
    <select id="audit-period-filter" style="max-width:150px;font-size:12.5px;padding:7px 8px;">
      ${AUDIT_PERIOD_OPTIONS.map(p=>`<option value="${p.value}" ${period===p.value?'selected':''}>${p.label}</option>`).join('')}
    </select>
    ${term?`<span style="font-size:13px;color:var(--ink-soft);">عدد النتائج: <strong style="color:var(--accent-dark);font-size:15px;">${log.length}</strong></span>`:''}
  </div>

  <div class="card"><div class="table-wrap">
    ${log.length===0?`<div class="empty-state"><div class="big">📜</div><div>${term?'لا توجد نتائج مطابقة':'لا توجد عمليات مسجلة في هذه الفترة'}</div></div>`:`
    <table><thead><tr><th>الوقت</th><th>المستخدم</th><th>العملية</th><th>التفاصيل</th></tr></thead><tbody>
    ${log.map(l=>{
      const parts=l.action.split(' — ');
      const mainAction=parts[0]||l.action;
      const details=parts.slice(1).join(' — ')||'';
      return`<tr>
      <td data-label="الوقت"><span class="mono" style="font-size:12px;">${formatDateTime(l.time)}</span></td>
      <td data-label="المستخدم"><strong>${escapeHtml(l.user)}</strong></td>
      <td data-label="العملية">${escapeHtml(mainAction)}</td>
      <td data-label="التفاصيل" style="font-size:12px;color:var(--ink-soft);">${escapeHtml(details)||'—'}</td>
    </tr>`;}).join('')}
    </tbody></table>`}
  </div></div>`;
}
async function clearAuditLog(){
  state.auditLog=[];
  const ok=await saveAuditLog([]);
  render();
  toast(ok?'تم مسح سجل العمليات بالكامل':saveFailMsg('خطأ في الحفظ'),ok?'ok':'error');
}

/* ============== customers database (admin only) ============== */
/* تجميع العملاء من الطلبات — التجميع برقم الجوال (الرقم الأصح) لمنع تكرار نفس العميل أكثر من مرة */
function buildCustomerDirectory(){
  const map=new Map();
  sortedOrders(state.orders).slice().reverse().forEach(o=>{
    const mobileNorm=(o.mobile||'').replace(/[^0-9]/g,'');
    const key=mobileNorm?('m:'+mobileNorm):(o.customerName?('n:'+o.customerName.trim().toLowerCase()):null);
    if(!key)return;
    if(!map.has(key))map.set(key,{key,name:o.customerName||'بدون اسم',mobile:o.mobile||'',orderCount:0,totalQty:0,lastDate:'',orders:[]});
    const rec=map.get(key);
    rec.orderCount+=1;
    rec.totalQty+=orderTotalQtyCartons(o);
    rec.orders.push(o);
    if(!rec.mobile&&o.mobile)rec.mobile=o.mobile;
    if(!rec.lastDate||(o.date||'')>=rec.lastDate){ rec.lastDate=o.date||rec.lastDate; rec.name=o.customerName||rec.name; }
  });
  return Array.from(map.values()).sort((a,b)=>b.totalQty-a.totalQty);
}
function renderCustomers(){
  const dir=buildCustomerDirectory();
  const term=(state.customersSearchTerm||'').trim().toLowerCase();

   (سجل الطلبات، الفاكيوم، الدبس، العجينة، التعقيم، المستودع، الخدمات الإضافية، البحث)
   عشان محدش يضطر يقلّب في آلاف الطلبات دفعة واحدة، وبنفس الوقت الطلبات المعلّقة تفضل ظاهرة دايمًا مهما كان تاريخها */
const PERIOD_OPTIONS=[
  {value:'month',label:'الشهر الحالي فقط',months:0},
  {value:'1.5',label:'شهر ونص',months:1.5},
  {value:'2',label:'شهرين',months:2},
  {value:'3',label:'آخر 3 أشهر',months:3},
  {value:'6',label:'آخر 6 أشهر',months:6},
  {value:'all',label:'كل الفترات',months:null},
];
const PAGE_SIZE=50;
/* تاريخ القطع (cutoff) المقابل لقيمة الفترة المختارة — null يعني بلا حد (كل الفترات) */
function periodCutoffDate(periodValue){
  const opt=PERIOD_OPTIONS.find(p=>p.value===periodValue);
  const months=opt?opt.months:3;
  if(months===null)return null;
  const cutoff=new Date();
  const wholeMonths=Math.floor(months);
  const fracMonth=months-wholeMonths;
  cutoff.setMonth(cutoff.getMonth()-wholeMonths);
  if(fracMonth)cutoff.setDate(cutoff.getDate()-Math.round(fracMonth*30));
  cutoff.setHours(0,0,0,0);
  return cutoff;
}
function periodSelectHtml(id,selectedValue){
  const val=selectedValue||'3';
  return `<select id="${id}" style="max-width:170px;font-size:12.5px;padding:7px 8px;">
    ${PERIOD_OPTIONS.map(p=>`<option value="${p.value}" ${val===p.value?'selected':''}>${p.label}</option>`).join('')}
  </select>`;
}

const DELIVERED_PERIOD_OPTIONS=[
  {value:'today',label:'اليوم'},
  {value:'week',label:'آخر أسبوع'},
  {value:'month',label:'آخر شهر'},
  {value:'all',label:'المدة كلها'},

function inDeliveredPeriod(dateStr,periodValue){
  if(!dateStr)return false;
  if(periodValue==='all')return true;
  if(periodValue==='today')return isToday(dateStr);
  const days=periodValue==='week'?7:30;
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-days); cutoff.setHours(0,0,0,0);
  return new Date(dateStr)>=cutoff;
}

/* يجمّع منطق فلترة سجل الطلبات (فلتر لوحة التحكم + البحث النصي + الفترة الزمنية + فلاتر الأعمدة/الاقماع)
   في مكان واحد، عشان العرض على الشاشة وتصدير Excel يستخدموا نفس القائمة بالظبط */
function getFilteredRegistryOrders(){
  const showArchived=!!state.registryShowArchived;
  const allOrders=sortedOrders(showArchived?state.orders:state.orders.filter(o=>!o.archived));
  const term=(state.registrySearchTerm||'').trim().toLowerCase();
  const rf=state.registryFilter||'all';
  const statusF=state.registryStatusFilter||'all';
  const period=state.registryPeriod||'3';
  let base=allOrders;
  if(rf==='urgent')base=allOrders.filter(isUrgentPending);
  else if(rf==='nearing')base=allOrders.filter(o=>isNearingDelay(o));
  else if(rf==='overdue')base=allOrders.filter(o=>isOverdue(o));
  else if(rf==='needs-reminder')base=allOrders.filter(o=>isNearingDelay(o)||isOverdue(o));
  /* "المستودع" (التسكين) خاص بالفاكيوم بس فعليًا — باقي الأنواع (دبس/عجينة/تعقيم) مالهاش تسكين مستودع
     بنفس الطريقة، فمش منطقي نحسبهم ضمن "مصنّع ولم يُسكَّن" */
  else if(rf==='mfg-not-placed')base=allOrders.filter(o=>o.processingType==='فاكيوم'&&(o.qtyMfg||'').toString().trim()&&!(o.placementLocation||'').trim()&&o.status!=='تم التسليم');
  else if(rf==='remaining')base=allOrders.filter(o=>!(o.qtyMfg||'').toString().trim()&&o.status!=='تم التسليم');
  else if(rf==='delivered')base=allOrders.filter(o=>o.status==='تم التسليم');
  else if(rf==='mfg-done')base=allOrders.filter(o=>(o.qtyMfg||'').toString().trim()&&o.status!=='تم التسليم');
  else if(rf==='wa-sent-today')base=allOrders.filter(o=>o.whatsappSentAt&&isToday(o.whatsappSentAt));
  if(statusF!=='all')base=base.filter(o=>o.status===statusF);
  let orders=term?base.filter(o=>
    (o.receiptNo||'').toLowerCase().includes(term)||
    (o.customerName||'').toLowerCase().includes(term)||
    (o.mobile||'').includes(term)
  ):base;
  /* فلتر "مدة التصنيع" — بيوري بس الطلبات اللي اتصنّعت فعلاً وعدّى على تاريخ استلامها (o.date) لحد
     النهارده مدة أكبر من أو تساوي عدد الأيام المكتوب */
  const durationDays=Number(state.registryDurationFilter||0);
  if(durationDays>0){
    orders=orders.filter(o=>{
      if(!o.mfgDate||!o.date)return false;
      const days=(Date.now()-new Date(o.date).getTime())/86400000;
      return days>=durationDays;
    });
  }
  /* فلتر الفترة الزمنية — لتخفيف حِمل عرض الجدول مع تراكم آلاف الطلبات بمرور الوقت.
     لا يُطبَّق إلا على الطلبات المُسلَّمة فقط (المكتملة) — أي طلب لسه معلّق أو مستعجل بيفضل ظاهر دايمًا مهما كان تاريخه، عشان محدش ينسى متابعته. */
  const cutoff=periodCutoffDate(period);
  const hiddenByPeriodCount=(cutoff===null||term||rf!=='all'||statusF!=='all')?0:orders.filter(o=>{
    if(o.status!=='تم التسليم')return false;
    if(!o.date)return false;
    return new Date(o.date)<cutoff;
  }).length;
  if(cutoff!==null&&!term&&rf==='all'&&statusF==='all'){
    orders=orders.filter(o=>o.status!=='تم التسليم'||!o.date||new Date(o.date)>=cutoff);
  }
  /* نتائج الخدمات الإضافية للشركة اللي بتطابق نفس نص البحث — بتظهر بس لو فيه بحث فعلي */
  const serviceResults=term?state.serviceOrders.filter(so=>
    (so.receiptNo||'').toLowerCase().includes(term)||(so.customerName||'').toLowerCase().includes(term)
  ).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)):[];
  /* funnelBase = القائمة قبل تطبيق فلاتر الأعمدة (تُستخدم لبناء قوائم القيم في قوائم الاقماع) */
  const funnelBase=orders;
  orders=applyColumnFilters('registry',orders);
  orders=applySortState('registry',orders);
  return {orders,funnelBase,hiddenByPeriodCount,term,rf,statusF,period,showArchived,serviceResults,durationDays};
}
function renderRegistry(){

  const registeredToday=allOrders.filter(o=>isToday(o.createdAt)).length;
  /* عدد العملاء (مش الرسائل) اللي اتبعتلهم واتساب النهارده — بنعدّ العميل مرة واحدة حتى لو اتبعتله أكتر
     من رسالة عن أكتر من طلب في نفس اليوم */

  /* عدد الطلبات اللي قرّبت تتأخر أو اتأخرت فعلاً ولسه محتاجة تذكير للعميل */
  const needsReminderOrders=allOrders.filter(o=>isNearingDelay(o)||isOverdue(o));
  const archivableCount=canManage?state.orders.filter(isArchivable).length:0;
  const archivedCount=state.orders.filter(o=>o.archived).length;
  const {orders:filteredOrders,funnelBase,hiddenByPeriodCount,term,rf,statusF,period,showArchived,serviceResults,durationDays}=getFilteredRegistryOrders();
  state._registryFunnelBase=funnelBase;
  let orders=filteredOrders;
  const activeColFilterCount=Object.values(state.columnFilters.registry||{}).filter(v=>v&&v.length).length;

  const canEditHere=canAdd;
  /* الكمية المصنعة بقت قراءة فقط في سجل الطلبات دايمًا — الكتابة/التعديل بيتم بس من صفحات
     التصنيع (فاكيوم/دبس/عجينة/تعقيم)، وصفحة الخدمات الإضافية بطريقتها الخاصة */
  const canEditQtyHere=false;

/* توليد محتوى خلية جدول "المستودع" حسب مفتاح العمود */
function warehouseCellHtml(o,key){
  switch(key){
    case 'placement': return `<td data-label="موقع التسكين"><span class="wh-loc-badge">${escapeHtml(o.placementLocation)}</span></td>`;
    case 'receiptNo': return `<td data-label="رقم السند"><span class="receipt-display receipt-goto" data-id="${o.id}" title="الانتقال لصفحة التصنيع الخاصة بهذا الطلب" style="color:#C0392B;font-weight:800;">${formatReceiptNoHtml(o.receiptNo||'—')}</span>${riyalCalcIconHtml(o.receiptNo)}${daysWithoutMfgBadge(o)}</td>`;
    case 'customer': return `<td data-label="العميل"><strong class="cell-customer-name customer-goto" data-mobile="${escapeHtml(o.mobile||'')}" title="اعرض كل طلبات هذا العميل" style="color:#C0392B;">${escapeHtml(o.customerName||'—')}</strong></td>`;
    case 'dateType': return `<td data-label="نوع التمر">${escapeHtml(o.dateType||'—')}</td>`;
    case 'qtyReceived': return `<td data-label="الكمية المستلمة">${qtyReceivedHtml(o)}</td>`;
    case 'qtyMfg': return `<td data-label="الكمية المصنعة">${qtyMfgDisplayHtml(o)}</td>`;
    case 'status': return `<td data-label="الحالة">${canManageStatus()?statusEditControlHtml(o):statusBadge(o.status,'sm')}</td>`;
    case 'storageDays': { const days=daysInWarehouse(o); const dayColor=days>=25?'#C0392B':(days>=15?'#B8860B':'#2F7A4D');
      return `<td data-label="عدد أيام التخزين"><strong style="color:${dayColor};">${days} يوم</strong>${days>=25?' 🔴':(days>=15?' 🟡':'')}</td>`; }
    default: return '<td>—</td>';
  }
}
function renderWarehouse(){
  const wf=state.warehouseFilter||'remaining';
  const remainingBase=state.orders.filter(o=>(o.placementLocation||'').trim()&&o.status!=='تم التسليم');
  const allEverPlaced=state.orders.filter(o=>(o.placementLocation||'').trim());
  const deliveredBase=allEverPlaced.filter(o=>o.status==='تم التسليم');
  const deliveredFromWarehouse=deliveredBase.length;
  let all=wf==='delivered'?deliveredBase:(wf==='all'?allEverPlaced:remainingBase);
  const stagnantOnly=!!state.warehouseStagnantOnly;
  if(stagnantOnly)all=all.filter(isStagnantInWarehouse);
  const term=(state.warehouseSearchTerm||'').trim().toLowerCase();
  /* فلتر الفترة الزمنية — لا يخفي إلا الطلبات المُسلَّمة القديمة؛ الطلبات المتبقية بالمستودع تفضل ظاهرة دايمًا مهما كان تاريخها */
  const period=state.warehousePeriod||'3';
  const cutoff=periodCutoffDate(period);
  const hiddenByPeriodCount=(cutoff===null||term)?0:all.filter(o=>o.status==='تم التسليم'&&o.date&&new Date(o.date)<cutoff).length;
  if(cutoff!==null&&!term){
    all=all.filter(o=>o.status!=='تم التسليم'||!o.date||new Date(o.date)>=cutoff);
  }
  const filtered=term?all.filter(o=>
    (o.receiptNo||'').toLowerCase().includes(term)||
    (o.customerName||'').toLowerCase().includes(term)||
    (o.mobile||'').includes(term)||
    (o.dateType||'').toLowerCase().includes(term)
  ):all;
  /* فلتر "مدة التصنيع" — بيوري بس الطلبات اللي اتصنّعت فعلاً وعدّى على تاريخ استلامها (o.date) لحد
     النهارده مدة أكبر من أو تساوي عدد الأيام المكتوب */
  const durationDays=Number(state.warehouseDurationFilter||0);
  const filteredByDuration=durationDays>0?filtered.filter(o=>{
    if(!o.mfgDate||!o.date)return false;
    const days=(Date.now()-new Date(o.date).getTime())/86400000;
    return days>=durationDays;
  }):filtered;
  /* funnelBase = القائمة قبل تطبيق فلاتر الأعمدة (تُستخدم لبناء قوائم القيم في قوائم الاقماع) */
  state._warehouseFunnelBase=filteredByDuration;
  const activeColFilterCount=Object.values(state.columnFilters.warehouse||{}).filter(v=>v&&v.length).length;
  const colFiltered=applyColumnFilters('warehouse',filteredByDuration);
  /* الترتيب: لو المستخدم دوس على رأس عمود لترتيبه، نستخدم الترتيب ده؛ غير كده الترتيب الافتراضي حسب
     موقع التسكين: 1-1 ، 1-2 ، 1-3 ، 2-1 ، 2-2 ... */
  const whSortActive=!!((state.sortState||{}).warehouse&&(state.sortState||{}).warehouse.col);
  const list=whSortActive?applySortState('warehouse',colFiltered):sortByPlacement(colFiltered);
  const whCols=resolveColumns('warehouse',['placement','receiptNo','customer','dateType','qtyReceived','qtyMfg','status','storageDays']);
  /* الترقيم (Pagination) */
  const filterSig=wf+'|'+term+'|'+period+'|'+durationDays+'|'+JSON.stringify(state.columnFilters.warehouse||{});
  if(state._warehouseFilterSig!==filterSig){ state._warehouseFilterSig=filterSig; state.warehousePage=1; }
  const totalPages=Math.max(1,Math.ceil(list.length/PAGE_SIZE));
  if(!state.warehousePage||state.warehousePage<1)state.warehousePage=1;
  if(state.warehousePage>totalPages)state.warehousePage=totalPages;
  const curPage=state.warehousePage;
  const pagedList=list.slice((curPage-1)*PAGE_SIZE,curPage*PAGE_SIZE);
  const paginationHtml=paginationBarHtml('warehouse',curPage,totalPages,list.length,'طلب');

  const totalOrders=remainingBase.length;
  const totalQty=remainingBase.reduce((s,o)=>s+(orderTotalQtyCartons(o)),0);
  const dateTypesSet=new Set(remainingBase.flatMap(splitDateTypes));
  const dateTypesArr=[...dateTypesSet];
  /* طلبات تم تصنيعها لكن لم توضع في المستودع بعد (لا يوجد لها موقع تسكين) */
  /* "المستودع" خاص بالفاكيوم بس فعليًا — باقي الأنواع (دبس/عجينة/تعقيم) مالهاش تسكين مستودع بنفس الطريقة */
  const mfgNotPlaced=state.orders.filter(o=>o.processingType==='فاكيوم'&&(o.qtyMfg||'').toString().trim()&&!(o.placementLocation||'').trim()&&o.status!=='تم التسليم');
  const stagnantCount=remainingBase.filter(isStagnantInWarehouse).length;
  const placedTodayCount=state.orders.filter(o=>o.placementDate===todayIso()).length;
  const whDeliveredPeriod=state.warehouseDeliveredPeriod||'today';
  const whDeliveredCount=deliveredBase.filter(o=>inDeliveredPeriod(o.lastEditedAt,whDeliveredPeriod)).length;

  return`
  <div class="page-head">
    <div><h1 class="page-title">${warehouseIconSvg(26)} المستودع</h1><div class="page-desc">الطلبات المسكّنة حسب موقع التسكين بالمستودع — مرتبة حسب موقع الرف</div></div>
    <div class="toolbar">
      <span class="last-sync">آخر تحديث: ${state.lastSync||'—'}</span>
      <button class="btn btn-ghost btn-sm" id="btn-refresh">↻ تحديث</button>
      <button class="btn btn-primary btn-sm" id="btn-print-warehouse" style="background:#B5651D;">🖨️ طباعة جرد المستودع</button>
    </div>
  </div>
  ${bigDayCounterHtml('🏭','عدد الأوردرات المسكَّنة اليوم',placedTodayCount)}
  ${deliveredCounterHtml('warehouse-delivered-period',whDeliveredCount,whDeliveredPeriod)}
  ${wf==='delivered'?`<div class="filter-banner filter-nearing">✅ عرض الطلبات المسلَّمة (اللي كانت بالمستودع) فقط — <button class="btn-clear-filter" id="btn-clear-warehouse-filter">× مسح الفلتر</button></div>`:''}
  ${wf==='all'?`<div class="filter-banner filter-nearing">📦 عرض كل الطلبات اللي دخلت المستودع (المتبقي + المسلَّم) — <button class="btn-clear-filter" id="btn-clear-warehouse-filter">× مسح الفلتر</button></div>`:''}
  ${stagnantOnly?`<div class="filter-banner filter-urgent">🐌 عرض الطلبات الراكدة فقط (${STAGNANT_WAREHOUSE_DAYS} يوم أو أكتر بدون خروج) — <button class="btn-clear-filter" id="btn-clear-warehouse-stagnant">× مسح الفلتر</button></div>`:''}
  ${activeColFilterCount>0?`<div class="filter-banner filter-nearing">🔽 مطبّق ${activeColFilterCount} فلتر أعمدة على الجدول — <button class="btn-clear-filter" id="btn-clear-col-filters-warehouse">× مسح فلاتر الأعمدة</button></div>`:''}
  ${durationDays>0?`<div class="filter-banner filter-nearing">🕐 عرض الطلبات المصنّعة اللي عدّى على استلامها ${durationDays} يوم أو أكتر — <button class="btn-clear-filter" id="btn-clear-warehouse-duration">× مسح الفلتر</button></div>`:''}

  ${progressBarHtml('نسبة ما تم تسليمه',deliveredFromWarehouse,allEverPlaced.length,'#B5651D')}

/* توليد محتوى خلية جداول التصنيع (فاكيوم/دبس/عجينة/تعقيم) حسب مفتاح العمود */
function productionCellHtml(o,key,ctx){
  switch(key){
    case 'date': return `<td data-label="التاريخ"><span class="mono" style="font-weight:700;">${formatDate(o.date)}</span>${isOverdue(o)?` <span style="color:#C0392B;font-size:10px;font-weight:700;">متأخر</span>`:(isNearingDelay(o)?` <span style="color:#8A6500;font-size:10px;font-weight:700;">🟡 قرّب يتأخر</span>`:'')}</td>`;
    case 'receiptNo': return `<td data-label="رقم السند"><span class="receipt-display">${formatReceiptNoHtml(o.receiptNo)}</span>${daysWithoutMfgBadge(o)}</td>`;
    case 'customer': return `<td data-label="العميل"><strong class="cell-customer-name customer-goto" data-mobile="${escapeHtml(o.mobile||'')}" title="اعرض كل طلبات هذا العميل">${escapeHtml(o.customerName)}</strong><br><span class="mono" style="font-size:11px;color:var(--ink-soft)">${escapeHtml(o.mobile||'')}</span></td>`;
    case 'dateType': return `<td data-label="نوع التمر">${escapeHtml(o.dateType||'—')}</td>`;
    case 'qtyReceived': return `<td data-label="الكمية المستلمة">${qtyReceivedHtml(o)}</td>`;
    case 'pkgCarton': return `<td data-label="حجم العبوة / الكرتون">${escapeHtml(o.packageSize||'—')} <span style="opacity:.5">/</span> ${escapeHtml(o.cartonSize||'—')}</td>`;
    case 'extra': return ctx.showPlacement
        ? ((o.vacuumServices||[]).length>0?`<td data-label="الخدمات الإضافية"><div style="display:flex;flex-wrap:wrap;gap:4px;">${(o.vacuumServices||[]).map(s=>serviceBadge(s)).join('')}</div></td>`:`<td data-label="الخدمات الإضافية">—</td>`)
        : `<td data-label="حالة التمر">${dateConditionBadge(o)}</td>`;
    case 'urgent': return `<td data-label="الأولوية">${o.processingType==='فاكيوم'?urgentBadge(o.urgent):''}</td>`;
    case 'qtyMfg': return `<td data-label="الكمية المصنعة">${canEditQtyMfg()?qtyMfgEditableHtmlMulti(o):qtyMfgDisplayHtml(o)}</td>`;
    case 'placement': return `<td data-label="موقع التسكين">${ctx.canEdit&&canEditPlacement()?`<input type="text" class="placement-input" data-id="${o.id}" placeholder="مثال: 3-1" value="${escapeHtml((state.placementDraft&&state.placementDraft[o.id]!=null)?state.placementDraft[o.id]:(o.placementLocation||''))}" style="color:#C0392B;font-weight:700;">`:`<strong style="color:#C0392B;">${escapeHtml(o.placementLocation||'—')}</strong>`}</td>`;
    case 'status': return `<td data-label="الحالة">${canManageStatus()?statusEditControlHtml(o):statusBadge(o.status)}</td>`;
    case 'notes': return `<td data-label="ملاحظات" class="cell-notes">${ctx.canEdit?`<textarea class="notes-input" data-id="${o.id}" placeholder="أضف ملاحظة…" style="color:#C0392B;font-weight:700;">${escapeHtml(o.processingNotes||'')}</textarea>`:escapeHtml(o.processingNotes||'—')}</td>`;
    case 'lastEdit': return `<td data-label="آخر تعديل">${auditLine(o)||'<span style="color:var(--ink-soft);font-size:11px;">—</span>'}</td>`;
    default: return '<td>—</td>';
  }

/* فلترة موحّدة لصفحات التصنيع (فاكيوم/دبس/عجينة/تعقيم) — نفس منطق سجل الطلبات بالظبط،
   وتُستخدم في العرض وفي التصدير والطباعة معًا عشان تفضل النتيجة واحدة في كل مكان */
function getFilteredProductionOrders(view){
  const type=PROD_VIEW_LABELS[view];
  let allOrders=sortedOrders(state.orders.filter(o=>o.processingType===type));
  /* طلبات الفاكيوم اللي مرتبطة بخدمة إضافية (تقعيم/حشو لوز...) لسه معلّقة (مش "تم التسليم" في صفحة الخدمات)
     ميظهروش في صفحة الفاكيوم خالص لحد ما الخدمة تتسلَّم — ساعتها بس يبقى دور الفاكيوم يبدأ */
  if(type==='فاكيوم'){
    allOrders=allOrders.filter(o=>{
      if(!(o.receiptNo||'').trim())return true;
      const linkedPendingService=state.serviceOrders.some(so=>so.receiptNo===o.receiptNo&&so.status!=='تم التسليم');
      return !linkedPendingService;
    });
  }
  const pf=((state.productionFilter||{})[view])||'all';
  let filteredByStatus=allOrders;
  if(pf==='remaining')filteredByStatus=allOrders.filter(o=>!(o.qtyMfg||'').toString().trim()&&o.status!=='تم التسليم');
  else if(pf==='mfg')filteredByStatus=allOrders.filter(o=>(o.qtyMfg||'').toString().trim());
  else if(pf==='urgent')filteredByStatus=allOrders.filter(isUrgentPending);
  else if(pf==='overdue')filteredByStatus=allOrders.filter(o=>isOverdue(o));
  else if(pf==='nearing')filteredByStatus=allOrders.filter(o=>isNearingDelay(o));
  const term=((state.productionSearchTerm||{})[view]||'').trim().toLowerCase();
  let orders=term?filteredByStatus.filter(o=>
    (o.receiptNo||'').toLowerCase().includes(term)||
    (o.customerName||'').toLowerCase().includes(term)||
    (o.mobile||'').includes(term)
  ):filteredByStatus;
  /* فلتر "مدة التصنيع" — بيوري بس الطلبات اللي اتصنّعت فعلاً وعدّى على تاريخ استلامها (o.date) لحد
     النهارده مدة أكبر من أو تساوي عدد الأيام المكتوب (مش المدة اللي استغرقها التصنيع فعليًا) */
  const durationDays=Number(((state.productionDurationFilter||{})[view])||0);
  if(durationDays>0){
    orders=orders.filter(o=>{
      if(!o.mfgDate||!o.date)return false;
      const days=(Date.now()-new Date(o.date).getTime())/86400000;
      return days>=durationDays;
    });
  }
  /* فلتر الفترة الزمنية — لا يخفي إلا الطلبات المُسلَّمة القديمة؛ أي طلب لسه معلّق أو مستعجل يفضل ظاهر دايمًا */
  const period=((state.productionPeriod||{})[view])||'3';
  const cutoff=periodCutoffDate(period);
  const hiddenByPeriodCount=(cutoff===null||term||pf!=='all')?0:orders.filter(o=>o.status==='تم التسليم'&&o.date&&new Date(o.date)<cutoff).length;
  if(cutoff!==null&&!term&&pf==='all'){
    orders=orders.filter(o=>o.status!=='تم التسليم'||!o.date||new Date(o.date)>=cutoff);
  }
  /* funnelBase = القائمة قبل تطبيق فلاتر الأعمدة (تُستخدم لبناء قوائم القيم في قوائم الاقماع) */
  const funnelBase=orders;
  const tableKey='production-'+view;
  orders=applyColumnFilters(tableKey,orders);
  orders=applySortState(tableKey,orders);
  return {orders,allOrders,funnelBase,hiddenByPeriodCount,term,pf,period,type,tableKey,durationDays};
}
/* ============== storage: متوسط وزن الكيلو للتمر المستلم بالسلة/الكرتون (دبس وعجينة) ============== */
async function loadAvgReceivedWeightKg(){
  try{ const r=await sbGet('avg-received-weight-kg'); if(r&&r.value)return Number(r.value)||18; }catch(e){}
  return 18;
}
async function saveAvgReceivedWeightKg(v){
  return await storageSetRetry('avg-received-weight-kg',String(v),true);
}
/* إجمالي كيلوجرامات التمر المستلمة النهارده لنوع تصنيع معيّن (دبس/عجينة) — الكمية المستلمة (بالسلال/الكراتين)
   مضروبة في متوسط وزن الوحدة (قابل للتعديل من المسؤول) */
function receivedKgTodayFor(processingType){
  const avg=Number(state.avgReceivedWeightKg)||18;
  const todayOrders=state.orders.filter(o=>o.processingType===processingType&&isToday(o.createdAt));
  return todayOrders.reduce((s,o)=>s+orderTotalQtyCartons(o),0)*avg;
}
/* إجمالي كيلوجرامات الدبس/العجينة المصنّعة النهارده — لكل سند (والأصناف الإضافية بيه)، بنجيب وزن الوحدة
   من نفس جدول الأسعار (حسب حجم العبوة والكرتون) ونضربه في الكمية المصنّعة، ونجمعهم كلهم */
function manufacturedKgTodayFor(processingType){
  const isDibs=processingType==='دبس';
  const table=isDibs?getDibsWeightTable():getDoughWeightTable();
  const todayOrders=state.orders.filter(o=>o.processingType===processingType);
  let total=0;
  todayOrders.forEach(o=>{
    if((o.qtyMfg||'').toString().trim()&&o.mfgDate===todayIso()){
      const m=matchWeightRowIn(table,o.packageSize,o.cartonSize);
      if(m)total+=(Number(o.qtyMfg)||0)*(Number(m.weight)||0);
    }
    (o.extraItems||[]).forEach(it=>{
      if((it.qtyMfg||'').toString().trim()&&it.mfgDate===todayIso()){
        const m=matchWeightRowIn(table,it.packageSize,it.cartonSize);
        if(m)total+=(Number(it.qtyMfg)||0)*(Number(m.weight)||0);
      }
    });
  });
  return total;
}

const SERVICES_COLS=[

  const canManage=isAdmin();
  const canAddSvc=canAddServices();

  const sf=state.servicesStatusFilter||'all';
  /* خدمات الفاكيوم/العملاء = لها رقم سند أو مرجع — خدمات أخرى للشركة = بدون رقم سند */
  const hasReceipt=so=>!!((so.receiptNo||'').trim());
  const isDone=so=>!!((so.qtyMfg||'').toString().trim());
  /* متأخر / قرّب على التأخير — بنفس منطق الطلبات (25 يوم) لكن بالاعتماد على "تم تصنيعه" بدل حالة التسليم */
  const svcDaysSince=so=>so.date?Math.floor((Date.now()-new Date(so.date).getTime())/(1000*60*60*24)):null;
  const svcIsOverdue=so=>{ const d=svcDaysSince(so); return d!==null&&!isDone(so)&&d>25; };
  const svcIsNearing=so=>{ const d=svcDaysSince(so); return d!==null&&!isDone(so)&&d>=18&&d<=25; };
  const byType=filterVal==='all'?allList:(filterVal==='auto'?allList.filter(hasReceipt):allList.filter(so=>!hasReceipt(so)));
  let list=byType;
  if(sf==='done')list=byType.filter(isDone);
  else if(sf==='pending')list=byType.filter(so=>!isDone(so));
  else if(sf==='urgent')list=byType.filter(so=>so.urgent&&!isDone(so));
  else if(sf==='overdue')list=byType.filter(svcIsOverdue);
  else if(sf==='nearing')list=byType.filter(svcIsNearing);
  const term=(state.servicesSearchTerm||'').trim().toLowerCase();

  const manualCount=allList.length-autoCount;
  const doneCount=allList.filter(isDone).length;
  const pendingCount=allList.length-doneCount;

/* ============== reports ============== */
function addDaysStr(dateStr,days){
  const d=new Date((dateStr||todayIso())+'T00:00:00');
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function addMonthsStr(dateStr,months){
  const d=new Date((dateStr||todayIso())+'T00:00:00');
  d.setMonth(d.getMonth()+months);
  return d.toISOString().slice(0,10);
}
/* يحسب بداية ونهاية الفترة المطلوبة حسب اختيار المسؤول (يومي/أسبوعي/شهري/الموسم كله) */
function reportPeriodRange(){
  const period=state.reportsPeriod||'daily';
  if(period==='weekly'){
    const start=state.reportsStartDate||todayIso();
    const end=addDaysStr(start,6);
    return {start,end,label:'أسبوعي',rangeLabel:`من ${formatDate(start)} إلى ${formatDate(end)}`};
  }
  if(period==='monthly'){
    const start=state.reportsStartDate||todayIso();
    const end=addDaysStr(addMonthsStr(start,1),-1);
    return {start,end,label:'شهري',rangeLabel:`من ${formatDate(start)} إلى ${formatDate(end)}`};
  }
  if(period==='season'){
    const dated=(state.orders||[]).filter(o=>o.date).sort((a,b)=>a.date.localeCompare(b.date));
    const start=dated.length?dated[0].date:todayIso();
    const end=todayIso();
    const year=new Date().getFullYear();
    return {start,end,label:`إجمالي الموسم ${year}`,rangeLabel:`موسم ${year} — من ${formatDate(start)} وحتى اليوم ${formatDate(end)}`};
  }
  const t=todayIso();
  return {start:t,end:t,label:'يومي',rangeLabel:`يوم ${formatDate(t)}`};
}
/* يجمع كل أرقام التقرير للفترة المحددة */
function computeReportData(){
  const {start,end,label,rangeLabel}=reportPeriodRange();
  const orders=(state.orders||[]).filter(o=>o.date&&o.date>=start&&o.date<=end);
  const received=orders.length;
  const mfg=orders.filter(o=>(o.qtyMfg||'').toString().trim());
  const delivered=orders.filter(o=>o.status==='تم التسليم');
  const bananaCartons=orders.reduce((s,o)=>((o.cartonTypes||[]).includes('كرتون موز')?s+(orderTotalQtyCartons(o)):s),0);

  const mfgByCartonSize={};
  mfg.forEach(o=>{
    const key=(o.cartonSize||'غير محدد').trim()||'غير محدد';
    mfgByCartonSize[key]=(mfgByCartonSize[key]||0)+(Number(o.qtyMfg)||0);
  });
  const mfgCartonEntries=Object.entries(mfgByCartonSize).sort((a,b)=>b[1]-a[1]);

  const deliveredByCartonSize={};
  delivered.forEach(o=>{
    const key=(o.cartonSize||'غير محدد').trim()||'غير محدد';
    deliveredByCartonSize[key]=(deliveredByCartonSize[key]||0)+(Number(o.qtyMfg)||Number(o.qtyCartons)||0);
  });
  const deliveredCartonEntries=Object.entries(deliveredByCartonSize).sort((a,b)=>b[1]-a[1]);

  const customersSet=new Set(orders.map(o=>(o.mobile||'').trim()).filter(Boolean));

  const dateTypeCounts={};
  orders.forEach(o=>{ splitDateTypes(o).forEach(dt=>{ dateTypeCounts[dt]=(dateTypeCounts[dt]||0)+1; }); });
  const dateTypeEntries=Object.entries(dateTypeCounts).sort((a,b)=>b[1]-a[1]);

  const custQty={};
  orders.forEach(o=>{
    const key=(o.mobile||o.customerName||'').trim();
    if(!key)return;
    if(!custQty[key])custQty[key]={name:o.customerName||'—',mobile:o.mobile||'—',qty:0};
    custQty[key].qty+=orderTotalQtyCartons(o);
  });
  const topCustomers=Object.values(custQty).sort((a,b)=>b.qty-a.qty).slice(0,5);

  /* تفصيل التقرير حسب القسم — فاكيوم / دبس / عجينة، كل قسم بأرقامه لوحده */
  const departments=['فاكيوم','دبس','عجينة'].map(deptName=>{
    const deptOrders=orders.filter(o=>o.processingType===deptName);
    const deptMfg=deptOrders.filter(o=>(o.qtyMfg||'').toString().trim());
    const deptDelivered=deptOrders.filter(o=>o.status==='تم التسليم');
    const receivedQty=round2(deptOrders.reduce((s,o)=>s+(orderTotalQtyCartons(o)),0));
    const mfgQty=round2(deptMfg.reduce((s,o)=>s+(Number(o.qtyMfg)||0),0));
    const deliveredQty=round2(deptDelivered.reduce((s,o)=>s+(Number(o.qtyMfg)||Number(o.qtyCartons)||0),0));
    return {name:deptName,received:deptOrders.length,mfgCount:deptMfg.length,deliveredCount:deptDelivered.length,receivedQty,mfgQty,deliveredQty};
  });

  const deliveredWithDates=delivered.filter(o=>o.date&&o.lastEditedAt);
  let avgDays=null;
  if(deliveredWithDates.length){
    const totalDays=deliveredWithDates.reduce((s,o)=>{
      const d=(new Date(o.lastEditedAt).getTime()-new Date(o.date).getTime())/(1000*60*60*24);
      return s+Math.max(0,d);
    },0);
    avgDays=(totalDays/deliveredWithDates.length).toFixed(1);
  }

  /* تقييمات رضا العملاء (بعد التسليم) اللي وصلت خلال نفس فترة التقرير — بنطابق حسب تاريخ إرسال التقييم نفسه */
  const ratingsMap=state.orderRatings||{};
  const ratingsInPeriod=Object.entries(ratingsMap)
    .filter(([rn,r])=>r&&r.ts&&r.ts.slice(0,10)>=start&&r.ts.slice(0,10)<=end)
    .map(([rn,r])=>({receiptNo:rn,...r}))
    .sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));
  const ratingsCount=ratingsInPeriod.length;
  const avgRating=ratingsCount?Math.round((ratingsInPeriod.reduce((s,r)=>s+(Number(r.stars)||0),0)/ratingsCount)*10)/10:null;
  const ratingsBreakdown=[5,4,3,2,1].map(n=>({stars:n,count:ratingsInPeriod.filter(r=>r.stars===n).length}));
  const lowRatings=ratingsInPeriod.filter(r=>Number(r.stars)<=2);

  return {start,end,label,rangeLabel,received,mfgCount:mfg.length,deliveredCount:delivered.length,
    bananaCartons,mfgCartonEntries,deliveredCartonEntries,customersCount:customersSet.size,
    dateTypeEntries,topDateType:dateTypeEntries[0]||null,topCustomers,avgDays,departments,
    ratingsCount,avgRating,ratingsBreakdown,lowRatings,ratingsInPeriod};
}

    data.topCustomers.slice(0,5).forEach((c,i)=>lines.push(`${i+1}. ${c.name} — ${c.qty} كرتون`));

  }

  <div class="card card-pad settings-section">

    ${(cfg.reminderMessageTemplate||'').includes('\uFFFD')?`<div style="font-size:12.5px;font-weight:700;color:var(--danger);background:var(--danger-soft);border-radius:8px;padding:8px 10px;margin-bottom:10px;">⚠️ النص المحفوظ حاليًا فيه رموز إيموجي تالفة — امسحها واكتب الإيموجي مباشرة من لوحة إيموجي جهازك قبل ما تحفظ تاني.</div>`:''}

    <div class="field" style="max-width:300px;"><label>الإجابة الصحيحة</label><input type="text" id="security-answer-config-input" value="${escapeHtml(cfg.securityAnswer||'')}"></div>

  <div class="card card-pad settings-section">
    <h3>نسخة احتياطية</h3>

    <button class="btn btn-primary btn-sm" id="btn-export-backup">⭳ تصدير نسخة احتياطية شاملة</button>
  </div>

  <div class="card card-pad settings-section">
    <h3>📁 مجلد الحفظ التلقائي</h3>
    <div class="sec-desc">حدد مجلد على جهازك مرة واحدة، وكل ملفات النسخ الاحتياطية والتصدير التلقائي (اليدوية والتلقائية) هتنزل جواه مباشرة من غير ما تطلب موافقتك على الحفظ في كل مرة.<br>⚠️ الخاصية دي شغالة على متصفح Chrome أو Edge على الكمبيوتر بس (مش على الموبايل ولا Safari/Firefox). لو المتصفح مش بيدعمها، الملفات هتفضل تنزل عادي في مجلد التنزيلات.</div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <span id="backup-folder-current" style="font-size:13px;font-weight:700;color:${localStorage.getItem('sajjal-backup-folder-name')?'var(--accent-dark)':'var(--ink-soft)'};">${localStorage.getItem('sajjal-backup-folder-name')?`📂 المجلد المحدد حاليًا: ${escapeHtml(localStorage.getItem('sajjal-backup-folder-name'))}`:'لم يتم تحديد مجلد بعد — الملفات بتنزل في مجلد التنزيلات العادي'}</span>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button class="btn btn-primary btn-sm" id="btn-pick-backup-folder">📁 اختيار مجلد الحفظ</button>
      ${localStorage.getItem('sajjal-backup-folder-name')?`<button class="btn btn-ghost btn-sm" id="btn-clear-backup-folder">إلغاء المجلد المحدد</button>`:''}
    </div>
  </div>

  <div class="card card-pad settings-section">
    <h3>📊 التصدير التلقائي</h3>
    <div class="sec-desc">3 طبقات حماية تلقائية: (1) لقطة يومية بتتحفظ داخل قاعدة البيانات نفسها فورًا أول ما حد يفتح البرنامج، (2) تنزيل ملف الطلبات + النسخة الشاملة على أي جهاز يفتح البرنامج بعد الساعة المحدَّدة تحت، (3) إرسال بالإيميل تلقائيًا (اختياري). كل ده بيشتغل وانت فاتح التطبيق فعليًا بس، مش في الخلفية وهو مقفول.</div>

      <input type="checkbox" id="auto-export-toggle" ${cfg.autoExportEnabled!==false?'checked':''}> تفعيل التصدير التلقائي
    </label>
    <div class="field" style="max-width:220px;margin-top:10px;">
      <label>ميعاد تجهيز نسخة اليوم (تقريبًا)</label>
      <input type="time" id="backup-time-input" value="${String(cfg.backupHour!=null?cfg.backupHour:19).padStart(2,'0')}:${String(cfg.backupMinute!=null?cfg.backupMinute:30).padStart(2,'0')}">
    </div>
  </div>

  <div class="card card-pad settings-section">
    <h3>📧 إرسال النسخة الاحتياطية بالإيميل تلقائيًا (اختياري)</h3>
    <div class="sec-desc">
      طبقة حماية إضافية — نسخة توصلك بالإيميل يوميًا بعد الميعاد أعلاه، بعيدة عن أي جهاز. محتاجة حساب مجاني من <a href="https://www.emailjs.com" target="_blank" rel="noopener">EmailJS</a> (خدمة إرسال إيميلات من المتصفح مباشرة بدون سيرفر):
      <ol style="margin:6px 0 0 0;padding-inline-start:18px;font-size:12.5px;">
        <li>سجّلي حساب مجاني في emailjs.com وريطي بريدك (Gmail/Outlook) كـ"Email Service"</li>
        <li>اعملي "Email Template" فيه المتغيرات: {{to_email}} {{subject}} {{message}} {{filename}}</li>
        <li>هاتي من لوحة تحكم EmailJS: Service ID و Template ID و Public Key، وحطيهم تحت</li>
      </ol>
      ⚠️ إرفاق الملف نفسه بالإيميل بيعتمد على خطتك في EmailJS — لو مش متاح، على الأقل هتوصلك رسالة تأكيد يومية إن النسخة اتعملت بنجاح.
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;cursor:pointer;margin-bottom:8px;">
      <input type="checkbox" id="email-backup-toggle" ${cfg.emailBackupEnabled?'checked':''}> تفعيل الإرسال بالإيميل
    </label>
    <div class="field"><label>البريد الإلكتروني المستلم</label><input type="email" id="email-backup-address" value="${escapeHtml(cfg.emailBackupAddress||'')}" placeholder="example@gmail.com"></div>
    <div class="field"><label>EmailJS Service ID</label><input type="text" id="emailjs-service-id" value="${escapeHtml(cfg.emailjsServiceId||'')}" dir="ltr"></div>
    <div class="field"><label>EmailJS Template ID</label><input type="text" id="emailjs-template-id" value="${escapeHtml(cfg.emailjsTemplateId||'')}" dir="ltr"></div>
    <div class="field"><label>EmailJS Public Key</label><input type="text" id="emailjs-public-key" value="${escapeHtml(cfg.emailjsPublicKey||'')}" dir="ltr"></div>
    <button class="btn btn-primary btn-sm" id="btn-save-email-backup">حفظ إعدادات الإيميل</button>
  </div>

  <div class="card card-pad settings-section" style="border:2px solid #E67E22;">
    <h3>🆘 استرجاع طارئ من نسخة احتياطية Excel</h3>
    <div class="sec-desc">استخدم الأداة دي بس لو حصل فقدان بيانات (زي مشكلة اتصال أدّت لمسح شهر كامل بالغلط) وعندك ملف Excel اتصدّر من نفس البرنامج (زرار "📊 تصدير Excel" في سجل الطلبات) من قبل ما المشكلة تحصل. الأداة بتقرأ الملف وتضيف بس الطلبات اللي رقم السند بتاعها مش موجود حاليًا في النظام (عشان متكررش أي طلب موجود بالفعل)، وبتسيب أي بيانات تانية زي هي تمامًا.</div>
    <div class="field"><input type="file" id="restore-backup-input" accept=".xlsx,.xls"></div>
    <button class="btn btn-primary btn-sm" id="btn-restore-backup" style="background:#E67E22;">🆘 ابدأ الاسترجاع من الملف المختار</button>
  </div>

  <div class="card card-pad settings-section">
    <h3>⚠️ منطقة الخطر</h3>
    <div class="sec-desc">مسح جميع الطلبات والخدمات الإضافية وسجل التدقيق نهائيًا. لا يمكن التراجع عن هذا الإجراء. ملاحظة: بيانات العملاء (الملاحظات والتسعير في صفحة "بيانات العملاء") لا تتأثر بهذا الزر ولها زر مسح خاص بها في صفحتها.</div>
    <button class="btn btn-danger btn-sm" id="btn-wipe-all-data">🗑️ مسح جميع البيانات</button>
  </div>`;
}
