    <div class="result-card svc-search-result" data-svc-id="${so.id}" style="cursor:pointer;border-inline-start:4px solid #7B2FBE;">
      <div class="result-top">
        <div>
          <div class="result-name">${escapeHtml(so.customerName||'—')}</div>
          <div>${so.receiptNo?`سند <span class="receipt-display" style="font-size:15px;">${formatReceiptNoHtml(so.receiptNo)}</span> — `:''}<span style="font-weight:700;font-size:14px;">${formatDate(so.date)}</span></div>
        </div>
        <div>${serviceBadge(so.serviceType)}</div>
      </div>
    </div>`).join('')}
  ${serviceResults.length>20?`<div style="font-size:12px;color:var(--ink-soft);margin-top:4px;">و${serviceResults.length-20} نتيجة تانية — افتح صفحة الخدمات الإضافية لعرضها كلها</div>`:''}
  `:''}`;
}

/* ============== warehouse ============== */
/* توليد محتوى خلية جدول "المستودع" حسب مفتاح العمود */
function warehouseCellHtml(o,key){
  switch(key){
    case 'placement': return `<td data-label="موقع التسكين"><span class="wh-loc-badge">${escapeHtml(o.placementLocation)}</span></td>`;
    case 'receiptNo': return `<td data-label="رقم السند"><span class="receipt-display receipt-goto" data-id="${o.id}" title="الانتقال لصفحة التصنيع الخاصة بهذا الطلب" style="color:#C0392B;font-weight:800;">${formatReceiptNoHtml(o.receiptNo||'—')}</span>${riyalCalcIconHtml(o.receiptNo)}${daysWithoutMfgBadge(o)}${unwashedBadge(o)}${notesIconBadge(o)}</td>`;
    case 'customer': return `<td data-label="العميل"><strong class="cell-customer-name customer-goto" data-mobile="${escapeHtml(o.mobile||'')}" title="اعرض كل طلبات هذا العميل" style="color:#C0392B;">${escapeHtml(o.customerName||'—')}${clBadge(o.mobile)}${customerNoteBadge(o.mobile)}</strong></td>`;
    case 'dateType': return `<td data-label="نوع التمر">${escapeHtml(o.dateType||'—')}</td>`;
    case 'qtyReceived': return `<td data-label="الكمية المستلمة">${qtyReceivedHtml(o)}</td>`;
    case 'qtyMfg': return `<td data-label="الكمية المصنعة">${qtyMfgDisplayHtml(o)}</td>`;
    case 'status': return `<td data-label="الحالة">${canManageStatus()?statusEditControlHtml(o):statusBadge(o.status,'sm')}</td>`;
    case 'storageDays': { const days=daysInWarehouse(o); const dayColor=days>=25?'#C0392B':(days>=15?'#B8860B':'#2F7A4D');
      return `<td data-label="عدد أيام التخزين"><strong style="color:${dayColor};">${days} يوم</strong>${days>=25?' 🔴':(days>=15?' 🟡':'')}</td>`; }
    default: return '<td>—</td>';
  }
}
function renderWarehouse(){
  /* المستودع أصلاً وظيفته يوري الطلبات الراكدة/القديمة اللي لسه في المستودع، فلازم يشوف الأرشيف كامل
     من أول ما يتفتح (مش يستنى بحث)، عشان محدّش يفتكر إن طلب قديم "اختفى" وهو بس لسه ما اتحمّلش */
  triggerFullHistoryLoadIfNeeded();
  const wf=state.warehouseFilter||'remaining';
  const remainingBase=state.orders.filter(o=>(o.placementLocation||'').trim()&&o.status!=='تم التسليم');
  const allEverPlaced=state.orders.filter(o=>(o.placementLocation||'').trim());
  const deliveredBase=allEverPlaced.filter(o=>o.status==='تم التسليم');
  const deliveredFromWarehouse=deliveredBase.length;
  let all=wf==='delivered'?deliveredBase:(wf==='all'?allEverPlaced:remainingBase);
  const stagnantOnly=!!state.warehouseStagnantOnly;
  if(stagnantOnly)all=all.filter(isStagnantInWarehouse);
  const term=(state.warehouseSearchTerm||'').trim().toLowerCase();
  /* فلتر الفترة الزمنية — لا يخفي إلا الطلبات المُسلَّمة القديمة؛ الطلبات المتبقية بالمستودع تفضل ظاهرة دايمًا مهما كان تاريخها */
  const period=state.warehousePeriod||'3';
  const cutoff=periodCutoffDate(period);
  const hiddenByPeriodCount=(cutoff===null||term)?0:all.filter(o=>o.status==='تم التسليم'&&o.date&&new Date(o.date)<cutoff).length;
  if(cutoff!==null&&!term){
    all=all.filter(o=>o.status!=='تم التسليم'||!o.date||new Date(o.date)>=cutoff);
  }
  const filtered=term?all.filter(o=>{
    const sf=smartSearchFields(term);
    if(sf)return sf.some(f=>(o[f]||'').toString().toLowerCase().includes(term));
    return (o.receiptNo||'').toLowerCase().includes(term)||
    (o.customerName||'').toLowerCase().includes(term)||
    (o.mobile||'').includes(term)||
    (o.dateType||'').toLowerCase().includes(term);
  }):all;
  /* فلتر "مدة التصنيع" — بيوري بس الطلبات اللي اتصنّعت فعلاً وعدّى على تاريخ استلامها (o.date) لحد
     النهارده مدة أكبر من أو تساوي عدد الأيام المكتوب */
  const durationDays=Number(state.warehouseDurationFilter||0);
  const filteredByDuration=durationDays>0?filtered.filter(o=>{
    if(!o.mfgDate||!o.date)return false;
    const days=(Date.now()-new Date(o.date).getTime())/86400000;
    return days>=durationDays;
  }):filtered;
  /* فلتر "من تم إرسال واتساب له / لم يُرسَل" */
  const waFilter=state.warehouseWaFilter||'';
  const filteredByWa=waFilter==='wa-sent'?filteredByDuration.filter(o=>!!o.whatsappSentAt)
    :waFilter==='wa-not-sent'?filteredByDuration.filter(o=>!o.whatsappSentAt)
    :filteredByDuration;
  /* funnelBase = القائمة قبل تطبيق فلاتر الأعمدة (تُستخدم لبناء قوائم القيم في قوائم الاقماع) */
  state._warehouseFunnelBase=filteredByWa;
  const activeColFilterCount=Object.values(state.columnFilters.warehouse||{}).filter(v=>v&&v.length).length;
  const colFiltered=applyColumnFilters('warehouse',filteredByWa);
  /* الترتيب: لو المستخدم دوس على رأس عمود لترتيبه، نستخدم الترتيب ده؛ غير كده الترتيب الافتراضي حسب
     موقع التسكين: 1-1 ، 1-2 ، 1-3 ، 2-1 ، 2-2 ... */
  const whSortActive=!!((state.sortState||{}).warehouse&&(state.sortState||{}).warehouse.col);
  const list=whSortActive?applySortState('warehouse',colFiltered):sortByPlacement(colFiltered);
  const whCols=resolveColumns('warehouse',['placement','receiptNo','customer','dateType','qtyReceived','qtyMfg','status','storageDays']);
  /* الترقيم (Pagination) */
  const filterSig=wf+'|'+term+'|'+period+'|'+durationDays+'|'+waFilter+'|'+JSON.stringify(state.columnFilters.warehouse||{});
  if(state._warehouseFilterSig!==filterSig){ state._warehouseFilterSig=filterSig; state.warehousePage=1; }
  const totalPages=Math.max(1,Math.ceil(list.length/PAGE_SIZE));
  if(!state.warehousePage||state.warehousePage<1)state.warehousePage=1;
  if(state.warehousePage>totalPages)state.warehousePage=totalPages;
  const curPage=state.warehousePage;
  const pagedList=list.slice((curPage-1)*PAGE_SIZE,curPage*PAGE_SIZE);
  const paginationHtml=paginationBarHtml('warehouse',curPage,totalPages,list.length,'طلب');

  const totalOrders=remainingBase.length;
  const totalQty=remainingBase.reduce((s,o)=>s+orderTotalQtyCartonsCeil(o),0);
  const dateTypesSet=new Set(remainingBase.flatMap(splitDateTypes));
  const dateTypesArr=[...dateTypesSet];
  /* طلبات تم تصنيعها لكن لم توضع في المستودع بعد (لا يوجد لها موقع تسكين) */
  /* "المستودع" خاص بالفاكيوم بس فعليًا — باقي الأنواع (دبس/عجينة/تعقيم) مالهاش تسكين مستودع بنفس الطريقة */
  const mfgNotPlaced=state.orders.filter(o=>o.processingType==='فاكيوم'&&(o.qtyMfg||'').toString().trim()&&!(o.placementLocation||'').trim()&&o.status!=='تم التسليم');
  /* العكس: طلب اتكتب له موقع تسكين بس من غير ما تُكتب له كمية مصنعة خالص (لسه في remainingBase لأنه
     مش مُسلَّم) — ده بيفسّر أي فرق بين "المتبقي بالمستودع" وبين (تم التصنيع - المسلَّم) في صفحة الفاكيوم،
     غالبًا حد كتب المكان قبل الكمية، أو الكمية اتكتبت وبعدين اتمسحت وفضل المكان زي ما هو */
  const placedNoMfg=isAdmin()?remainingBase.filter(o=>!(o.qtyMfg||'').toString().trim()):[];
  state._placedNoMfgData=placedNoMfg;
  const stagnantCount=remainingBase.filter(isStagnantInWarehouse).length;
  const placedTodayCount=state.orders.filter(o=>o.placementDate===todayIso()).length;
  const whDeliveredPeriod=state.warehouseDeliveredPeriod||'today';
  const whDeliveredCount=deliveredBase.filter(o=>inDeliveredPeriod(o.lastEditedAt,whDeliveredPeriod)).length;

  return`
  <div class="page-head">
    <div><h1 class="page-title">${warehouseIconSvg(26)} المستودع</h1><div class="page-desc">الطلبات المسكّنة حسب موقع التسكين بالمستودع — مرتبة حسب موقع الرف</div></div>
    <div class="toolbar">
      <span class="last-sync">آخر تحديث: ${state.lastSync||'—'}</span>
      <button class="btn btn-ghost btn-sm" id="btn-refresh">↻ تحديث</button>
      <button class="btn btn-primary btn-sm" id="btn-print-warehouse" style="background:#B5651D;">🖨️ طباعة جرد المستودع</button>
    </div>
  </div>
  ${bigDayCounterHtml('🏭','عدد الأوردرات المسكَّنة اليوم',placedTodayCount)}
  ${deliveredCounterHtml('warehouse-delivered-period',whDeliveredCount,whDeliveredPeriod)}
  ${wf==='delivered'?`<div class="filter-banner filter-nearing">✅ عرض الطلبات المسلَّمة (اللي كانت بالمستودع) فقط — <button class="btn-clear-filter" id="btn-clear-warehouse-filter">× مسح الفلتر</button></div>`:''}
  ${wf==='all'?`<div class="filter-banner filter-nearing">📦 عرض كل الطلبات اللي دخلت المستودع (المتبقي + المسلَّم) — <button class="btn-clear-filter" id="btn-clear-warehouse-filter">× مسح الفلتر</button></div>`:''}
  ${stagnantOnly?`<div class="filter-banner filter-urgent">🐌 عرض الطلبات الراكدة فقط (${STAGNANT_WAREHOUSE_DAYS} يوم أو أكتر بدون خروج) — <button class="btn-clear-filter" id="btn-clear-warehouse-stagnant">× مسح الفلتر</button></div>`:''}
  ${activeColFilterCount>0?`<div class="filter-banner filter-nearing">🔽 مطبّق ${activeColFilterCount} فلتر أعمدة على الجدول — <button class="btn-clear-filter" id="btn-clear-col-filters-warehouse">× مسح فلاتر الأعمدة</button></div>`:''}
  ${durationDays>0?`<div class="filter-banner filter-nearing">🕐 عرض الطلبات المصنّعة اللي عدّى على استلامها ${durationDays} يوم أو أكتر — <button class="btn-clear-filter" id="btn-clear-warehouse-duration">× مسح الفلتر</button></div>`:''}
  ${isAdmin()&&placedNoMfg.length>0?`<div class="filter-banner filter-nearing" style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
    <span>⚠️ فيه ${placedNoMfg.length} طلب له موقع تسكين بالمستودع بدون كمية مصنعة مسجَّلة — ده سبب الفرق بين "المتبقي بالمستودع" و(تم التصنيع - المسلَّم)</span>
    <button type="button" class="btn btn-sm" id="btn-view-placed-no-mfg" style="background:#E67E22;color:#fff;font-weight:800;white-space:nowrap;">عرض الطلبات</button>
  </div>`:''}

  ${progressBarHtml('نسبة ما تم تسليمه',deliveredFromWarehouse,allEverPlaced.length,'#B5651D')}

  <div class="stats">
    <div class="stat-chip" style="cursor:pointer;" id="stat-chip-total-warehouse"><img src="assets/shelf.png" width="26" style="vertical-align:middle;margin-left:6px;" alt="" onerror="this.outerHTML='🏬'"><span class="stat-num">${allEverPlaced.length}</span><span class="stat-label">إجمالي طلبات دخلت المستودع</span></div>
    <div class="stat-chip" style="border-color:#2F7A4D;cursor:pointer;" id="stat-chip-delivered-warehouse"><span class="stat-num">${deliveredFromWarehouse}</span><span class="stat-label">تم التسليم منها</span></div>
    <div class="stat-chip" style="border-color:#B8860B;cursor:pointer;" id="stat-chip-remaining-warehouse"><span class="stat-num">${totalOrders}</span><span class="stat-label">المتبقي بالمستودع</span></div>
  </div>

  <div class="warehouse-stats">
    <div class="wh-stat-card">
      <div class="wh-stat-icon" style="animation:iconBounce 1.6s ease-in-out infinite;"><img src="assets/boxes.png" width="34" alt="" onerror="this.outerHTML='📦'"></div>
      <div class="wh-stat-num">${totalOrders}</div>
      <div class="wh-stat-label">عدد الطلبات بالمستودع</div>
    </div>
    <div class="wh-stat-card">
      <div class="wh-stat-icon" style="animation:iconPulse 1.6s ease-in-out infinite;"><img src="assets/dates-box.png" width="34" alt="" onerror="this.outerHTML='📦'"></div>
      <div class="wh-stat-num">${totalQty} <span style="font-size:13px;font-weight:700;">كرتون</span></div>
      <div class="wh-stat-label">إجمالي الكمية الموجودة</div>
    </div>
    <div class="wh-stat-card">
      <div class="wh-stat-icon" style="animation:iconSwing 1.8s ease-in-out infinite;">🌴</div>
      <div class="wh-stat-num">${dateTypesSet.size}</div>
      <div class="wh-stat-label" title="${escapeHtml(dateTypesArr.join('، '))}">أنواع التمور الموجودة</div>
    </div>
    <div class="wh-stat-card" id="wh-card-mfg-not-placed" style="cursor:pointer;border-color:#C0392B;">
      <div class="wh-stat-icon" style="animation:iconBounce 1.6s ease-in-out infinite;">${forkliftIconSvg(52)}</div>
      <div class="wh-stat-num" style="color:#C0392B;">${mfgNotPlaced.length}</div>
      <div class="wh-stat-label">مصنّعة ولم تدخل المستودع بعد</div>
    </div>
    <div class="wh-stat-card" id="wh-card-stagnant" style="cursor:pointer;border-color:#C0392B;">
      <div class="wh-stat-icon dash-icon-blink${stagnantCount>0?' is-active':''}" style="font-size:34px;">🐌</div>
      <div class="wh-stat-num" style="color:#C0392B;">${stagnantCount}</div>
      <div class="wh-stat-label">طلبات راكدة (${STAGNANT_WAREHOUSE_DAYS}+ يوم بدون خروج)</div>
    </div>
  </div>

  <div class="toolbar search-toolbar-sticky">
    ${searchBoxHtml('warehouse-search-input','رقم السند / الاسم / الجوال / نوع التمر…',state.warehouseSearchTerm)}
    ${periodSelectHtml('warehouse-period-filter',period)}
    <select id="warehouse-wa-filter" style="max-width:170px;font-size:12.5px;padding:7px 8px;">
      <option value="">📱 فلتر الواتساب: الكل</option>
      <option value="wa-sent" ${waFilter==='wa-sent'?'selected':''}>تم إرسال واتساب لهم</option>
      <option value="wa-not-sent" ${waFilter==='wa-not-sent'?'selected':''}>لم يُرسَل لهم واتساب</option>
    </select>
    <span style="display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-soft);" title="بيحسب المدة من تاريخ استلام الطلب لحد النهارده، ويعرض بس الطلبات اللي اتصنّعت فعلاً">
      🕐 عدّى على الاستلام ≥
      <input type="number" min="1" id="warehouse-duration-filter" value="${durationDays||''}" placeholder="أيام" style="width:60px;padding:5px 6px;border:1px solid var(--border);border-radius:6px;">
      يوم (مصنّعة)
    </span>
    ${(term||activeColFilterCount>0||durationDays>0)?`<span style="font-size:13px;color:var(--ink-soft);">عدد النتائج: <strong style="color:var(--accent-dark);font-size:15px;">${list.length}</strong></span>`:''}
    ${(!term&&hiddenByPeriodCount>0)?`<span style="font-size:12px;color:var(--ink-soft);">(${hiddenByPeriodCount} طلب مُسلَّم أقدم من الفترة مش ظاهر هنا — اختر "كل الفترات" لعرضه)</span>`:''}
  </div>

  ${paginationHtml}
  ${list.length===0?`<div class="card"><div class="empty-state"><div class="big">🏭</div><div>${(term||activeColFilterCount>0)?'لا توجد نتائج مطابقة':'لا توجد طلبات في المستودع حاليًا'}</div></div></div>`:`
  <div class="card"><div class="table-wrap">
    <table data-col-table="warehouse"><thead><tr>${colHeaderHtml('warehouse',whCols)}<th></th></tr></thead><tbody>
    ${pagedList.map(o=>{
      return`<tr data-id="${o.id}" class="wh-row" style="cursor:pointer;">
      ${whCols.map(c=>warehouseCellHtml(o,c.key)).join('')}
      <td data-label="واتساب">${whatsAppCellHtml(o)}</td>
    </tr>`;}).join('')}
    </tbody></table>
  </div></div>`}
  `;
}

/* ============== production ============== */
/* توليد محتوى خلية جداول التصنيع (فاكيوم/دبس/عجينة/تعقيم) حسب مفتاح العمود */
function productionCellHtml(o,key,ctx){
  switch(key){
    case 'date': return `<td data-label="التاريخ"><span class="mono" style="font-weight:700;">${formatDate(o.date)}</span>${isOverdue(o)?` <span style="color:#C0392B;font-size:10px;font-weight:700;">متأخر</span>`:(isNearingDelay(o)?` <span style="color:#8A6500;font-size:10px;font-weight:700;">🟡 قرّب يتأخر</span>`:'')}</td>`;
    case 'receiptNo': return `<td data-label="رقم السند"><span class="receipt-display">${formatReceiptNoHtml(o.receiptNo)}</span>${daysWithoutMfgBadge(o)}${unwashedBadge(o)}${notesIconBadge(o)}</td>`;
    case 'customer': return `<td data-label="العميل"><strong class="cell-customer-name customer-goto" data-mobile="${escapeHtml(o.mobile||'')}" title="اعرض كل طلبات هذا العميل">${escapeHtml(o.customerName)}${clBadge(o.mobile)}${customerNoteBadge(o.mobile)}</strong><br><span class="mono" style="font-size:11px;color:var(--ink-soft)">${escapeHtml(o.mobile||'')}</span></td>`;
    case 'dateType': return `<td data-label="نوع التمر">${escapeHtml(o.dateType||'—')}</td>`;
    case 'qtyReceived': return `<td data-label="الكمية المستلمة">${qtyReceivedHtml(o)}</td>`;
    case 'pkgCarton': return `<td data-label="حجم العبوة / الكرتون">${escapeHtml(o.packageSize||'—')} <span style="opacity:.5">/</span> ${escapeHtml(o.cartonSize||'—')}</td>`;
    case 'extra': return ctx.showPlacement
        ? ((o.vacuumServices||[]).length>0?`<td data-label="الخدمات الإضافية"><div style="display:flex;flex-wrap:wrap;gap:4px;">${(o.vacuumServices||[]).map(s=>serviceBadge(s)).join('')}</div></td>`:`<td data-label="الخدمات الإضافية">—</td>`)
        : `<td data-label="حالة التمر">${dateConditionBadge(o)}</td>`;
    case 'urgent': return `<td data-label="الأولوية">${o.processingType==='فاكيوم'?urgentBadge(o.urgent):''}</td>`;
    /* بمجرد ما الطلب يبقى "تم التسليم"، كل خانات التعديل (الكمية المصنعة/التسكين/الملاحظات) تتقفل
       وتتحول لعرض قراءة فقط — إلا زرار "تم التسليم" نفسه، لازم يفضل قابل للضغط عشان لو حد شال العلامة
       بالغلط أو محتاج يصحّح، الخانات ترجع تتفتح تلقائيًا. ده لمنع مشكلة مسح الكمية المصنعة بعد التسليم
       من غير قصد (اللي كانت بتسبب فرق بين كارت "تم التصنيع" وكارت "المتبقي") */
    case 'qtyMfg': return `<td data-label="الكمية المصنعة">${(canEditQtyMfg()&&o.status!=='تم التسليم')?qtyMfgEditableHtmlMulti(o):qtyMfgDisplayHtml(o)}</td>`;
    case 'placement': return `<td data-label="موقع التسكين">${(ctx.canEdit&&canEditPlacement()&&o.status!=='تم التسليم')?`<input type="text" class="placement-input" data-id="${o.id}" placeholder="مثال: 3-1" value="${escapeHtml((state.placementDraft&&state.placementDraft[o.id]!=null)?state.placementDraft[o.id]:(o.placementLocation||''))}" style="color:#C0392B;font-weight:700;">`:`<strong style="color:#C0392B;">${escapeHtml(o.placementLocation||'—')}</strong>`}</td>`;
    case 'status': return `<td data-label="الحالة">${canManageStatus()?statusEditControlHtml(o):statusBadge(o.status)}</td>`;
    case 'notes': return `<td data-label="ملاحظات" class="cell-notes">${(ctx.canEdit&&o.status!=='تم التسليم')?`<textarea class="notes-input" data-id="${o.id}" placeholder="أضف ملاحظة…" style="color:#C0392B;font-weight:700;">${escapeHtml((state.notesDraft&&state.notesDraft[o.id]!=null)?state.notesDraft[o.id]:(o.processingNotes||''))}</textarea>`:escapeHtml(o.processingNotes||'—')}</td>`;
    case 'lastEdit': return `<td data-label="آخر تعديل">${auditLine(o)||'<span style="color:var(--ink-soft);font-size:11px;">—</span>'}</td>`;
    default: return '<td>—</td>';
  }
}
/* فلترة موحّدة لصفحات التصنيع (فاكيوم/دبس/عجينة/تعقيم) — نفس منطق سجل الطلبات بالظبط،
   وتُستخدم في العرض وفي التصدير والطباعة معًا عشان تفضل النتيجة واحدة في كل مكان */
function getFilteredProductionOrders(view){
  const type=PROD_VIEW_LABELS[view];
  let allOrders=sortedOrders(state.orders.filter(o=>o.processingType===type));
  /* طلبات الفاكيوم اللي مرتبطة بخدمة إضافية (تقعيم/حشو لوز...) لسه معلّقة (مش "تم التسليم" في صفحة الخدمات)
     ميظهروش في صفحة الفاكيوم خالص لحد ما الخدمة تتسلَّم — ساعتها بس يبقى دور الفاكيوم يبدأ */
  if(type==='فاكيوم'){
    /* مجموعة (Set) بأرقام سندات الخدمات المعلّقة مرة واحدة بدل ما نلف على كل الخدمات لكل طلب (كان بطيء مع تراكم البيانات) */
    const pendingSvcReceipts=new Set(state.serviceOrders.filter(so=>so.status!=='تم التسليم'&&so.receiptNo).map(so=>so.receiptNo));
    allOrders=allOrders.filter(o=>{
      if(!(o.receiptNo||'').trim())return true;
      return !pendingSvcReceipts.has(o.receiptNo);
    });
  }
  const pf=((state.productionFilter||{})[view])||'all';
  let filteredByStatus=allOrders;
  if(pf==='remaining')filteredByStatus=allOrders.filter(o=>!(o.qtyMfg||'').toString().trim()&&o.status!=='تم التسليم');
  else if(pf==='mfg')filteredByStatus=allOrders.filter(o=>(o.qtyMfg||'').toString().trim());
  else if(pf==='urgent')filteredByStatus=allOrders.filter(isUrgentPending);
  else if(pf==='overdue')filteredByStatus=allOrders.filter(o=>isOverdue(o));
  else if(pf==='nearing')filteredByStatus=allOrders.filter(o=>isNearingDelay(o));
  else if(pf==='delivered-today')filteredByStatus=allOrders.filter(o=>o.status==='تم التسليم'&&o.statusDate&&isToday(o.statusDate));
  else if(pf==='delivered')filteredByStatus=allOrders.filter(o=>o.status==='تم التسليم');
  /* "بدون غسيل" فلتر مستقل عن باقي الكروت (زي "تم التصنيع") — عشان تقدر تجمّع بينهم في نفس الوقت،
     بدل ما اختيار واحد يلغي التاني. وزي باقي كروت التنبيهات (مستعجل/قرّب على التأخير/متأخر) —
     بمجرد ما تُسجَّل كمية مصنعة للطلب، يخرج من عداد "بدون غسيل" تلقائيًا حتى لو لسه ما اتسلمش */
  const unwashedOnly=!!((state.productionUnwashedFilter||{})[view]);
  if(unwashedOnly)filteredByStatus=filteredByStatus.filter(o=>o.washed===false&&!(o.qtyMfg||'').toString().trim());
  const term=((state.productionSearchTerm||{})[view]||'').trim().toLowerCase();
  let orders=term?filteredByStatus.filter(o=>{
    const sf=smartSearchFields(term);
    if(sf)return sf.some(f=>(o[f]||'').toString().toLowerCase().includes(term));
    return (o.receiptNo||'').toLowerCase().includes(term)||
    (o.customerName||'').toLowerCase().includes(term)||
    (o.mobile||'').includes(term);
  }):filteredByStatus;
  /* فلتر "إخفاء المسلّم" — مستقل عن باقي الفلاتر، مفيد وانت بتدور برقم جوال عميل في خانة البحث
     وعايز تشوف بس اللي لسه معلّق عنده */
  const hideDelivered=!!((state.productionHideDelivered||{})[view]);
  if(hideDelivered)orders=orders.filter(o=>o.status!=='تم التسليم');
  /* فلتر "مدة التصنيع" — بيوري بس الطلبات اللي اتصنّعت فعلاً وعدّى على تاريخ استلامها (o.date) لحد
     النهارده مدة أكبر من أو تساوي عدد الأيام المكتوب (مش المدة اللي استغرقها التصنيع فعليًا) */
  const durationDays=Number(((state.productionDurationFilter||{})[view])||0);
  if(durationDays>0){
    orders=orders.filter(o=>{
      if(!o.mfgDate||!o.date)return false;
      const days=(Date.now()-new Date(o.date).getTime())/86400000;
      return days>=durationDays;
    });
  }
  /* فلتر الفترة الزمنية — لا يخفي إلا الطلبات المُسلَّمة القديمة؛ أي طلب لسه معلّق أو مستعجل يفضل ظاهر دايمًا */
  const period=((state.productionPeriod||{})[view])||'3';
  const cutoff=periodCutoffDate(period);
  const hiddenByPeriodCount=(cutoff===null||term||pf!=='all')?0:orders.filter(o=>o.status==='تم التسليم'&&o.date&&new Date(o.date)<cutoff).length;
  if(cutoff!==null&&!term&&pf==='all'){
    orders=orders.filter(o=>o.status!=='تم التسليم'||!o.date||new Date(o.date)>=cutoff);
  }
  /* funnelBase = القائمة قبل تطبيق فلاتر الأعمدة (تُستخدم لبناء قوائم القيم في قوائم الاقماع) */
  const funnelBase=orders;
  const tableKey='production-'+view;
  orders=applyColumnFilters(tableKey,orders);
  orders=applySortState(tableKey,orders);
  /* المستعجل اللي لسه ما اتصنعش بيطلع في أول الجدول تلقائيًا (لو المستخدم مرتّب بعمود معيّن بنسيب ترتيبه زي ما هو) */
  if(!((state.sortState||{})[tableKey]||{}).col&&orders.some(isUrgentPending)){
    orders=[...orders.filter(isUrgentPending),...orders.filter(o=>!isUrgentPending(o))];
  }
  return {orders,allOrders,funnelBase,hiddenByPeriodCount,term,pf,period,type,tableKey,durationDays,unwashedOnly,hideDelivered};
}
/* ============== storage: متوسط وزن الكيلو للتمر المستلم بالسلة/الكرتون (دبس وعجينة) ============== */
/* إجمالي كيلوجرامات التمر المستلمة النهارده لنوع تصنيع معيّن (دبس/عجينة) — الكمية المستلمة (بالسلال/الكراتين)
   مضروبة في متوسط وزن الوحدة (قابل للتعديل من المسؤول) */
function receivedKgTodayFor(processingType){
  const avg=Number(state.avgReceivedWeightKg)||18;
  const todayOrders=state.orders.filter(o=>o.processingType===processingType&&isToday(o.createdAt));
  return todayOrders.reduce((s,o)=>s+orderTotalQtyCartons(o),0)*avg;
}
/* إجمالي كيلوجرامات الدبس/العجينة المصنّعة النهارده — لكل سند (والأصناف الإضافية بيه)، بنجيب وزن الوحدة
   من نفس جدول الأسعار (حسب حجم العبوة والكرتون) ونضربه في الكمية المصنّعة، ونجمعهم كلهم */
function manufacturedKgTodayFor(processingType){
  const isDibs=processingType==='دبس';
  const table=isDibs?getDibsWeightTable():getDoughWeightTable();
  const todayOrders=state.orders.filter(o=>o.processingType===processingType);
  let total=0;
  todayOrders.forEach(o=>{
    if((o.qtyMfg||'').toString().trim()&&o.mfgDate===todayIso()){
      const m=matchWeightRowIn(table,o.packageSize,o.cartonSize);
      if(m)total+=(Number(o.qtyMfg)||0)*(Number(m.weight)||0);
    }
    (o.extraItems||[]).forEach(it=>{
      if((it.qtyMfg||'').toString().trim()&&it.mfgDate===todayIso()){
        const m=matchWeightRowIn(table,it.packageSize,it.cartonSize);
        if(m)total+=(Number(it.qtyMfg)||0)*(Number(m.weight)||0);
      }
    });
  });
  return total;
}
/* كارت صغير لصفحتي الدبس والعجينة — كمية التمر المستلم بالكيلو (تقديري) وكمية المُصنَّع الفعلية بالكيلو، النهارده بس */

        <div style="font-size:16px;font-weight:800;color:#6B4E16;line-height:1.1;">${receivedKg.toLocaleString('en-US',{maximumFractionDigits:1})} كجم</div>

  const allList=[...state.serviceOrders].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const filterVal=state.servicesFilter||'all';

  /* خدمات الفاكيوم/العملاء = لها رقم سند أو مرجع — خدمات أخرى للشركة = بدون رقم سند */
  const hasReceipt=so=>!!((so.receiptNo||'').trim());

  /* متأخر / قرّب على التأخير — بنفس منطق الطلبات (25 يوم) لكن بالاعتماد على "تم تصنيعه" بدل حالة التسليم */
  const svcDaysSince=so=>so.date?Math.floor((Date.now()-new Date(so.date).getTime())/(1000*60*60*24)):null;
  const svcIsOverdue=so=>{ const d=svcDaysSince(so); return d!==null&&!isDone(so)&&d>25; };
  const svcIsNearing=so=>{ const d=svcDaysSince(so); return d!==null&&!isDone(so)&&d>=18&&d<=25; };
  const byType=filterVal==='all'?allList:(filterVal==='auto'?allList.filter(hasReceipt):allList.filter(so=>!hasReceipt(so)));
  let list=byType;
  if(sf==='done')list=byType.filter(isDone);
  else if(sf==='pending')list=byType.filter(so=>!isDone(so));
  else if(sf==='urgent')list=byType.filter(so=>so.urgent&&!isDone(so));
  else if(sf==='overdue')list=byType.filter(svcIsOverdue);
  else if(sf==='nearing')list=byType.filter(svcIsNearing);
  else if(sf==='delivered')list=byType.filter(so=>so.status==='تم التسليم');
  const term=(state.servicesSearchTerm||'').trim().toLowerCase();
  if(term)list=list.filter(so=>{
    const sf=smartSearchFields(term);
    if(sf)return sf.some(f=>(so[f]||'').toString().toLowerCase().includes(term));
    return (so.receiptNo||'').toLowerCase().includes(term)||
    (so.customerName||'').toLowerCase().includes(term)||
    (so.mobile||'').includes(term);
  });
  /* فلتر الفترة الزمنية — لا يخفي إلا الخدمات المُصنَّعة القديمة؛ الخدمات لسه معلّقة تفضل ظاهرة دايمًا */
  const period=state.servicesPeriod||'3';
  const cutoff=periodCutoffDate(period);
  const hiddenByPeriodCount=(cutoff===null||sf!=='all'||term)?0:list.filter(so=>isDone(so)&&so.date&&new Date(so.date)<cutoff).length;
  if(cutoff!==null&&sf==='all'&&!term){
    list=list.filter(so=>!isDone(so)||!so.date||new Date(so.date)>=cutoff);
  }
  /* funnelBase = القائمة قبل تطبيق فلاتر الأعمدة (تُستخدم لبناء قوائم القيم في قوائم الاقماع) */
  state._servicesFunnelBase=list;
  const activeColFilterCount=Object.values(state.columnFilters.services||{}).filter(v=>v&&v.length).length;
  list=applyColumnFilters('services',list);
  /* الترقيم (Pagination) */
  const filterSig=filterVal+'|'+sf+'|'+term+'|'+period+'|'+JSON.stringify(state.columnFilters.services||{});
  if(state._servicesFilterSig!==filterSig){ state._servicesFilterSig=filterSig; state.servicesPage=1; }
  const totalPages=Math.max(1,Math.ceil(list.length/PAGE_SIZE));
  if(!state.servicesPage||state.servicesPage<1)state.servicesPage=1;
  if(state.servicesPage>totalPages)state.servicesPage=totalPages;
  const curPage=state.servicesPage;
  const pagedList=list.slice((curPage-1)*PAGE_SIZE,curPage*PAGE_SIZE);
  const paginationHtml=paginationBarHtml('services',curPage,totalPages,list.length,'خدمة');
  const autoCount=allList.filter(hasReceipt).length;
  const manualCount=allList.length-autoCount;
  const doneCount=allList.filter(isDone).length;
  const pendingCount=allList.length-doneCount;
  const urgentCount=allList.filter(so=>so.urgent&&!isDone(so)).length;
  const overdueCount=allList.filter(svcIsOverdue).length;
  const nearingCount=allList.filter(svcIsNearing).length;
  const mfgTodayCount=allList.filter(so=>so.mfgDate===todayIso()).length;
  const svcDeliveredPeriod=state.servicesDeliveredPeriod||'today';
  const svcDeliveredCount=allList.filter(so=>isDone(so)&&inDeliveredPeriod(so.mfgDate,svcDeliveredPeriod)).length;
  const deliveredCount=allList.filter(so=>so.status==='تم التسليم').length;
  return`

  ${bigDayCounterHtml('🟣','عدد الأوردرات المصنَّعة اليوم — الخدمات الإضافية',mfgTodayCount)}
  ${deliveredCounterHtml('services-delivered-period',svcDeliveredCount,svcDeliveredPeriod)}
  ${sf==='done'?`<div class="filter-banner filter-nearing">✅ عرض الخدمات التي تم تصنيعها فقط — <button class="btn-clear-filter" id="btn-clear-services-status-filter">× مسح الفلتر</button></div>`:''}
  ${sf==='pending'?`<div class="filter-banner filter-nearing">📋 عرض الخدمات المتبقية (لم تُصنّع بعد) فقط — <button class="btn-clear-filter" id="btn-clear-services-status-filter">× مسح الفلتر</button></div>`:''}

  ${sf==='overdue'?`<div class="filter-banner filter-urgent">⚠️ عرض الخدمات المتأخرة فقط — <button class="btn-clear-filter" id="btn-clear-services-status-filter">× مسح الفلتر</button></div>`:''}
  ${sf==='nearing'?`<div class="filter-banner filter-nearing">🟡 عرض الخدمات القريبة من التأخير فقط — <button class="btn-clear-filter" id="btn-clear-services-status-filter">× مسح الفلتر</button></div>`:''}
  ${sf==='delivered'?`<div class="filter-banner filter-nearing">✅ عرض الخدمات المُسلَّمة فقط — <button class="btn-clear-filter" id="btn-clear-services-status-filter">× مسح الفلتر</button></div>`:''}
  ${activeColFilterCount>0?`<div class="filter-banner filter-nearing">🔽 مطبّق ${activeColFilterCount} فلتر أعمدة على الجدول — <button class="btn-clear-filter" id="btn-clear-col-filters-services">× مسح فلاتر الأعمدة</button></div>`:''}

  ${progressBarHtml('نسبة ما تم تصنيعه',doneCount,allList.length,'#7B2FBE')}

  <div class="stats">

  </div>

  <div class="toolbar" style="margin-bottom:16px;">
    <select id="services-filter" style="max-width:240px;">
      <option value="all" ${filterVal==='all'?'selected':''}>كل الخدمات</option>
      <option value="auto" ${filterVal==='auto'?'selected':''}>خدمات العملاء (لها رقم سند)</option>
      <option value="manual" ${filterVal==='manual'?'selected':''}>خدمات أخرى للشركة (بدون رقم سند)</option>
    </select>
    ${periodSelectHtml('services-period-filter',period)}
    ${activeColFilterCount>0?`<span style="font-size:13px;color:var(--ink-soft);">عدد النتائج: <strong style="color:var(--accent-dark);font-size:15px;">${list.length}</strong></span>`:''}
    ${hiddenByPeriodCount>0?`<span style="font-size:12px;color:var(--ink-soft);">(${hiddenByPeriodCount} خدمة مُصنَّعة أقدم من الفترة مش ظاهرة هنا — اختر "كل الفترات" لعرضها)</span>`:''}
  </div>

  ${paginationHtml}
  <div class="card"><div class="table-wrap">
    ${list.length===0?`<div class="empty-state"><div class="big">🟣</div><div>${activeColFilterCount>0?'لا توجد نتائج مطابقة':'لا توجد خدمات مسجلة بعد'}</div></div>`:`
    <table><thead><tr>
      ${colHeaderHtml('services',SERVICES_COLS)}
      ${canManage?'<th></th>':''}
    </tr></thead><tbody>
    ${pagedList.map(so=>`<tr data-svc-id="${so.id}">
      <td data-label="تاريخ الطلب"><span class="mono" style="font-weight:700;">${formatDate(so.date)}</span></td>

      <td data-label="اسم العميل"><strong>${escapeHtml(so.customerName||'—')}</strong></td>
      <td data-label="نوع التمر">${escapeHtml((so.dateTypes||[]).join('،')||so.dateType||'—')}</td>
      <td data-label="الكمية المستلمة">${escapeHtml(so.qtyReceived||'—')}</td>
      <td data-label="نوع الخدمة">${serviceBadge(so.serviceType||'—','20px')}</td>
      <td data-label="المصدر">${hasReceipt(so)?`<span class="badge" style="background:#DCF3EF;color:#1B6E62;">عميل (له سند)</span>`:`<span class="badge" style="background:#EDE3FF;color:#7B2FBE;">شركة أخرى</span>`}</td>
      <td data-label="الكمية المصنعة">${(canEditQtyMfg()&&so.status!=='تم التسليم')?`<input type="text" class="svc-qty-mfg" data-id="${so.id}" value="${escapeHtml((state.svcQtyMfgDraft&&state.svcQtyMfgDraft[so.id]!=null)?state.svcQtyMfgDraft[so.id]:(so.qtyMfg||''))}" style="width:110px;font-weight:800;font-size:14px;" placeholder="اكتب الكمية هنا">${so.qtyMfg&&so.mfgDate?`<div class="qty-mfg-date" style="color:#2F7A4D;">✓ تم التصنيع · ${formatDate(so.mfgDate)}</div>`:(!so.qtyMfg&&so.qtyMfgClearedAt?`<div class="qty-mfg-date" style="color:var(--danger);">🗑️ تم المسح · ${formatDate(so.qtyMfgClearedAt)}</div>`:'')}`:`<span class="qty-mfg-display">${escapeHtml(so.qtyMfg||'—')}</span>${so.qtyMfg&&so.mfgDate?`<div class="qty-mfg-date" style="color:#2F7A4D;">✓ تم التصنيع · ${formatDate(so.mfgDate)}</div>`:(!so.qtyMfg&&so.qtyMfgClearedAt?`<div class="qty-mfg-date" style="color:var(--danger);">🗑️ تم المسح · ${formatDate(so.qtyMfgClearedAt)}</div>`:'')}`}</td>
      <td data-label="تم تصنيعه؟">${(so.qtyMfg||'').toString().trim()?`<span class="badge" style="background:#E3F3E8;color:#2F7A4D;">✅ تم تصنيعه</span>`:`<span class="badge" style="background:#FEF6D9;color:#8A6500;">⏳ لم يُصنّع بعد</span>`}</td>
      <td data-label="تم التسليم؟">${canManageStatus()?statusEditControlHtml(so,'svc'):(so.status==='تم التسليم'?`<span class="badge" style="background:#E3F3E8;color:#145A32;">✅ تم التسليم</span>${so.statusDate?`<div class="delivered-date" style="font-size:11px;font-weight:800;color:#145A32;">📅 ${formatDateTime(so.statusDate)}</div>`:''}`:'—')}</td>
      <td data-label="ملاحظات" class="cell-notes">${(canAddSvc&&so.status!=='تم التسليم')?`<textarea class="svc-notes-input" data-id="${so.id}" rows="2" placeholder="أضف ملاحظة…">${escapeHtml((state.svcNotesDraft&&state.svcNotesDraft[so.id]!=null)?state.svcNotesDraft[so.id]:(so.notes||''))}</textarea>`:escapeHtml(so.notes||'—')}</td>
      ${canManage?`<td><div style="display:flex;gap:6px;justify-content:flex-end;">
        <button class="icon-btn danger btn-delete-svc" data-id="${so.id}" title="حذف">🗑</button>
      </div></td>`:''}
    </tr>`).join('')}
    </tbody></table>`}
  </div></div>`;
}


/* ============== reports ============== */
function addDaysStr(dateStr,days){
  const d=new Date((dateStr||todayIso())+'T00:00:00');
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function addMonthsStr(dateStr,months){
  const d=new Date((dateStr||todayIso())+'T00:00:00');
  d.setMonth(d.getMonth()+months);
  return d.toISOString().slice(0,10);
}
/* يحسب بداية ونهاية الفترة المطلوبة حسب اختيار المسؤول (يومي/أسبوعي/شهري/الموسم كله) */
function reportPeriodRange(){
  const period=state.reportsPeriod||'daily';
  if(period==='weekly'){
    const start=state.reportsStartDate||todayIso();
    const end=addDaysStr(start,6);
    return {start,end,label:'أسبوعي',rangeLabel:`من ${formatDate(start)} إلى ${formatDate(end)}`};
  }
  if(period==='monthly'){
    const start=state.reportsStartDate||todayIso();
    const end=addDaysStr(addMonthsStr(start,1),-1);
    return {start,end,label:'شهري',rangeLabel:`من ${formatDate(start)} إلى ${formatDate(end)}`};
  }
  if(period==='season'){
    const dated=(state.orders||[]).filter(o=>o.date).sort((a,b)=>a.date.localeCompare(b.date));
    const start=dated.length?dated[0].date:todayIso();
    const end=todayIso();
    const year=new Date().getFullYear();
    return {start,end,label:`إجمالي الموسم ${year}`,rangeLabel:`موسم ${year} — من ${formatDate(start)} وحتى اليوم ${formatDate(end)}`};
  }
  const t=todayIso();
  return {start:t,end:t,label:'يومي',rangeLabel:`يوم ${formatDate(t)}`};
}
/* يجمع كل أرقام التقرير للفترة المحددة */
function computeReportData(){
  const {start,end,label,rangeLabel}=reportPeriodRange();
  const allOrders=state.orders||[];
  const orders=allOrders.filter(o=>o.date&&o.date>=start&&o.date<=end);
  const received=orders.length;
  /* "الطلبات المصنّعة" و"المسلَّمة" في الفترة لازم تتحسب حسب تاريخ التصنيع/التسليم الفعلي، مش حسب تاريخ
     الاستلام — لأن الطلب غالبًا بيتصنّع أو يتسلّم بعد استلامه بأيام أو أسابيع. قبل الإصلاح، كان الحساب
     بيقتصر على الطلبات اللي اتسجّلت في نفس الفترة بس، فأي طلب اتسلّم أو اتصنّع النهارده لكن كان اتسجّل
     قبل كده، كان بيختفي تمامًا من تقرير اليوم رغم إن العملية فعلاً حصلت في الفترة دي */
  const mfg=allOrders.filter(o=>(o.qtyMfg||'').toString().trim()&&o.mfgDate&&o.mfgDate>=start&&o.mfgDate<=end);
  const delivered=allOrders.filter(o=>o.status==='تم التسليم'&&o.statusDate&&o.statusDate.slice(0,10)>=start&&o.statusDate.slice(0,10)<=end);
  const bananaCartons=orders.reduce((s,o)=>((o.cartonTypes||[]).includes('كرتون موز')?s+orderTotalQtyCartonsCeil(o):s),0);
  /* "المتبقي" هنا يعني الطلبات المستلمة في الفترة ولسه ما اتصنّعتش؛ "المتبقي بالمستودع" رقم حيّ
     (لحظي) — نفس تعريف صفحة المستودع بالظبط (له موقع تسكين ولسه ما اتسلّمش)، مش مرتبط بفترة التقرير
     لأنه أصلًا حالة لحظية مش حركة حصلت خلال الفترة */
  const remainingCount=Math.max(0,received-mfg.length);
  const warehouseCount=allOrders.filter(o=>(o.placementLocation||'').trim()&&o.status!=='تم التسليم').length;

  const mfgByCartonSize={};
  mfg.forEach(o=>{
    const key=(o.cartonSize||'غير محدد').trim()||'غير محدد';
    mfgByCartonSize[key]=(mfgByCartonSize[key]||0)+(Number(o.qtyMfg)||0);
  });
  const mfgCartonEntries=Object.entries(mfgByCartonSize).sort((a,b)=>b[1]-a[1]);

  const deliveredByCartonSize={};
  delivered.forEach(o=>{
    const key=(o.cartonSize||'غير محدد').trim()||'غير محدد';
    deliveredByCartonSize[key]=(deliveredByCartonSize[key]||0)+(Number(o.qtyMfg)||Number(o.qtyCartons)||0);
  });
  const deliveredCartonEntries=Object.entries(deliveredByCartonSize).sort((a,b)=>b[1]-a[1]);

  const customersSet=new Set(orders.map(o=>(o.mobile||'').trim()).filter(Boolean));

  const dateTypeCounts={};
  orders.forEach(o=>{ splitDateTypes(o).forEach(dt=>{ dateTypeCounts[dt]=(dateTypeCounts[dt]||0)+1; }); });
  const dateTypeEntries=Object.entries(dateTypeCounts).sort((a,b)=>b[1]-a[1]);

  const custQty={};
  orders.forEach(o=>{
    const key=(o.mobile||o.customerName||'').trim();
    if(!key)return;
    if(!custQty[key])custQty[key]={name:o.customerName||'—',mobile:o.mobile||'—',qty:0};
    custQty[key].qty+=orderTotalQtyCartons(o);
  });
  const topCustomers=Object.values(custQty).sort((a,b)=>b.qty-a.qty).slice(0,5);

  /* تفصيل التقرير حسب القسم — فاكيوم / دبس / عجينة، كل قسم بأرقامه لوحده. نفس التصحيح: المصنَّع
     والمسلَّم بالتاريخ الفعلي بتاعهم، مش بتاريخ الاستلام */
  const departments=['فاكيوم','دبس','عجينة'].map(deptName=>{
    const deptOrders=orders.filter(o=>o.processingType===deptName);
    const deptMfg=mfg.filter(o=>o.processingType===deptName);
    const deptDelivered=delivered.filter(o=>o.processingType===deptName);
    const receivedQty=round2(deptOrders.reduce((s,o)=>s+(orderTotalQtyCartons(o)),0));
    const mfgQty=round2(deptMfg.reduce((s,o)=>s+(Number(o.qtyMfg)||0),0));
    const deliveredQty=round2(deptDelivered.reduce((s,o)=>s+(Number(o.qtyMfg)||Number(o.qtyCartons)||0),0));
    return {name:deptName,received:deptOrders.length,mfgCount:deptMfg.length,deliveredCount:deptDelivered.length,receivedQty,mfgQty,deliveredQty};
  });

  const deliveredWithDates=delivered.filter(o=>o.date&&o.lastEditedAt);
  let avgDays=null;
  if(deliveredWithDates.length){
    const totalDays=deliveredWithDates.reduce((s,o)=>{
      const d=(new Date(o.lastEditedAt).getTime()-new Date(o.date).getTime())/(1000*60*60*24);
      return s+Math.max(0,d);
    },0);
    avgDays=(totalDays/deliveredWithDates.length).toFixed(1);
  }

  /* تقييمات رضا العملاء (بعد التسليم) اللي وصلت خلال نفس فترة التقرير — بنطابق حسب تاريخ إرسال التقييم نفسه */
  const ratingsMap=state.orderRatings||{};
  const ratingsInPeriod=Object.entries(ratingsMap)
    .filter(([rn,r])=>r&&r.ts&&r.ts.slice(0,10)>=start&&r.ts.slice(0,10)<=end)
    .map(([rn,r])=>({receiptNo:rn,...r}))
    .sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));
  const ratingsCount=ratingsInPeriod.length;
  const avgRating=ratingsCount?Math.round((ratingsInPeriod.reduce((s,r)=>s+(Number(r.stars)||0),0)/ratingsCount)*10)/10:null;
  const ratingsBreakdown=[5,4,3,2,1].map(n=>({stars:n,count:ratingsInPeriod.filter(r=>r.stars===n).length}));
  const lowRatings=ratingsInPeriod.filter(r=>Number(r.stars)<=2);

  return {start,end,label,rangeLabel,received,mfgCount:mfg.length,deliveredCount:delivered.length,
    remainingCount,warehouseCount,
    bananaCartons,mfgCartonEntries,deliveredCartonEntries,customersCount:customersSet.size,
    dateTypeEntries,topDateType:dateTypeEntries[0]||null,topCustomers,avgDays,departments,
    ratingsCount,avgRating,ratingsBreakdown,lowRatings,ratingsInPeriod};
}
/* نص ملخّص التقرير — يُستخدم في رسالة الواتساب والإيميل */
function reportSummaryText(data,cfg){
  const lines=[
    `📊 تقرير ${data.label} — ${data.rangeLabel}`,

    `👥 عدد العملاء: ${data.customersCount}`,
    `⏱️ متوسط مدة التصنيع: ${data.avgDays!==null?data.avgDays+' يوم':'—'}`,
  ];
  if(data.topDateType)lines.push(`🌴 أكثر نوع تمر طلبًا: ${data.topDateType[0]} (${data.topDateType[1]} طلب)`);
  if(data.departments&&data.departments.length){
    lines.push('','🏭 تفصيل حسب القسم:');
    data.departments.forEach(d=>lines.push(`• ${d.name}: مستلم ${d.received} — مصنّع ${d.mfgCount} (${d.mfgQty} كرتون) — مسلَّم ${d.deliveredCount} (${d.deliveredQty} كرتون)`));
  }
  if(data.mfgCartonEntries.length){
    lines.push('','📦 كراتين مصنّعة حسب الحجم:');
    data.mfgCartonEntries.forEach(([size,qty])=>lines.push(`• ${size}: ${qty}`));
  }
  if(data.topCustomers.length){
    lines.push('','🏆 أكثر 5 عملاء من حيث كمية الكراتين:');
    data.topCustomers.slice(0,5).forEach((c,i)=>lines.push(`${i+1}. ${c.name} — ${c.qty} كرتون`));
  }
  if(data.ratingsCount){
    lines.push('',`⭐ تقييمات العملاء: ${data.avgRating}/5 (${data.ratingsCount} تقييم)`);
    if(data.lowRatings.length)lines.push(`⚠️ ${data.lowRatings.length} تقييم منخفض (نجمة أو نجمتين) يحتاج متابعة`);
  }
  lines.push('','مقدم التقرير: مصطفى أمين - قسم المبيعات');
  return lines.join('\n');
}

/* ============== صفحة Cash (للمسؤول فقط): إيراد اليوم + تفقيط النقد ============== */
const CASH_NOTES=[
  {v:500,bg:'#2F5F9E',fg:'#fff'},   /* أزرق */
  {v:200,bg:'#7A7F85',fg:'#fff'},   /* رمادي */
  {v:100,bg:'#C0392B',fg:'#fff'},   /* أحمر */
  {v:50, bg:'#2E8B57',fg:'#fff'},   /* أخضر */
  {v:20, bg:'#A9745B',fg:'#fff'},   /* بنّي فاتح (لا توجد ورقة ٢٠ في السلسلة الحالية) */
  {v:10, bg:'#8B5A2B',fg:'#fff'},   /* بنّي */
  {v:5,  bg:'#7B4FA0',fg:'#fff'},   /* بنفسجي */
  {v:1,  bg:'#C9A227',fg:'#fff'}    /* عملة معدنية */
];
function cashLocalToday(){ return new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10); }
function cashDefaultData(){
  const rows=[]; for(let i=0;i<10;i++)rows.push({c:'',d:'',t:''});
  const cash={}; CASH_NOTES.forEach(n=>{ cash[n.v]=''; });
  return {rows,m1:{a:'',n:''},m2:{a:'',n:''},ma:{a:'',n:''},sy:{a:'',n:''},cash,defs:[],notes:[{a:'',t:''},{a:'',t:''},{a:'',t:''}],out:[{dt:'',item:'',qty:'',inv:'',who:''},{dt:'',item:'',qty:'',inv:'',who:''},{dt:'',item:'',qty:'',inv:'',who:''}],locked:false,open:false};
}
function cashNormalizeData(d){
  const base=cashDefaultData();
  if(!d||typeof d!=='object')return base;
  const out={...base,...d};
  out.rows=Array.isArray(d.rows)&&d.rows.length?d.rows.map(r=>({c:r.c||'',d:r.d||'',t:r.t||''})):base.rows;
  ['m1','m2','ma','sy'].forEach(k=>{ out[k]={a:(d[k]&&d[k].a)||'',n:(d[k]&&d[k].n)||''}; });
  out.cash={...base.cash,...(d.cash||{})};
  out.defs=Array.isArray(d.defs)?d.defs.map(x=>({dt:x.dt||'',inv:x.inv||'',cust:x.cust||'',amt:x.amt||'',note:x.note||'',paid:!!x.paid,paidAt:x.paidAt||''})):[];
  out.out=Array.isArray(d.out)&&d.out.length?d.out.map(x=>({dt:x.dt||'',item:x.item||'',qty:x.qty||'',inv:(x.inv==='y'||x.inv==='n')?x.inv:'',who:x.who||''})):base.out;
  out.notes=Array.isArray(d.notes)&&d.notes.length?d.notes.map(x=>({a:x.a||'',t:x.t||''})):base.notes;
  out.locked=d.locked===true; out.open=d.open===true;
  return out;
}
/* حساب تعبير بسيط (+ − × ÷ وأقواس) بمحلّل آمن بدون eval — يرجّع null لو مش تعبير صحيح */
function cashEvalExpr(str){
  const s=String(str==null?'':str).replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-0x660)).replace(/[۰-۹]/g,c=>String(c.charCodeAt(0)-0x6F0)).replace(/[×xX]/g,'*').replace(/÷/g,'/').replace(/[−–—]/g,'-').replace(/\s+/g,'');
  if(!s||!/^[0-9.+\-*/()]+$/.test(s))return null;
  let i=0;
  const num=()=>{ if(s[i]==='('){ i++; const v=expr(); if(s[i]!==')')throw 0; i++; return v; } const j=i; while(i<s.length&&/[0-9.]/.test(s[i]))i++; if(j===i)throw 0; const v=parseFloat(s.slice(j,i)); if(!isFinite(v))throw 0; return v; };
  const unary=()=>{ if(s[i]==='-'){ i++; return -unary(); } if(s[i]==='+'){ i++; return unary(); } return num(); };
  const term=()=>{ let v=unary(); while(s[i]==='*'||s[i]==='/'){ const op=s[i++], r=unary(); if(op==='/'&&r===0)throw 0; v=op==='*'?v*r:v/r; } return v; };
  const expr=()=>{ let v=term(); while(s[i]==='+'||s[i]==='-'){ const op=s[i++], r=term(); v=op==='+'?v+r:v-r; } return v; };
  try{ const v=expr(); return (i===s.length&&isFinite(v))?v:null; }catch(e){ return null; }
}
function cashHasOp(v){ return /[+*/÷×()xX]|.-/.test(String(v==null?'':v).replace(/\s+/g,'')); }
function cashNum(v){
  const ev=cashEvalExpr(v); if(ev!==null)return ev;
  if(cashHasOp(v)){ const ev2=cashEvalExpr(String(v).replace(/[+\-*/×÷xX.(\s]+$/,'')); return ev2!==null?ev2:0; } /* تعبير ناقص (5+) يحسب لحد آخر رقم كامل؛ وغير صالح (1/0) = 0 */
  const s=String(v==null?'':v).replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-0x660)).replace(/[۰-۹]/g,c=>String(c.charCodeAt(0)-0x6F0)).replace(/[^0-9.]/g,'');
  const n=parseFloat(s); return isFinite(n)?n:0;

function cashPosIcon(){ return `<img class="csh-posimg" src="${CASH_IMG_POS}" alt="">`; }
function cashNoteStyle(x){ return Math.abs(x)<0.005?'color:#222;':(x<0?'color:#C0392B;':'color:#C99700;'); }
/* نسخة العرض: كلمة نقدي بالأخضر وكلمة شبكة بالرصاصي وأكبر وبولد */
/* لون خفيف جدًا من لون الفئة (مزج مع الأبيض) — يظهر على خانة العدد والإجمالي لما يتكتب عدد */
function cashNoteTint(n,val){
  if(!(cashNum(val)>0))return '';
  const h=n.bg.replace('#',''), mix=c=>Math.round(parseInt(c,16)*0.14+255*0.86);
  return `background:rgb(${mix(h.slice(0,2))},${mix(h.slice(2,4))},${mix(h.slice(4,6))});`;
}
function cashDiffNoteHtml(x){
  return escapeHtml(cashDiffNote(x)).replace(/(ال)?(نقدي|شبكة)/g,(m,a,w)=>`<span class="${w==='نقدي'?'csh-w-cash':'csh-w-net'}">${m}</span>`);
}
function cashDiffNote(x){
  if(Math.abs(x)<0.005)return '';
  const v=cashFmt(Math.abs(x));
  return x>0?`حد يكون بيدفع نقدي اعمل طريقة الدفع نقدي واكتب القيمة دي (${v}) في الشبكة والباقي نقدي`
            :`حد يكون عاوز يدفع شبكة اعمل طريقة الدفع نقدي واكتب القيمة دي (${v}) في النقدي والباقي شبكة`;
}
function cashDefFilled(x){ return !!((x.inv||'').trim()||(x.cust||'').trim()||(x.note||'').trim()||cashNum(x.amt)>0); }
function cashDefsCount(d){ return (d.defs||[]).filter(x=>cashDefFilled(x)&&!x.paid).length; }
/* ---- الملاحظات: مقفولة (مطوية) افتراضيًا — تفتح بالضغط عليها، ولو فيه رقم سري يتطلب كتابته. مش بتظهر في صور الكاش المبعوتة ولا الـPDF.
   ملحوظة: الرقم السري حماية على مستوى الشاشة بس (مش تشفير للبيانات نفسها) ---- */
async function cashPinHash(pin){
  const s='sajjal-cash-notes:'+pin;
  try{ if(window.crypto&&crypto.subtle){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); } }catch(e){}
  let h=5381; for(const ch of s)h=((h<<5)+h+ch.charCodeAt(0))|0; return 'x'+(h>>>0).toString(16);
}
async function cashPinLoad(){
  if(state.cashPinLoaded)return true;
  try{ const v=await sbGetStrict('cash-notes-pin'); state.cashPin=v||''; state.cashPinLoaded=true; return true; }catch(e){ return false; }
}
async function cashLockPinLoad(){
  if(state.cashLockPinLoaded)return true;
  try{ const v=await sbGetStrict('cash-lock-pin'); state.cashLockPin=v||''; state.cashLockPinLoaded=true; return true; }catch(e){ return false; }
}

  if(!open){
    const ask=state.cashNotesAsk?`<div class="csh-pinrow"><input type="password" id="cash-notes-pin" inputmode="numeric" autocomplete="off" placeholder="اكتب الرقم السري"><button type="button" class="btn btn-primary btn-sm" id="cash-notes-pin-ok">فتح</button></div>`:'';
    return `<div dir="rtl" class="csh-notesbox csh-noshot">${head}${ask}</div>`;
  }
  const pinForm=state.cashNotesPinForm?`<div class="csh-pinrow"><input type="password" id="cash-notes-newpin" autocomplete="off" placeholder="رقم سري جديد (4 خانات على الأقل)"><button type="button" class="btn btn-primary btn-sm" id="cash-notes-pin-save">حفظ</button>${hasPin?'<button type="button" class="btn btn-ghost btn-sm" id="cash-notes-pin-clear">إزالة الرقم السري</button>':''}</div>`:'';

function cashNotesTotal(d){ return (d.notes||[]).reduce((a,x)=>a+cashNum(x.a),0); }

/* قفل اليوم: يدويًا (locked) أو تلقائيًا لأي يوم قبل اليوم الحالي ما لم يُفتح (open) */
function cashIsLockedFor(date,d){ return !!d&&(d.locked===true||(date<cashLocalToday()&&d.open!==true)); }
function cashIsLocked(){ const c=state.cash; return !!(c&&c.loaded&&c.data&&cashIsLockedFor(c.date,c.data)); }
function cashThr(){ const n=Number(state.cashThr); return isFinite(n)&&n>=0?n:50; }
function cashAlerts(t){
  const thr=cashThr(), out=[]; if(thr<=0)return out;
  if(Math.abs(t.diff)>=thr)out.push(`الفرق بين الماكينات و(مدى + أساس) ${cashFmt(t.diff)}`);
  if(t.inHand>0&&Math.abs(t.deficit)>=thr)out.push(`${t.deficit<0?'عجز':'زيادة'} في الكاش ${cashFmt(Math.abs(t.deficit))} (Deficits)`);

}

async function cashIndexLoad(){

async function cashFlush(){

  if(!_cashDirty||!state.cash||!state.cash.loaded)return true;
  _cashSaving=(async()=>{
    let ok=false;

      const c=state.cash; if(!c||!c.loaded)break;
      const snapshot=cashDayJson(c.data), key='cash:'+c.date;
      ok=await storageSetRetry(key,snapshot,true);

      else if(state.cash!==c){ _cashDirty=false; pendingSavesChange(-1); }

/* ---- جداول التمور الطالعة والملاحظات والعجوزات: مش مربوطة بيوم، محفوظة في مفتاح واحد 'cash-shared' وبتظهر نفسها في أي يوم ومش بتتقفل بقفل اليوم.
   أول مرة: بتتجمّع من بيانات الأيام القديمة (آخر 120 يوم + الأيام اللي في الفهرس) من غير ما تتمسح منها (النسخة القديمة بتفضل زي ما هي). ---- */
function cashDayJson(d){ const {out,notes,defs,...rest}=d; return JSON.stringify(rest); }
function cashSharedNormalize(o){
  o=o&&typeof o==='object'?o:{};
  const out=(Array.isArray(o.out)?o.out:[]).map(x=>({dt:x.dt||'',item:x.item||'',qty:x.qty||'',inv:(x.inv==='y'||x.inv==='n')?x.inv:'',who:x.who||''}));
  const notes=(Array.isArray(o.notes)?o.notes:[]).map(x=>({a:x.a||'',t:x.t||''}));
  const defs=(Array.isArray(o.defs)?o.defs:[]).map(x=>({dt:x.dt||'',inv:x.inv||'',cust:x.cust||'',amt:x.amt||'',note:x.note||'',paid:!!x.paid,paidAt:x.paidAt||''}));
  while(out.length<3)out.push({dt:'',item:'',qty:'',inv:'',who:''});
  while(notes.length<3)notes.push({a:'',t:''});
  return {out,notes,defs};
}
async function cashSharedMigrate(){
  const ix=await cashIndexLoad();
  const set=new Set(Object.keys(ix.days||{}));
  for(let i=0;i<120;i++)set.add(new Date(Date.now()-new Date().getTimezoneOffset()*60000-i*864e5).toISOString().slice(0,10));
  const dates=[...set].sort();
  const res={out:[],notes:[],defs:[]}, seen=new Set();
  const add=(k,row)=>{ const key=k+JSON.stringify(row); if(seen.has(key))return; seen.add(key); res[k].push(row); };
  for(let i=0;i<dates.length;i+=6){
    const vals=await Promise.all(dates.slice(i,i+6).map(async dt=>({dt,v:await sbGetStrict('cash:'+dt)})));
    vals.forEach(({dt,v})=>{
      if(!v)return; let d=null; try{ d=cashNormalizeData(JSON.parse(v)); }catch(e){ return; }
      d.out.forEach(x=>{ if((x.item||'').trim()||(x.qty||'').trim()||(x.who||'').trim())add('out',{...x,dt:x.dt||dt}); });
      d.notes.forEach(x=>{ if((x.a||'').trim()||(x.t||'').trim())add('notes',x); });
      d.defs.forEach(x=>{ if(cashDefFilled(x))add('defs',x); });
    });
  }
  const data=cashSharedNormalize(res);
  const ok=await storageSetRetry('cash-shared',JSON.stringify({v:1,...data}),true);
  if(!ok)throw new Error('تعذّر حفظ الجداول المشتركة');
  return data;
}
function cashSharedEnsure(){
  if(state.cashShared&&(state.cashShared.loaded||state.cashShared.loading))return;
  const S=state.cashShared={loading:true,loaded:false,error:null,data:null};
  (async()=>{
    try{
      const v=await sbGetStrict('cash-shared');
      if(v){ let o=null; try{ o=JSON.parse(v); }catch(e){ throw new Error('بيانات الجداول المشتركة تالفة'); } S.data=cashSharedNormalize(o); }
      else S.data=await cashSharedMigrate();
      S.loaded=true;
    }catch(e){ S.error='تعذّر تحميل جداول التمور والملاحظات والعجوزات'+(typeof connDiag==='function'?connDiag(e):''); }
    S.loading=false;
    cashAttach(); if(state.view==='cash')render();
  })();
}
function cashAttach(){
  const c=state.cash, S=state.cashShared;
  if(c&&c.loaded&&c.data&&S&&S.loaded){ c.data.out=S.data.out; c.data.notes=S.data.notes; c.data.defs=S.data.defs; }
}
let _csTimer=null, _csDirty=false, _csSaving=null;
function cashSharedDirty(){

  const A=[['Cash — '+c.date],[],['دائن','مدين','التفاصيل']];
  d.rows.forEach((r,i)=>{ if(i===0||cashNum(r.c)||cashNum(r.d)||(r.t||'').trim())A.push([cashNum(r.c)||'',i===0?'':(cashNum(r.d)||''),i===0?'إيراد اليوم':(r.t||'')]); });
  A.push([],['إجمالي الكاش (دائن − مدين)',t.balance],[],['','Amount','Note']);
  [['Machine 1 (V)','m1'],['Machine 2','m2'],['Asas','sy'],['Mada','ma']].forEach(([l,k])=>A.push([l,cashNum(d[k].a),d[k].n||'']));
  A.push(['الفرق (ماكينة 1 + 2) − (مدى + أساس)',t.diff,cashDiffNote(t.diff)],[],['Denomination','Count','Total']);
  CASH_NOTES.forEach(n=>A.push([n.v,cashNum(d.cash[n.v]),n.v*cashNum(d.cash[n.v])]));
  A.push([],['ملاحظات','القيمة','الشرح']);
  d.notes.forEach(x=>{ if(cashNum(x.a)||(x.t||'').trim())A.push(['',cashNum(x.a),x.t||'']); });
  A.push(['المجموع',cashNotesTotal(d)],[]);
  A.push(['Cash On Hand','',t.inHand],['Expected Cash','',t.suppose],['Deficits','',t.deficit],[],['Total Cash','',t.balance],['Total Net','',t.net],['Total Value','',t.totalValue]);
  const D=[['التاريخ والوقت','رقم الفاتورة','اسم العميل','المبلغ','ملاحظة','الحالة']];
  d.defs.filter(cashDefFilled).forEach(x=>D.push([x.dt.replace('T',' '),x.inv,x.cust,cashNum(x.amt),x.note,x.paid?'تم السداد':'غير مسدد']));
  D.push([],['','','المتبقي',cashDefsOpenAmt(d)]);
  const O=[['التاريخ','الصنف','الكمية','مفوتر؟','مفوتر باسم']];
  cashOutFilled(d).forEach(x=>O.push([x.dt,x.item,cashNum(x.qty),x.inv==='y'?'أه':(x.inv==='n'?'لا':''),x.who]));
  O.push([],['الإجمالي','',cashOutTotalsRows(d).q],[],['إجمالي كل صنف','عدد السجلات','إجمالي الكمية']);
  cashOutTotalsRows(d).rows.forEach(r=>O.push([r.item,r.n,r.q]));
  cashXlsxFile(`cash-${c.date}.xlsx`,[['اليوم',A,[30,14,28]],['عجوزات العملاء',D,[18,14,20,12,24,12]],['تمور ال VIP',O,[14,18,10,10,22]]]);
}

function cashExportHistXlsx(){
  const rows=cashHistRows().slice().reverse(); const m=cashMonthKey();
  const A=[['التاريخ','الإيراد','الفرق (ماكينة 1 + 2) − (مدى + أساس)','Deficits','الحالة']];
  rows.forEach(r=>A.push([r.date,r.rev||0,r.diff||0,r.ih?(r.sh||0):'',cashHistLocked(r)?'مقفول':'مفتوح']));
  A.push([],['الإجمالي',rows.reduce((a,r)=>a+(r.rev||0),0),'',rows.reduce((a,r)=>a+(r.ih?(r.sh||0):0),0)]);
  cashXlsxFile(`cash-${m}.xlsx`,[['سجل '+m,A,[14,14,22,12,10]]]);
}
/* ---- تغيير عرض الأعمدة بالسحب (محفوظ على الجهاز ده): اسحب الخط الفاصل بين عمودين، ودوبل-كليك عليه يرجّع الأصل ---- */
const CASH_COLS_KEY='sajjal-cash-cols';
function cashColsRead(){ try{ const o=JSON.parse(localStorage.getItem(CASH_COLS_KEY)||'{}'); return (o&&typeof o==='object')?o:{}; }catch(e){ return {}; } }
function cashColsWrite(o){ try{ localStorage.setItem(CASH_COLS_KEY,JSON.stringify(o)); }catch(e){} }
function cashColCells(tbl){ const r=tbl.querySelector('thead tr')||tbl.querySelector('tbody tr'); return r?[...r.cells]:[]; }
function cashSetupColResize(){
  const saved=cashColsRead();
  document.querySelectorAll('.csh-table[data-ck]').forEach(tbl=>{
    const key=tbl.dataset.ck, cells=cashColCells(tbl); if(cells.length<2)return;
    const wkey=key+':w', wp=saved[wkey];
    if(typeof wp==='number'&&wp>=30&&wp<=100){ tbl.style.width=wp+'%'; tbl.style.minWidth='0'; }
    { /* مقبض تغيير عرض الجدول كله — على الحافة الخارجية لآخر عمود */
      const last=cells[cells.length-1]; last.style.position='relative';
      const th=document.createElement('span'); th.className='csh-rsz csh-rsz-tbl csh-noshot'; th.title='اسحب لتغيير عرض الجدول كله — دوبل كليك للرجوع للأصل';
      last.appendChild(th);
      th.addEventListener('dblclick',e=>{ e.stopPropagation(); const o=cashColsRead(); delete o[key]; delete o[wkey]; cashColsWrite(o); render(); });
      th.addEventListener('pointerdown',e=>{
        e.preventDefault(); e.stopPropagation(); th.setPointerCapture(e.pointerId);
        const par=tbl.parentElement, cs=getComputedStyle(par), P=par.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
        const w0=tbl.getBoundingClientRect().width, x0=e.clientX, rtl=getComputedStyle(tbl).direction==='rtl';
        const move=ev=>{ const dx=(ev.clientX-x0)*(rtl?-1:1); const pct=Math.max(30,Math.min(100,(w0+dx)/P*100)); tbl.style.minWidth='0'; tbl.style.width=pct.toFixed(2)+'%'; };
        const up=()=>{ th.removeEventListener('pointermove',move); th.removeEventListener('pointerup',up); th.removeEventListener('pointercancel',up);
          const o=cashColsRead(); o[wkey]=Math.round(tbl.getBoundingClientRect().width/P*10000)/100; cashColsWrite(o); };
        th.addEventListener('pointermove',move); th.addEventListener('pointerup',up); th.addEventListener('pointercancel',up);
      });
    }
    const sv=saved[key]; if(Array.isArray(sv)&&sv.length===cells.length&&sv.every(x=>x>3&&x<95))cells.forEach((c,i)=>{ c.style.width=sv[i]+'%'; });
    cells.slice(0,-1).forEach((cell,i)=>{
      cell.style.position='relative';
      const h=document.createElement('span'); h.className='csh-rsz csh-noshot'; h.title='اسحب لتغيير عرض العمود — دوبل كليك للرجوع للأصل';
      cell.appendChild(h);
      h.addEventListener('dblclick',e=>{ e.stopPropagation(); const o=cashColsRead(); delete o[key]; cashColsWrite(o); render(); });
      h.addEventListener('pointerdown',e=>{
        e.preventDefault(); e.stopPropagation(); h.setPointerCapture(e.pointerId);
        const a=cell, b=cells[i+1], wa=a.getBoundingClientRect().width, wb=b.getBoundingClientRect().width, W=tbl.getBoundingClientRect().width;
        const x0=e.clientX, rtl=getComputedStyle(tbl).direction==='rtl', min=44;
        const widths=cells.map(c=>c.getBoundingClientRect().width);
        const move=ev=>{
          const dx=(ev.clientX-x0)*(rtl?-1:1);
          const na=Math.max(min,Math.min(wa+wb-min,wa+dx)), nb=wa+wb-na;
          widths[i]=na; widths[i+1]=nb;
          cells.forEach((c,k)=>{ c.style.width=(widths[k]/W*100).toFixed(2)+'%'; });
        };
        const up=()=>{
          h.removeEventListener('pointermove',move); h.removeEventListener('pointerup',up); h.removeEventListener('pointercancel',up);
          const o=cashColsRead(); o[key]=cells.map(c=>Math.round(c.getBoundingClientRect().width/W*10000)/100); cashColsWrite(o);
        };
        h.addEventListener('pointermove',move); h.addEventListener('pointerup',up); h.addEventListener('pointercancel',up);
      });
    });
  });
}
function attachCashEvents(){

    const to=b.dataset.tab; if((state.cashTab||'day')===to)return;

    if(_csDirty){ await cashSharedFlush(); if(_csDirty){ toast('لم يتم حفظ الجداول — حاول مرة أخرى','error'); return; } }
    state.cashTab=to; render();
  }));
  if(state.cashTab==='hist'){
    cashSetupColResize();
    const mo=byId('cash-month'); if(mo)mo.addEventListener('change',()=>{ if(mo.value){ state.cashMonth=mo.value; render(); } });
    const hx=byId('cash-hist-xlsx'); if(hx)hx.addEventListener('click',cashExportHistXlsx);
    document.querySelectorAll('.csh-hrow').forEach(tr=>tr.addEventListener('click',()=>{ state.cash={date:tr.dataset.d}; state.cashTab='day'; render(); }));
    return;
  }
  const c=state.cash; if(!c)return;
  cashSetupColResize();
  const retry=byId('cash-retry'); if(retry)retry.addEventListener('click',()=>{ state.cash={date:c.date}; render(); });
  const sret=byId('cash-shared-retry'); if(sret)sret.addEventListener('click',()=>{ state.cashShared=null; render(); });
  if(!c.loaded)return;
  document.querySelectorAll('.csh-in[data-p]').forEach(inp=>{
    inp.addEventListener('input',()=>{
      const p=inp.dataset.p, d=state.cash.data;
      const sh=/^(df:|o:|n:)/.test(p);
      if(!sh&&cashIsLocked()){ toast('اليوم مقفول للتعديل — افتح التعديل أولًا','error'); render(); return; }
      if(inp.classList.contains('csh-num')){
        let cleaned=inp.value.replace(/[٠-٩]/g,x=>String(x.charCodeAt(0)-0x660)).replace(/[۰-۹]/g,x=>String(x.charCodeAt(0)-0x6F0)).replace(/[^0-9.+\-*/×÷xX()\s−]/g,'');
        if(!cashHasOp(cleaned))cleaned=cleaned.replace(/(\..*)\./g,'$1');
        if(cleaned!==inp.value)inp.value=cleaned;
      }
      const v=inp.value;
      if(p.startsWith('df:')){ const [,i,f]=p.split(':'); if(d.defs[+i])d.defs[+i][f]=v; }
      else if(p.startsWith('c:'))d.rows[+p.slice(2)].c=v;
      else if(p.startsWith('d:'))d.rows[+p.slice(2)].d=v;
      else if(p.startsWith('t:'))d.rows[+p.slice(2)].t=v;
      else if(p.startsWith('k:'))d.cash[p.slice(2)]=v;
      else if(p.startsWith('o:')){ const [,i,f]=p.split(':'); const x=d.out[+i]; if(x){ x[f]=v; if(f!=='dt'&&!x.dt){ x.dt=state.cash.date; const di=document.querySelector('[data-p="o:'+i+':dt"]'); if(di)di.value=x.dt; } } }
      else if(p.startsWith('n:')){ const [,i,f]=p.split(':'); if(d.notes[+i])d.notes[+i][f]=v; }
      else{ const key=p.slice(0,-1), f=p.slice(-1); const map={m1:'m1',m2:'m2',ma:'ma',sy:'sy'}; if(map[key])d[map[key]][f]=v; }
      cashRecalc(); if(sh)cashSharedDirty(); else cashMarkDirty();
    });
    if(inp.classList.contains('csh-num'))inp.addEventListener('change',()=>{ cashApplyExpr(inp); });
  });
  const lk=byId('cash-lock');
  const doUnlock=()=>{ const d=state.cash.data; d.locked=false; d.open=true; state.cashLockAsk=false; cashMarkDirty(); render(); toast('تم فتح اليوم للتعديل','ok'); };

    const d=state.cash.data, was=cashIsLockedFor(state.cash.date,d);
    if(!was){ d.locked=true; d.open=false; state.cashLockAsk=false; cashMarkDirty(); render(); toast('تم قفل اليوم','ok'); return; }
    if(!(await cashLockPinLoad())){ toast('تعذّر التحقق من الرقم السري (مشكلة اتصال) — حاول مرة أخرى','error'); return; }

/* ---- كارت Cash في سجل الطلبات (للمسؤول فقط): نقدي = دائن − مدين، وشبكة = أساس، من صفحة Cash ليوم النهارده ---- */
let _cashChipTs=0, _cashChipLoading=false;
function cashChipValues(){
  const c=state.cash, today=cashLocalToday();
  if(c&&c.loaded&&c.data&&c.date===today){ const t=cashTotals(c.data); return {cash:t.balance,net:t.net}; }
  const v=state.cashChip; return (v&&v.date===today)?v:null;

function cashChipHtml(){

}
function cashChipRefresh(){
  if(!isAdmin()||_cashChipLoading)return;
  const c=state.cash, today=cashLocalToday();
  if(c&&c.loaded&&c.date===today)return; /* الصفحة نفسها محمّلة وبتتحدّث لحظيًا */
  if(Date.now()-_cashChipTs<120000)return;
  _cashChipLoading=true; _cashChipTs=Date.now();
  sbGetStrict('cash:'+today).then(v=>{
    let d=null; try{ d=v?JSON.parse(v):null; }catch(e){ d=null; }
    const t=cashTotals(cashNormalizeData(d));
    state.cashChip={date:today,cash:t.balance,net:t.net};
    const a=byId('cash-chip-cash'), b=byId('cash-chip-net'); if(a)a.innerHTML=cashMoney(t.balance); if(b)b.innerHTML=cashMoney(t.net);
  }).catch(()=>{}).finally(()=>{ _cashChipLoading=false; });
}
/* ============== صفحة دليل العملاء (للأدمن فقط) ==============
   البيانات محفوظة في Supabase تحت المفتاح 'clients-db' كنص JSON واحد: {v:1,list:[...]}.
   كل عميل: n الاسم، m الجوال، c كود السيستم، s الاسم على السيستم، mn حساب المن، k1/k5 سعر التمر كيلو/نصف،
   hp بالتجعيم، hm حساب المن ½، h[4] أسعار ½ كيلو، f إفطار صائم، d[6] الدبس، g[4] العجينة، o أخرى، t ملاحظات، u آخر تعديل {t:وقت ISO, w:وصف}.
   كل تعديل = "اقرأ بصرامة ← عدّل ← احفظ" عشان ما نمسحش بيانات جهاز تاني. */
const CL_KEY='clients-db';
const CL_TIERS=[
  {k:'t1',name:'240 — كرتون 8',   bg:'#FFF7BF',bd:'#E3D25A',ink:'#5B4F00'},
  {k:'t2',name:'270 — كرتون 9',   bg:'#FFDF70',bd:'#D4A400',ink:'#5A4300'},
  {k:'t3',name:'300 — كرتون 10',  bg:'#6FC785',bd:'#2E8B47',ink:'#06301A'},
  {k:'t4',name:'350 — كرتون 11.68',bg:'#C3DFF6',bd:'#4A93CF',ink:'#12426B'},
  {k:'r1',name:'360 / 375 — كرتون 12 / 12.5',bg:'#FAD0CB',bd:'#E58A82',ink:'#7A1F18'},
  {k:'r2',name:'400 — كرتون 13.34',bg:'#F4A9A1',bd:'#D9645A',ink:'#6E140D'},
  {k:'r3',name:'أعلى من 400',      bg:'#E98076',bd:'#C23B2F',ink:'#fff'},
  {k:'g', name:'بدون سعر',         bg:'#E9ECEA',bd:'#B9C0BC',ink:'#4E5A54'}
];
const CL_D_LBL=['390 جم','400 جم','700 جم','1.5 ك','2.75 ك','25 ك'];
const CL_G_LBL=['1 ك (كرتون 8)','1 ك (كرتون 12)','5 ك (كرتون 10)','5 ك (كرتون 15)'];
const CL_H_LBL=['½ ك — 3','½ ك — 4','½ ك — 6','½ ك — 8'];
function clTierOf(c){
  let p=parseFloat(String(c.k1||'').replace(',','.'));
  if(!isFinite(p)||p<=0){
    const m=String(c.mn||'').match(/\d+(\.\d+)?/g);
    if(m){ const cand=m.map(Number).filter(x=>x>=200&&x<=600); if(cand.length)p=cand[cand.length-1]/30; }
  }
  if(!isFinite(p)||p<=0)return 'g';
  if(p<=8.5)return 't1';
  if(p<=9.5)return 't2';
  if(p<=10.5)return 't3';
  if(p<=11.7)return 't4';
  if(p<12.7)return 'r1';
  if(p<13.7)return 'r2';
  return 'r3';
}
function clTierInfo(k){ return CL_TIERS.find(t=>t.k===k)||CL_TIERS[CL_TIERS.length-1]; }
function clTierStyle(k){ const t=clTierInfo(k); return `--cb:${t.bg};--cd:${t.bd};--ci:${t.ink};`; }
function clNorm(s){
  return String(s==null?'':s).toLowerCase()
    .replace(/[٠-٩]/g,d=>String(d.charCodeAt(0)-1632)).replace(/[۰-۹]/g,d=>String(d.charCodeAt(0)-1776))
    .replace(/[ً-ٰٟـ]/g,'')
    .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
    .replace(/\s+/g,' ').trim();
}
/* الجوال ممكن يبقى أكتر من رقم (مفصولين بـ / أو - أو سطر) — بنحتفظ بكل رقم لوحده */
function clMobs(s){
  return clNorm(s).split(/[^0-9]+/).filter(x=>x.length>=7).map(x=>(x.length===9&&x[0]==='5')?'0'+x:x);
}
const _clHay=new WeakMap();
function clHay(c){
  let h=_clHay.get(c);
  if(h===undefined){
    const ms=clMobs(c.m);
    h=clNorm([c.n,c.s,c.c,...ms,...ms.map(x=>x.replace(/^0/,'')),c.mn,c.t,c.o].join(' '));
    _clHay.set(c,h);
  }
  return h;
}
const CL_F_LBL={n:'الاسم',m:'الجوال',c:'كود السيستم',s:'الاسم على السيستم',mn:'حساب المن',k1:'كرتون 1 ك',k5:'كرتون 4',hp:'½ ك بالتجعيم',hm:'حساب المن ½ ك',f:'إفطار صائم',o:'أخرى',t:'الملاحظات'};
function clWhen(t){
  const d=new Date(t); if(isNaN(d))return '';
  const p=n=>String(n).padStart(2,'0');
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} — ${p(d.getHours())}:${p(d.getMinutes())}`;
}
/* وصف التعديل: كل خانة اتغيّرت (قديم ← جديد)، وأول 5 بس لو كتير */
function clDiff(a,b){
  const ch=[], v=x=>(x===''||x==null)?'فاضي':x;
  Object.keys(CL_F_LBL).forEach(k=>{ if((a[k]||'')!==(b[k]||''))ch.push(`${CL_F_LBL[k]}: ${v(a[k])} ← ${v(b[k])}`); });
  [['h',CL_H_LBL],['d',CL_D_LBL.map(x=>'دبس '+x)],['g',CL_G_LBL.map(x=>'عجينة '+x)]].forEach(([k,l])=>{ b[k].forEach((x,i)=>{ if((a[k][i]||'')!==(x||''))ch.push(`${l[i]}: ${v(a[k][i])} ← ${v(x)}`); }); });
  if(!ch.length)return 'حفظ بدون تغيير';
  return ch.slice(0,5).join(' | ')+(ch.length>5?` | و${ch.length-5} تغييرات أخرى`:'');
}
function clBlank(){ return {id:'',n:'',m:'',c:'',s:'',mn:'',k1:'',k5:'',hp:'',hm:'',h:['','','',''],f:'',d:['','','','','',''],g:['','','',''],o:'',t:'',u:null}; }
function clNewId(){ return 'c_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function clClean(o){
  const b=clBlank(), r={id:o.id||clNewId()};
  ['n','m','c','s','mn','k1','k5','hp','hm','f','o','t'].forEach(k=>{ r[k]=String(o[k]==null?b[k]:o[k]).trim(); });
  ['h','d','g'].forEach(k=>{ const a=Array.isArray(o[k])?o[k]:[]; r[k]=b[k].map((_,i)=>String(a[i]==null?'':a[i]).trim()); });
  r.m=clMobs(r.m).join(' / ');
  r.u=(o.u&&typeof o.u==='object'&&o.u.t)?{t:String(o.u.t),w:String(o.u.w||'')}:null;
  return r;
}
function clState(){
  if(!state.cl)state.cl={loading:false,loaded:false,list:[],err:'',q:'',tier:'',lim:60,sel:null,form:null,busy:false};
  return state.cl;
}
async function clLoad(force){
  const S=clState();
  if(S.loading||(S.loaded&&!force))return;
  S.loading=true; S.err='';
  try{
    const v=await sbGetStrict(CL_KEY);
    const o=v?JSON.parse(v):null;
    S.list=(o&&Array.isArray(o.list))?o.list:[];
    S.loaded=true;
  }catch(e){ S.err=(e&&e.message)||'تعذّر تحميل العملاء'; }
  S.loading=false;
  if(state.view==='clients')render();
  else if(S.loaded&&!S.err){ const a=document.activeElement; if(!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))&&!byId('modal-root').innerHTML)render(); }
}
/* قراءة صارمة ← تعديل ← حفظ؛ لو فشلت القراءة أو الحفظ يرمي خطأ ومفيش حاجة بتتغيّر */
async function clMutate(fn){
  const S=clState();
  const v=await sbGetStrict(CL_KEY);
  const o=v?JSON.parse(v):{v:1,list:[]};
  if(!Array.isArray(o.list))o.list=[];
  const res=fn(o.list);
  const ok=await storageSetRetry(CL_KEY,JSON.stringify({v:1,list:o.list}),true);
  if(!ok)throw new Error('تعذّر الحفظ — تأكد من الاتصال وحاول مرة أخرى');
  S.list=o.list; S.loaded=true;
  return res;
}

/* كارت دليل العملاء في سجل الطلبات (للأدمن بس) — جنب كارت Cash، بيفتح صفحة الدليل */
function clChipHtml(){

  const priced=ok?S.list.filter(c=>clTierOf(c)!=='g').length:'—';

function clFiltered(){
  const S=clState();
  const toks=clNorm(S.q).split(' ').filter(Boolean);
  let out=S.list;
  if(S.tier)out=out.filter(c=>clTierOf(c)===S.tier);
  if(toks.length){
    out=out.filter(c=>{ const h=clHay(c); return toks.every(t=>h.includes(t)); });
    if(toks.length>=2){
      /* اسم كامل مكتوب (كلمتين فأكتر): الاسم المطابق تمامًا ثم اللي بيبدأ الاسم أو الكلمة فيه بنفس العبارة؛ ما نرجّعش كل اللي فيهم الكلمتين متفرقين */
      const q=clNorm(S.q);
      const exact=out.filter(c=>clNorm(c.n)===q||clNorm(c.s)===q);
      if(exact.length)out=exact;
      else{ const ph=out.filter(c=>(' '+clNorm(c.n)).includes(' '+q)||(' '+clNorm(c.s)).includes(' '+q)); if(ph.length)out=ph; }
    }
    const t0=toks[0];
    out=out.map((c,i)=>({c,i,s:clNorm(c.n).startsWith(t0)?0:(clNorm(c.n).includes(t0)?1:2)})).sort((a,b)=>a.s-b.s||a.i-b.i).map(x=>x.c);
  }
  return out;
}

function clFld(key,label,val,extra){ return `<div class="field"><label>${escapeHtml(label)}</label><input type="text" data-f="${key}" value="${escapeHtml(val)}" ${extra||''}></div>`; }

    <h4 class="cl-fh">🌙 إفطار صائم</h4><div class="cl-fgrid">${clFld('f','السعر',c.f)}</div>

    <div class="field"><label>ملاحظات</label><textarea data-f="t" rows="2">${escapeHtml(c.t)}</textarea></div>
    <div class="modal-foot"><button class="btn btn-ghost" id="cl-fcancel">إلغاء</button><button class="btn btn-primary" id="cl-fsave">💾 حفظ</button></div>
  </div></div>`;
}
function clReadForm(base){
  const o=JSON.parse(JSON.stringify(base));
  document.querySelectorAll('#cl-ov [data-f]').forEach(el=>{
    const k=el.getAttribute('data-f'), v=el.value;
    const m=k.match(/^([hdg])(\d)$/);
    if(m)o[m[1]][+m[2]]=v; else o[k]=v;
  });
  return clClean(o);
}
function clDupes(list,c){
  const nm=clNorm(c.n), sy=clNorm(c.s), md=clMobs(c.m).map(x=>x.slice(-9)), cc=clNorm(c.c);
  const out=[];
  list.forEach(x=>{
    if(x.id===c.id)return;
    const why=[];
    if(md.length&&clMobs(x.m).some(y=>md.includes(y.slice(-9))))why.push('نفس رقم الجوال');
    if(cc&&clNorm(x.c)===cc)why.push('نفس كود السيستم');
    if(nm&&clNorm(x.n)===nm)why.push('نفس الاسم');
    if(sy&&clNorm(x.s)===sy)why.push('نفس الاسم على السيستم');
    if(why.length)out.push({x,why});
  });
  return out;
}
function clAsk(dups){
  return new Promise(res=>{
    const d=document.createElement('div');
    d.className='overlay'; d.style.zIndex='300';
    d.innerHTML=`<div class="modal" style="max-width:480px;"><h3>⚠️ عميل مشابه موجود بالفعل</h3>
      <div class="cl-dups">${dups.slice(0,5).map(({x,why})=>`<div class="cl-dup" style="${clTierStyle(clTierOf(x))}"><b>${escapeHtml(x.n)}</b>${x.s?` — ${escapeHtml(x.s)}`:''}<div class="hint">${x.m?escapeHtml(x.m)+' · ':''}${escapeHtml(why.join(' + '))}</div></div>`).join('')}${dups.length>5?`<div class="hint">و ${dups.length-5} آخرين…</div>`:''}</div>
      <p style="font-weight:700;margin-top:10px;">هل تريد الحفظ رغم التكرار؟</p>
      <div class="modal-foot" style="justify-content:center;"><button class="btn btn-ghost" id="cl-dno">إلغاء</button><button class="btn btn-primary" id="cl-dyes">موافق، احفظ</button></div></div>`;
    document.body.appendChild(d);
    const done=v=>{ d.remove(); res(v); };
    d.querySelector('#cl-dno').onclick=()=>done(false);
    d.querySelector('#cl-dyes').onclick=()=>done(true);
  });
}
function clConfirm(title,bodyHtml,yes,danger){

      <div class="modal-foot" style="justify-content:center;"><button class="btn btn-ghost" id="cl-cno">إلغاء</button><button class="btn ${danger?'btn-danger':'btn-primary'}" id="cl-cyes">${yes}</button></div></div>`;
    document.body.appendChild(d);

    d.querySelector('#cl-cno').onclick=()=>done(false);

function clCloseModal(){ byId('modal-root').innerHTML=''; clState().sel=null; clState().form=null; }
function clRefreshList(){

async function clSaveForm(){
  const S=clState(); if(S.busy||!S.form)return;
  const isNew=!S.form.id;
  const c=clReadForm(S.form.base);
  if(!c.n){ toast('اكتب اسم العميل','error'); const el=document.querySelector('#cl-ov [data-f="n"]'); if(el){ el.classList.add('field-error'); el.focus(); } return; }
  let editDesc='';
  if(isNew){ c.id=clNewId(); c.u={t:new Date().toISOString(),w:'إضافة عميل جديد'}; }
  else{
    c.id=S.form.id;
    const was=S.list.find(x=>x.id===c.id);
    const w=clDiff(was?clClean(was):clBlank(),c);
    if(w==='حفظ بدون تغيير'){ toast('لا توجد تغييرات لحفظها'); clCloseModal(); return; }
    editDesc=w; c.u={t:new Date().toISOString(),w};
  }
  const dups=clDupes(S.list,c);
  if(dups.length){ const ok=await clAsk(dups); if(!ok)return; }
  if(!isNew){
    const ok=await clConfirm('✏️ تأكيد حفظ التعديل',`<p style="font-weight:800;">العميل: ${escapeHtml(c.n)}</p><div class="cl-cfdiff">${escapeHtml(editDesc).split(' | ').map(x=>`<div>${x}</div>`).join('')}</div><p style="font-weight:800;margin-top:10px;">هل تريد حفظ هذا التعديل؟</p>`,'نعم، احفظ التعديل');
    if(!ok)return;
  }
  if(clMobs(c.m).some(n=>!isValidSaudiMobile(n)))toast('تنبيه: رقم الجوال لا يبدو سعوديًا صحيحًا — تم الحفظ كما هو','warn');
  S.busy=true; const btn=byId('cl-fsave'); if(btn){ btn.disabled=true; btn.textContent='جارٍ الحفظ…'; }
  try{
    await clMutate(list=>{
      const i=list.findIndex(x=>x.id===c.id);
      if(i>=0)list[i]=c; else list.unshift(c);
    });
    S.busy=false; clCloseModal(); toast(isNew?'تمت إضافة العميل':'تم حفظ التعديل');
    if(isNew){ S.q=''; S.tier=''; }
    render();
    S.sel=c.id; clOpen(clDetailHtml(c)); clWireModal();
  }catch(e){ S.busy=false; if(btn){ btn.disabled=false; btn.textContent='💾 حفظ'; } toast((e&&e.message)||'تعذّر الحفظ','error'); }
}
function clExportXlsx(){
  const S=clState();
  if(!window.XLSX){ toast('تعذّر تحميل مكتبة Excel — تأكد من الاتصال بالإنترنت','error'); return; }

  const rows=S.list.map(c=>[c.n,c.m,c.c,c.s,clTierInfo(clTierOf(c)).name,c.mn,c.k1,c.k5,c.hp,c.hm,...c.h,c.f,...c.d,...c.g,c.o,c.t,c.u?(c.u.w+' — '+clWhen(c.u.t)):'']);

function clImportFile(file){
  const fr=new FileReader();
  fr.onerror=()=>toast('تعذّر قراءة الملف','error');
  fr.onload=()=>{
    let arr;
    try{ const o=JSON.parse(fr.result); arr=Array.isArray(o)?o:o.list; if(!Array.isArray(arr))throw 0; }catch(e){ toast('الملف غير صالح — اختر customers_import.json','error'); return; }
    const incoming=arr.map(clClean).filter(c=>c.n);
    if(!incoming.length){ toast('الملف فارغ','error'); return; }
    showConfirm(`سيتم استيراد ${incoming.length} عميل. العملاء المكررون (نفس الاسم أو الجوال أو الكود) سيتم تخطيهم. متابعة؟`,async()=>{
      try{
        const r=await clMutate(list=>{
          let add=0,skip=0;
          incoming.forEach(c=>{
            if(clDupes(list,{...c,id:'__new'}).length){ skip++; return; }
            c.u={t:new Date().toISOString(),w:'استيراد من ملف'}; list.push(c); add++;
          });
          return {add,skip};
        });
        toast(`تم استيراد ${r.add} عميل${r.skip?` — تم تخطي ${r.skip} مكرر`:''}`);
        render();
      }catch(e){ toast((e&&e.message)||'تعذّر الاستيراد','error'); }
    },'استيراد','إلغاء');
  };
  fr.readAsText(file,'utf-8');
}
function attachClientsEvents(){
  const S=clState();
  const q=byId('cl-q');
  if(q){
    q.addEventListener('input',()=>{ S.q=q.value; S.lim=60; clRefreshList(); });
    q.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const l=clFiltered(); if(l.length===1)clShow(l[0].id); } });
  }
  const on=(id,fn)=>{ const el=byId(id); if(el)el.addEventListener('click',fn); };
  on('cl-add',()=>clShowForm(null));
  on('cl-xlsx',clExportXlsx);
  on('cl-retry',()=>{ S.err=''; clLoad(true); render(); });
  const pick=()=>{ const f=document.createElement('input'); f.type='file'; f.accept='.json,application/json'; f.onchange=()=>{ if(f.files[0])clImportFile(f.files[0]); }; f.click(); };
  on('cl-import',pick); on('cl-import2',pick);
  const lg=byId('cl-legend'), ls=byId('cl-list');
  if(S.openId){ const id=S.openId; S.openId=null; if(S.list.find(x=>x.id===id))clShow(id); }
  if(lg)lg.addEventListener('click',e=>{ const b=e.target.closest('[data-tier]'); if(!b)return; const k=b.getAttribute('data-tier'); S.tier=(S.tier===k)?'':k; S.lim=60; clRefreshList(); });
  if(ls)ls.addEventListener('click',e=>{
    if(e.target.closest('#cl-more')){ S.lim+=60; clRefreshList(); return; }
    const r=e.target.closest('.cl-row'); if(r)clShow(r.getAttribute('data-id'));
  });
}
function clShow(id){
  const S=clState(), c=S.list.find(x=>x.id===id); if(!c)return;
  S.sel=id; clOpen(clDetailHtml(c));
  clWireModal();
}
function clShowForm(id){
  const S=clState();
  const base=id?JSON.parse(JSON.stringify(S.list.find(x=>x.id===id)||clBlank())):clBlank();
  S.form={id:id||'',base};
  clOpen(clFormHtml(base,!id));
  clWireModal();
  const f=document.querySelector('#cl-ov [data-f="n"]'); if(f)f.focus();
}
function clWireModal(){
  const S=clState(), ov=byId('cl-ov'); if(!ov)return;
  ov.addEventListener('mousedown',e=>{ if(e.target===ov&&!S.form)clCloseModal(); });
  const on=(id,fn)=>{ const el=byId(id); if(el)el.addEventListener('click',fn); };
  on('cl-close',clCloseModal);
  on('cl-fcancel',clCloseModal);
  on('cl-fsave',clSaveForm);
  on('cl-edit',e=>clShowForm(e.currentTarget.getAttribute('data-id')));
  on('cl-del',e=>{
    const id=e.currentTarget.getAttribute('data-id'), c=S.list.find(x=>x.id===id); if(!c)return;
    clConfirm('🗑️ تأكيد الحذف',`<p style="font-weight:900;font-size:17px;">${escapeHtml(c.n)}</p><p style="font-weight:800;">سيتم حذف هذا العميل وكل بياناته نهائيًا ولا يمكن التراجع. هل أنت متأكد؟</p>`,'نعم، احذف',true).then(async ok=>{
      if(!ok)return;
      try{ await clMutate(list=>{ const i=list.findIndex(x=>x.id===id); if(i>=0)list.splice(i,1); }); clCloseModal(); toast('تم حذف العميل'); render(); }
      catch(err){ toast((err&&err.message)||'تعذّر الحذف','error'); }
    });
  });
  if(S.form){
    /* اللون بيتغير وانت بتكتب سعر الكرتون أو حساب المن: 8 أصفر فاتح، 9 أصفر غامق، 10 أخضر، 11.68 أزرق، أعلى أحمر */
    const recolor=()=>{
      const t=clTierOf(clReadForm(S.form.base)), fm=byId('cl-fm'), tg=byId('cl-ftag');
      if(fm)fm.style.cssText=clTierStyle(t);
      if(tg)tg.textContent=clTierInfo(t).name;
    };
    ['k1','mn'].forEach(k=>{ const el=ov.querySelector('[data-f="'+k+'"]'); if(el)el.addEventListener('input',recolor); });
  }
  ov.querySelectorAll('input[data-f]').forEach(el=>el.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); clSaveForm(); } }));
}
