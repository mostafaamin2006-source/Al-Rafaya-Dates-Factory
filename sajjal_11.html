        ${pc.priceWithTax!=null&&pc.priceWithTax!==''?`<div><div class="k">السعر بالضريبة</div><div class="v mono">${escapeHtml(String(pc.priceWithTax))}</div></div>`:''}
        ${pc.total!=null&&pc.total!==''?`<div><div class="k">اجمالي السعر بعد الضريبة</div><div class="v mono" style="font-weight:800;color:var(--accent-dark);">${escapeHtml(String(pc.total))} ريال</div></div>`:''}
      </div>

      `; })()}
      <div class="section-title" style="margin-top:18px;">📞 اتصالات العميل بخصوص الطلب</div>
      <div id="calls-box" style="font-size:13px;">

        ${o.status!=='تم التسليم'?`<button type="button" class="btn btn-ghost btn-sm" id="btn-log-call" style="margin-top:6px;">📞 العميل سأل عن الطلب دلوقتي</button>`:''}
      </div>
      <div class="section-title" style="margin-top:18px;">سجل التعديلات</div>
      ${related.length===0?`<div class="hint">لا يوجد سجل تعديلات لهذا الطلب بعد</div>`:`
      <div class="table-wrap audit-history"><table><thead><tr><th>الوقت</th><th>المستخدم</th><th>العملية</th></tr></thead><tbody>
        ${related.map(l=>`<tr><td><span class="mono" style="font-size:12px;">${formatDateTime(l.time)}</span></td><td>${escapeHtml(l.user)}</td><td>${escapeHtml(l.action)}</td></tr>`).join('')}
      </tbody></table></div>`}

        <button type="button" class="btn btn-ghost" id="btn-print-label">🏷️ ملصق الكرتون</button>
        <button type="button" class="btn btn-primary" id="btn-print-order">🖨️ طباعة أمر التصنيع</button>
      </div>
    </div>
  </div>`;
  const close=()=>{ byId('modal-root').innerHTML=''; state.modalOpen=false; };
  byId('modal-close').addEventListener('click',close);
  byId('modal-cancel').addEventListener('click',close);
  byId('overlay').addEventListener('click',e=>{ if(e.target.id==='overlay')close(); });
  byId('btn-print-label').addEventListener('click',()=>{ close(); printCartonLabel(o.id); });
  byId('btn-detail-loadlist').addEventListener('click',()=>{ close(); openLoadListModal(o.mobile,o.customerName); });
  byId('btn-print-order').addEventListener('click',()=>{ close(); printOrder(o.id); });
  const logCallBtn=byId('btn-log-call');
  if(logCallBtn)logCallBtn.addEventListener('click',async()=>{
    logCallBtn.disabled=true;
    const cur=state.orders.find(x=>x.id===o.id)||o;
    const ok=await updateOrder(o.id,{customerCalls:[...(cur.customerCalls||[]),{at:nowIso(),by:currentUserName()}].slice(-20)},'اتسجّل إن العميل سأل عن الطلب',{bypassSelfEditWindow:true});
    if(ok)openOrderDetailModal(o.id); else logCallBtn.disabled=false;
  });
  const openCustLink=document.querySelector('.open-customer-link');
  if(openCustLink)openCustLink.addEventListener('click',()=>{
    const key=customerKeyForMobile(openCustLink.dataset.mobile);
    if(!key){ toast('رقم جوال هذا العميل غير مسجَّل','error'); return; }
    openCustomerDetailModal(key);
  });
  const editDetailBtn=byId('btn-edit-detail');
  if(editDetailBtn)editDetailBtn.addEventListener('click',()=>{
    if(!canEditOwnOrder(o)){ toast('التعديل مقفول — هذا الطلب ليس من تسجيلك، تواصل مع المسؤول لفتح التعديل','error',5000); return; }
    close();
    openOrderModal(o);
  });
  const waBtn=byId('btn-send-whatsapp');
  if(waBtn)waBtn.addEventListener('click',async()=>{
    if(!o.mobile||!o.qtyMfg){ toast('لا يمكن الإرسال — لا يوجد رقم جوال أو الكمية المصنعة لم تُسجل بعد','error'); return; }
    if(!isValidSaudiMobile(o.mobile)){ toast('رقم الجوال غير صحيح — تأكد من الرقم قبل الإرسال','error'); return; }
    window.open(whatsAppLink(o),'_blank');
    showConfirm('هل تم إرسال الرسالة بنجاح على واتساب؟ (إذا كان الرقم خاطئًا أو غير موجود على واتساب فاضغط "لم يتم الإرسال")',async()=>{
      await markWhatsAppSent(o.id);
      openOrderDetailModal(o.id);
    },'تم الإرسال','لم يتم الإرسال');
  });
}

/* ============== customer detail modal (سجل كامل + ملاحظة ثابتة) ============== */
function openCustomerDetailModal(key){
  const dir=buildCustomerDirectory();
  const c=dir.find(x=>x.key===key);
  if(!c)return;
  state.modalOpen=true;
  const ordersSorted=sortedOrders(c.orders);
  /* فلتر سريع (مؤقت، بيرجع يتصفّر لما تقفلي وتفتحي النافذة تاني): إظهار الطلبات اللي لسه ما اتسلّمتش
     بس — مفيد وأنتِ بتدوري برقم جوال عميل وعايزة تشوفي بس اللي لسه معلّق عنده، من غير كل التاريخ القديم */
  const hideDelivered=!!state._custModalHideDelivered;
  const shownOrders=hideDelivered?ordersSorted.filter(o=>o.status!=='تم التسليم'):ordersSorted;

  byId('modal-root').innerHTML=`
  <div class="overlay" id="overlay">
    <div class="modal" style="max-width:680px;">
      <div class="modal-head"><h3 style="${(note||Object.keys(pr).length)?'color:#C0392B;':''}">🗂️ ${escapeHtml(c.name||'بدون اسم')}</h3><button class="icon-btn" id="modal-close">✕</button></div>
      <div class="result-grid" style="margin-bottom:6px;">
        <div><div class="k">رقم الجوال</div><div class="v mono">${escapeHtml(c.mobile||'—')}</div></div>
        <div><div class="k">📦 عدد الطلبات</div><div class="v">${c.orderCount}</div></div>
        <div><div class="k">⚖️ إجمالي الكمية</div><div class="v">${Math.ceil(c.totalQty)}</div></div>
        ${c.readyCount>0?`<div><div class="k">✅ طلبات جاهزة له</div><div class="v" style="color:#C0392B;font-weight:900;">${c.readyCount}</div></div>`:''}
      </div>
      <div style="margin:6px 0 4px;"><button type="button" class="btn btn-ghost btn-sm" id="btn-cust-loadlist">📋 قائمة التحميل (مواقع طبالي طلباته)</button></div>
      <div class="section-title" style="margin-top:18px;">📌 ملاحظة ثابتة عن العميل</div>
      <textarea id="cust-note-input" rows="2" placeholder="مثال: يفضل تغليف فاخر — يدفع متأخر أحيانًا…" style="width:100%;resize:vertical;">${escapeHtml(note)}</textarea>
      <button type="button" class="btn btn-ghost btn-sm" id="btn-save-cust-note" style="margin-top:6px;">💾 حفظ الملاحظة</button>

      <div class="section-title" style="margin-top:18px;">🔗 دمج مع عميل مكرر (نفس الشخص برقم جوال تاني)</div>
      <div class="sec-desc" style="margin-bottom:8px;">لو العميل ده مسجَّل سابقًا برقم جوال مختلف وبان كعميل منفصل، دوري عليه هنا وادمجيه هنا — كل طلباته القديمة هتتحوّل لرقم الجوال والاسم بتاع العميل ده.</div>
      <input type="text" id="merge-cust-search" placeholder="اكتبي اسم أو رقم جوال العميل التاني..." style="width:100%;margin-bottom:8px;">
      <div id="merge-cust-results"></div>

      <div class="section-title" style="margin-top:18px;">💰 بيانات التسعير (تُكتب يدويًا)</div>
      <div style="margin-bottom:10px;">
        <label style="font-size:12.5px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:3px;">اسم العميل على السيستم</label>
        <input type="text" id="pr-sysname" value="${pf('sysName')}" placeholder="اسم العميل كما هو مسجل على السيستم" style="width:100%;">
      </div>

      <div class="section-title" style="margin-top:12px;font-size:13.5px;">🌴 سعر التمر</div>
      <div class="result-grid">
        <div><label style="font-size:12px;color:var(--ink-soft);">من 1 كيلو</label><input type="number" step="0.01" id="pr-dates-1kg" value="${pf('dates1kg')}" style="width:100%;"></div>
        <div><label style="font-size:12px;color:var(--ink-soft);">من 1/2 كيلو</label><input type="number" step="0.01" id="pr-dates-half" value="${pf('datesHalfKg')}" style="width:100%;"></div>
        <div><label style="font-size:12px;color:var(--ink-soft);">من افطار صائم</label><input type="number" step="0.01" id="pr-dates-iftar" value="${pf('datesIftarSaem')}" style="width:100%;"></div>
      </div>

      <div class="section-title" style="margin-top:12px;font-size:13.5px;">🍯 سعر الدبس</div>
      <div class="result-grid">
        <div><label style="font-size:12px;color:var(--ink-soft);">25 كيلو</label><input type="number" step="0.01" id="pr-dibs-25" value="${pf('dibs25')}" style="width:100%;"></div>
        <div><label style="font-size:12px;color:var(--ink-soft);">2.75 كيلو</label><input type="number" step="0.01" id="pr-dibs-275" value="${pf('dibs275')}" style="width:100%;"></div>
        <div><label style="font-size:12px;color:var(--ink-soft);">1.5 كيلو</label><input type="number" step="0.01" id="pr-dibs-15" value="${pf('dibs15')}" style="width:100%;"></div>
        <div><label style="font-size:12px;color:var(--ink-soft);">700 جرام</label><input type="number" step="0.01" id="pr-dibs-700" value="${pf('dibs700')}" style="width:100%;"></div>
        <div><label style="font-size:12px;color:var(--ink-soft);">400 جرام</label><input type="number" step="0.01" id="pr-dibs-400" value="${pf('dibs400')}" style="width:100%;"></div>
        <div><label style="font-size:12px;color:var(--ink-soft);">390 جرام</label><input type="number" step="0.01" id="pr-dibs-390" value="${pf('dibs390')}" style="width:100%;"></div>
      </div>

      <div class="section-title" style="margin-top:12px;font-size:13.5px;">🥟 سعر العجينة</div>
      <div class="result-grid">
        <div><label style="font-size:12px;color:var(--ink-soft);">مبيعات 1 كيلو</label><input type="number" step="0.01" id="pr-dough-sales1" value="${pf('doughSales1kg')}" style="width:100%;"></div>
        <div><label style="font-size:12px;color:var(--ink-soft);">مبيعات 5 كيلو</label><input type="number" step="0.01" id="pr-dough-sales5" value="${pf('doughSales5kg')}" style="width:100%;"></div>
        <div><label style="font-size:12px;color:var(--ink-soft);">تصنيع 1 كيلو</label><input type="number" step="0.01" id="pr-dough-mfg1" value="${pf('doughMfg1kg')}" style="width:100%;"></div>
        <div><label style="font-size:12px;color:var(--ink-soft);">تصنيع 5 كيلو</label><input type="number" step="0.01" id="pr-dough-mfg5" value="${pf('doughMfg5kg')}" style="width:100%;"></div>
      </div>
      <button type="button" class="btn btn-primary btn-sm" id="btn-save-cust-pricing" style="margin-top:12px;background:#C2185B;">💾 حفظ بيانات التسعير</button>

      <div class="section-title" style="margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
        <span>سجل طلبات العميل (${shownOrders.length}${hideDelivered?` من ${ordersSorted.length}`:''})</span>
        <label style="display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;">
          <input type="checkbox" id="cust-hide-delivered-toggle" ${hideDelivered?'checked':''}> عرض اللي لسه ما اتسلّمش بس
        </label>
      </div>
      ${shownOrders.length===0?`<div class="hint">${hideDelivered?'لا توجد طلبات لسه ما اتسلّمتش':'لا توجد طلبات'}</div>`:`
      <div class="table-wrap audit-history"><table><thead><tr><th>التاريخ</th><th>رقم السند</th><th>نوع التصنيع</th><th>نوع التمر</th><th>الكمية المستلمة</th><th>الكمية المصنعة</th><th>الحالة</th></tr></thead><tbody>
        ${shownOrders.map(o=>`<tr>
          <td><span class="mono" style="font-size:12px;font-weight:700;">${formatDate(o.date)}</span></td>
          <td><span class="receipt-display" style="font-size:12.5px;">${formatReceiptNoHtml(o.receiptNo||'—')}</span>${daysWithoutMfgBadge(o)}</td>
          <td>${escapeHtml(o.processingType||'—')}</td>
          <td>${escapeHtml(o.dateType||'—')}</td>
          <td>${qtyReceivedHtml(o)}</td>
          <td>${qtyMfgDisplayHtml(o)}</td>
          <td>${statusBadge(o.status,'sm')}</td>
        </tr>`).join('')}
      </tbody></table></div>`}
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" id="modal-cancel">إغلاق</button>
      </div>
    </div>
  </div>`;
  const close=()=>{ byId('modal-root').innerHTML=''; state.modalOpen=false; };

  byId('btn-cust-loadlist').addEventListener('click',()=>{ close(); openLoadListModal(c.mobile,c.name); });
  byId('modal-cancel').addEventListener('click',close);
  byId('overlay').addEventListener('click',e=>{ if(e.target.id==='overlay')close(); });
  byId('btn-save-cust-note').addEventListener('click',async()=>{
    await setCustomerNote(key,byId('cust-note-input').value.trim());
  });
  byId('cust-hide-delivered-toggle').addEventListener('change',(e)=>{
    state._custModalHideDelivered=e.target.checked;
    openCustomerDetailModal(key);
  });
  byId('btn-save-cust-pricing').addEventListener('click',async()=>{
    const v=id=>{ const el=byId(id); const t=(el.value||'').trim(); return t===''?'':(el.type==='number'?Number(t):t); };
    const data={
      sysName:v('pr-sysname'),
      dates1kg:v('pr-dates-1kg'), datesHalfKg:v('pr-dates-half'), datesIftarSaem:v('pr-dates-iftar'),
      dibs25:v('pr-dibs-25'), dibs275:v('pr-dibs-275'), dibs15:v('pr-dibs-15'),
      dibs700:v('pr-dibs-700'), dibs400:v('pr-dibs-400'), dibs390:v('pr-dibs-390'),
      doughSales1kg:v('pr-dough-sales1'), doughSales5kg:v('pr-dough-sales5'),
      doughMfg1kg:v('pr-dough-mfg1'), doughMfg5kg:v('pr-dough-mfg5'),
    };
    await setCustomerPricing(key,data);
    openCustomerDetailModal(key);
  });

  /* البحث عن العميل المكرر — بيفلتر قائمة كل العملاء (غير العميل الحالي) بالاسم أو رقم الجوال */
  const mergeSearchInput=byId('merge-cust-search');
  const mergeResultsBox=byId('merge-cust-results');
  const renderMergeResults=(term)=>{
    const t=term.trim().toLowerCase();
    if(!t){ mergeResultsBox.innerHTML=''; return; }
    const matches=dir.filter(x=>x.key!==key&&((x.name||'').toLowerCase().includes(t)||(x.mobile||'').includes(t))).slice(0,6);
    if(!matches.length){ mergeResultsBox.innerHTML=`<div class="hint">لا يوجد عملاء مطابقين</div>`; return; }
    mergeResultsBox.innerHTML=matches.map(m=>`
      <div class="merge-cust-row" data-key="${escapeHtml(m.key)}" style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;">

        <div style="font-size:11.5px;color:var(--ink-soft);">${m.orderCount} طلب</div>
      </div>`).join('');
    mergeResultsBox.querySelectorAll('.merge-cust-row').forEach(row=>row.addEventListener('click',()=>{
      const otherKey=row.dataset.key;
      const other=dir.find(x=>x.key===otherKey);
      if(!other)return;
      showMergeCustomersConfirm(c,other);
    }));
  };
  if(mergeSearchInput){
    let mt; mergeSearchInput.addEventListener('input',()=>{ clearTimeout(mt); mt=setTimeout(()=>renderMergeResults(mergeSearchInput.value),200); });
  }
}
/* نافذة تأكيد الدمج — بتوري ملخص واضح قبل التنفيذ، وبتخلي المستخدم يختار الاسم النهائي الموحّد */

function openOrderModal(order){
  state.modalOpen=true;
  triggerFullHistoryLoadIfNeeded();
  const isEdit=!!order;
  const empDefaultTypes=(state.currentUser&&state.currentUser.role==='employee')?(state.currentUser.defaultProcessingTypes||[]).filter(t=>PROCESSING_TYPES.includes(t)):[];
  const defaultType=empDefaultTypes.length?empDefaultTypes[0]:PROCESSING_TYPES[0];
  /* لو الموظف عنده أقسام افتراضية محدَّدة (قسم أو أكتر)، بنقصر قائمة "نوع التصنيع" عليها بس عند تسجيل
     طلب جديد، عشان ميختارش قسم مش بتاعه بالغلط. عند التعديل بنسيب كل الخيارات ظاهرة دايمًا. */
  const processingTypeOptions=(!isEdit&&empDefaultTypes.length)?empDefaultTypes:PROCESSING_TYPES;
  const o=order||{date:todayIso(),receiptNo:nextReceiptNo(defaultType),processingType:defaultType,status:'جديد',urgent:false,dateCondition:{good:false,hasNotes:false,detail:''}};
  const dCond=o.dateCondition||{good:false,hasNotes:false,detail:''};
  const initialSizes=typeSizes(o.processingType||PROCESSING_TYPES[0]);
  /* خريطة اسم العميل ← أرقام الجوال المستخدمة معاه (كل الأرقام المختلفة، الأحدث أولًا) — تُستخدم لاقتراح
     الأسماء تلقائيًا، تعبئة رقم الجوال فور اختيار اسم عميل سبق تسجيله، والتنبيه لو نفس الاسم له أكتر من رقم */
  const customerMobilesMap={};
  const customerLastOrderMap={};
  sortedOrders(state.orders).forEach(ord=>{
    const nm=(ord.customerName||'').trim();
    const mb=(ord.mobile||'').trim();
    if(!nm)return;
    if(!customerMobilesMap[nm])customerMobilesMap[nm]=[];
    if(mb&&!customerMobilesMap[nm].includes(mb))customerMobilesMap[nm].push(mb);
    if(!customerLastOrderMap[nm])customerLastOrderMap[nm]=ord;
  });
  const customerMobileMap={}; Object.keys(customerMobilesMap).forEach(nm=>{ customerMobileMap[nm]=customerMobilesMap[nm][0]||''; });
  const knownCustomerNames=Object.keys(customerMobileMap);

  byId('modal-root').innerHTML=`
  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="modal-head"><h3>${isEdit?'تعديل الطلب':'تسجيل طلب جديد'}</h3><button class="icon-btn" id="modal-close">✕</button></div>
      ${isEdit&&o.lastEditedBy?`<div class="audit-row" style="margin:-10px 0 14px;">✏️ آخر تعديل: ${escapeHtml(o.lastEditedBy)} · ${formatDateTime(o.lastEditedAt)}</div>`:''}
      <div id="order-form">
        <div class="form-grid">
          <div class="field"><label>التاريخ *</label><input type="date" name="date" value="${escapeHtml(o.date||'')}"></div>
          <div class="field"><label>نوع التصنيع *</label>
            <select name="processingType">${processingTypeOptions.map(t=>`<option value="${t}" ${o.processingType===t?'selected':''}>${t}</option>`).join('')}</select>

  </div>`;

  const close=()=>{ byId('modal-root').innerHTML=''; state.modalOpen=false; };
  /* إغلاق بتلاشي 200ms بعد حفظ الطلب بنجاح */
  const closeWithFade=()=>{
    const ov=byId('overlay');
    if(!ov){ close(); return; }
    ov.classList.add('closing');
    setTimeout(close,200);
  };
  byId('modal-close').addEventListener('click',close);
  byId('modal-cancel').addEventListener('click',close);
  /* لا نغلق عند الضغط خارج النافذة هنا عمدًا — عشان منع فقدان بيانات الطلب اللي بيتسجل بالغلط */

  const formEl=byId('order-form');
  const flcBtn=byId('btn-fill-last-customer');
  if(flcBtn)flcBtn.addEventListener('click',()=>{
    const last=sortedOrders(state.orders)[0];
    if(!last){ toast('لا توجد طلبات سابقة','error'); return; }
    formEl.querySelector('[name="customerName"]').value=last.customerName||'';
    formEl.querySelector('[name="mobile"]').value=last.mobile||'';
    toast('تمت تعبئة اسم ورقم جوال آخر عميل');
  });
  /* لما يُكتب أو يُختار اسم عميل معروف سبق تسجيله، نعبّي رقم جواله تلقائيًا لو حقل الجوال لسه فاضي،
     ولو الاسم ده مسجَّل بأكتر من رقم جوال مختلف قبل كده، ننبّه المستخدم يتأكد من الرقم الصح */
  const customerNameInput=formEl.querySelector('[name="customerName"]');
  const mobileInput=formEl.querySelector('[name="mobile"]');
  const multiMobileWarn=byId('customer-multi-mobile-warn');
  const repeatOrderBtn=byId('btn-repeat-customer-order');
  if(customerNameInput&&mobileInput){
    customerNameInput.addEventListener('input',()=>{
      const nm=customerNameInput.value.trim();
      if(nm&&customerMobileMap[nm]&&!mobileInput.value.trim())mobileInput.value=customerMobileMap[nm];
      if(repeatOrderBtn)repeatOrderBtn.style.display=(nm&&customerLastOrderMap[nm])?'inline-block':'none';
      if(multiMobileWarn){
        const nums=customerMobilesMap[nm]||[];
        if(nm&&nums.length>1){
          multiMobileWarn.style.display='block';
          multiMobileWarn.textContent=`⚠️ العميل "${nm}" مسجَّل قبل كده بأكتر من رقم جوال (${nums.join(' ، ')}) — تأكد إنك مختار الرقم الصحيح`;
        }else{
          multiMobileWarn.style.display='none';
          multiMobileWarn.textContent='';
        }
      }
    });
    if(repeatOrderBtn)repeatOrderBtn.addEventListener('click',()=>{
      const nm=customerNameInput.value.trim();
      const last=customerLastOrderMap[nm];
      if(!last)return;
      const procSel=formEl.querySelector('[name="processingType"]');
      if(procSel&&last.processingType){ procSel.value=last.processingType; procSel.dispatchEvent(new Event('change')); }
      setTimeout(()=>{
        const pkgInp=formEl.querySelector('[name="packageSize"]');
        const ctnInp=formEl.querySelector('[name="cartonSize"]');
        if(pkgInp)pkgInp.value=last.packageSize||'';
        if(ctnInp)ctnInp.value=last.cartonSize||'';
        if(pkgInp)pkgInp.dispatchEvent(new Event('input'));
        (last.dateTypes||(last.dateType?[last.dateType]:[])).forEach(d=>{
          const cb=formEl.querySelector(idSel('dt-'+d));
          if(cb)cb.checked=true;
        });
        toast('تمت تعبئة بيانات آخر طلب لهذا العميل — راجعها قبل الحفظ');
      },50);
    });
    const mobileHint=byId('mobile-hint');
    if(mobileHint)mobileInput.addEventListener('input',()=>{
      const v=mobileInput.value.trim();
      if(!v){ mobileHint.textContent='10 أرقام بالضبط'; mobileHint.style.color=''; return; }
      const ok=isValidSaudiMobile(v);
      mobileHint.textContent=ok?'✓ رقم صحيح':'⚠️ الرقم لازم يبدأ بـ 05 ويكون 10 أرقام';
      mobileHint.style.color=ok?'var(--success,#2F7A4D)':'var(--danger)';
    });
    if(customerNameInput.value.trim())customerNameInput.dispatchEvent(new Event('input'));
  }
  /* شيك ماركة "الوزن بالكيلو" و"نسبة صافي دبس %" — بيظهروا بس للدبس والعجينة، ودايمًا يبدأوا غير
     مفعّلين لطلب جديد. الاتنين بديلين لبعض (مينفعش الاتنين مفعّلين مع بعض): إما تكتب الوزن يدوي، أو
     تكتب نسبة صافي الدبس وتتحسب الوزن أوتوماتيك (الكمية المستلمة × متوسط وزن الوحدة × النسبة/100) */
  const weightKgToggle=byId('weight-kg-toggle');
  const weightKgInputWrap=byId('weight-kg-input-wrap');
  const netPctToggle=byId('net-pct-toggle');
  const netPctInputWrap=byId('net-pct-input-wrap');
  const netPctInput=byId('net-pct-input');
  const netPctCalcHint=byId('net-pct-calc-hint');
  const qtyCartonsInputForWeight=formEl.querySelector('[name="qtyCartons"]');
  const avgUnitWeight=Number(state.avgReceivedWeightKg)||18;
  const updateNetPctHint=()=>{
    if(!netPctCalcHint)return;
    const qty=Number(qtyCartonsInputForWeight&&qtyCartonsInputForWeight.value)||0;
    const pct=Number(netPctInput&&netPctInput.value)||0;
    const computed=qty*avgUnitWeight*pct/100;
    netPctCalcHint.textContent=computed>0?`= ${round2(computed)} كجم (${qty} × ${avgUnitWeight} كجم × ${pct}٪)`:'';
  };
  if(weightKgToggle&&weightKgInputWrap){
    weightKgToggle.addEventListener('change',()=>{
      weightKgInputWrap.style.display=weightKgToggle.checked?'':'none';
      if(!weightKgToggle.checked){ const inp=byId('weight-kg-input'); if(inp)inp.value=''; }
      if(weightKgToggle.checked&&netPctToggle){ netPctToggle.checked=false; netPctInputWrap.style.display='none'; if(netPctInput)netPctInput.value=''; }
    });
  }
  if(netPctToggle&&netPctInputWrap){
    netPctToggle.addEventListener('change',()=>{
      netPctInputWrap.style.display=netPctToggle.checked?'':'none';
      if(!netPctToggle.checked){ if(netPctInput)netPctInput.value=''; if(netPctCalcHint)netPctCalcHint.textContent=''; }
      else{ updateNetPctHint(); if(weightKgToggle){ weightKgToggle.checked=false; weightKgInputWrap.style.display='none'; const inp=byId('weight-kg-input'); if(inp)inp.value=''; } }
    });
  }
  if(netPctInput)netPctInput.addEventListener('input',updateNetPctHint);
  if(qtyCartonsInputForWeight)qtyCartonsInputForWeight.addEventListener('input',updateNetPctHint);
  updateNetPctHint();
  /* تحديث شارة حرف رقم السند (V/J/P/S) — أكبر حجمًا وبلون يمثل نوع الخدمة */
  const receiptNoInput=byId('receipt-no-input');
  const receiptChip=byId('receipt-letter-chip');
  const updateReceiptChip=()=>{
    const val=(receiptNoInput.value||'').trim();
    const letter=val.charAt(0).toUpperCase();
    const color=receiptLetterColor(letter);
    if(color){ receiptChip.textContent=letter; receiptChip.style.color=color; }
    else{ receiptChip.textContent=''; }
  };
  updateReceiptChip();
  receiptNoInput.addEventListener('input',updateReceiptChip);
  /* تنبيه فوري لو رقم الجوال مختلف عن اللي اتسجّل قبل كده لنفس العميل (أو مسجّل باسم عميل تاني) */
  (()=>{
    const nameI=formEl.querySelector('[name="customerName"]'), mobI=formEl.querySelector('[name="mobile"]');
    if(!nameI||!mobI)return;
    const hint=document.createElement('div'); hint.className='receipt-dup-warn'; hint.style.display='none'; hint.style.background='#FFF6EA'; hint.style.borderColor='#E67E22'; hint.style.color='#8A4B00';
    mobI.insertAdjacentElement('afterend',hint);
    const norm=t=>(t||'').toString().trim().toLowerCase();
    const check=()=>{
      const nm=norm(nameI.value), mb=(mobI.value||'').trim();
      let msg='';
      if(nm&&/^\d{10}$/.test(mb)){
        const sameName=state.orders.filter(x=>norm(x.customerName)===nm&&x.mobile&&(!isEdit||x.id!==o.id));
        if(sameName.length&&!sameName.some(x=>x.mobile===mb)){
          msg=`⚠️ العميل "${nameI.value.trim()}" مسجَّل سابقًا برقم ${sameName[sameName.length-1].mobile} — راجع الرقم`;
        }else{
          const sameMob=state.orders.find(x=>x.mobile===mb&&x.customerName&&norm(x.customerName)!==nm&&(!isEdit||x.id!==o.id));
          if(sameMob)msg=`⚠️ هذا الرقم مسجَّل سابقًا باسم "${sameMob.customerName}"`;
        }
      }
      hint.textContent=msg; hint.style.display=msg?'':'none';
    };
    nameI.addEventListener('input',check); mobI.addEventListener('input',check); nameI.addEventListener('change',check); check();
  })();
  /* تنبيه فوري لو رقم السند مكرر (على الطلبات المحمَّلة حاليًا — والفحص الكامل بيحصل برضه وقت الحفظ) */
  const dupWarnEl=byId('receipt-dup-warn');
  const checkReceiptDup=()=>{
    const v=(receiptNoInput.value||'').trim();
    const hit=v?state.orders.find(x=>(x.receiptNo||'').toString().trim().toLowerCase()===v.toLowerCase()&&(!isEdit||x.id!==o.id)):null;
    if(hit){
      dupWarnEl.style.display='';
      dupWarnEl.textContent=`⚠️ رقم السند ${v} موجود بالفعل — العميل: ${hit.customerName||'—'} — تاريخ الطلب: ${formatDate(hit.date)}`;
    }else{ dupWarnEl.style.display='none'; dupWarnEl.textContent=''; }
  };
  receiptNoInput.addEventListener('input',checkReceiptDup);
  checkReceiptDup();
  /* تنبيه فوري لو حجم العبوة/الكرتون المختارين لطلب دبس مش موجودين معًا في جدول الأسعار، عشان الموظف يصحّحه وهو بيسجل الطلب مش بعدين في الحاسبة */
  const packageSizeInput=formEl.querySelector('[name="packageSize"]');
  const cartonSizeInput=formEl.querySelector('[name="cartonSize"]');
  const dibsWarnEl=byId('dibs-size-warn');
  const procSelect=formEl.querySelector('[name="processingType"]');
  const updateDibsSizeWarn=()=>{
    if(!dibsWarnEl)return;
    const isDibsType=procSelect.value==='دبس';
    const ps=packageSizeInput.value.trim(), cs=cartonSizeInput.value.trim();
    const shouldWarn=isDibsType&&ps&&cs&&!matchWeightRowIn(getDibsWeightTable(),ps,cs);
    dibsWarnEl.style.display=shouldWarn?'':'none';
  };
  const cartonSizeOptionsFor=(pkgVal)=>{
    const sz=typeSizes(procSelect.value);
    let opts=sz.cartonSizes||[];
    if(procSelect.value==='دبس'){
      const specific=dibsPiecesForPackage((pkgVal||'').trim());
      if(specific.length)opts=specific;
    }
    return opts;
  };
  const updateCartonSizeOptions=()=>{
    byId('carton-sizes-list').innerHTML=cartonSizeOptionsFor(packageSizeInput.value).map(s=>`<option value="${escapeHtml(s)}">`).join('');
  };
  if(packageSizeInput&&cartonSizeInput){
    packageSizeInput.addEventListener('input',()=>{ updateDibsSizeWarn(); updateCartonSizeOptions(); });
    cartonSizeInput.addEventListener('input',updateDibsSizeWarn);
    updateDibsSizeWarn();
    updateCartonSizeOptions();
  }

  /* ============== طلبات إضافية لنفس السند ============== */
  let extraItems=(o.extraItems||[]).map(it=>({...it}));
  function renderExtraItemsList(){
    const box=byId('extra-items-list');
    if(!box)return;
    box.innerHTML=extraItems.map((it,i)=>`
      <div class="extra-item-row" data-idx="${i}" style="display:flex;gap:8px;align-items:flex-end;margin-top:8px;padding:8px;background:var(--surface-2);border-radius:10px;">
        <div class="field" style="margin:0;flex:1;"><label style="font-size:11px;">حجم العبوة</label><input type="text" class="extra-item-pkg" list="package-sizes-list" value="${escapeHtml(it.packageSize||'')}"></div>
        <div class="field" style="margin:0;flex:1;"><label style="font-size:11px;">حجم الكرتون</label><input type="text" class="extra-item-ctn" list="extra-carton-sizes-list-${i}" value="${escapeHtml(it.cartonSize||'')}"></div>
        <div class="field" style="margin:0;flex:1;"><label style="font-size:11px;">الكمية المستلمة</label><input type="number" min="1" class="extra-item-qty" value="${escapeHtml(it.qtyCartons||'')}"></div>
        <datalist id="extra-carton-sizes-list-${i}">${cartonSizeOptionsFor(it.packageSize).map(s=>`<option value="${escapeHtml(s)}">`).join('')}</datalist>
        <button type="button" class="icon-btn danger btn-remove-extra-item" title="حذف هذا الطلب الفرعي" style="flex-shrink:0;">🗑</button>
      </div>`).join('');
    box.querySelectorAll('.extra-item-row').forEach(row=>{
      const idx=Number(row.dataset.idx);
      const pkgInp=row.querySelector('.extra-item-pkg');
      pkgInp.addEventListener('input',e=>{
        extraItems[idx].packageSize=e.target.value;
        const dl=byId('extra-carton-sizes-list-'+idx);
        if(dl)dl.innerHTML=cartonSizeOptionsFor(e.target.value).map(s=>`<option value="${escapeHtml(s)}">`).join('');
      });
      row.querySelector('.extra-item-ctn').addEventListener('input',e=>{ extraItems[idx].cartonSize=e.target.value; });
      row.querySelector('.extra-item-ctn').addEventListener('focus',()=>{
        const dl=byId('extra-carton-sizes-list-'+idx);
        if(dl)dl.innerHTML=cartonSizeOptionsFor(extraItems[idx].packageSize).map(s=>`<option value="${escapeHtml(s)}">`).join('');
      });
      row.querySelector('.extra-item-qty').addEventListener('input',e=>{ extraItems[idx].qtyCartons=e.target.value; });
      row.querySelector('.btn-remove-extra-item').addEventListener('click',()=>{ extraItems.splice(idx,1); renderExtraItemsList(); });
    });
  }
  renderExtraItemsList();
  const btnAddExtraItem=byId('btn-add-extra-item');
  if(btnAddExtraItem)btnAddExtraItem.addEventListener('click',()=>{
    extraItems.push({packageSize:'',cartonSize:'',qtyCartons:''});
    renderExtraItemsList();
  });
  procSelect.addEventListener('change',()=>{ 
    const sz=typeSizes(procSelect.value);
    byId('package-sizes-list').innerHTML=(sz.packageSizes||[]).map(s=>`<option value="${escapeHtml(s)}">`).join('');
    updateCartonSizeOptions();
    updateDibsSizeWarn();
    /* تحديث قوائم حجم الكرتون في كل الطلبات الإضافية كمان، لأنها بتعتمد على نوع التصنيع المختار */
    extraItems.forEach((it,i)=>{
      const dl=byId('extra-carton-sizes-list-'+i);
      if(dl)dl.innerHTML=cartonSizeOptionsFor(it.packageSize).map(s=>`<option value="${escapeHtml(s)}">`).join('');
    });
    const vsw=byId('vacuum-services-wrap');
    if(vsw)vsw.style.display=procSelect.value==='فاكيوم'?'':'none';
    const ufw=byId('urgent-field-wrap');
    if(ufw){
      ufw.style.display=procSelect.value==='فاكيوم'?'':'none';
      if(procSelect.value!=='فاكيوم'){ const cb=ufw.querySelector('input[name="urgent"]'); if(cb)cb.checked=false; }
    }
    const dcw=byId('date-condition-wrap');
    /* حالة التمر بتظهر لكل الأنواع عدا التعقيم (مش تصنيع فعليًا) */
    const showDateCondition=procSelect.value!=='تعقيم';
    if(dcw)dcw.style.display=showDateCondition?'':'none';
    if(!showDateCondition){
      const cg=byId('cond-good'),cn=byId('cond-hasnotes'),cdw=byId('cond-detail-wrap'),cd=byId('cond-detail');
      if(cg)cg.checked=false;
      if(cn)cn.checked=false;
      if(cdw)cdw.style.display='none';
      if(cd)cd.value='';
    }
    /* الوزن بالكيلو بيظهر بس للدبس والعجينة — ولو اتغيّر نوع التصنيع لنوع تاني، نقفل الشيك ماركة ونمسح القيمة */
    const wkWrap=byId('weight-kg-wrap');
    const showWeightKg=procSelect.value==='دبس'||procSelect.value==='عجينة';
    if(wkWrap)wkWrap.style.display=showWeightKg?'':'none';
    if(!showWeightKg){
      const wkToggle=byId('weight-kg-toggle'), wkInputWrap=byId('weight-kg-input-wrap'), wkInput=byId('weight-kg-input');
      if(wkToggle)wkToggle.checked=false;
      if(wkInputWrap)wkInputWrap.style.display='none';
      if(wkInput)wkInput.value='';
    }
    /* التعقيم مش تصنيع فعليًا (بدون تعبئة) — نخفي حجم العبوة/الكرتون والطلبات الإضافية ونمسح قيمهم
       عشان محفظش قيمة قديمة متسجّلة بالغلط من نوع تصنيع تاني كان مختار قبل كده */
    const isSterilize=procSelect.value==='تعقيم';
    const pkgWrap=byId('package-size-wrap'), ctnWrap=byId('carton-size-wrap'), eiWrap=byId('extra-items-wrap');
    if(pkgWrap)pkgWrap.style.display=isSterilize?'none':'';
    if(ctnWrap)ctnWrap.style.display=isSterilize?'none':'';
    if(eiWrap)eiWrap.style.display=isSterilize?'none':'';
    if(isSterilize){
      if(packageSizeInput)packageSizeInput.value='';
      if(cartonSizeInput)cartonSizeInput.value='';
      extraItems.length=0;
      renderExtraItemsList();
    }
    /* تحديث رقم السند تلقائيًا عند تغيير نوع التصنيع (طلب جديد فقط) */
    if(!isEdit){
      const rnInp=formEl.querySelector('[name="receiptNo"]');
      if(rnInp)rnInp.value=nextReceiptNo(procSelect.value);
    }
    updateReceiptChip();
  });
  const condGood=byId('cond-good'),condNotes=byId('cond-hasnotes'),condWrap=byId('cond-detail-wrap');
  condGood.addEventListener('change',()=>{ if(condGood.checked){condNotes.checked=false;condWrap.style.display='none';} });
  condNotes.addEventListener('change',()=>{ if(condNotes.checked){condGood.checked=false;condWrap.style.display='';}else{condWrap.style.display='none';} });

  /* لو الموظف غيّر حالة "إدخال سريع" يدويًا، نحفظها كتفضيل على الجهاز عشان تفضل بنفس الحالة في المرة الجاية */
  const qeCb=byId('quick-entry-mode');
  if(qeCb)qeCb.addEventListener('change',()=>{ setQuickEntryDefaultChecked(qeCb.checked); });

  /* أخرى toggle */
  const dtOtherCb=formEl.querySelector(idSel('dt-أخرى'));
  const dtOtherInput=formEl.querySelector('#dateTypeOther-input');
  if(dtOtherCb&&dtOtherInput){
    dtOtherCb.addEventListener('change',()=>{ dtOtherInput.style.display=dtOtherCb.checked?'':'none'; });
  }

  /* Enter في أي خانة بيودّي للخانة اللي بعدها (بدل ما يعمل حاجة تانية) — ما عدا الملاحظات (سطر جديد) والأزرار */
  formEl.addEventListener('keydown',e=>{
    if(e.key!=='Enter'||e.shiftKey||e.isComposing)return;
    const t=e.target;
    if(!t||t.tagName==='TEXTAREA'||t.tagName==='BUTTON')return;
    if(t.tagName==='INPUT'&&['checkbox','radio','button','submit'].includes(t.type))return;
    if(t.closest&&t.closest('.suggest-list,.autocomplete-list'))return;
    const fields=Array.from(formEl.querySelectorAll('input,select,textarea')).filter(el=>
      !el.disabled&&!el.readOnly&&el.type!=='hidden'&&!['checkbox','radio','button','submit'].includes(el.type)&&el.offsetParent!==null);
    const i=fields.indexOf(t);
    if(i<0)return;
    e.preventDefault();
    const nxt=fields[i+1];
    if(nxt){ nxt.focus(); if(nxt.select&&['text','tel','number','search'].includes(nxt.type))try{ nxt.select(); }catch(_){} }
  });
  byId('submit-order-btn').addEventListener('click',async()=>{
    const sBtn=byId('submit-order-btn');
    /* منع تسجيل نفس الطلب مرتين لو الموظف ضغط "حفظ" أكتر من مرة (بيحصل كتير لما النت يكون بطيء ومفيش
       رد فعل فوري على الشاشة فيحس إنه محتاج يضغط تاني) — بنعطّل الزرار فورًا أول ما يتضغط، ومنرجّعوش
       متاح إلا لو التحقق فشل وممكن يصحّح ويعيد المحاولة؛ لو نجح الحفظ هيقفل النافذة عادي */
    if(sBtn.disabled)return;
    sBtn.disabled=true;
    const origBtnLabel=sBtn.textContent;
    const abortSave=(msg)=>{ sBtn.disabled=false; sBtn.textContent=origBtnLabel; if(msg)toast(msg,'error'); };
    const get=n=>formEl.querySelector(`[name="${n}"]`);
    formEl.querySelectorAll('.field-error').forEach(el=>el.classList.remove('field-error'));
    const dateVal=get('date').value, receiptNoVal=get('receiptNo').value.trim();
    const customerNameVal=get('customerName').value.trim(), processingTypeVal=get('processingType').value;
    const mobileRaw=get('mobile').value.trim();
    const qtyVal=get('qtyCartons').value.trim();
    const pkgVal=get('packageSize').value.trim();
    const ctnVal=get('cartonSize').value.trim();
    const selectedDateTypes=dateTypeCheckboxOptions().filter(d=>formEl.querySelector(idSel('dt-'+d))?.checked);
    let firstInvalid=null,errorMsg='';
    if(!dateVal){firstInvalid=get('date');errorMsg='التاريخ مطلوب';}
    else if(!receiptNoVal){firstInvalid=get('receiptNo');errorMsg='رقم السند مطلوب';}
    else if(!customerNameVal){firstInvalid=get('customerName');errorMsg='اسم العميل مطلوب';}
    else if(!mobileRaw||!/^\d{10}$/.test(mobileRaw)){firstInvalid=get('mobile');errorMsg='رقم الجوال مطلوب (10 أرقام)';}
    else if(!qtyVal){firstInvalid=get('qtyCartons');errorMsg='كمية الكراتين مطلوبة';}
    else if(!selectedDateTypes.length){errorMsg='اختر نوع التمر';const cb=formEl.querySelector(idSel('dt-خلاص'));firstInvalid=cb;}
    else if(!processingTypeVal){firstInvalid=get('processingType');errorMsg='نوع التصنيع مطلوب';}
    else if(processingTypeVal!=='تعقيم'&&!pkgVal){firstInvalid=get('packageSize');errorMsg='حجم العبوة مطلوب';}
    else if(processingTypeVal!=='تعقيم'&&!ctnVal){firstInvalid=get('cartonSize');errorMsg='حجم الكرتون مطلوب';}
    else if(!CARTON_TYPES.some((ct,cti)=>formEl.querySelector(`#ctype-${cti}`)?.checked)){errorMsg='اختر نوع العبوة المستلمة (موز/مدهش/غير ممتلئ...)';firstInvalid=formEl.querySelector('#ctype-0');}
    else if(processingTypeVal!=='تعقيم'&&!byId('cond-good').checked&&!byId('cond-hasnotes').checked){errorMsg='اختر حالة التمر (جيد أو به ملاحظات)';firstInvalid=byId('cond-good');}
    /* لازم كل طلب فرعي إضافي يكون مكتمل البيانات (حجم عبوة + حجم كرتون + كمية) قبل الحفظ — التعقيم مالوش طلبات إضافية أصلًا */
    if(!firstInvalid&&!errorMsg&&processingTypeVal!=='تعقيم'){
      for(const it of extraItems){
        if(!((it.packageSize||'').trim())||!((it.cartonSize||'').trim())||!((it.qtyCartons||'').toString().trim())){
          errorMsg='يجب إكمال بيانات كل طلب إضافي (حجم العبوة والكرتون والكمية) أو حذفه';
          break;
        }
      }
    }
    if(firstInvalid){firstInvalid.classList.add('field-error');firstInvalid.focus();abortSave(errorMsg);return;}
    if(errorMsg&&!firstInvalid){abortSave(errorMsg);return;}
    /* لازم نتأكد إن كل الأرشيف القديم اتحمّل قبل ما نتحقق من تكرار رقم السند — لو البرنامج لسه في أول تحميله
       (فتح فورًا بآخر شهر بس لسرعة الفتح)، فحص التكرار على state.orders الناقصة ممكن يفوّت رقم سند
       مكرر موجود في شهر قديم لسه ما اتحمّلش، ويسمح بحفظ رقم مكرر فعليًا من غير ما يتنبّه حد */
    if(state.allHistoryLoaded!==true){
      sBtn.textContent='جارٍ التحقق من عدم تكرار رقم السند…';
      try{ await triggerFullHistoryLoadIfNeeded(); }catch(e){}
    }
    const dupExists=state.orders.some(ord=>ord.receiptNo===receiptNoVal&&(!isEdit||ord.id!==o.id));
    if(dupExists){ get('receiptNo').classList.add('field-error'); abortSave('رقم السند موجود بالفعل'); return; }
    sBtn.textContent='جارٍ الحفظ…';
    /* تنبيه لو رقم الجوال ده مسجل قبل كده باسم مختلف — يمنع تشتت بيانات نفس العميل بأسماء مكتوبة بطرق مختلفة */
    const mobileNameConflict=state.orders.find(ord=>ord.mobile===mobileRaw&&ord.customerName&&ord.customerName.trim()!==customerNameVal&&(!isEdit||ord.id!==o.id));
    const doSave=async()=>{
    const dateTypeOtherVal=(formEl.querySelector('#dateTypeOther-input')?.value||'').trim();
    const selectedCartonTypes=CARTON_TYPES.filter((ct,cti)=>formEl.querySelector(`#ctype-${cti}`)?.checked);
    /* خدمات الفاكيوم المختارة فعليًا من صناديق الاختيار (تشمل سحب هواء — قابلة للإزالة الآن) */
    const vacuumServices=processingTypeVal==='فاكيوم'?VACUUM_SERVICES.filter(s=>formEl.querySelector(`[name="vs-${s}"]`)?.checked):[];
    const payload={
      date:dateVal,receiptNo:receiptNoVal,customerName:customerNameVal,
      mobile:mobileRaw,
      dateTypes:selectedDateTypes,
      dateType:(()=>{ const disp=selectedDateTypes.map(d=>d==='أخرى'?(dateTypeOtherVal||'أخرى'):d); return disp.length===1?disp[0]:disp.join('،'); })(),
      dateTypeOther:dateTypeOtherVal,
      qtyCartons:qtyVal,processingType:processingTypeVal,
      cartonTypes:selectedCartonTypes,
      status:isEdit?o.status||'جديد':'جديد',
      packageSize:processingTypeVal==='تعقيم'?'':pkgVal,cartonSize:processingTypeVal==='تعقيم'?'':ctnVal,urgent:get('urgent').checked,
      weightKg:(()=>{
        const showWk=processingTypeVal==='دبس'||processingTypeVal==='عجينة';
        if(!showWk)return '';
        const wkToggle=byId('weight-kg-toggle');
        if(wkToggle&&wkToggle.checked)return (byId('weight-kg-input').value||'').trim();
        const pctToggle=byId('net-pct-toggle');
        if(pctToggle&&pctToggle.checked){
          const pct=Number(byId('net-pct-input').value)||0;
          const qty=Number(qtyVal)||0;
          const avgW=Number(state.avgReceivedWeightKg)||18;
          return pct>0?String(round2(qty*avgW*pct/100)):'';
        }
        return '';
      })(),
      dibsNetPercentage:(()=>{
        const showWk=processingTypeVal==='دبس'||processingTypeVal==='عجينة';
        const pctToggle=byId('net-pct-toggle');
        return (showWk&&pctToggle&&pctToggle.checked)?(byId('net-pct-input').value||'').trim():'';
      })(),
      extraItems:processingTypeVal==='تعقيم'?[]:extraItems.map(it=>({...it,packageSize:(it.packageSize||'').trim(),cartonSize:(it.cartonSize||'').trim(),qtyCartons:(it.qtyCartons||'').toString().trim()})),
      processingNotes:get('processingNotes').value.trim(),
      vacuumServices,
      dateCondition:{good:byId('cond-good').checked,hasNotes:byId('cond-hasnotes').checked,detail:byId('cond-detail').value.trim()},
      washed:byId('wash-status-toggle').checked,
    };
    if(isEdit&&get('wasteQty')){ const wv=(get('wasteQty').value||'').trim(); payload.wasteQty=wv===''?'':round2(parseFloat(wv)||0); }
    let saveOk;
    if(isEdit){
      /* بنبعت للحفظ الحقول اللي اتغيّرت فعلًا بس — عشان تعديل بسيط (زي تصحيح اسم) ما يرجّعش حالة/ملاحظات/كمية
         اتعدّلت من جهاز تاني بعد ما فتحت نافذة التعديل */
      const editPatch={};
      Object.keys(payload).forEach(k=>{ if(JSON.stringify(payload[k])!==JSON.stringify(o[k]===undefined?null:o[k]))editPatch[k]=payload[k]; });
      delete editPatch.status;
      saveOk=await updateOrder(o.id,editPatch,'تم حفظ التعديلات');
      /* بنستدعي المزامنة دايمًا مع أي تعديل (حتى لو الطلب بقى نوعه مش فاكيوم) عشان أي خدمة إضافية
         كانت مرتبطة بيه قبل كده تتشال تلقائيًا لو مبقتش موجودة، مش بس نضيف الجديد */
      if(saveOk)await syncExtraServiceRecords(payload,processingTypeVal==='فاكيوم'?vacuumServices:[]);
    }else{
      saveOk=await addOrder(payload);
      if(saveOk&&processingTypeVal==='فاكيوم')await syncExtraServiceRecords(payload,vacuumServices);
    }
    /* حماية أساسية: لو الحفظ فشل فعليًا (مشكلة نت/اتصال) مينفعش نقفل النافذة أو نمسح البيانات
       أو نطلّع رسالة "اتسجّل" — ده كان بيخلي الموظف يفتكر إن الطلب اتسجّل ويكمل شغله عادي، مع إن
       الطلب أصلًا ما اتحفظش في القاعدة خالص. بنسيب النافذة مفتوحة وكل البيانات المكتوبة زي ما هي
       عشان يقدر يعيد المحاولة، ورسالة الخطأ (اللي طلعت بالفعل من دالة الحفظ) توضّح السبب */
    if(!saveOk){ abortSave(); return; }
    const quickEntryCb=byId('quick-entry-mode');
    const quickEntry=!isEdit&&quickEntryCb&&quickEntryCb.checked;
    /* في وضع الإدخال السريع، بنحتفظ بنوع التصنيع ونوع التمر المختارين، وبنمسح باقي بيانات الطلب،
       عشان تسجيل كذا سند ورا بعض لنفس الخط يبقى أسرع من غير ما تقفل النافذة كل مرة */
    const carryProcessingType=quickEntry?processingTypeVal:null;
    const carryDateTypes=quickEntry?selectedDateTypes.slice():null;
    if(quickEntry){
      close();
      openOrderModal();
      setTimeout(()=>{
        const nf=byId('order-form');
        if(!nf)return;
        if(carryProcessingType){
          const ps=nf.querySelector('[name="processingType"]');
          if(ps){ ps.value=carryProcessingType; ps.dispatchEvent(new Event('change')); }
        }
        (carryDateTypes||[]).forEach(d=>{ const cb=nf.querySelector(idSel('dt-'+d)); if(cb)cb.checked=true; });
        const cnInp=nf.querySelector('[name="customerName"]');
        if(cnInp)cnInp.focus();
      },80);
      toast('✅ تم التسجيل — جاهز لطلب جديد');
    }else{
      closeWithFade();
    }
    };
    if(mobileNameConflict){
      toast(`⚠️ رقم الجوال هذا مسجَّل سابقًا باسم "${mobileNameConflict.customerName}" — وقد تم الحفظ`,'error',6000);
    }
    await doSave();
  });
}

/* خدمات "تقعيم تمور" و"حشو لوز" وغيرها — إذا اختيرت مع الفاكيوم (عند التسجيل أو التعديل) تُنشئ نسخة في
   صفحة الخدمات الإضافية أيضاً. الدالة دي كمان بتزامن أي تعديل لاحق على الطلب: لو خدمة اتشالت من الطلب
   (أو الطلب بقى نوعه مش فاكيوم أصلًا)، السجل المرتبط بيها بيتشال من الخدمات الإضافية تلقائيًا؛ ولو
   بيانات الطلب اتغيّرت (اسم العميل، التاريخ، نوع التمر، الكمية، الأولوية)، نفس التغيير بينعكس على أي
   سجل خدمة لسه مرتبط بنفس السند. بتشتغل حتى لو الطلب بقى نوعه مش فاكيوم، عشان تقدر تشيل أي سجل قديم
   كان مرتبط قبل التغيير */
async function syncExtraServiceRecords(payload,extraVacSvcs){
  const extraForServices=(extraVacSvcs||[]).filter(s=>VACUUM_SERVICES_EXTRA.includes(s));
  /* بس السجلات اللي اتربطت تلقائيًا بنفس السند ده (مش أي خدمة سجّلها حد يدويًا بشكل مستقل) */
  const existingAuto=state.serviceOrders.filter(so=>so.receiptNo===payload.receiptNo&&so.serviceSource==='auto');

  const toRemove=existingAuto.filter(so=>!extraForServices.includes(so.serviceType));
  for(const so of toRemove){ await deleteServiceOrder(so.id,true); }

  const stillLinked=existingAuto.filter(so=>extraForServices.includes(so.serviceType));
  for(const so of stillLinked){
    await updateServiceOrder(so.id,{
      date:payload.date,customerName:payload.customerName,
      dateTypes:payload.dateTypes||[],dateType:payload.dateType,
      qtyReceived:payload.qtyCartons||'',urgent:!!payload.urgent,
    });
  }

  const existingTypes=existingAuto.map(so=>so.serviceType);
  const toCreate=extraForServices.filter(s=>!existingTypes.includes(s));
  const created=[],failed=[];
  for(const svc of toCreate){
    const ok=await addServiceOrder({
      date:payload.date,receiptNo:payload.receiptNo,customerName:payload.customerName,
      dateTypes:payload.dateTypes||[],dateType:payload.dateType,serviceType:svc,
      qtyReceived:payload.qtyCartons||'',qtyMfg:'',mfgDate:'',notes:'',serviceSource:'auto',urgent:!!payload.urgent,
    },true);
    if(ok)created.push(svc); else failed.push(svc);
  }
  if(created.length>0)toast(`✅ نُسخ سند ${payload.receiptNo||''} إلى الخدمات الإضافية (${created.join('، ')})`,'ok',5000);
  if(toRemove.length>0)toast(`🗑️ تمت إزالة (${toRemove.map(s=>s.serviceType).join('، ')}) من الخدمات الإضافية لسند ${payload.receiptNo||''}`,'ok',5000);

/* ============== مجلد الحفظ التلقائي لملفات النسخ الاحتياطية والتصدير ==============
   بتستخدم File System Access API (مدعومة في Chrome/Edge على الكمبيوتر بس، مش في Firefox/Safari ولا الموبايل).
   بنخزّن مقبض المجلد (Directory Handle) في IndexedDB لأنه مش نص عادي يتخزن في localStorage،
   وبنحفظ اسم المجلد في localStorage كمان عشان يظهر فورًا في الإعدادات من غير انتظار قراءة IndexedDB. */
const BACKUP_FS_DB='sajjal-fs-handles';
function openHandleDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(BACKUP_FS_DB,1);
    req.onupgradeneeded=()=>{ req.result.createObjectStore('handles'); };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function saveBackupFolderHandle(handle){
  const db=await openHandleDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction('handles','readwrite');
    tx.objectStore('handles').put(handle,'backup-folder');
    tx.oncomplete=()=>resolve(true);
    tx.onerror=()=>reject(tx.error);
  });
}
async function getBackupFolderHandle(){
  try{
    const db=await openHandleDB();
    return await new Promise((resolve,reject)=>{
      const tx=db.transaction('handles','readonly');
      const req=tx.objectStore('handles').get('backup-folder');
      req.onsuccess=()=>resolve(req.result||null);
      req.onerror=()=>reject(req.error);
    });
  }catch(e){ return null; }
}
async function clearBackupFolderHandle(){
  try{ const db=await openHandleDB(); const tx=db.transaction('handles','readwrite'); tx.objectStore('handles').delete('backup-folder'); }catch(e){}
}
async function pickBackupFolder(){
  if(!('showDirectoryPicker' in window)){ toast('هذا المتصفح لا يدعم اختيار المجلد تلقائيًا — استخدم Chrome أو Edge على الحاسوب','error'); return; }
  try{
    const handle=await window.showDirectoryPicker({mode:'readwrite'});
    const perm=await handle.requestPermission({mode:'readwrite'});
    if(perm!=='granted'){ toast('يجب الموافقة على صلاحية الكتابة في المجلد حتى تعمل الخاصية','error'); return; }
    await saveBackupFolderHandle(handle);
    try{ localStorage.setItem('sajjal-backup-folder-name',handle.name); }catch(e){}
    toast(`✅ تم تحديد مجلد الحفظ: ${handle.name}`);
    render();
  }catch(e){ if(e.name!=='AbortError')toast('حدث خطأ أثناء اختيار المجلد','error'); }
}
async function clearBackupFolder(){
  await clearBackupFolderHandle();
  try{ localStorage.removeItem('sajjal-backup-folder-name'); }catch(e){}
  toast('تم إلغاء مجلد الحفظ التلقائي — ستُحفظ الملفات في مجلد التنزيلات المعتاد');
  render();
}
/* يحفظ الملف مباشرة جوه المجلد المحدد من غير أي نافذة تأكيد لو الصلاحية لسه سارية،
   وإلا يرجع لطريقة التنزيل العادية من المتصفح (زر تنزيل بسيط). بترجع true لو اتحفظ في المجلد المحدد. */
async function saveBackupFile(blob,filename){
  try{
    const dirHandle=await getBackupFolderHandle();
    if(dirHandle){
      const perm=await dirHandle.queryPermission({mode:'readwrite'});
      if(perm==='granted'){
        const fileHandle=await dirHandle.getFileHandle(filename,{create:true});
        const writable=await fileHandle.createWritable();
        await writable.write(blob);
        await writable.close();
        return true;
      }
    }
  }catch(e){ /* لو فشل لأي سبب، نكمل على طريقة التنزيل العادية تحت */ }
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  return false;
}

/* تصوير صفحة التقرير كصورة، وإرسالها مباشرة كملف عبر شاشة المشاركة (تظهر فيها واتساب) —
   ده أقرب حاجة ممكنة لإرسال "صورة/ملف" تلقائي، لأن واتساب مفيش له رابط رسمي بيرفق ملفات لوحده.
   لو المتصفح مش بيدعم مشاركة الملفات (غالبًا أجهزة الكمبيوتر)، بننزّل الصورة تلقائيًا
   ونفتح واتساب بالنص جاهز، والمستخدم يرفق الصورة يدويًا بضغطة واحدة. */
async function captureReportCanvas(){
  if(!window.html2canvas){ toast('تعذّر تحميل مكتبة التصوير — تأكد من الاتصال بالإنترنت','error'); return null; }
  const el=byId('report-print-area');
  if(!el){ toast('لا يوجد تقرير لتصديره','error'); return null; }
  /* نخفي مؤقتًا صندوق الإرسال والتذييل عشان الصورة توقف عند آخر اسم في جدول "أكثر 5 عملاء" ومتجيبش حاجة بعده */
  const toHide=[...el.querySelectorAll('.report-send-box,.report-footer')];
  const prevDisplay=toHide.map(x=>x.style.display);
  toHide.forEach(x=>{ x.style.display='none'; });
  try{
    return await html2canvas(el,{backgroundColor:'#ffffff',scale:2});
  }catch(e){ toast('تعذّر إنشاء صورة التقرير','error'); return null; }
  finally{ toHide.forEach((x,i)=>{ x.style.display=prevDisplay[i]; }); }
}
async function shareReportAsImage(waNumber,text){
  toast('جارٍ تجهيز صورة التقرير…');
  const canvas=await captureReportCanvas();
  if(!canvas)return false;
  const blob=await new Promise(res=>canvas.toBlob(res,'image/png'));
  if(!blob){ toast('تعذّر إنشاء صورة التقرير','error'); return false; }
  const fileName=`تقرير-${todayIso()}.png`;
  const file=new File([blob],fileName,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file],text,title:'تقرير'});
      return true;
    }catch(e){ if(e&&e.name==='AbortError')return true; /* المستخدم لغى المشاركة، مفيش داعي لأي فولباك */ }
  }
  /* فولباك: تنزيل الصورة + فتح واتساب بنص التقرير، والمستخدم يرفق الصورة بنفسه */
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=fileName;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  if(waNumber)window.open(`https://wa.me/${waNumber}?text=${encodeURIComponent(text)}`,'_blank');

/* رقم الأسبوع بمعيار ISO — يُستخدم لمعرفة هل بدأ أسبوع جديد أم لا */
function isoWeekKey(d){
  const date=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const dayNum=(date.getUTCDay()+6)%7;
  date.setUTCDate(date.getUTCDate()-dayNum+3);
  const firstThursday=new Date(Date.UTC(date.getUTCFullYear(),0,4));
  const week=1+Math.round(((date-firstThursday)/86400000-3+((firstThursday.getUTCDay()+6)%7))/7);
  return `${date.getUTCFullYear()}-W${String(week).padStart(2,'0')}`;
}
/* تصدير تلقائي (يومي وأسبوعي) بدون أي ضغطة زر — يعمل مرة واحدة فقط لكل يوم/أسبوع أول ما المسؤول يفتح التطبيق.
   ملاحظة: بما إن التطبيق يعمل من المتصفح فقط بدون سيرفر، فهو "تلقائي" بمعنى إنه ميحتاجش ضغطة زر،
/* ============== نظام النسخ الاحتياطي التلقائي — 3 طبقات حماية مستقلة عن بعض ==============
   1) لقطة يومية تتحفظ داخل قاعدة البيانات نفسها (أسرع طبقة، ومستقلة عن أي جهاز/متصفح)
   2) تنزيل ملف يوميًا على أي جهاز يفتح البرنامج بعد الساعة المحدَّدة (افتراضيًا 7:30 م)
   3) إرسال بالإيميل تلقائيًا (اختياري، يحتاج إعداد EmailJS من صفحة الإعدادات) */
/* لقطة يومية كاملة (طلبات + خدمات) بتتحفظ في قاعدة البيانات تحت مفتاح منفصل لكل يوم — طبقة حماية
   مستقلة تمامًا عن أي جهاز، بتفضل موجودة حتى لو الجهاز اتقفل أو النت وقع. بنحتفظ بآخر 30 يوم بس */
async function saveDailySnapshotIfNeeded(){
  try{
    /* أصبحت للأدمن بس (17 سبتمبر 2026) — كانت بتشتغل لأي موظف يفتح البرنامج، وكل واحد منهم كان بيحمّل
       الأرشيف كامل (كل شهور الموسم) لوحده بس عشان ياخد لقطة يومية واحدة مش هيستخدمها غيره أصلاً — تكرار
       بلا داعي بيستهلك بيانات (Egress) كتير مع كل موظف إضافي بيفتح البرنامج، وبيانات الموسم بقت كبيرة.
       نسخة واحدة يومية من جهاز الأدمن كافية تمامًا لنفس الغرض (شبكة أمان يومية) */
    if(!isAdmin())return;
    const todayKey=todayIso();
    if(localStorage.getItem('sajjal-last-snapshot')===todayKey)return;
    await triggerFullHistoryLoadIfNeeded();
    const snapshot={savedAt:nowIso(),savedBy:currentUserName(),orders:state.orders,serviceOrders:state.serviceOrders};
    const ok=await storageSetRetry('backup-snapshot:'+todayKey,JSON.stringify(snapshot),true);
    if(!ok)return;
    localStorage.setItem('sajjal-last-snapshot',todayKey);
    let idx=[]; try{ const r=await sbGet('backup-snapshot-index'); idx=r&&r.value?JSON.parse(r.value):[]; }catch(e){}
    if(!idx.includes(todayKey)){
      idx=[...idx,todayKey].sort();
      await storageSetRetry('backup-snapshot-index',JSON.stringify(idx),true);
      const cutoff=new Date(Date.now()-30*86400000).toISOString().slice(0,10);
      const toDelete=idx.filter(d=>d<cutoff);
      if(toDelete.length){
        for(const d of toDelete){
          try{ await fetch(`${SB_URL}/rest/v1/sajjal_store?key=eq.${encodeURIComponent('backup-snapshot:'+d)}`,{method:'DELETE',headers:SB_HDR,cache:'no-store'}); }catch(e){}
        }
        await storageSetRetry('backup-snapshot-index',JSON.stringify(idx.filter(d=>d>=cutoff)),true);
      }
    }
  }catch(e){}
}
/* إرسال ملف النسخة الاحتياطية بالإيميل تلقائيًا عبر EmailJS (خدمة مجانية بحد أقصى شهري، محتاجة إعداد
   حساب مرة واحدة من صفحة الإعدادات). لو المرفقات مش مدعومة في خطتك المجانية، هيوصلك على الأقل إيميل
   تأكيد إن النسخة اتعملت مع ملخص الأرقام، وتقدر تفتح البرنامج وتنزّل الملف نفسه وقت ما تحب */
async function sendBackupEmail(blob,filename,summary){
  const cfg=currentConfig();
  if(!cfg.emailBackupEnabled||!cfg.emailBackupAddress||!cfg.emailjsServiceId||!cfg.emailjsTemplateId||!cfg.emailjsPublicKey)return false;
  try{
    if(!window.emailjs){
      await new Promise((resolve,reject)=>{
        const s=document.createElement('script');
        s.src='https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js';
        s.onload=resolve; s.onerror=reject; document.head.appendChild(s);
      });
      window.emailjs.init({publicKey:cfg.emailjsPublicKey});
    }
    const base64=await new Promise((resolve,reject)=>{
      const r=new FileReader();
      r.onload=()=>resolve(r.result.split(',')[1]);
      r.onerror=reject;
      r.readAsDataURL(blob);
    });
    await window.emailjs.send(cfg.emailjsServiceId,cfg.emailjsTemplateId,{
      to_email:cfg.emailBackupAddress,
      subject:`نسخة احتياطية تلقائية — ${todayIso()}`,
      message:summary,
      attachment:base64,
      filename,
    });
    return true;
  }catch(e){ return false; }
}
/* إصلاح حرج (22 سبتمبر 2026): كانت الدالة دي بتتأكد "هل اتعمل النهارده؟" وتعلّم "تم" بس بعد ما العملية
   تخلص، مش قبل ما تبدأ. بما إن النسخة الشاملة بتاخد وقت طويل (لازم تحمّل أرشيف الموسم كامل) — أطول من
   الـ60 ثانية اللي بيتفحص فيها تاني — الفحص التالي كان لسه شايف "لسه ماتمّتش" فكان بيبدأ نسخة تانية
   فوق الأولى اللي لسه شغّالة، وده كان بيتكرر كل دقيقة ويتراكم لعشرات النسخ المكررة (وكمان استهلاك بيانات
   ضخم بسبب تكرار تحميل الأرشيف كامل كل مرة). الحل: قفل بسيط (mutex) بيمنع أي تنفيذ تاني للدالة دي لحد
   ما التنفيذ الحالي يخلص تمامًا، حتى لو الفحص الدوري حصل عشرات المرات في نفس الوقت */
let _autoExportInFlight=false;
async function maybeRunAutoExport(){
  if(_autoExportInFlight)return;
  _autoExportInFlight=true;
  try{
    if(!state.currentUser)return;
    /* الطبقة 1: لقطة يومية جوه قاعدة البيانات — بتحصل فورًا أول ما حد يفتح البرنامج، مش لازم تستنى ميعاد */
    await saveDailySnapshotIfNeeded();
    const cfg=currentConfig();
    if(cfg.autoExportEnabled===false)return;
    if(!window.XLSX)return;
    if(!state.orders.length)return;
    /* الطبقتين 2 و3 (تنزيل الملف + الإيميل) — كانت بتستنّى ميعاد معيّن (7:30 م افتراضيًا)، بس ده كان
       بيخلّيها متفوّت كل يوم لو البرنامج اتقفل قبل الميعاد (زي فتحه الصبح وقفله بالليل) — بما إن
       النظام صفحة ويب بس من غير سيرفر خلفي، مفيش ضمان إن حد هيكون فاتح البرنامج بالظبط في الميعاد ده.
       دلوقتي بتشتغل فورًا أول ما البرنامج يتفتح كل يوم، مضمون تحصل كل يوم بيفتح فيه البرنامج */
    const todayKey=todayIso();
    const lastDaily=localStorage.getItem('sajjal-last-daily-export');
    if(lastDaily!==todayKey){
      await exportOrdersExcel();
      localStorage.setItem('sajjal-last-daily-export',todayKey);
      toast('📊 تم تنزيل التقرير اليومي للطلبات تلقائيًا');
    }
    const lastDailyBackup=localStorage.getItem('sajjal-last-daily-backup');
    /* النسخة الشاملة (الثقيلة) — بتحمّل كل بيانات المصنع من الأول (كل الشهور) كل مرة، فلو كل الموظفين
       شغّلوها يوميًا كل واحد على جهازه، الاستهلاك (Egress) بيتضاعف بعدد الأجهزة. خليناها تشتغل يوميًا
       بس على جهاز الأدمن، وباقي الموظفين بياخدوا بس الطبقة الخفيفة (اللقطة اليومية + تقرير الطلبات) */
    if(lastDailyBackup!==todayKey&&window.ExcelJS&&isAdmin()){
      await exportBackupCSVForAuto();
      localStorage.setItem('sajjal-last-daily-backup',todayKey);
    }
    const weekKey=isoWeekKey(new Date());
    const lastWeekly=localStorage.getItem('sajjal-last-weekly-export');
    if(lastWeekly!==weekKey){
      await exportCustomersExcel();
      localStorage.setItem('sajjal-last-weekly-export',weekKey);
      toast('📊 تم تنزيل التقرير الأسبوعي للعملاء تلقائيًا');
    }
  }catch(e){}
  finally{ _autoExportInFlight=false; }
}

/* ============== أداة استرجاع طارئ من نسخة Excel احتياطية (30 أغسطس 2026) — لاستخدامها لو حصل فقدان
   بيانات (بسبب العيب البرمجي اللي اتصلّح أعلاه) وعندك ملف Excel اتصدّر من نفس البرنامج قبل المشكلة.
   بتقرأ نفس أعمدة exportOrdersExcel بالظبط، وبتضيف بس الطلبات اللي رقم سندها مش موجود حاليًا (تفادي تكرار) */
async function restoreFromBackupExcel(file){
  if(!window.XLSX){ toast('تعذّر تحميل مكتبة Excel — تأكد من الاتصال بالإنترنت','error'); return; }
  toast('جارٍ قراءة ملف النسخة الاحتياطية…');
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array',cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
    if(!rows.length){ toast('الملف فارغ أو بدون بيانات','error'); return; }

    if(state.allHistoryLoaded!==true){ toast('جارٍ تحميل كل الأرشيف الحالي للتأكد من عدم التكرار…'); await triggerFullHistoryLoadIfNeeded(); }

    const norm=s=>String(s||'').replace(/\(.*?\)/g,'').trim();
    const getVal=(row,...names)=>{
      for(const key of Object.keys(row)){
        const nk=norm(key);
        if(names.some(n=>nk.includes(n)))return row[key];
      }
      return '';
    };
    const parseDMY=(raw)=>{
      if(raw instanceof Date&&!isNaN(raw))return `${raw.getFullYear()}-${String(raw.getMonth()+1).padStart(2,'0')}-${String(raw.getDate()).padStart(2,'0')}`;
      if(typeof raw==='number'&&window.XLSX&&XLSX.SSF){ const d=XLSX.SSF.parse_date_code(raw); if(d)return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`; }
      if(typeof raw==='string'&&raw.trim()){
        const s=raw.trim();
        const m1=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s);
        const m2=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);
        if(m1)return `${m1[1]}-${m1[2].padStart(2,'0')}-${m1[3].padStart(2,'0')}`;
        if(m2)return `${m2[3]}-${m2[2].padStart(2,'0')}-${m2[1].padStart(2,'0')}`;
      }
      return '';
    };
    const statusReverse={}; Object.keys(STATUS_LABELS).forEach(code=>{ statusReverse[STATUS_LABELS[code]]=code; });
    const existingReceipts=new Set(state.orders.map(o=>o.receiptNo).filter(Boolean));

    const byMonth={}; let restored=0,skippedDup=0,skippedNoReceipt=0;
    const now=Date.now();
    rows.forEach((row,i)=>{
      const receiptNo=String(getVal(row,'رقم السند')||'').trim();
      if(!receiptNo){ skippedNoReceipt++; return; }
      if(existingReceipts.has(receiptNo)){ skippedDup++; return; }
      const dateVal=parseDMY(getVal(row,'التاريخ'));
      const mfgDateVal=parseDMY(getVal(row,'تاريخ التصنيع'));
      const statusLabelVal=String(getVal(row,'الحالة')||'').trim();
      const statusCode=statusReverse[statusLabelVal]||(STATUS_FLOW.includes(statusLabelVal)?statusLabelVal:'جديد');
      const condRaw=String(getVal(row,'حالة التمر')||'').trim();
      const dateCondition=condRaw==='جيد'?{good:true}:(condRaw==='به ملاحظات'?{hasNotes:true}:undefined);
      const monthKey=dateVal?dateVal.slice(0,7):new Date(now).toISOString().slice(0,7);
      const order={
        id:genId(),createdAt:now+i,monthKey,
        createdBy:'استرجاع من نسخة احتياطية',lastEditedBy:'استرجاع من نسخة احتياطية',lastEditedAt:nowIso(),
        date:dateVal,receiptNo,customerName:String(getVal(row,'اسم العميل')||'').trim(),
        mobile:String(getVal(row,'رقم الجوال')||'').trim().replace(/\D/g,''),
        dateType:String(getVal(row,'نوع التمر')||'').trim(),
        qtyCartons:String(getVal(row,'الكمية المستلمة')||'').trim(),
        qtyMfg:String(getVal(row,'الكمية المصنعة')||'').trim(),
        mfgDate:mfgDateVal,
        processingType:String(getVal(row,'نوع التصنيع')||'').trim(),
        packageSize:String(getVal(row,'حجم العبوة')||'').trim(),
        cartonSize:String(getVal(row,'حجم الكرتون')||'').trim(),
        dateCondition,
        urgent:String(getVal(row,'الأولوية')||'').trim()==='مستعجل',
        status:statusCode,
        processingNotes:String(getVal(row,'ملاحظات التصنيع')||'').trim(),
        cartonTypes:[],extraItems:[],
      };
      (byMonth[monthKey]=byMonth[monthKey]||[]).push(order);
      existingReceipts.add(receiptNo);
      restored++;
    });

    if(!restored){ toast(`لا يوجد طلبات جديدة للاسترجاع (${skippedDup} موجودة مسبقًا، ${skippedNoReceipt} بدون رقم سند)`,'error',6000); return; }

    toast(`جارٍ استرجاع ${restored} طلب…`);
    try{ for(const m of Object.keys(byMonth))await ensureMonthIndexedStrict(m); }
    catch(e){ toast('تعذّر التأكد من فهرس الأشهر (مشكلة اتصال) — لم يتم الاسترجاع، جرّب مرة أخرى بعد قليل','error',7000); return; }

    let savedTotal=0,anyFail=false;
    for(const mk of Object.keys(byMonth)){
      try{
        const fresh=await loadMonthOrThrow(mk);
        const merged=[...fresh,...byMonth[mk]];
        const ok=await saveMonth(mk,merged);
        if(ok)savedTotal+=byMonth[mk].length; else anyFail=true;
      }catch(e){ anyFail=true; toast(`تعذّر استرجاع شهر ${mk} (مشكلة اتصال) — جرّب رفع الملف مرة أخرى بعد قليل`,'error',7000); }
    }
    await fullRefresh();
    render();
    if(savedTotal){
      addAudit(`🆘 استرجاع طارئ: ${savedTotal} طلب من نسخة احتياطية Excel${skippedDup?` (تخطّي ${skippedDup} موجودين بالفعل)`:''}`);
      toast(anyFail?`تم استرجاع ${savedTotal} طلب، وحدث خطأ في بعض الأشهر — جرّب رفع الملف مرة أخرى`:`✅ تم استرجاع ${savedTotal} طلب بنجاح`,'ok',7000);
    }
  }catch(e){
    toast('حدث خطأ أثناء قراءة الملف: '+(e.message||e),'error',6000);
  }
}

async function importOrdersFromExcel(file){
  if(!window.XLSX){ toast('تعذّر تحميل مكتبة Excel — تأكد من الاتصال بالإنترنت','error'); return; }
  toast('جارٍ قراءة الملف…');
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array',cellDates:true});
    const sheetName=wb.SheetNames[0];
    const ws=wb.Sheets[sheetName];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
    if(!rows.length){ toast('الملف فارغ أو بدون بيانات صالحة','error'); return; }
    /* لازم كل تاريخ الطلبات القديم يكون محمَّل قبل ما نتحقق من تكرار أرقام السندات أو نولّد أرقام تلقائية —
       fullRefresh() بيحدّث بس الشهر الحالي والي قبله (لسرعة عادية)، ده مش كافي هنا؛ محتاجين كل الأرشيف فعليًا */
    if(state.allHistoryLoaded!==true){ toast('جارٍ تحميل كل الأرشيف القديم للتأكد من عدم تكرار الأرقام…'); await triggerFullHistoryLoadIfNeeded(); }
    else{ await fullRefresh(); }

    const norm=s=>String(s||'').replace(/\(.*?\)/g,'').trim();
    const getVal=(row,...names)=>{
      for(const key of Object.keys(row)){
        const nk=norm(key);
        if(names.some(n=>nk.includes(n)))return row[key];
      }
      return '';
    };

    const valid=[],errors=[];
    const seqCounters={};
    rows.forEach((row,i)=>{
      const rowNum=i+2;
      const dateRaw=getVal(row,'التاريخ');
      let dateVal='';
      if(dateRaw instanceof Date&&!isNaN(dateRaw)){
        dateVal=`${dateRaw.getFullYear()}-${String(dateRaw.getMonth()+1).padStart(2,'0')}-${String(dateRaw.getDate()).padStart(2,'0')}`;
      }else if(typeof dateRaw==='number'&&window.XLSX&&XLSX.SSF){
        const d=XLSX.SSF.parse_date_code(dateRaw);
        if(d)dateVal=`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
      }else if(typeof dateRaw==='string'&&dateRaw.trim()){
        const s=dateRaw.trim();
        const m1=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s);
        const m2=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);
        if(m1)dateVal=`${m1[1]}-${m1[2].padStart(2,'0')}-${m1[3].padStart(2,'0')}`;
        else if(m2)dateVal=`${m2[3]}-${m2[2].padStart(2,'0')}-${m2[1].padStart(2,'0')}`;
      }
      const processingType=String(getVal(row,'نوع التصنيع')||'').trim();
      let receiptNo=String(getVal(row,'رقم السند')||'').trim();
      const customerName=String(getVal(row,'اسم العميل')||'').trim();
      let mobile=String(getVal(row,'رقم الجوال','الجوال')||'').trim().replace(/\D/g,'');
      if(mobile&&mobile.length<10)mobile=mobile.padStart(10,'0');
      const qtyCartons=String(getVal(row,'الكمية المستلمة','كراتين')||'').trim();
      const dateTypeRaw=String(getVal(row,'نوع التمر')||'').trim();
      const dateTypes=dateTypeRaw?dateTypeRaw.split(/[,،]/).map(s=>s.trim()).filter(Boolean):[];
      const packageSize=String(getVal(row,'حجم العبوة')||'').trim();
      const cartonSize=String(getVal(row,'حجم الكرتون')||'').trim();
      const urgentRaw=String(getVal(row,'مستعجل')||'').trim();
      const urgent=/^(نعم|yes|true|1)$/i.test(urgentRaw);
      const processingNotes=String(getVal(row,'ملاحظات')||'').trim();

      if(!dateVal&&!processingType&&!customerName&&!mobile&&!qtyCartons&&!dateTypes.length&&!packageSize&&!cartonSize)return;

      const rowErrors=[];
      if(!dateVal)rowErrors.push('تاريخ غير صالح');
      if(!PROCESSING_TYPES.includes(processingType))rowErrors.push('نوع التصنيع غير صحيح');
      if(!customerName)rowErrors.push('اسم العميل مطلوب');
      if(!mobile||!/^\d{10}$/.test(mobile))rowErrors.push('رقم الجوال يجب أن يكون 10 أرقام');
      if(!qtyCartons)rowErrors.push('الكمية المستلمة مطلوبة');
      if(!dateTypes.length)rowErrors.push('نوع التمر مطلوب');
      /* التعقيم مش تصنيع فعليًا (بدون تعبئة)، فحجم العبوة/الكرتون مش مطلوبين له */
      if(processingType!=='تعقيم'){
        if(!packageSize)rowErrors.push('حجم العبوة مطلوب');
        if(!cartonSize)rowErrors.push('حجم الكرتون مطلوب');
      }
      if(rowErrors.length){ errors.push(`صف ${rowNum}: ${rowErrors.join('، ')}`); return; }

      if(!receiptNo){
        const prefix=RECEIPT_PREFIX[processingType]||'';
        /* العجينة والتعقيم بيشاركوا نفس حرف رقم السند (P) ونفس تسلسل الترقيم، فبنحسب آخر رقم من نوعي
           التصنيع مع بعض (مش بس اللي بيبدأ بنفس الحرف نصيًا) عشان يطابق نفس منطق nextReceiptNo() —
           وبنكمل من آخر سند اتسجل/اتعدّل فعليًا (lastEditedAt) مش من أعلى رقم في التاريخ كله */
        const family=RECEIPT_SEQUENCE_GROUP[processingType]||[processingType];
        if(seqCounters[prefix]===undefined){
          const matching=state.orders.filter(o=>family.includes(o.processingType));
          if(matching.length){
            const latest=matching.reduce((a,b)=>{
              const ta=a.lastEditedAt?new Date(a.lastEditedAt).getTime():(a.createdAt||0);
              const tb=b.lastEditedAt?new Date(b.lastEditedAt).getTime():(b.createdAt||0);
              return tb>ta?b:a;
            });
            const m=(latest.receiptNo||'').match(/(\d+)\s*$/);
            seqCounters[prefix]=m?parseInt(m[1],10):0;
          }else{
            seqCounters[prefix]=0;
          }
        }
        seqCounters[prefix]+=1;
        receiptNo=prefix+String(seqCounters[prefix]).padStart(4,'0');
      }else{
        const dup=state.orders.some(o=>o.receiptNo===receiptNo)||valid.some(v=>v.receiptNo===receiptNo);
        if(dup){ errors.push(`صف ${rowNum}: رقم السند "${receiptNo}" مستخدم بالفعل`); return; }
      }

      valid.push({
        date:dateVal,receiptNo,customerName,mobile,
        dateTypes,dateType:dateTypes.length===1?dateTypes[0]:dateTypes.join('،'),
        qtyCartons,processingType,status:'جديد',
        packageSize,cartonSize,urgent,processingNotes,vacuumServices:[],
        dateCondition:{good:false,hasNotes:false,detail:''},
      });
    });

    if(!valid.length){
      toast('لم يتم استيراد أي صف — راجع الملاحظات','error',5000);
      if(errors.length)showImportErrorsModal(errors);
      return;
    }

    const now=Date.now();
    const byMonth={};
    valid.forEach((payload,idx2)=>{
      const monthKey=(payload.date||todayIso()).slice(0,7);
      const newOrder={id:genId(),createdAt:now+idx2,monthKey,createdBy:currentUserName(),lastEditedBy:currentUserName(),lastEditedAt:nowIso(),...payload};
      (byMonth[monthKey]=byMonth[monthKey]||[]).push(newOrder);
    });
    try{ for(const m of Object.keys(byMonth))await ensureMonthIndexedStrict(m); }
    catch(e){ toast('تعذّر التأكد من فهرس الأشهر (مشكلة اتصال) — لم يتم الاستيراد، جرّب مرة أخرى بعد قليل','error',7000); return; }
    let savedOrders=[];
    for(const monthKey of Object.keys(byMonth)){
      let fresh;
      try{ fresh=await loadMonthOrThrow(monthKey); }
      catch(e){ errors.push(`تعذّر تحميل بيانات شهر ${monthKey} قبل الحفظ (مشكلة اتصال) — لم يتم استيراد صفوف هذا الشهر لتفادي فقدان بيانات`); continue; }
      const merged=[...fresh,...byMonth[monthKey]];
      const ok=await saveMonth(monthKey,merged);
      if(ok)savedOrders=savedOrders.concat(byMonth[monthKey]);
      else errors.push(`تعذّر حفظ بيانات شهر ${monthKey}`);
    }
    if(savedOrders.length){
      state.orders=[...state.orders,...savedOrders];
      addAudit(`استيراد ${savedOrders.length} طلب من ملف Excel`);
      render();
    }
    if(savedOrders.length&&!errors.length){
      toast(`✅ تم استيراد ${savedOrders.length} طلب بنجاح`,'ok',4000);
    }else if(savedOrders.length&&errors.length){
      toast(`تم استيراد ${savedOrders.length} طلب، وتعذّر استيراد ${errors.length} صف`,'error',5000);
      showImportErrorsModal(errors);
    }else{
      toast('تعذّر استيراد أي بيانات','error');
      showImportErrorsModal(errors);
    }
  }catch(e){
    console.error(e);
    toast('تعذّر قراءة ملف Excel — تأكد من صيغة الملف','error');
  }
}

/* ============== event wiring ============== */
function attachViewEvents(){
  const aub=byId('btn-app-update-reload');
  if(aub)aub.addEventListener('click',async()=>{
    aub.textContent='جارٍ التحميل…'; aub.disabled=true;
    /* السبب الشائع لرجوع البانر بعد التحميل: الـ Service Worker بيفضل يقدّم نسخة قديمة متخزّنة (Cache) للصفحة
       حتى لو غيّرنا رابط التحميل. فبنمسح كل الكاش المتخزّن ونجبر الـ SW يتحدّث الأول، وبعدين نعمل تحميل قسري حقيقي. */
    try{
      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(keys.map(k=>caches.delete(k)));
      }
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r=>r.unregister()));
      }
    }catch(e){}

  document.querySelectorAll('.delivered-checkbox').forEach(cb=>cb.addEventListener('change',async()=>{
    const id=cb.dataset.id;
    const ord=state.orders.find(x=>x.id===id);
    /* تأكيد قبل تسليم طلب فاكيوم لسه ما اتسكّنش (مفيش موقع تسكين) — بيمنع التسليم بالغلط */
    if(cb.checked&&ord&&ord.processingType==='فاكيوم'&&!(ord.placementLocation||'').trim()){
      cb.checked=false;
      showConfirm(`الطلب ${ord.receiptNo||''} لم يُسكَّن بعد (لا يوجد موقع تسكين). هل تأكدت أنه سُلِّم فعلًا؟`,()=>doDeliverToggle(id,true),'نعم، سُلِّم','رجوع');
      return;
    }
    await doDeliverToggle(id,cb.checked,cb);
  }));
  /* تعليم/إلغاء التسليم — وبعد التعليم بيظهر زر "تراجع" لمدة 10 ثواني يرجّع الطلب لحالته السابقة */
  async function doDeliverToggle(id,checked,cb){
    if(!canManageStatus()){ toast('ليس لديك صلاحية تغيير حالة الطلب','error'); render(); return; }
    const prev=state.orders.find(x=>x.id===id);
    const prevStatus=prev?prev.status:'جاهز للتسليم', prevDate=prev?(prev.statusDate||''):'';
    /* تعطيل الصندوق مؤقتًا مع تلوين خفيف أثناء الحفظ — لو الحفظ فشل بنرجّعه شغّال تاني بنفسنا
       لأن render() (اللي بيرجّعه طبيعي) بيحصل بس لو الحفظ نجح */
    let wrap=null;
    if(cb){ cb.disabled=true; wrap=cb.closest('label'); if(wrap)wrap.style.opacity='.55'; }
    let ok;
    if(checked){
      ok=await updateOrder(id,{status:'تم التسليم',statusDate:nowIso()},null);
      if(ok){
        toastWithAction('تم تحديد الطلب كـ "تم التسليم"','تراجع',async()=>{
          const undone=await updateOrder(id,{status:prevStatus==='تم التسليم'?'جاهز للتسليم':prevStatus,statusDate:prevDate},'تم التراجع عن التسليم');
          if(!undone)toast('تعذّر التراجع — حاول مرة أخرى','error');
        },10000);
      }
    }else{
      ok=await updateOrder(id,{status:'جاهز للتسليم',statusDate:nowIso()},'تم إلغاء "تم التسليم"');
    }
    if(!ok&&cb){ cb.disabled=false; if(wrap)wrap.style.opacity=''; cb.checked=!cb.checked; }
  }
  document.querySelectorAll('.svc-delivered-checkbox').forEach(cb=>cb.addEventListener('change',async()=>{

      await updateServiceOrder(id,{status:'تم التسليم',statusDate:nowIso()},'تم تحديد الخدمة كـ "تم التسليم"');
    }else{
      await updateServiceOrder(id,{status:'',statusDate:''},'تم إلغاء "تم التسليم"');
    }
  }));
  document.querySelectorAll('.notes-input').forEach(ta=>{
    ta.addEventListener('input',()=>{ state.notesDraft=state.notesDraft||{}; state.notesDraft[ta.dataset.id]=ta.value; });
    ta.addEventListener('blur',async()=>{
      const o=state.orders.find(x=>x.id===ta.dataset.id);
      if(o&&o.status==='تم التسليم'){ if(state.notesDraft)delete state.notesDraft[ta.dataset.id]; render(); return; }
      if(o&&(o.processingNotes||'')===ta.value){ if(state.notesDraft)delete state.notesDraft[ta.dataset.id]; return; }
      const ok=await updateOrder(ta.dataset.id,{processingNotes:ta.value},null,{bypassSelfEditWindow:true});
      if(!ok)toast('لم تُحفظ الملاحظة — الإنترنت مقطوع أو توجد مشكلة في الاتصال، حاول مرة أخرى','error',7000);

  document.querySelectorAll('.placement-input').forEach(inp=>{

    });
    inp.addEventListener('blur',async()=>{
      if(!canEditPlacement())return;
      inp.style.outline='';
      const val=inp.value.trim();
      const ord=state.orders.find(x=>x.id===inp.dataset.id);
      /* حماية إضافية: لو الطلب بقى "تم التسليم" (مثلاً موظف تاني علّمه وهي الخانة لسه مفتوحة عندها)،
         نرفض الحفظ ونعيد رسم الصفحة عشان الخانة تتقفل فورًا بدل ما تكتب فوق بيانات طلب مُسلَّم */
      if(ord&&ord.status==='تم التسليم'){ if(state.placementDraft)delete state.placementDraft[inp.dataset.id]; render(); return; }
      const patch={placementLocation:val};
      if(val&&ord&&!(ord.placementLocation||'').trim())patch.placementDate=todayIso();
      const ok=await updateOrder(inp.dataset.id,patch);
      /* لو الحفظ فشل (مشكلة نت) بنسيب اللي كتبه ظاهر في الخانة، ومنمسحوش المسودة — نفس إصلاح
         خانة الكمية المصنعة، عشان موقع التسكين ميختفيش برضه بعد ما يُكتب */
      if(!ok){ toast('لم يُحفظ موقع التسكين — الإنترنت مقطوع أو توجد مشكلة في الاتصال، حاول مرة أخرى','error',7000); return; }
      if(state.placementDraft)delete state.placementDraft[inp.dataset.id];
      if(val&&ord&&!(ord.qtyMfg||'').toString().trim()){

    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); inp.blur(); } });

  /* الكمية المصنعة — تُكتب يدويًا في سجل الطلبات، وأول مرة تُكتب فيها يُسجَّل تاريخ التصنيع تلقائيًا */
  document.querySelectorAll('.qty-mfg-input-multi').forEach(inp=>{
    inp.addEventListener('input',()=>{
      if(!state.qtyMfgDraft)state.qtyMfgDraft={};
      state.qtyMfgDraft[inp.dataset.id+'_'+inp.dataset.itemIdx]=inp.value;
    });
    inp.addEventListener('blur',async()=>{
      const draftKey=inp.dataset.id+'_'+inp.dataset.itemIdx;
      /* لو الحفظ فشل (مشكلة نت مثلًا) لازم نسيب القيمة اللي كتبها الموظف زي ما هي في الخانة
         بدل ما نمسحها من غير ما نأكد إنها اتحفظت فعلًا — ده كان سبب اختفاء الكمية بعد كتابتها
         أكتر من مرة على نفس الطلب مع إن محدش غيره بيعدّل فيه */
      let saveFailed=false;
      try{
        if(!canEditQtyMfg())return;
        const val=inp.value.trim();
        const o=state.orders.find(x=>x.id===inp.dataset.id);
        if(!o){ saveFailed=true; toast('الطلب غير موجود (ربما حُذف أو أُرشف) — الكمية لم تُحفظ','error',6000); return; }
        /* حماية إضافية: لو الطلب بقى "تم التسليم" في الوقت اللي الخانة كانت لسه مفتوحة، نرفض الحفظ
           ونعيد رسم الصفحة عشان الخانة تتقفل — ده اللي كان بيسبب مسح الكمية المصنعة بالغلط بعد التسليم */
        if(o.status==='تم التسليم'){ render(); return; }
        const itemIdx=Number(inp.dataset.itemIdx);
        const isBase=itemIdx===-1;
        const currentVal=isBase?(o.qtyMfg||''):((o.extraItems&&o.extraItems[itemIdx]&&o.extraItems[itemIdx].qtyMfg)||'');
        if(val===String(currentVal))return;
        const patch={};
        if(isBase){
          if(val===''){ patch.qtyMfg=''; patch.qtyMfgClearedAt=todayIso(); }
          else{ patch.qtyMfg=val; patch.mfgDate=todayIso(); patch.qtyMfgClearedAt=''; }
        }else{

    else toast(saveFailMsg('تعذّر حفظ البانر'),'error');
  });
  const rtbBtn=byId('btn-remove-track-banner');
  if(rtbBtn)rtbBtn.addEventListener('click',async()=>{
    const data={imageDataUrl:'',enabled:false};
    const ok=await saveTrackBanner(data);
    if(ok){ state.trackBanner=data; state.pendingTrackBannerDataUrl=null; render(); toast('تم إزالة البانر'); }
    else toast(saveFailMsg('تعذّر إزالة البانر'),'error');

  const swtBtn=byId('btn-save-wa-template');
  if(swtBtn)swtBtn.addEventListener('click',async()=>{
    const val=byId('wa-template-input').value;
    /* لو النص فيه رمز "تالف" (U+FFFD) — غالبًا نتيجة نسخ ولصق من مصدر خارجي حوّل بعض الإيموجي المعقدة
       (زي 🕗 🕑) لرمز مكسور قبل ما يوصل هنا أصلاً — نمنع الحفظ وننبّه المستخدم بدل ما نحفظ نص مكسور
       يظهر بشكل غلط لاحقًا عند إرساله فعليًا على واتساب */

  const srtBtn=byId('btn-save-reminder-template');

  const ssBtn=byId('btn-save-security');

    await mutateConfig(cfg=>({...cfg,emailBackupEnabled:enabled,emailBackupAddress:address,emailjsServiceId:serviceId,emailjsTemplateId:templateId,emailjsPublicKey:publicKey}),'تم حفظ إعدادات الإيميل');

  const wadBtn=byId('btn-wipe-all-data');
