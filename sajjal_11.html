  if(btnReportSendEmail)btnReportSendEmail.addEventListener('click',()=>{

    const data=computeReportData();

    const subject=`تقرير ${data.label} — ${data.rangeLabel}`;

  const btnReportSendDailyReminder=byId('btn-report-daily-reminder-send');
  if(btnReportSendDailyReminder)btnReportSendDailyReminder.addEventListener('click',()=>{

    state.reportsPeriod='daily';

    state.reportsPeriod=prevPeriod;
    const text=reportSummaryText(data,currentConfig());
    window.open(`https://wa.me/966507993971?text=${encodeURIComponent(text)}`,'_blank');
    localStorage.setItem('sajjal-last-daily-report-wa',todayIso());

    render();
  });
}

async function enterApp(user){
  if(!state.loaded){
    byId('login-root').innerHTML=`<div class="login-wrap">${palmLoaderHtml()}</div>`;
    await ensureCoreDataLoaded();
  }
  state.currentUser=user;
  /* كان فيه 3 طلبات ورا بعض قبل أول رسم للشاشة (قراءة آخر دخول — ومفيش حد بيستخدمها — وتسجيل الدخول وقراءة الفلاتر).
     دلوقتي طلب واحد بس (الفلاتر) قبل الرسم، وتسجيل وقت الدخول بيتم في الخلفية */
  Object.assign(state,defaultFilterState());
  const savedFilters=await loadUserFilters(user.id).catch(()=>null);
  setLastLogin();
  try{
    if(savedFilters)Object.assign(state,savedFilters);
    state._lastPersistedFiltersSig=null;
  }catch(e){}
  const visible=visibleNavItems();
  let lastView=null;
  try{ lastView=localStorage.getItem('sajjal-last-view'); }catch(e){}
  state.view=(lastView&&visible.some(v=>v.key===lastView))?lastView:(visible.length?visible[0].key:null);
  byId('login-root').innerHTML='';
  byId('login-root').style.display='none';
  byId('app').style.display='';
  render();
  startIdleLogoutWatcher();
  setTimeout(maybeRunAutoExport,1500);
  if(isAdmin()){ setTimeout(()=>{ clLoad(); },4000); setTimeout(()=>{ logoShrinkIfNeeded(); },9000); }
  startBackupTimeWatcher();
  /* ماعدش فيه تحميل تلقائي لباقي الأرشيف القديم — بس آخر شهر هو اللي بيظهر افتراضيًا للجميع.
     أي بحث برقم السند/الاسم/الجوال في أي صفحة هو اللي بيشغّل تحميل باقي الأرشيف تلقائيًا في الخلفية عند الحاجة فعلًا. */
}

/* ============== boot ============== */
/* ============== صفحة تتبّع الطلب العامة (بدون تسجيل دخول) — الوصول عبر ?track=1 في الرابط
   العميل لازم يدخل رقم السند + رقم الجوال المسجَّل مع الطلب، والاتنين لازم يتطابقو مع بعض عشان يظهرله الطلب ============== */
async function bootTrackPage(){

/* ============== حساب سعر تلقائي من قوائم الأسعار المعتمدة (بدون تدخّل يدوي) — نفس منطق حاسبة الأسعار بالظبط،
   يُستخدم لما محدش يكون عمل حساب يدوي وحفظه للسند ده، فيتحسب تلقائيًا من الجدول لو الحجم متطابق ولو الطلب اتصنّع بالفعل ============== */
function numOnlyStr(s){ const m=String(s||'').match(/[\d.]+/); return m?m[0]:''; }
function tokenizeSizeStr(s){ return String(s||'').split(/[\s\-–—]+/).filter(Boolean).sort().join('|'); }
/* بيستخرج وزن العبوة الواحدة بالكيلو من نص حجم الحبة (مثلاً "عبوة - 390 غ" → 0.39، "سطل - 1.5 ك" → 1.5) */
function parsePackageWeightKg(sizeStr){
  const m=String(sizeStr||'').match(/([\d.]+)\s*(غ|جم|جرام|ك|كجم|kg|g)\b/i);
  if(!m)return null;
  const num=parseFloat(m[1]);
  if(isNaN(num))return null;
  const unit=m[2].toLowerCase();
  return (unit==='غ'||unit==='جم'||unit==='جرام'||unit==='g')?num/1000:num;
}
function matchWeightRowIn(table,pieceSize,cartonSize){
  const psTok=tokenizeSizeStr(pieceSize);
  const csTok=tokenizeSizeStr(cartonSize);
  const csNum=numOnlyStr(cartonSize);
  /* مطابقة عن طريق "مقاس الكرتون" كعدد قطع (زي "4 حبات"/"250 ظرف"/"8 سطول") — الأسلوب المعتمد لجدول الدبس */
  let match=table.find(r=>r.pieces&&tokenizeSizeStr(r.size)===psTok&&tokenizeSizeStr(r.pieces)===csTok);
  if(match)return match;
  match=table.find(r=>tokenizeSizeStr(r.size)===psTok&&String(r.weight)===csNum);
  if(match)return match;
  if(csNum){
    match=table.find(r=>!tokenizeSizeStr(r.size)&&String(r.weight)===csNum);
    if(match)return match;
  }
  /* لو حجم الكرتون اتكتب "عدد الحبات" بدل وزن الكرتون (مثلاً "12 حبة" بدل "4.68 كجم")، نحسب الوزن الضمني
     من (وزن العبوة الواحدة × العدد) ونطابقه مع الجدول */
  const pkgWeightKg=parsePackageWeightKg(pieceSize);
  if(pkgWeightKg&&csNum){
    const impliedWeight=Math.round(pkgWeightKg*Number(csNum)*100)/100;
    match=table.find(r=>tokenizeSizeStr(r.size)===psTok&&Math.abs(Number(r.weight)-impliedWeight)<0.01);
    if(match)return match;
  }
  return null;
}
/* بيحسب سعر الطلب تلقائي لصفحة تتبّع الطلب العامة (لما مفيش سعر يدوي محفوظ للسند ده) — لازم تكون نفس
   الحسبة بالظبط اللي بتحصل في حاسبة الأسعار الداخلية (صفحة "حاسبة الأسعار")، وإلا العميل هيشوف سعر
   مختلف عن اللي شايفه الموظف. قبل الإصلاح، الدالة دي كانت بتحسب السعر الأساسي بس (حسب حجم العبوة/الكرتون)
   وبتتجاهل تمامًا أي خدمة إضافية مرتبطة بالسند (تعقيم/تقعيم/فرشاة/حشو لوز)، فكان بيطلع سعر أقل من الحقيقي
   لأي طلب فيه خدمة إضافية زي ده */
function computeOrderPricingAuto(o){
  if(!o||!(o.qtyMfg||'').toString().trim())return null;
  const isDibs=o.processingType==='دبس';
  const isDough=o.processingType==='عجينة';
  const isVacuum=o.processingType==='فاكيوم';
  if(!isDibs&&!isDough&&!isVacuum)return null;
  const table=isDibs?getDibsWeightTable():isDough?getDoughWeightTable():getVacuumWeightTable();
  const match=matchWeightRowIn(table,o.packageSize,o.cartonSize);
  if(!match)return null;
  const qtyMfg=Number(o.qtyMfg)||0;
  const priceNoTax=isDibs?Number(match.pricePerKilo):Number(match.priceCarton);
  if(!priceNoTax)return null;
  const priceWithTax=priceNoTax*1.15;
  const cartonWeight=isDibs?Number(match.weight):'';
  const totalWeightKg=isDibs?qtyMfg*cartonWeight:'';
  let baseTotal=isDibs?(totalWeightKg*priceWithTax):(qtyMfg*priceWithTax);

  /* أصناف إضافية داخل نفس الطلب (extraItems) — للدبس والعجينة بس، زي ما بتحسبها حاسبة الأسعار بالظبط */
  if((isDibs||isDough)&&o.extraItems&&o.extraItems.length){
    o.extraItems.forEach(it=>{
      const itQty=Number(it.qtyMfg)||0;
      if(!itQty)return;
      const itMatch=matchWeightRowIn(table,it.packageSize,it.cartonSize);
      if(!itMatch)return;
      const itPriceNoTax=isDibs?itMatch.pricePerKilo:itMatch.priceCarton;
      const itPriceWithTax=(Number(itPriceNoTax)||0)*1.15;
      baseTotal+=isDibs?(itQty*(Number(itMatch.weight)||0)*itPriceWithTax):(itQty*itPriceWithTax);
    });
  }

  /* خدمة إضافية مرتبطة (تقعيم/تعقيم/فرشاة/حشو لوز) — إما مسجّلة كسجل مستقل في صفحة الخدمات الإضافية
     بنفس رقم السند، أو مختارة كـ"خدمة فاكيوم" داخل الطلب نفسه — نفس منطق حاسبة الأسعار بالظبط */
  const linkedService=findLinkedServiceOrder(o.receiptNo);
  const vacuumSvcExtra=(o.vacuumServices)?o.vacuumServices.filter(s=>s!=='سحب هواء'):[];
  const extraServiceType=linkedService?(linkedService.serviceType||''):(vacuumSvcExtra[0]||'');
  const extraCartonKg=Number(cartonWeight)||Number(numOnlyStr(o.cartonSize))||0;
  const extraEffect=extraServiceEffect(extraServiceType,extraCartonKg,qtyMfg,extraCartonKg);
  let total=baseTotal;
  if(extraEffect){
    if(extraEffect.mode==='replace')total=extraEffect.amount;
    else if(extraEffect.mode==='add')total=baseTotal+extraEffect.amount;
    else if(extraEffect.mode==='unknown')total=0;
  }
  const finalTotal=extraEffect&&(extraEffect.mode==='replace'||extraEffect.mode==='unknown')
    ?total
    :(total>0?Math.max(total,100):0);
  return {priceNoTax,priceWithTax:Number(priceWithTax.toFixed(2)),total:Number(finalTotal.toFixed(2)),auto:true};
}
function findReceiptPricingFor(o){
  const map=state.receiptPricing||{};
  const norm=s=>(s||'').toString().replace(/\s+/g,'').toLowerCase();
  const rn=(o.receiptNo||'').toString().trim();
  if(!rn)return null;
  if(map[rn])return map[rn];
  const target=norm(rn);
  const key=Object.keys(map).find(k=>norm(k)===target);
  return key?map[key]:null;
}

  const s=(rn||'').toString();

}

async function runSpeedTest(){

  byId('modal-root').innerHTML=`

    const dlStart=performance.now();
    const res=await fetch('https://speed.cloudflare.com/__down?bytes=3000000',{cache:'no-store',mode:'cors'});
    const buf=await res.arrayBuffer();
    const dlSec=Math.max((performance.now()-dlStart)/1000,0.05);
    const mbps=((buf.byteLength*8)/1e6)/dlSec;
    const quality=mbps>15?'⚡ ممتازة':mbps>5?'✅ جيدة':mbps>1?'🟡 متوسطة':'🔴 بطيئة';
    const body=byId('speedtest-body');

      <div style="margin-top:10px;font-size:13px;color:var(--ink-soft);">🏓 زمن الاستجابة: ${ping} ms</div>`;
  }catch(e){
    const body=byId('speedtest-body');
    if(body)body.innerHTML=`<div style="color:var(--danger);font-weight:700;">⚠️ تعذّر قياس السرعة — تأكد من اتصالك بالإنترنت</div>`;

  if(stBtn){ stBtn.textContent='📶'; stBtn.style.pointerEvents=''; }
}
let _lastKnownEtag=null;
async function checkForAppUpdate(){
  if(document.hidden)return; /* التاب مخفي — مفيش داعي نفحص التحديث */
  try{
    /* بنبعت HEAD الأول (بيرجّع العناوين بس، مش محتوى الملف كامل) عشان نشوف لو فيه تغيير أصلًا قبل ما
       ننزّل الملف كله (أكتر من 500 كيلوبايت) كل 5 دقايق لكل جلسة مفتوحة — ده بيوفّر استهلاك بيانات
       كبير على المدى الطويل من غير ما يأثر على دقة الفحص، لأن GitHub Pages بيرجّع ETag/Last-Modified
       بيتغيّر أي وقت الملف يتحدّث فعليًا */
    const headRes=await fetch(window.location.pathname,{method:'HEAD',cache:'no-store'});
    if(headRes.ok){
      const tag=headRes.headers.get('etag')||headRes.headers.get('last-modified');
      if(tag){
        if(_lastKnownEtag&&tag===_lastKnownEtag)return; // مفيش تغيير — منزلش الملف كامل خالص
        _lastKnownEtag=tag;
      }
    }
  }catch(e){ /* لو الـHEAD فشل لأي سبب (متصفح قديم، شبكة...)، نكمّل عادي بالطريقة الأصلية تحت */ }
  try{
    const res=await fetch(window.location.pathname+'?_v='+Date.now(),{cache:'no-store'});
    if(!res.ok)return;
    const html=await res.text();
    const m=html.match(/const\s+APP_VERSION\s*=\s*'([^']+)'/);
    if(m&&m[1]&&m[1]!==APP_VERSION&&!_updateAvailable){
      _updateAvailable=true;
      /* لو فيه نافذة مفتوحة أو المستخدم بيكتب في خانة دلوقتي، منعملش render() فوري عشان منمسحش اللي
         لسه بيكتبه من غير ما يتحفظ — بنكتفي بتنبيه خفيف (toast) مايلمسش أي بيانات، وبانر التحديث
         هيظهر لوحده تلقائيًا أول ما أي render طبيعي يحصل بعد كده (حفظ، تنقل بين صفحات...) */
      const active=document.activeElement;
      const busy=state.modalOpen||(active&&(active.tagName==='INPUT'||active.tagName==='TEXTAREA'));
      if(busy)toast('🔄 يوجد تحديث جديد للنظام — سيظهر تلقائيًا فور انتهاء عملك الحالي');
      else render();
    }
  }catch(e){ /* تجاهل أخطاء الشبكة أثناء الفحص — هنحاول تاني في المرة الجاية */ }
}

  render();
}
let _lastAutoRefreshAt=0;
async function silentAutoRefresh(){
  if(_autoRefreshInFlight)return;
  if(Date.now()-_lastAutoRefreshAt<60000)return; /* حد أدنى دقيقة بين أي تحديثين — التركيز/الرجوع للتاب كان بيطلق تحديث كامل كل مرة */
  _lastAutoRefreshAt=Date.now();
  if(!state.currentUser||state.modalOpen)return;
  if(document.hidden)return;
  if(state._savingCount>0)return; /* في حفظ شغال في الخلفية — التحديث دلوقتي ممكن يرجّع القيمة قبل ما تتأكد */
  if(!navigator.onLine){ setConnectionQuality('offline'); return; }
  /* لو المستخدم دلوقتي بيكتب في أي خانة (ملاحظات، مكان تسكين، بحث...)، نأجّل التحديث الصامت للدورة
     الجاية — عشان التحديث (اللي بيعيد بناء الصفحة كاملة) ما يمسحش اللي لسه بيكتبه ولسه ما اتحفظش */
  const active=document.activeElement;
  if(active&&(active.tagName==='INPUT'||active.tagName==='TEXTAREA'))return;
  _autoRefreshInFlight=true;
  const startedAt=performance.now();
  try{
    await fullRefresh();
    const elapsed=performance.now()-startedAt;
    _failStreak=0;
    /* بنطلب 3 قراءات بطيئة متتالية (مش قراءة أو اتنين بس) قبل ما نظهر تنبيه — عشان نتجنب تنبيهات خاطئة
       بسبب تأخير عابر في السيرفر (مش بالضرورة نت المستخدم بطيء فعلاً)، خصوصًا إن سرعة النت المحلية
       للمستخدم مش هي العامل الوحيد اللي بيأثر على مدة العملية دي */
    if(elapsed>SLOW_CONNECTION_MS){ _slowStreak++; if(_slowStreak>=3)setConnectionQuality('slow'); }
    else{ _slowStreak=0; setConnectionQuality('good'); }
    /* لازم نتأكد تاني هنا (مش بس في بداية الدالة) إن المستخدم مش بيكتب دلوقتي — لأن fullRefresh() ده
       عملية شبكة بتاخد ثانية أو اتنين، والمستخدم ممكن يكون بدأ يكتب في خانة (زي الملاحظات) في نفس اللحظة
       اللي التحديث كان شغّال فيها، فلازم نتحقق من الحالة الحالية فورًا قبل render() مباشرة، مش الحالة
       اللي كانت وقت ما التحديث بدأ */
    const activeNow=document.activeElement;
    const busyNow=state.modalOpen||(activeNow&&(activeNow.tagName==='INPUT'||activeNow.tagName==='TEXTAREA'));
    if(!busyNow)render();
  }catch(e){
    /* تجاهل أخطاء الشبكة أثناء المزامنة الصامتة — هنحاول تاني في المرة الجاية، بس لو تكررت الأخطاء
       نظهر تنبيه ضعف اتصال بدل ما نسيب المستخدم من غير أي إشارة إن فيه مشكلة */
    _failStreak++; if(_failStreak>=2)setConnectionQuality('slow');
  }
  _autoRefreshInFlight=false;
}
setInterval(silentAutoRefresh,300*1000);
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){ checkForAppUpdate(); silentAutoRefresh(); }
});
window.addEventListener('focus',()=>{ silentAutoRefresh(); });
/* تسجيل Service Worker — لتفعيل التثبيت كتطبيق (PWA) */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
/* اختصارات لوحة المفاتيح: F2 لفتح شاشة "تسجيل طلب جديد"، / أو Ctrl+K للبحث الفوري، ؟ لعرض قائمة الاختصارات، ESC لإغلاق أي نافذة (مودال) مفتوحة */
document.addEventListener('keydown',(e)=>{
  const typingInField=['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.isContentEditable;
  if(e.key==='F2'){
    if(state.modalOpen||!state.currentUser||!canAddOrders())return;
    e.preventDefault();
    openOrderModal();
  }else if(!typingInField&&(e.key==='/'||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'))){
    if(state.modalOpen||!state.currentUser)return;
    e.preventDefault();
    if(state.view!=='registry'){ state.view='registry'; render(); }
    const si=byId('registry-search-input');
    if(si){ si.focus(); si.select(); }
  }else if(!typingInField&&e.key==='?'){
    if(state.modalOpen||!state.currentUser)return;
    e.preventDefault();
    openShortcutsModal();
  }else if(e.key==='Escape'){
    if(document.getElementById('col-filter-dropdown')){ closeColumnFilterDropdown(); return; }
    if(!state.modalOpen)return;
    e.preventDefault();
    byId('modal-root').innerHTML='';
    state.modalOpen=false;
  }
});
document.addEventListener('click',()=>{ closeColumnFilterDropdown(); });
if(new URLSearchParams(window.location.search).get('track')==='1'){ bootTrackPage(); } else { boot(); }
</script>
