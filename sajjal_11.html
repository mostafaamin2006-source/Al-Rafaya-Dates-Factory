/* auto receipt number — prefix by processing type: V0001 فاكيوم، M0001 دبس، P0001 عجينة/تعقيم (نفس التسلسل) */
const RECEIPT_PREFIX={'فاكيوم':'V','دبس':'M','عجينة':'P','تعقيم':'P'};
/* أنواع التصنيع اللي بتشارك نفس حرف رقم السند وتسلسل الترقيم — التعقيم مش تصنيع مستقل فعليًا (بدون تعبئة)،
   فبياخد حرف العجينة (P) وترقيمه، ويكمل من آخر رقم اتسجل في أي منهم مهما كان النوع */
const RECEIPT_SEQUENCE_GROUP={'عجينة':['عجينة','تعقيم'],'تعقيم':['عجينة','تعقيم']};
function nextReceiptNo(processingType){
  const prefix=RECEIPT_PREFIX[processingType]||'';
  const family=RECEIPT_SEQUENCE_GROUP[processingType]||[processingType];
  const matching=state.orders.filter(o=>family.includes(o.processingType));
  if(!matching.length)return prefix+'0001';
  /* بنكمل من آخر سند اتسجل أو اتعدّل فعليًا (بناءً على lastEditedAt، وهو موجود دايمًا حتى عند أول تسجيل)
     — مش من أعلى رقم اتسجل في تاريخ المصنع كله. لو حد غيّر رقم سند يدويًا لرقم أصغر عن قصد (مثلاً كان
     V6329 وغيّره لـV0001)، ده بيبقى "نقطة بداية جديدة" مقصودة، والسند اللي بعده لازم يكمل من بعده هو
     (V0002) مش يرجع يقفز لأعلى رقم قديم كان موجود قبل كده */
  const latest=matching.reduce((a,b)=>{
    const ta=a.lastEditedAt?new Date(a.lastEditedAt).getTime():(a.createdAt||0);
    const tb=b.lastEditedAt?new Date(b.lastEditedAt).getTime():(b.createdAt||0);
    return tb>ta?b:a;
  });
  const m=(latest.receiptNo||'').match(/(\d+)\s*$/);
  const lastNum=m?parseInt(m[1],10):0;
  return prefix+String(lastNum+1).padStart(4,'0');
}

let _lastSbError=null;

function connDiag(e){

async function fetchRetry(url,opts,tries=2){
  let last;
  for(let i=0;i<tries;i++){
    try{
      const r=await fetch(url,opts);
      if(r.ok||(r.status<500&&r.status!==429))return r;
      last=r; sbDiag('fetch',`HTTP ${r.status}`);
    }catch(e){ last=e; sbDiag('fetch',e&&e.message||'network'); }
    if(i<tries-1)await new Promise(res=>setTimeout(res,700));
  }
  if(last instanceof Error)throw last;
  return last;
}

/* ==============================================================================================
   حماية من تعارض الكتابة بين جهازين (Optimistic Concurrency): كل "اقرأ الشهر ← عدّل ← احفظ" كان فيه
   فجوة صغيرة (أجزاء من الثانية) لو موظفين حفظوا في نفس اللحظة، اللي يحفظ تاني كان بيمسح تعديل الأول.
   دلوقتي القراءة بتفتكر نسخة الشهر ووقت آخر تحديث لها، والحفظ بيتم بشرط إن الشهر ما اتغيّرش من وقتها؛
   لو اتغيّر بنقرأ النسخة الجديدة وندمج تعديلاتنا بس (حقل بحقل) فوق تعديلات الغير، ونحاول تاني.
   لو الشرط نفسه مش شغال على القاعدة (نادر) بنوقف الحماية ونرجع للحفظ العادي — مفيش حالة بتعطّل الحفظ ============== */
const _occBase={};
let _occDisabled=false;
function occRemember(key,rawValue,ts){ if(rawValue!=null&&ts)_occBase[key]={json:rawValue,ts,at:Date.now()}; else delete _occBase[key]; }
let _lastSetIfTs=null;
const OCC_CACHE_MAX_MS=600000;
function occFresh(key){ const b=_occBase[key]; return (!_occDisabled&&b&&b.at&&Date.now()-b.at<OCC_CACHE_MAX_MS)?b:null; }
async function sbSetIf(key,value,expectedTs){
  const newTs=new Date().toISOString();

      body:JSON.stringify({value,updated_at:newTs}),
      cache:'no-store',
    });
    if(!r.ok){ sbDiag('save-if',`HTTP ${r.status}`); return 'http'; }
    const d=await r.json();
    if(Array.isArray(d)&&d.length){ _lastSetIfTs=d[0].updated_at||null; return 'ok'; }
    return 'conflict';
  }catch(e){ sbDiag('save-if',e&&e.message||'network'); return 'error'; }
}

/* دمج ثلاثي بالـid: base = اللي قريناه، ours = اللي عايزين نحفظه، cur = اللي على السيرفر دلوقتي */
function mergeOrderLists(base,ours,cur){
  const j=v=>JSON.stringify(v===undefined?null:v);
  const bMap=new Map(base.map(o=>[o.id,o])), oMap=new Map(ours.map(o=>[o.id,o]));
  const result=cur.filter(c=>!(bMap.has(c.id)&&!oMap.has(c.id))).map(c=>({...c}));
  const cMap=new Map(result.map(c=>[c.id,c]));
  ours.forEach(o=>{
    const b=bMap.get(o.id), c=cMap.get(o.id);
    if(!b){ if(!c)result.push(o); return; }
    if(!c)return;
    new Set([...Object.keys(o),...Object.keys(b)]).forEach(k=>{
      if(j(o[k])!==j(b[k])){ if(o[k]===undefined)delete c[k]; else c[k]=o[k]; }
    });
  });
  return result;
}
async function saveListGuarded(key,list){
  let base=_occBase[key]; delete _occBase[key];
  if(_occDisabled||!base)return await storageSetRetry(key,JSON.stringify(list),true);
  let cur=list;
  for(let attempt=0;attempt<5;attempt++){
    let res='error';
    for(let i=0;i<=3;i++){
      res=await sbSetIf(key,JSON.stringify(cur),base.ts);
      if(res==='http'){ _occDisabled=true; console.warn('OCC disabled: conditional write rejected'); return await storageSetRetry(key,JSON.stringify(cur),true); }
      if(res!=='error')break;
      await new Promise(r=>setTimeout(r,500*(i+1)));
    }
    if(res==='ok'){ if(_lastSetIfTs)_occBase[key]={json:JSON.stringify(cur),ts:_lastSetIfTs,at:Date.now()}; return true; }
    if(res==='error')return false;
    const row=await sbGetRow(key);
    if(row===undefined)return false;
    if(row===null)return await storageSetRetry(key,JSON.stringify(cur),true);
    if(row.ts===base.ts){ _occDisabled=true; console.warn('OCC disabled: timestamp compare unreliable'); return await storageSetRetry(key,JSON.stringify(cur),true); }
    let baseList,curList;
    try{ baseList=JSON.parse(base.json||'[]'); curList=JSON.parse(row.value||'[]'); }catch(e){ return false; }
    cur=mergeOrderLists(baseList,cur,curList);
    base={json:row.value,ts:row.ts};
  }
  return false;
}

/* بترصد أي تغيير في الفلاتر المذكورة فوق بعد كل render، وتحفظه (بعد تهدئة بسيطة) لنفس المستخدم بس */
function scheduleSaveUserFilters(){
  if(!state.currentUser||!state.currentUser.id)return;
  const snapshot={};
  PERSISTED_FILTER_KEYS.forEach(k=>{ if(state[k]!==undefined)snapshot[k]=state[k]; });
  const sig=JSON.stringify(snapshot);
  if(sig===state._lastPersistedFiltersSig)return;
  state._lastPersistedFiltersSig=sig;
  clearTimeout(state._persistFiltersTimer);
  const uid=state.currentUser.id;
  state._persistFiltersTimer=setTimeout(()=>{ sbSet('user-filters:'+uid,sig); },900);
}

/* تفضيل "إبقاء البرنامج مفتوح" ومدة الخمول المخصّصة — بيتحفظوا على الجهاز نفسه (تفضيل شخصي)
   لو "إبقاء البرنامج مفتوح" مفعّل، مفيش تسجيل خروج تلقائي خالص. لو مش مفعّل، بيتسجّل الخروج تلقائيًا
   بعد عدد الدقائق المكتوب (بدل الـ15 دقيقة الثابتة قديمًا) */
function keepAppOpenPref(){ try{ return localStorage.getItem('sajjal-keep-open')==='1'; }catch(e){ return false; } }
function setKeepAppOpenPref(v){ try{ localStorage.setItem('sajjal-keep-open',v?'1':'0'); }catch(e){} }
function idleMinutesPref(){ try{ const v=parseInt(localStorage.getItem('sajjal-idle-minutes'),10); return (v>0)?v:15; }catch(e){ return 15; } }
function setIdleMinutesPref(v){ try{ localStorage.setItem('sajjal-idle-minutes',String(Math.max(1,parseInt(v,10)||15))); }catch(e){} }
/* تسجيل خروج موحّد — تستخدمه أزرار تسجيل الخروج، وكمان تسجيل الخروج التلقائي بسبب عدم النشاط */
async function performLogout(){
  clearTimeout(state._idleLogoutTimer);
  state.currentUser=null; state.view=null;
  renderLoginGate(); byId('app').style.display='none'; byId('login-root').style.display='';
}
/* تسجيل خروج تلقائي بعد مدة خمول (افتراضيًا 15 دقيقة، أو حسب تفضيل الموظف) بدون أي نشاط
   (ماوس/كيبورد/لمس/سكرول) — بيتصفّر المؤقت مع أي نشاط جديد، وبيتعطّل خالص لو "إبقاء البرنامج مفتوح" مفعّل */
function resetIdleLogoutTimer(){
  if(!state.currentUser)return;
  clearTimeout(state._idleLogoutTimer);
  if(keepAppOpenPref())return;
  const minutes=idleMinutesPref();
  state._idleLogoutTimer=setTimeout(async()=>{
    if(!state.currentUser)return;
    toast(`تم تسجيل الخروج تلقائيًا بعد ${minutes} دقيقة بدون نشاط`,'error',5000);
    await performLogout();
  },minutes*60*1000);
}
function startIdleLogoutWatcher(){
  if(state._idleWatcherStarted)return;
  state._idleWatcherStarted=true;
  ['mousemove','mousedown','keydown','touchstart','scroll','click'].forEach(evt=>{
    document.addEventListener(evt,resetIdleLogoutTimer,{passive:true});
  });
  resetIdleLogoutTimer();
}

function toast(msg,type='ok',duration=2600){
  const root=byId('toast-root');
  const el=document.createElement('div');
  el.className='toast'+(type==='error'?' error':'');
  el.textContent=msg;

}
/* رسالة فشل الحفظ — توضّح بشكل صريح إن السبب هو انقطاع النت لو الجهاز أوفلاين فعلًا،
   وإلا بترجع رسالة الخطأ الأصلية (لأسباب تانية غير انقطاع الاتصال) */
function saveFailMsg(fallback){
  if(!navigator.onLine)return 'لا يمكن الحفظ بدون الاتصال بالإنترنت';
  const d=_lastSbError&&(Date.now()-_lastSbError.at<30000)?` [${_lastSbError.detail}]`:'';
  return fallback+d;
}
/* توست فيه زرار إجراء (تُستخدم في "تراجع" بعد الحذف) */
/* بيغيّر شكل الزرار وهو بينفّذ عملية غير متزامنة (زي تسجيل الدخول) عشان يبان إنه شغال ومش متجمّد —
   بيتفعّل بمجرد الضغط (زرار أو Enter)، وبيرجع لشكله الطبيعي دايمًا في النهاية حتى لو حصل خطأ */
function setBtnLoading(btn,loading,loadingText='⏳ جارٍ التحقق...'){
  if(!btn)return;
  if(loading){
    if(btn.dataset.origText==null)btn.dataset.origText=btn.textContent;
    btn.textContent=loadingText;
    btn.classList.add('btn-loading');
    btn.disabled=true;
  }else{
    if(btn.dataset.origText!=null)btn.textContent=btn.dataset.origText;
    btn.classList.remove('btn-loading');
    btn.disabled=false;
  }
}
function toastWithAction(msg,actionLabel,onAction,duration=8000,icon){
  const root=byId('toast-root');
  const el=document.createElement('div');
  el.className='toast toast-action';
  el.innerHTML=`<span>${escapeHtml(msg)}</span><button type="button" class="toast-action-btn">${icon||'↩️'} ${escapeHtml(actionLabel)}</button>`;
  root.appendChild(el);
  let done=false;
  el.querySelector('.toast-action-btn').addEventListener('click',()=>{
    if(done)return; done=true; el.style.opacity='0'; setTimeout(()=>el.remove(),200); onAction();
  });
  setTimeout(()=>{ if(done)return; el.style.opacity='0'; setTimeout(()=>el.remove(),200); },duration);
}

async function loadConfig(opts){
  try{
    const r=await sbGet('app-config');
    const cfg=(r&&r.value)?JSON.parse(r.value):null;
    if(!cfg)return null;
    /* الشعار (لوجو) محفوظ في مفتاح منفصل عشان تعديل أي إعداد تاني (رمز دخول، نص رسالة...) ما يبقاش محتاج
       يرفع صورة اللوجو كاملة تاني كل مرة — ده كان سبب بطء الحفظ في صفحة الإعدادات */
    /* فتح التطبيق: ما نستناش صورة الشعار (حجمها حوالي 3 ميجا) — شاشة الدخول تظهر فورًا والشعار يتحمّل في الخلفية */
    if(opts&&opts.skipLogo){ loadLogoBackground(); return cfg; }
    if(opts&&opts.reuseLogo&&state.config&&state.config.logoDataUrl){ cfg.logoDataUrl=state.config.logoDataUrl; return cfg; } /* توفير egress: الشعار (صورة كبيرة) ما بنحمّلوش تاني في كل تحديث دوري */
    try{
      const lg=await sbGet('app-logo');
      if(lg&&lg.value)cfg.logoDataUrl=lg.value;
      else if(cfg.logoDataUrl){ saveLogo(cfg.logoDataUrl); } /* ترحيل الشعار القديم المدمج في الإعدادات لمفتاحه الجديد في الخلفية، بدون ما يعطّل التحميل */
    }catch(e){}
    return cfg;
  }catch(e){}
  return null;
}
async function loadConfigStrict(){
  const v=await sbGetStrict('app-config');
  if(!v)return null;
  const cfg=JSON.parse(v);
  if(state.config&&state.config.logoDataUrl){ cfg.logoDataUrl=state.config.logoDataUrl; return cfg; }
  loadLogoBackground(); /* الدخول ما يستناش الشعار */
  return cfg;
}
/* تصغير الشعار تلقائيًا (مرة واحدة، للأدمن): لو أكبر من ~400 ك بنصغّره لأقصى بُعد 320px ونحفظه مكان القديم،
   بعد ما نحتفظ بنسخة الأصل في مفتاح منفصل (app-logo-original) ما بيتحمّلش وقت الفتح. بيوفّر ثواني من كل فتح وEgress كبير */
function logoLoadImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }
async function logoShrinkIfNeeded(){
  if(!isAdmin())return;
  try{
    if(!(state.config&&state.config.logoDataUrl))await loadLogoBackground();
    const src=state.config&&state.config.logoDataUrl;
    if(!src||src.length<400000)return;
    const im=await logoLoadImg(src);
    const sc=Math.min(1,320/Math.max(im.naturalWidth,im.naturalHeight));
    const w=Math.max(1,Math.round(im.naturalWidth*sc)), h=Math.max(1,Math.round(im.naturalHeight*sc));
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    const cx=cv.getContext('2d'); cx.imageSmoothingQuality='high'; cx.drawImage(im,0,0,w,h);
    const out=cv.toDataURL('image/png');
    if(!out||out.length>=src.length*0.5)return;
    if(!(await storageSetRetry('app-logo-original',src,true)))return;
    if(await saveLogo(out)){ state.config.logoDataUrl=out; toast('تم تصغير الشعار لتسريع فتح التطبيق ✔'); }
  }catch(e){}
}
let _logoBgP=null;

  if(_logoBgP)return _logoBgP;
  _logoBgP=(async()=>{
    try{
      const lg=await sbGet('app-logo');
      if(state.config){
        if(lg&&lg.value)state.config.logoDataUrl=lg.value;

        if(state.currentUser){ if(!typing&&!state.modalOpen&&!byId('modal-root').innerHTML)render(); }
        else if(!typing&&typeof renderLoginGate==='function'&&byId('login-root')&&byId('login-root').querySelector('.login-wrap'))renderLoginGate();

  })();
  return _logoBgP;
}

const FIELD_LABELS={
  status:'الحالة',customerName:'اسم العميل',mobile:'الجوال',dateType:'نوع التمر',
  dateTypes:'أنواع التمر',qtyCartons:'الكمية المستلمة',processingType:'نوع التصنيع',
  packageSize:'حجم العبوة',cartonSize:'حجم الكرتون',urgent:'الأولوية',
  processingNotes:'ملاحظات التصنيع',placementLocation:'موقع التسكين',
  vacuumServices:'الخدمات الإضافية',date:'التاريخ',receiptNo:'رقم السند',
  dateCondition:'حالة التمر',qtyMfg:'الكمية المصنعة',mfgDate:'تاريخ التصنيع',
  serviceType:'نوع الخدمة',qtyReceived:'الكمية المستلمة',notes:'ملاحظات',wasteQty:'الفاقد',
};
function describeChanges(oldObj,newPatch){
  const parts=[];
  for(const [k,nv] of Object.entries(newPatch)){
    if(['lastEditedBy','lastEditedAt','createdAt','id','monthKey','customerCalls'].includes(k))continue;
    const label=FIELD_LABELS[k]||k;
    const ov=oldObj?oldObj[k]:undefined;
    const ovStr=Array.isArray(ov)?ov.join('،'):(ov!=null?String(ov):'—');
    const nvStr=Array.isArray(nv)?nv.join('،'):(nv!=null?String(nv):'—');
    if(ovStr!==nvStr&&nvStr&&nvStr!=='—')parts.push(`${label}: ${ovStr!=='—'?`"${ovStr}" → `:''}"${nvStr}"`);
  }
  return parts.length?parts.join(' | '):'';
}
/* سجل العمليات: بنكتب نسخة الجهاز (من غير قراءة السجل من السيرفر في كل حركة — توفيرًا لل egress). ولو تحميل السجل

/* ============== دمج عميل مكرر (نفس الشخص برقم جوال تاني) في عميل أساسي ==============
   1) كل الطلبات القديمة المسجَّلة برقم العميل الثانوي بتتحوّل لرقم جوال العميل الأساسي، والاسم
      بيتوحّد على الاسم اللي اخترتيه — عشان الطلبات كلها تتجمّع تحت عميل واحد من دلوقتي فصاعدًا.
   2) بيانات التسعير والملاحظة الخاصة بالعميلين بتتدمج في سجل واحد (بيانات العميل الأساسي لها الأولوية،
      وأي حقل فاضي عنده بياخده من الثانوي)، وسجل العميل الثانوي بيتشال.
   الدالة دي بتستخدم نفس أسلوب القراءة الآمنة (loadMonthOrThrow) قبل أي حفظ، عشان محدش يكرر نفس مشكلة
   فقدان البيانات اللي حصلت قبل كده */
async function mergeCustomers(primaryKey,secondaryKey,canonicalName){
  const dir=buildCustomerDirectory();
  const primary=dir.find(c=>c.key===primaryKey);
  const secondary=dir.find(c=>c.key===secondaryKey);
  if(!primary||!secondary){ toast('تعذّر العثور على أحد العميلين','error'); return false; }
  if(!primary.mobile){ toast('يجب أن يكون للعميل الأساسي رقم جوال مسجَّل لإتمام الدمج','error'); return false; }

  const byMonth={};
  secondary.orders.forEach(o=>{ (byMonth[o.monthKey]=byMonth[o.monthKey]||[]).push(o.id); });
  let allOk=true,movedCount=0;
  for(const mk of Object.keys(byMonth)){
    const idSet=new Set(byMonth[mk]);
    try{
      const fresh=await loadMonthOrThrow(mk);
      const patch={mobile:primary.mobile,customerName:canonicalName,lastEditedBy:currentUserName(),lastEditedAt:nowIso()};
      const updated=fresh.map(o=>idSet.has(o.id)?{...o,...patch}:o);
      const ok=await saveMonth(mk,updated);
      if(ok){
        state.orders=state.orders.map(o=>idSet.has(o.id)?{...o,...patch}:o);
        movedCount+=idSet.size;
      }else allOk=false;
    }catch(e){ allOk=false; }
  }

  try{
    const freshPricing=await loadMapStrict('customer-pricing');
    const mergedPricing={...(freshPricing[secondaryKey]||{}),...(freshPricing[primaryKey]||{})};
    mergedPricing.sysName=canonicalName;
    delete freshPricing[secondaryKey];
    freshPricing[primaryKey]=mergedPricing;
    if(await saveCustomerPricingMap(freshPricing))state.customerPricing=freshPricing;

    const freshNotes=await loadMapStrict('customer-notes');
    const noteA=(freshNotes[primaryKey]||'').trim(), noteB=(freshNotes[secondaryKey]||'').trim();
    const mergedNote=noteA&&noteB&&noteA!==noteB?`${noteA}\n${noteB}`:(noteA||noteB);
    delete freshNotes[secondaryKey];
    if(mergedNote)freshNotes[primaryKey]=mergedNote;
    if(await saveCustomerNotes(freshNotes))state.customerNotes=freshNotes;
  }catch(e){ allOk=false; }

  addAudit(`دمج عميل "${secondary.name}" (${secondary.mobile||'بدون جوال'}) في "${canonicalName}" (${primary.mobile}) — ${movedCount} طلب`);
  render();
  toast(allOk?`✅ تم الدمج — ${movedCount} طلب انتقل للعميل الموحّد`:'تم الدمج جزئيًا — حدث خطأ في بعض الطلبات','ok',5000);
  return allOk;
}

/* لسه محتاجين الكائن ده — مش للتخزين المؤقت وقت القراءة الحرجة (اتشال فوق لحل مشكلة التعارض بين
   الموظفين)، بس لحماية fullRefresh() من نسخة قديمة متأخرة توصل بعد حفظ محلي أحدث — دي حماية ضد تعارض
   مختلف تمامًا (تحديث الخلفية الدوري نفسه، مش تعارض بين موظفين) */
const _svcMonthFreshCache={};
function serviceMonthKeyOf(so){
  return (so.date||'').slice(0,7)||new Date(so.createdAt||Date.now()).toISOString().slice(0,7);
}
/* ترقية آمنة تلقائية لمرة واحدة: لو لقى الفهرس الشهري فاضي والنسخة القديمة (ملف واحد) فيها بيانات،
   يقسمها على شهور ويحفظها بالنظام الجديد. النسخة القديمة بتفضل موجودة زي ما هي (مش بتتمسح) كنسخة أمان احتياطية،
   وبكده مفيش أي احتمال ضياع بيانات حتى لو حصل أي خطأ أثناء الترقية. */
async function migrateServiceOrdersIfNeeded(){
  /* بعد أول مرة نتأكد فيها إن الفهرس الشهري موجود، بنتذكّر ده على الجهاز ونتخطى الفحص ده خالص (طلب شبكة زيادة في كل فتحة) */
  try{ if(localStorage.getItem('svc-migration-done')==='1')return; }catch(e){}
  try{
    const idx=await loadServiceIndexOrThrow();
    if(idx.length){ try{ localStorage.setItem('svc-migration-done','1'); }catch(e){} return; }
    const legacy=await sbGet('service-orders');
    if(!legacy||!legacy.value)return;
    const list=JSON.parse(legacy.value);
    if(!Array.isArray(list)||!list.length)return;
    const byMonth={};
    list.forEach(so=>{
      const mk=so.monthKey||serviceMonthKeyOf(so);
      (byMonth[mk]=byMonth[mk]||[]).push({...so,monthKey:mk});
    });
    const months=Object.keys(byMonth).sort();
    /* أمان: لو الشهر ده فيه بيانات فعلاً (أحدث من النسخة القديمة)، ما نكتبش فوقه أبدًا، ولو القراءة فشلت نوقف */
    for(const m of months){
      const existing=await loadServiceMonthOrThrow(m);
      if(existing.length)continue;
      if(!(await saveServiceMonth(m,byMonth[m])))return;
    }
    await saveServiceIndex(months);
  }catch(e){ console.warn('service orders migration skipped (connection issue) — will retry next load',e); }
}
async function loadAllServiceOrders(){
  await migrateServiceOrdersIfNeeded();
  const idx=await loadServiceIndex(); state.serviceMonthIndex=idx;
  if(!idx.length)return [];
  const lists=await Promise.all(idx.map(m=>loadServiceMonth(m)));
  return lists.flat();
}
const FAST_BOOT_SERVICE_MONTHS=1;
async function loadRecentServiceOrders(){
  await migrateServiceOrdersIfNeeded();
  const idx=await loadServiceIndex(); state.serviceMonthIndex=idx;
  if(!idx.length){ state._loadedServiceMonths=new Set(); return []; }
  const recent=[...idx].sort().slice(-FAST_BOOT_SERVICE_MONTHS);
  const lists=await Promise.all(recent.map(m=>loadServiceMonthOrNull(m)));
  state._loadedServiceMonths=new Set(recent.filter((m,i)=>lists[i]!==null));
  return lists.filter(Boolean).flat();
}
async function loadRemainingServiceOrdersInBackground(){
  const idx=state.serviceMonthIndex||[];
  const loaded=state._loadedServiceMonths||new Set();
  const remaining=idx.filter(m=>!loaded.has(m));
  if(!remaining.length){ state.allServiceHistoryLoaded=true; return; }
  state.allServiceHistoryLoaded=false;
  let allGood=true;
  try{
    const lists=await Promise.all(remaining.map(m=>loadServiceMonthOrNull(m)));
    const extra=[];
    remaining.forEach((m,i)=>{ if(lists[i]===null){ allGood=false; return; } extra.push(...lists[i]); loaded.add(m); });
    state.serviceOrders=[...state.serviceOrders,...extra];
    state._loadedServiceMonths=loaded;
  }catch(e){ allGood=false; }
  state.allServiceHistoryLoaded=allGood;
  if(!allGood)_fullHistoryLoadTriggered=false;
  render();
}
async function ensureServiceMonthIndexed(monthKey){
  if((state.serviceMonthIndex||[]).includes(monthKey))return;
  let idx=await loadServiceIndexOrThrow();
  if(!idx.includes(monthKey)){
    idx=[...idx,monthKey].sort();
    if(!(await saveServiceIndex(idx)))throw new Error('تعذّر حفظ فهرس أشهر الخدمات');
  }
  state.serviceMonthIndex=[...new Set([...(state.serviceMonthIndex||[]),...idx])].sort();
}

/* ==============================================================================================

/* ===== استكمال الحفظ بعد رجوع الإنترنت =====
   لو الاتصال فصل أثناء الحفظ، العملية بتفضل في الطابور (والتعديل ظاهر على الشاشة) وبتتعاد تلقائيًا أول ما الاتصال يرجع،
   والعمليات اللي بعدها بتستنى دورها بنفس الترتيب. */
function isConnectivityFailure(e){
  if(!navigator.onLine)return true;
  if(_lastSbError&&Date.now()-_lastSbError.at<30000)return true;
  const m=(e&&e.message)||'';
  return !!(e&&(e.name==='TypeError'||/fetch|network|HTTP\s*5\d\d/i.test(m)));

async function waitForConnection(maxMs){
  const t0=Date.now(); let delay=2000, waited=false;
  try{
    for(;;){
      if(navigator.onLine){
        try{
          const r=await fetch(`${SB_URL}/rest/v1/sajjal_store?select=key&limit=1`,{headers:SB_HDR,cache:'no-store'});
          if(r.status<500)return waited;
        }catch(e){}
      }
      if(Date.now()-t0>maxMs)return waited;
      if(!waited){ waited=true; _waitingConn=true; pendingSavesChange(0); }
      await new Promise(res=>{ let done=false; const f=()=>{ if(done)return; done=true; window.removeEventListener('online',f); res(); }; window.addEventListener('online',f); setTimeout(f,delay); });
      delay=Math.min(Math.round(delay*1.5),15000);
    }
  } finally{ if(waited){ _waitingConn=false; pendingSavesChange(0); } }
}
const _inflightPatches=new Map(); /* uid -> {id,patch}: تعديلات ظاهرة على الشاشة ولسه ما اتأكدتش على السيرفر */

/* ===== حفظ العمليات المعلّقة على الجهاز: لو الصفحة اتقفلت أو النت فصل قبل ما التعديل يوصل السيرفر، بنكمّله تلقائي أول ما تفتح تاني ===== */
const PENDING_OPS_KEY='sajjal-pending-ops';
const PENDING_OPS_MAX_AGE_MS=6*3600*1000;
function pendingOpsRead(){ try{ const a=JSON.parse(localStorage.getItem(PENDING_OPS_KEY)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function pendingOpsWrite(a){ try{ if(a.length)localStorage.setItem(PENDING_OPS_KEY,JSON.stringify(a)); else localStorage.removeItem(PENDING_OPS_KEY); }catch(e){} }
function pendingOpAdd(op){ const a=pendingOpsRead(); a.push(op); pendingOpsWrite(a); }
function pendingOpRemove(uid){ pendingOpsWrite(pendingOpsRead().filter(x=>x.uid!==uid)); }
let _replayTries=0, _replayDone=false;
const _liveOpUids=new Set(); /* عمليات التاب ده نفسه — مش بتتعاد */
async function replayPendingOps(){
  if(_replayDone||!state.currentUser)return;
  _replayTries++;
  const me=currentUserName();
  const all=pendingOpsRead();
  const fresh=all.filter(x=>Date.now()-x.ts<PENDING_OPS_MAX_AGE_MS);
  if(fresh.length!==all.length)pendingOpsWrite(fresh);
  const cand=fresh.filter(x=>x.user===me&&!_liveOpUids.has(x.uid));
  const mine=cand.filter(x=>Date.now()-x.ts>=15000); /* أحدث من 15 ثانية ممكن تكون لسه شغالة في تاب تاني */
  if(!mine.length){ if(!cand.length)_replayDone=true; return; }
  if(!state.orders.length&&_replayTries<20)return; /* لسه الطلبات ما اتحمّلتش */
  _replayDone=true;
  let n=0, lost=0;
  for(const op of mine){
    if(!state.orders.some(o=>o.id===op.id)){ pendingOpRemove(op.uid); lost++; continue; }
    const ok=await updateOrder(op.id,op.patch,null,{...(op.bypass?{bypassSelfEditWindow:true}:{}),_persistUid:op.uid});
    if(ok)n++; else lost++;
  }
  if(n)toast(`✅ تم استكمال ${n} عملية كانت معلّقة من المرة السابقة`,'ok',6000);
  if(lost)toast(`⚠️ ${lost} عملية معلّقة لم تكتمل — راجع الطلبات المعنية`,'error',8000);
}
const _replayTimer=setInterval(()=>{ if(_replayDone){ clearInterval(_replayTimer); return; } replayPendingOps().catch(()=>{}); },3000);
async function updateOrder(id,patch,msg,opts){
  /* حفظ فوري على الشاشة: التعديل يظهر في نفس اللحظة، والحفظ على السيرفر يكمل في الخلفية؛ لو فشل بنرجّع القيمة القديمة ونبلّغ */
  const order=state.orders.find(o=>o.id===id);
  if(!order||(!(opts&&opts.bypassSelfEditWindow)&&!canEditOwnOrder(order)))return queueOrderSave(()=>_updateOrderImpl(id,patch,msg,opts));

    /* دمج العمليات المتتالية: كل التعديلات اللي وصلت قبل ما الطابور يبدأ تتحفظ مع بعض (قراءة وكتابة واحدة لكل شهر)
       بدل طلب منفصل لكل تعديل — عشان 40 تعديل ورا بعض ما ياخدوش دقيقة */

}
let _optOps=[], _optDrainQueued=false;
async function _drainOptOps(){
  _optDrainQueued=false;
  const ops=_optOps.splice(0);
  const byMonth=new Map();
  ops.forEach(op=>{
    if(!state.orders.some(o=>o.id===op.id)){ toast('الطلب غير موجود','error'); op.resolve(false); return; }
    const mk=op.prev.monthKey; if(!byMonth.has(mk))byMonth.set(mk,[]); byMonth.get(mk).push(op);
  });
  for(const [mk,list] of byMonth){
    let ok=false;
    try{ ok=await _applyOptBatch(mk,list); }catch(e){ ok=false; }
    list.forEach(op=>op.resolve(ok));
  }
}
async function _applyOptBatch(mk,list){
  const merged=new Map();
  list.forEach(op=>{ merged.set(op.id,{...(merged.get(op.id)||{}),...op.patch}); });
  const startedAt=Date.now(); let ok=false, loadErr=null, attempt=0, quickRetries=0, auditPatch=null;
  try{
    for(;;){
      attempt++; loadErr=null; ok=false;
      let fresh=null;
      try{ fresh=await loadMonthOrThrow(mk,false,attempt===1); }catch(e){ loadErr=e; }
      if(fresh){
        auditPatch={ lastEditedBy:currentUserName(), lastEditedAt:nowIso() };
        const updated=fresh.map(o=>merged.has(o.id)?{...o,...merged.get(o.id),...auditPatch}:o);
        ok=await saveMonth(mk,updated);
        if(ok)break;
      }
      /* فشل بسبب الاتصال: العمليات كلها تستنى رجوع الإنترنت وتتعاد، بدل ما نرجّع التعديلات ونضيّعها */
      if(isConnectivityFailure(loadErr)&&Date.now()-startedAt<PENDING_OPS_MAX_AGE_MS){
        if(attempt===1)toast('📡 لا يوجد اتصال بالإنترنت — التعديلات محفوظة على جهازك وستُحفظ تلقائيًا عند عودة الاتصال','error',7000);
        const waited=await waitForConnection(PENDING_OPS_MAX_AGE_MS-(Date.now()-startedAt));
        if(!waited&&++quickRetries>3)break;
        continue;
      }
      break;
    }
  }catch(e){ ok=false; loadErr=loadErr||e; }
  if(ok){
    state.orders=state.orders.map(o=>merged.has(o.id)?{...o,...merged.get(o.id),...auditPatch}:o);
    list.forEach(op=>{ const ch=describeChanges(op.prev,op.patch); addAudit(`تعديل طلب ${op.patch.receiptNo||op.prev.receiptNo||''}${ch?' — '+ch:''}`); });
    render();
    const msgs=[...new Set(list.map(op=>op.msg).filter(Boolean))]; msgs.forEach(m=>toast(m));
  } else {
    /* رجوع القيم القديمة لكل تعديل لم يُحفظ (بترتيب عكسي) */
    [...list].reverse().forEach(op=>{
      state.orders=state.orders.map(o=>{
        if(o.id!==op.id)return o;
        const r={...o};
        Object.keys(op.patch).forEach(k=>{ if(JSON.stringify(r[k])===JSON.stringify(op.patch[k])){ if(k in op.prev)r[k]=op.prev[k]; else delete r[k]; } });
        return r;
      });
    });
    render();
    if(loadErr)toast('تعذّر تحميل بيانات الشهر للتأكد قبل الحفظ (مشكلة اتصال)'+connDiag(loadErr)+' — حاول مرة أخرى بعد ثوانٍ','error',6000);
    else toast(saveFailMsg('خطأ في الحفظ'),'error');
  }
  return ok;
}

    render();
  };
  if(!(opts&&(opts._optimistic||opts.bypassSelfEditWindow))&&!canEditOwnOrder(order)){ toast('التعديل مقفول — هذا الطلب ليس من تسجيلك، تواصل مع المسؤول لفتح التعديل','error',5000); return false; }
  const changes=describeChanges(order,patch);
  const auditPatch={ lastEditedBy:currentUserName(), lastEditedAt:nowIso() };
  const optimistic=!!(opts&&opts._optimistic);
  const startedAt=Date.now(); let ok=false, loadErr=null, attempt=0, quickRetries=0;
  try{
    for(;;){
      attempt++; loadErr=null; ok=false;
      let fresh=null;
      try{ fresh=await loadMonthOrThrow(order.monthKey,false,attempt===1); }catch(e){ loadErr=e; }
      if(fresh){
        const updated=fresh.map(o=>o.id===id?{...o,...patch,...auditPatch}:o);
        ok=await saveMonth(order.monthKey,updated);
        if(ok)break;
      }
      /* فشل بسبب الاتصال: العملية تستنى رجوع الإنترنت وتتعاد، بدل ما نرجّع التعديل ونضيّعه */
      if(optimistic&&isConnectivityFailure(loadErr)&&Date.now()-startedAt<PENDING_OPS_MAX_AGE_MS){
        if(attempt===1)toast('📡 لا يوجد اتصال بالإنترنت — التعديل محفوظ على جهازك وسيُحفظ تلقائيًا عند عودة الاتصال','error',7000);
        const waited=await waitForConnection(PENDING_OPS_MAX_AGE_MS-(Date.now()-startedAt));
        if(!waited&&++quickRetries>3)break;
        continue;
      }
      break;
    }
  }catch(e){ ok=false; loadErr=loadErr||e; }
  if(ok){
    state.orders=state.orders.map(o=>o.id===id?{...o,...patch,...auditPatch}:o);
    addAudit(`تعديل طلب ${patch.receiptNo||order.receiptNo||''}${changes?' — '+changes:''}`);
    render(); if(msg)toast(msg);
  } else {
    rollback();
    if(loadErr)toast('تعذّر تحميل بيانات الشهر للتأكد قبل الحفظ (مشكلة اتصال)'+connDiag(loadErr)+' — حاول مرة أخرى بعد ثوانٍ','error',6000);
    else toast(saveFailMsg('خطأ في الحفظ'),'error');
  }
  return ok;
}

/* تنبيه إيقاع إرسال واتساب (بدون منع): بعد كل WA_BATCH_SIZE رسالة اتأكد إرسالها بنظهر تحذير بس، والإرسال بيفضل شغال.
   لو عدّت ساعة من آخر إرسال العدّاد بيبدأ من صفر. الحالة محفوظة على الجهاز ده بس (localStorage) */
const WA_BATCH_SIZE=20, WA_LOCK_MS=60*60*1000, WA_STATE_KEY='sajjal-wa-throttle';
function waThrottleState(){
  try{ const st=JSON.parse(localStorage.getItem(WA_STATE_KEY)||'{}'); return {count:Number(st.count)||0,lastAt:Number(st.lastAt)||0,lockUntil:Number(st.lockUntil)||0}; }
  catch(e){ return {count:0,lastAt:0,lockUntil:0}; }
}
function trackWhatsAppSendCount(){
  /* تنبيه فقط (بدون أي منع): بعد كل WA_BATCH_SIZE رسالة خلال ساعة نظهر تحذير، والإرسال بيفضل شغال */
  try{
    const now=Date.now();
    let st=waThrottleState();
    if(st.lastAt&&now-st.lastAt>WA_LOCK_MS)st.count=0;
    st.count+=1; st.lastAt=now; st.lockUntil=0;
    if(st.count>=WA_BATCH_SIZE){
      st.count=0;
      toast(`⚠️ تم إرسال ${WA_BATCH_SIZE} رسالة — يُفضَّل التوقف قليلًا حتى لا يقيّد واتساب الرقم`,'error',9000);
    }else if(WA_BATCH_SIZE-st.count<=3){
      toast(`تنبيه: تبقّى ${WA_BATCH_SIZE-st.count} رسالة للوصول إلى حد الإرسال الموصى به`,'ok',5000);
    }
    localStorage.setItem(WA_STATE_KEY,JSON.stringify(st));
  }catch(e){}
}

async function _markWhatsAppSentBulkImpl(ids){

  targets.forEach(o=>{ (byMonth[o.monthKey]=byMonth[o.monthKey]||[]).push(o.id); });

  for(const mk of Object.keys(byMonth)){

}

/* التحديث اليدوي (زر ↻ تحديث) — بيحدّث بس الشهر الحالي والي قبله (فين بيحصل 95% من التغييرات الحقيقية:
   طلبات جديدة، تغيير حالة، تصنيع...)، مش كل تاريخ المصنع من الأول؛ ده بيخلي الزر سريع دايمًا
   حتى لو تراكمت سنين من البيانات، بدل ما يرجع لأداء بطيء زي التحميل الأول قبل تحسين الإقلاع السريع */
/* البانرات (صور) بتتغيّر نادرًا جدًا (مناسبات بس)، لكن كانت بتتنزّل بالكامل (Base64 — ممكن تبقى مئات
   الكيلوبايتات لكل صورة) في *كل* دورة تحديث صامت (كل 5 دقايق لكل موظف فاتح البرنامج)، حتى لو محدش غيّرها
   من أسبوع — ده كان بيستهلك جزء كبير من الـ Egress من غير أي فايدة حقيقية. الحل: نجيبهم تاني بس كل
   نص ساعة كحد أقصى، مش كل دورة تحديث */
/* صلاحيات الموظف كانت بتتنسخ مرة واحدة وقت تسجيل الدخول وتفضل زي ما هي طول الجلسة — فلو الأدمن فعّل
   لها صلاحية (زي "تعديل حالة الطلب") وهي شغالة، ما كانتش بتظهر لها إلا بعد ما تخرج وتدخل تاني.
   دلوقتي بنعيد مزامنتها من الإعدادات الجديدة في كل دورة تحديث؛ ولو الأدمن حذف الموظف نسيب الجلسة زي ما هي */
function syncCurrentEmployeeFromConfig(){
  const u=state.currentUser;
  if(!u||u.role!=='employee')return false;
  const emp=((state.config||{}).employees||[]).find(e=>e.id===u.id);
  if(!emp)return false;
  const before=JSON.stringify([u.allowedViews,u.perms,u.hiddenColumns]);
  const after=JSON.stringify([emp.allowedViews,emp.perms,emp.hiddenColumns]);
  if(before===after)return false;
  state.currentUser={...u,allowedViews:emp.allowedViews,perms:emp.perms,hiddenColumns:emp.hiddenColumns};
  return true;
}
const BANNER_REFRESH_INTERVAL_MS=30*60*1000;
let _lastBannerFetchAt=0;
async function fullRefresh(){
  /* تحديث الإعدادات كمان في كل دورة تحديث تلقائي — عشان لو الأدمن فعّل/ألغى وضع الصيانة، باقي المستخدمين
     يشوفوا التغيير خلال دقيقة من غير ما يحتاجوا يقفلوا ويفتحوا البرنامج تاني */
  try{ const cfgFresh=await loadConfig({reuseLogo:true}); if(cfgFresh){ state.config=cfgFresh; syncCurrentEmployeeFromConfig(); } }catch(e){}
  if(Date.now()-_lastBannerFetchAt>=BANNER_REFRESH_INTERVAL_MS){
    _lastBannerFetchAt=Date.now();
    try{ state.dashboardBanner=await loadDashboardBanner(); }catch(e){}
    try{ state.trackBanner=await loadTrackBanner(); }catch(e){}
  }
  let idx=null;
  try{ idx=await loadIndexOrThrow(); state.monthIndex=idx; }catch(e){ idx=state.monthIndex||[]; } /* فشل جلب الفهرس: نكمّل بالمحلي ولا نمسحه */
  const now=new Date();
  const months=[now.toISOString().slice(0,7),new Date(now.getFullYear(),now.getMonth()-1,1).toISOString().slice(0,7)];
  const toRefresh=idx.filter(m=>months.includes(m));
  if(toRefresh.length){
    /* إصلاح حرج: التحديث الدوري ده بياخد ثانية أو اتنين لحد ما يوصل رد السيرفر. لو المستخدم عمل حفظ
       (كمية مصنعة، تسكين، تسليم...) بالظبط في الفترة دي، ورد السيرفر (اللي بدأ قبل الحفظ) وصل بعد
       الحفظ، كان بيكتب البيانات القديمة فوق التعديل الجديد ويمسحه من غير أي تنبيه — بالظبط زي مشكلة
       فقدان البيانات اللي حصلت قبل كده. الحل: نسجّل وقت بداية الطلب، ولو لقينا حفظ محلي أحدث حصل لنفس
       الشهر بعد ما بدأنا نجيب البيانات، نتجاهل رد السيرفر القديم ده ونسيب النسخة المحلية الأحدث زي ما هي */
    const fetchStartedAt=Date.now();
    const lists=await Promise.all(toRefresh.map(m=>loadMonthOrNull(m)));
    const staleMonths=[];
    toRefresh.forEach((m,i)=>{
      if(lists[i]===null)return; // فشل التحميل — نسيب البيانات المحلية زي ما هي بدل ما نمسحها
      const cached=_monthFreshCache[m];
      if(cached&&cached.ts>fetchStartedAt)return; // فيه نسخة أحدث محليًا اتحفظت فعلاً — تجاهل رد السيرفر القديم
      staleMonths.push(m);
      _monthFreshCache[m]={data:lists[i],ts:Date.now()};
    });
    if(staleMonths.length){
      const merged=state.orders.filter(o=>!staleMonths.includes(o.monthKey));
      toRefresh.forEach((m,i)=>{ if(staleMonths.includes(m))lists[i].forEach(o=>merged.push(o)); });
      state.orders=merged; reapplyInflightPatches();
    }
    const loaded=state._loadedMonths||new Set();
    toRefresh.forEach((m,i)=>{ if(lists[i]!==null)loaded.add(m); });
    state._loadedMonths=loaded;
  }
  let svcIdx=null;
  try{ svcIdx=await loadServiceIndexOrThrow(); state.serviceMonthIndex=svcIdx; }catch(e){ svcIdx=state.serviceMonthIndex||[]; }
  const svcToRefresh=svcIdx.filter(m=>months.includes(m));
  if(svcToRefresh.length){
    /* نفس إصلاح التعارض بالظبط، لكن لجدول الخدمات الإضافية */
    const svcFetchStartedAt=Date.now();
    const svcLists=await Promise.all(svcToRefresh.map(m=>loadServiceMonthOrNull(m)));
    const svcStaleMonths=[];
    svcToRefresh.forEach((m,i)=>{
      if(svcLists[i]===null)return;
      const cached=_svcMonthFreshCache[m];
      if(cached&&cached.ts>svcFetchStartedAt)return;
      svcStaleMonths.push(m);
      _svcMonthFreshCache[m]={data:svcLists[i],ts:Date.now()};
    });
    if(svcStaleMonths.length){
      const svcMerged=state.serviceOrders.filter(so=>!svcStaleMonths.includes(so.monthKey));
      svcToRefresh.forEach((m,i)=>{ if(svcStaleMonths.includes(m))svcLists[i].forEach(so=>svcMerged.push(so)); });
      state.serviceOrders=svcMerged;
    }
    const svcLoaded=state._loadedServiceMonths||new Set();
    svcToRefresh.forEach((m,i)=>{ if(svcLists[i]!==null)svcLoaded.add(m); });
    state._loadedServiceMonths=svcLoaded;
  }
  state.lastSync=nowTimeStr();
}

/* الطلب "متأخر" يُحتسب في التحذيرات والإحصائيات طالما لم تُسجَّل له كمية مصنعة بعد ولم يُسلَّم —
   بمجرد ما يتسجل رقم في الكمية المصنعة، الطلب يخرج من عداد المتأخرة تلقائيًا حتى لو لسه ما اتسلمش (نفس منطق المستعجلة) */
function isOverdue(o){
  if(!o.date||o.status==='تم التسليم'||(o.qtyMfg||'').toString().trim())return false;
  const created=new Date(o.date);
  const diff=(Date.now()-created.getTime())/(1000*60*60*24);
  return diff>25;
}
/* الطلب "مستعجل" يُحتسب في التحذيرات والإحصائيات طالما لم تُسجَّل له كمية مصنعة بعد ولم يُسلَّم —
   بمجرد ما يتسجل رقم في الكمية المصنعة، الطلب يخرج من عداد المستعجلة تلقائيًا حتى لو لسه ما اتسلمش */
/* الكمية المستلمة الإجمالية للسند — تجمع الكمية الأساسية مع كل الطلبات الإضافية المرتبطة بنفس السند
   (لو العميل قسّم الكمية على أكتر من حجم عبوة/كرتون) */
function orderTotalQtyCartons(o){
  const base=Number(o.qtyCartons)||0;
  const extra=(o.extraItems||[]).reduce((s,it)=>s+(Number(it.qtyCartons)||0),0);
  return base+extra;
}
/* أي كسر في الكرتون (ربع، نص...) بيتحسب كرتون كامل — وبنشيل ضجيج الفاصلة العائمة (زي 10634.199999) */
function ceilCartons(n){ const v=Number(n); if(!isFinite(v)||v<=0)return 0; return Math.ceil(Math.round(v*1e6)/1e6); }
function orderTotalQtyCartonsCeil(o){ return ceilCartons(orderTotalQtyCartons(o)); }
function isUrgentPending(o){
  return !!o.urgent&&o.status!=='تم التسليم'&&!(o.qtyMfg||'').toString().trim();
}
function arabicDaysLabel(n){
  if(n<=0)return'أقل من يوم';
  if(n===1)return'يوم واحد';
  if(n===2)return'يومين';
  if(n<=10)return`${n} أيام`;
  return`${n} يوم`;
}
function overdueBadge(o){
  if(!isOverdue(o))return'';
  const daysSince=Math.floor((Date.now()-new Date(o.date).getTime())/(1000*60*60*24));
  return`<span class="overdue-badge"><span class="warn-icon">⚠️</span>متأخر منذ ${arabicDaysLabel(daysSince-25)}</span>`;
}
/* تنبيه مبكر — الطلب قارب على التأخير (بين 18 و25 يوم) ولم يُسلَّم ولم تُسجَّل له كمية مصنعة بعد */
function isNearingDelay(o){
  if(!o.date||o.status==='تم التسليم'||(o.qtyMfg||'').toString().trim())return false;
  const diff=(Date.now()-new Date(o.date).getTime())/(1000*60*60*24);
  return diff>=18&&diff<=25;
}
function nearingDelayBadge(o){
  if(!isNearingDelay(o))return'';
  const daysSince=Math.floor((Date.now()-new Date(o.date).getTime())/(1000*60*60*24));
  const remaining=Math.max(0,25-daysSince);
  return`<span class="nearing-badge"><span class="warn-icon">🟡</span>متبقي ${arabicDaysLabel(remaining)} على التأخير</span>`;
}

/* ترتيب مواقع التسكين: الصف الأول ثم العمود — 1-1, 1-2, 1-3, 2-1, 2-2... */
function parsePlacement(loc){
  const m=(loc||'').trim().match(/^(\d+)\s*-\s*(\d+)$/);
  if(!m)return{row:9999,col:9999};
  return{row:parseInt(m[1],10),col:parseInt(m[2],10)};
}
function sortByPlacement(list){
  return [...list].sort((a,b)=>{
    const pa=parsePlacement(a.placementLocation),pb=parsePlacement(b.placementLocation);
    if(pa.row!==pb.row)return pa.row-pb.row;
    return pa.col-pb.col;
  });
}
/* عدد الأيام منذ تاريخ التصنيع إن وُجد، وإلا منذ تاريخ استلام الطلب */
function daysInWarehouse(o){
  const refDate=o.mfgDate||o.date;
  if(!refDate)return 0;
  const created=new Date(refDate);
  return Math.max(0,Math.floor((Date.now()-created.getTime())/(1000*60*60*24)));
}
/* طلب "راكد" في المستودع — موجود بالمستودع (له موقع تسكين) ولسه ما اتسلّمش، وعدّى عليه 25 يوم أو أكتر بدون خروج */
const STAGNANT_WAREHOUSE_DAYS=25;
function isStagnantInWarehouse(o){
  if(!(o.placementLocation||'').trim()||o.status==='تم التسليم')return false;
  return daysInWarehouse(o)>=STAGNANT_WAREHOUSE_DAYS;
}
/* أرشفة تلقائية — طلب "قابل للأرشفة" لو اتسلّم فعلاً وعدّى على تاريخه أكتر من 6 شهور، ولسه مش مؤرشف */
const ARCHIVE_AFTER_DAYS=180;
function isArchivable(o){
  if(o.archived||o.status!=='تم التسليم'||!o.date)return false;
  const diff=(Date.now()-new Date(o.date).getTime())/(1000*60*60*24);
  return diff>ARCHIVE_AFTER_DAYS;
}

  }else if(type==='status'){
    if(scope==='registry')state.registryStatusFilter='all';
  }else if(type==='archived'){
    if(scope==='registry')state.registryShowArchived=false;
  }else if(type==='wa'){
    if(scope==='registry')state.registryWaFilter='';
    else if(scope==='warehouse')state.warehouseWaFilter='';
  }else if(type==='unwashed'){
    if(isProd){ state.productionUnwashedFilter=state.productionUnwashedFilter||{}; state.productionUnwashedFilter[view]=false; }
  }else if(type==='hide-delivered'){
    if(scope==='registry')state.registryHideDelivered=false;
    else if(isProd){ state.productionHideDelivered=state.productionHideDelivered||{}; state.productionHideDelivered[view]=false; }
  }else if(type==='period'){
    if(scope==='registry')state.registryPeriod='3';
    else if(isProd){ state.productionPeriod=state.productionPeriod||{}; state.productionPeriod[view]=undefined; }
  }else if(type==='duration'){
    if(scope==='registry')state.registryDurationFilter='';
    else if(scope==='warehouse')state.warehouseDurationFilter='';
    else if(isProd){ state.productionDurationFilter=state.productionDurationFilter||{}; state.productionDurationFilter[view]=''; }
  }else if(type==='column'){
    if(scope==='registry'){ if(state.columnFilters.registry)delete state.columnFilters.registry[col]; }
    else if(scope==='warehouse'){ if(state.columnFilters.warehouse)delete state.columnFilters.warehouse[col]; }
    else if(isProd){ if(state.columnFilters['production-'+view])delete state.columnFilters['production-'+view][col]; }
  }
}
function clearAllActiveFilters(scope){
  const isProd=scope.startsWith('production-');
  const view=isProd?scope.replace('production-',''):null;
  if(scope==='registry'){
    state.registrySearchTerm=''; state.registryFilter='all'; state.registryStatusFilter='all'; state.registryWaFilter='';
    state.registryShowArchived=false; state.registryDurationFilter=''; state.columnFilters.registry={}; state.registryHideDelivered=false;
  }else if(scope==='warehouse'){
    state.warehouseSearchTerm=''; state.warehouseFilter='remaining'; state.warehouseDurationFilter=''; state.warehouseWaFilter='';
    state.columnFilters.warehouse={};
  }else if(isProd){
    state.productionSearchTerm=state.productionSearchTerm||{}; state.productionSearchTerm[view]='';
    state.productionFilter=state.productionFilter||{}; state.productionFilter[view]='all';
    state.productionDurationFilter=state.productionDurationFilter||{}; state.productionDurationFilter[view]='';
    state.productionUnwashedFilter=state.productionUnwashedFilter||{}; state.productionUnwashedFilter[view]=false;
    state.productionHideDelivered=state.productionHideDelivered||{}; state.productionHideDelivered[view]=false;
    state.columnFilters['production-'+view]={};
  }
}

/* ============== render dispatcher ============== */
function captureFocus(){
  const el=document.activeElement;
  if(!el||!['INPUT','TEXTAREA','SELECT'].includes(el.tagName))return null;
  return {
    id:el.id||null,
    cls:el.className||'',
    dataId:el.dataset?el.dataset.id:null,
    selStart:(typeof el.selectionStart==='number')?el.selectionStart:null,
    selEnd:(typeof el.selectionEnd==='number')?el.selectionEnd:null,
    /* اللي المستخدم كاتبه ولسه ما اتحفظش — بنرجّعه بعد إعادة رسم الصفحة بدل ما يتمسح */
    value:(el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&['text','tel','search','number',''].includes(el.type||'')))?el.value:null,
    defaultValue:(el.tagName==='TEXTAREA'||el.tagName==='INPUT')?el.defaultValue:null
  };
}
function restoreFocus(saved){
  if(!saved)return;
  let el=null;
  if(saved.id)el=byId(saved.id);
  if(!el&&saved.dataId&&saved.cls){
    const firstCls=saved.cls.split(' ').filter(Boolean)[0];
    if(firstCls)el=document.querySelector(`.${firstCls}[data-id="${saved.dataId}"]`);
  }
  if(!el)return;
  try{
    if(saved.value!==null&&saved.value!==undefined&&el.value!==saved.value)el.value=saved.value;
    el.focus();
    if(saved.selStart!==null&&el.setSelectionRange)el.setSelectionRange(saved.selStart,saved.selEnd);
  }catch(e){}
}

     مش بيتأثر، عشان يقدر يشتغل عادي وهو بيعمل التحديثات */
  if(currentConfig().maintenanceMode&&!isAdmin()){

  if(state.view==='pricing'&&!employeeCanAccess('pricing'))state.view='dashboard';
  if(state.view){ try{ localStorage.setItem('sajjal-last-view',state.view); }catch(e){} }
  let pageHtml='';
  if(state.view==='dashboard')   pageHtml=renderDashboard();
  else if(state.view==='registry')  pageHtml=renderRegistry();
  else if(state.view==='services')  pageHtml=renderServices();
  else if(state.view==='settings')  pageHtml=renderSettings();
  else if(state.view==='audit')     pageHtml=renderAudit();
  else if(state.view==='customers') pageHtml=renderCustomers();
  else if(state.view==='clients')   pageHtml=renderClients();
  else if(state.view==='warehouse') pageHtml=renderWarehouse();
  else if(state.view==='pricing')   pageHtml=renderPricingPage();
  else if(state.view==='reports')   pageHtml=renderReports();

  else if(state.view==='cash')      pageHtml=renderCash();
  else pageHtml=renderProduction(state.view);

function renderPricingPage(){
  const rn=state.calcReceiptNo||'';
  const order=findOrderByReceiptNo(rn);
  const saved=(state.receiptPricing||{})[rn.trim()]||null;
  const f=state.calcForm||{};
  const val=(field,fallbackFromOrder)=>{
    if(f[field]!=null)return f[field];
    if(saved&&saved[field]!=null)return saved[field];
    if(fallbackFromOrder!=null)return fallbackFromOrder;
    return '';
  };
  const pieceSizeVal=val('pieceSize',order?order.packageSize:'');
  const cartonSizeVal=val('cartonSize',order?order.cartonSize:'');
  /* الكمية المصنعة لازم تعكس حالة السند الحية دايمًا، مش نسخة قديمة محفوظة من حساب سابق —
     لو السند موجود، قيمته الحالية (حتى لو فاضية بعد ما اتمسحت) هي الأساس؛ الحساب المحفوظ قديمًا
     بيتستخدم بس لو مفيش سند مطابق أصلاً (سند محذوف مثلاً) */
  const qtyMfgVal=f.qtyMfg!=null?f.qtyMfg:(order?(order.qtyMfg||''):(saved&&saved.qtyMfg!=null?saved.qtyMfg:''));
  const isDibs=(order?order.processingType==='دبس':false)||/^[jm]/i.test(rn.trim());
  const isDough=(order?order.processingType==='عجينة':false)||/^p/i.test(rn.trim());
  const isVacuum=(order?order.processingType==='فاكيوم':false)||/^v/i.test(rn.trim());
  const dibsTable=getDibsWeightTable();
  const doughTable=getDoughWeightTable();
  const vacuumTable=getVacuumWeightTable();
  /* مطابقة صف من الجدول: لازم حجم العبوة وحجم الكرتون (وزن الكرتون) يطابقوا مع بعض نفس الصف بالظبط.
     حجم/وزن الكرتون بييجي أحيانًا بصيغة فيها حروف زي "K 8" بدل "8"، فبنستخرج الرقم منها بس قبل المقارنة.
     لو صف في الجدول مالوش اسم حجم عبوة (زي بعض صفوف العجينة)، بيتطابق بوزن الكرتون بس */
  const matchWeightRow=(table)=>matchWeightRowIn(table,pieceSizeVal,cartonSizeVal);
  const dibsTableMatch=isDibs?matchWeightRow(dibsTable):null;
  const doughTableMatch=isDough?matchWeightRow(doughTable):null;
  const vacuumTableMatch=isVacuum?matchWeightRow(vacuumTable):null;
  const isPerKiloType=isDibs;
  const priceNoTaxVal=val('priceNoTax',
    (isDibs&&dibsTableMatch)?dibsTableMatch.pricePerKilo:
    (isDough&&doughTableMatch)?doughTableMatch.priceCarton:
    (isVacuum&&vacuumTableMatch)?vacuumTableMatch.priceCarton:'');
  const cartonWeightVal=(f.cartonWeight!=null?f.cartonWeight:(saved&&saved.cartonWeight!=null?saved.cartonWeight:(saved&&saved.kilos!=null?saved.kilos:
    (dibsTableMatch?dibsTableMatch.weight:''))));
  const totalWeightKgNum=(Number(qtyMfgVal)||0)*(Number(cartonWeightVal)||0);
  const priceWithTaxNum=(Number(priceNoTaxVal)||0)*1.15;
  let baseTotalNum=isPerKiloType
    ?totalWeightKgNum*priceWithTaxNum
    :(Number(qtyMfgVal)||0)*priceWithTaxNum;
  /* لو السند فيه أصناف إضافية (extraItems) وله كمية مصنعة خاصة بيه، بنحسب سعر كل صنف على حدة بحجمه ووزنه
     الصحيح من نفس الجدول، وبنجمعهم على السعر الأساسي — بس للدبس والعجينة (اللي بيتسعّروا بجدول أوزان) */
  const extraItemsPriced=[];
  if((isDibs||isDough)&&order&&order.extraItems&&order.extraItems.length){
    order.extraItems.forEach((it,i)=>{
      const itQty=Number(it.qtyMfg)||0;
      if(!itQty)return;
      const itTable=isDibs?dibsTable:doughTable;
      const itMatch=matchWeightRowIn(itTable,it.packageSize,it.cartonSize);
      if(!itMatch)return;
      const itPriceNoTax=isDibs?itMatch.pricePerKilo:itMatch.priceCarton;
      const itPriceWithTax=(Number(itPriceNoTax)||0)*1.15;
      const itTotal=isDibs?(itQty*(Number(itMatch.weight)||0)*itPriceWithTax):(itQty*itPriceWithTax);
      extraItemsPriced.push({label:`${it.packageSize||'—'} / ${it.cartonSize||'—'}`,qty:itQty,total:itTotal});
      baseTotalNum+=itTotal;
    });
  }
  /* خدمة إضافية مرتبطة بنفس رقم السند (تقعيم/فرز/تعقيم/فرشاة/حشو لوز...) — بتأثر على السعر النهائي حسب نوعها */

  const vacuumSvcExtra=(order&&order.vacuumServices)?order.vacuumServices.filter(s=>s!=='سحب هواء'):[];
  const extraServiceType=linkedService?(linkedService.serviceType||''):(vacuumSvcExtra[0]||'');
  const extraCartonKg=Number(cartonWeightVal)||Number(numOnlyStr(cartonSizeVal))||0;
  const extraEffect=extraServiceEffect(extraServiceType,extraCartonKg,qtyMfgVal,extraCartonKg);
  let totalNum=baseTotalNum;
  if(extraEffect){
    if(extraEffect.mode==='replace')totalNum=extraEffect.amount;
    else if(extraEffect.mode==='add')totalNum=baseTotalNum+extraEffect.amount;
    else if(extraEffect.mode==='unknown')totalNum=0;

     (الحد الأدنى ده مبيتطبقش على حالة "حشو لوز" ولا على حالة "خدمة غير معروفة السعر") */
  const finalTotalNum=extraEffect&&(extraEffect.mode==='replace'||extraEffect.mode==='unknown')
    ?totalNum
    :(totalNum>0?Math.max(totalNum,100):0);
  const notesVal=val('notes','');
  const customerName=order?order.customerName:(saved?saved.customerName:'');

  const list=Object.keys(state.receiptPricing||{})
    .map(k=>({receiptNo:k,...state.receiptPricing[k]}))
    .sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));

  const dibsPriceEditMode=!!state.dibsTableEditMode;
  const dibsPriceDraft=state.dibsTableEditDraft||{};
  const extraSvcPriceEditMode=!!state.extraSvcTableEditMode;
  const extraSvcPriceDraft=state.extraSvcTableEditDraft||{};
  const extraSvcRatesNow=getExtraServiceRates();
  const extraServiceRatesTableHtml=isAdmin()?`
  <div class="card card-pad" style="min-width:260px;max-width:340px;margin-top:22px;">
    <h3 style="margin:0 0 10px;font-size:14px;color:var(--accent-dark);">🔧 أسعار الخدمات الإضافية (ريال/كيلو)</h3>
    <div class="check-row" style="margin-bottom:8px;">
      <input type="checkbox" id="extra-svc-price-edit-toggle" ${extraSvcPriceEditMode?'checked':''}>
      <label for="extra-svc-price-edit-toggle">✏️ تعديل الأسعار</label>
    </div>
    <div style="width:100%;overflow-x:auto;">
    <table style="width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed;">
      <colgroup><col style="width:38%;"><col style="width:31%;"><col style="width:31%;"></colgroup>
      <thead><tr>
        <th style="text-align:right;border-bottom:2px solid var(--border);padding:5px 4px;">الخدمة</th>
        <th style="text-align:right;border-bottom:2px solid var(--border);padding:5px 4px;">بدون</th>
        <th style="text-align:right;border-bottom:2px solid var(--border);padding:5px 4px;">بالضريبة</th>
      </tr></thead>
      <tbody>
        ${[
          {id:'A',label:'تقعيم/فرز',row:extraSvcRatesNow.A},
          {id:'B',label:'تعقيم/فرشا',row:extraSvcRatesNow.B},
        ].map(g=>{
          const draftNoTax=extraSvcPriceDraft[g.id+'-noTax']!=null?extraSvcPriceDraft[g.id+'-noTax']:g.row.noTax;
          const draftWithTax=extraSvcPriceDraft[g.id+'-withTax']!=null?extraSvcPriceDraft[g.id+'-withTax']:g.row.withTax;
          return `<tr>

/* حالة النسخ الاحتياطي على جهاز الأدمن: من تواريخ محفوظة محليًا على الجهاز (من غير أي طلب شبكة) */
function backupStatusCardHtml(){
  if(!isAdmin())return'';
  let snap='',full='',daily='';
  try{ snap=localStorage.getItem('sajjal-last-snapshot')||''; full=localStorage.getItem('sajjal-last-daily-backup')||''; daily=localStorage.getItem('sajjal-last-daily-export')||''; }catch(e){}
  const today=todayIso();
  const ago=d=>{ if(!d)return'لسه ما اتعملتش على الجهاز ده'; if(d===today)return'النهارده ✅'; const n=Math.floor((new Date(today)-new Date(d))/86400000); return `من ${n} يوم (${formatDate(d)})`; };
  const warn=snap!==today;
  return `<div class="last-order-card ${warn?'lo-warn':'lo-ok'}" style="margin-bottom:14px;">
    <div class="lo-icon">💾</div>
    <div>
      <div class="lo-title">النسخ الاحتياطي</div>
      <div class="lo-line">لقطة قاعدة البيانات اليومية: ${ago(snap)}</div>
      <div class="lo-line">النسخة الشاملة (Excel): ${ago(full)}</div>
      <div class="lo-line">تقرير الطلبات اليومي: ${ago(daily)}</div>
      ${warn?'<div class="lo-line" style="color:#B35C00;">افتح البرنامج من جهاز الأدمن علشان تتعمل لقطة النهارده تلقائيًا</div>':''}
    </div>
  </div>`;
}
function renderDashboard(){
  /* لوحة التحكم بتعرض إحصائيات إجمالية (زي عدد الطلبات الراكدة أو المتأخرة) لازم تشمل الأرشيف كامل
     من أول ما تتفتح، مش بس آخر شهر أو اتنين، عشان الأرقام تبقى متطابقة على أي جهاز فورًا */
  triggerFullHistoryLoadIfNeeded();
  const orders=state.orders||[];
  const total     = orders.length;
  /* "تم التصنيع" = أي طلب اتكتبت له كمية مصنعة، حتى لو اتسلّم بعد كده (نفس تعريف صفحات التصنيع وسجل الطلبات) */
  const ready     = orders.filter(o=>(o.qtyMfg||'').toString().trim()).length;
  const delivered = orders.filter(o=>o.status==='تم التسليم').length;
  const urgent    = orders.filter(isUrgentPending).length;

  if(deliveredWithDates.length>0){
    const totalDays=deliveredWithDates.reduce((s,o)=>{
      const d=(new Date(o.lastEditedAt).getTime()-new Date(o.date).getTime())/(1000*60*60*24);

    avgDays=(totalDays/deliveredWithDates.length).toFixed(1);

  /* تنبيه مبكر: طلبات قاربت على التأخير (بين 18 و25 يوم) ولم تُسلَّم بعد ولم تُسجَّل لها كمية مصنعة —

  const monthLabel=(mk)=>{

  <div class="chart-card" style="margin-top:20px;border-color:#E67E22;">

    ${PROCESSING_TYPES.map((t,i)=>`

  ${dailyFlowChartHtml()}

/* ============== audit log ============== */
/* فلتر مدة سجل العمليات — افتراضيًا يعرض آخر يومين بس، عشان الجدول يفضل خفيف */
const AUDIT_PERIOD_OPTIONS=[
  {value:'2d',label:'آخر يومين',days:2},
  {value:'week',label:'أسبوع',days:7},
  {value:'month',label:'شهر',days:30},
  {value:'2m',label:'شهرين',days:60},
  {value:'3m',label:'3 أشهر',days:90},
];
/* لون ثابت لكل مستخدم (من اسمه) عشان تفرّق بين الموظفين بنظرة في سجل العمليات */
function userColorHsl(name){
  let h=0; const str=(name||'').toString();
  for(let i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))>>>0;
  return h%360;
}
function userPillHtml(name){
  const hue=userColorHsl(name);
  return `<span class="user-pill" style="background:hsl(${hue},70%,92%);color:hsl(${hue},60%,26%);border:1px solid hsl(${hue},55%,75%);">${escapeHtml(name||'—')}</span>`;
}
function renderAudit(){
  const allLog=state.auditLog||[];
  const term=(state.auditSearchTerm||'').trim().toLowerCase();
  const period=state.auditPeriod||'2d';
  const opt=AUDIT_PERIOD_OPTIONS.find(p=>p.value===period)||AUDIT_PERIOD_OPTIONS[0];
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-opt.days); cutoff.setHours(0,0,0,0);
  const byPeriod=allLog.filter(l=>l.time&&new Date(l.time)>=cutoff);
  const log=term?byPeriod.filter(l=>
    (l.action||'').toLowerCase().includes(term)||
    (l.user||'').toLowerCase().includes(term)
  ):byPeriod;
  return`
  <div class="page-head">
    <div><h1 class="page-title">📜 سجل العمليات</h1><div class="page-desc">كل إضافة أو تعديل أو حذف لطلب، مع اسم من قام بها والتوقيت</div></div>
    ${isAdmin()?`<div class="toolbar"><button class="btn btn-ghost btn-sm" id="btn-clear-audit-log" style="color:var(--danger);border-color:var(--danger);">🗑️ مسح السجل بالكامل</button></div>`:''}
  </div>

  <div class="toolbar search-toolbar-sticky">
    ${searchBoxHtml('audit-search-input','ابحث بالمستخدم أو نوع العملية…',state.auditSearchTerm)}
    <select id="audit-period-filter" style="max-width:150px;font-size:12.5px;padding:7px 8px;">
      ${AUDIT_PERIOD_OPTIONS.map(p=>`<option value="${p.value}" ${period===p.value?'selected':''}>${p.label}</option>`).join('')}
    </select>
    ${term?`<span style="font-size:13px;color:var(--ink-soft);">عدد النتائج: <strong style="color:var(--accent-dark);font-size:15px;">${log.length}</strong></span>`:''}

/* تجميع العملاء من الطلبات — التجميع برقم الجوال (الرقم الأصح) لمنع تكرار نفس العميل أكثر من مرة */
/* عدد الطلبات "الجاهزة" (اتصنّعت ولسه ما اتسلّمتش) لعميل معيّن، بحسب رقم جواله — نفس المنطق المستخدم
   في صفحة بيانات العملاء، بس هنا بترجع رقم واحد فوري بدل بناء دليل العملاء كامل */
function readyCountForMobile(mobile){
  const norm=(mobile||'').replace(/[^0-9]/g,'');
  if(!norm)return 0;
  return state.orders.filter(o=>(o.mobile||'').replace(/[^0-9]/g,'')===norm&&(o.qtyMfg||'').toString().trim()&&o.status!=='تم التسليم').length;
}
/* مفتاح العميل في state.customerNotes/customerPricing (نفس منطق buildCustomerDirectory بالظبط) */
function customerKeyForMobile(mobile){
  const norm=(mobile||'').replace(/[^0-9]/g,'');
  return norm?('m:'+norm):null;
}
/* شارة نجمة صغيرة ⭐ بتظهر جنب أي طلب لعميل عنده ملاحظة أو تسعير خاص محفوظ — تدوس عليها تفتحلك تفاصيل
   العميل على طول من غير ما تحتاجي تروحي صفحة "بيانات العملاء" بنفسك */
function customerNoteBadge(mobile){
  const key=customerKeyForMobile(mobile);
  if(!key||!(state.customerNotes[key]||state.customerPricing[key]))return'';
  return `<span class="cust-note-star" data-cust-key="${escapeHtml(key)}" title="لهذا العميل ملاحظة أو تسعير خاص محفوظ — دوس للتفاصيل">⭐</span>`;
}
function buildCustomerDirectory(){
  const map=new Map();
  sortedOrders(state.orders).slice().reverse().forEach(o=>{
    const mobileNorm=(o.mobile||'').replace(/[^0-9]/g,'');
    const key=mobileNorm?('m:'+mobileNorm):(o.customerName?('n:'+o.customerName.trim().toLowerCase()):null);
    if(!key)return;
    if(!map.has(key))map.set(key,{key,name:o.customerName||'بدون اسم',mobile:o.mobile||'',orderCount:0,totalQty:0,lastDate:'',orders:[],readyCount:0});
    const rec=map.get(key);
    rec.orderCount+=1;
    rec.totalQty+=orderTotalQtyCartons(o);
    rec.orders.push(o);
    /* عدد الطلبات "الجاهزة" لهذا العميل — اتصنّعت فعلاً ولسه ما اتسلّمتش، يعني جاهزة تُسلَّم له لو جه المصنع */
    if((o.qtyMfg||'').toString().trim()&&o.status!=='تم التسليم')rec.readyCount+=1;
    if(!rec.mobile&&o.mobile)rec.mobile=o.mobile;
    if(!rec.lastDate||(o.date||'')>=rec.lastDate){ rec.lastDate=o.date||rec.lastDate; rec.name=o.customerName||rec.name; }
  });
  return Array.from(map.values()).sort((a,b)=>b.totalQty-a.totalQty);
}

/* ============== فلتر الفترة الزمنية الموحّد + الترقيم (Pagination) — تُستخدم في كل صفحات القوائم
   (سجل الطلبات، الفاكيوم، الدبس، العجينة، التعقيم، المستودع، الخدمات الإضافية، البحث)
   عشان محدش يضطر يقلّب في آلاف الطلبات دفعة واحدة، وبنفس الوقت الطلبات المعلّقة تفضل ظاهرة دايمًا مهما كان تاريخها */
const PERIOD_OPTIONS=[
  {value:'month',label:'الشهر الحالي فقط',months:0},
  {value:'1.5',label:'شهر ونص',months:1.5},
  {value:'2',label:'شهرين',months:2},
  {value:'3',label:'آخر 3 أشهر',months:3},
  {value:'6',label:'آخر 6 أشهر',months:6},
  {value:'all',label:'كل الفترات',months:null},
];
const PAGE_SIZE=50;
/* تاريخ القطع (cutoff) المقابل لقيمة الفترة المختارة — null يعني بلا حد (كل الفترات) */
function periodCutoffDate(periodValue){
  const opt=PERIOD_OPTIONS.find(p=>p.value===periodValue);
  const months=opt?opt.months:3;
  if(months===null)return null;
  const cutoff=new Date();
  const wholeMonths=Math.floor(months);
  const fracMonth=months-wholeMonths;
  cutoff.setMonth(cutoff.getMonth()-wholeMonths);
  if(fracMonth)cutoff.setDate(cutoff.getDate()-Math.round(fracMonth*30));
  cutoff.setHours(0,0,0,0);
  return cutoff;
}
function periodSelectHtml(id,selectedValue){
  const val=selectedValue||'3';
  return `<select id="${id}" style="max-width:170px;font-size:12.5px;padding:7px 8px;">
    ${PERIOD_OPTIONS.map(p=>`<option value="${p.value}" ${val===p.value?'selected':''}>${p.label}</option>`).join('')}
  </select>`;
}

/* كارت "أقدم طلب لسه مستنّي" — أقدم طلب لسه ما اتسجلتش له كمية مصنعة ولا اتسلّم، ومضى عليه كام يوم */
function oldestPendingOrderCardHtml(list){
  let oldest=null,oldestT=Infinity,pendingCount=0;
  (list||[]).forEach(o=>{
    if(o.status==='تم التسليم'||(o.qtyMfg||'').toString().trim())return;
    pendingCount++;
    const t=o.date?new Date(o.date).getTime():o.createdAt;
    if(t&&t<oldestT){ oldestT=t; oldest=o; }
  });
  if(!oldest)return `<div class="last-order-card lo-ok"><div class="lo-icon">✅</div><div><div class="lo-title">أقدم طلب لسه مستنّي</div><div class="lo-line">مفيش طلبات متأخرة في الانتظار</div></div></div>`;
  const days=Math.max(0,Math.floor((Date.now()-oldestT)/86400000));
  return `<div class="last-order-card lo-click${days>=18?' lo-warn':''}" data-id="${oldest.id}" role="button" tabindex="0" title="اضغط لفتح الطلب في الجدول">

    <div>
      <div class="lo-title">أقدم طلب لسه مستنّي (بدون كمية مصنّعة)</div>

      <div class="lo-line">📅 مضى عليه ${days<=0?'أقل من يوم':days+' يوم'} — استلام ${formatDate(oldest.date)}</div>
      <div class="lo-line">👤 ${escapeHtml(oldest.customerName||'—')}</div>
    </div>
  </div>`;
}

function incompleteOrdersCount(){
  try{
    let n=0;
    for(const o of state.orders){
      if(o.status==='تم التسليم'||o.archived)continue;
      const m=!!(o.qtyMfg||'').toString().trim(), pl=!!(o.placementLocation||'').trim();
      if((o.processingType==='فاكيوم'&&m&&!pl)||(!m&&pl))n++;

/* خريطة المستودع: مواقع التسكين بصيغة "رقم-رقم" (رف-مكان) بتتحوّل لشبكة؛ أي موقع بصيغة تانية بيظهر في قائمة منفصلة */
const WH_MIN_LINE=2, WH_MAX_LINE=23, WH_LEVELS=3, WH_PALLETS_PER_CELL=9;
/* مواقع المستودع بصيغة "خط-دور": الخط من 2 لحد 23، والدور 1 (الأرضي) أو 2 أو 3 فوقه.
   كل خانة (خط+دور) بتشيل حوالي 9 طبالي، فممكن فيها أكتر من طلب. أي موقع بصيغة تانية بيظهر في قائمة منفصلة */
function parseLocation(loc){
  const t=String(loc||'').replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).trim();
  const m=t.match(/^(\d+)\s*[-–—_\/.]\s*(\d+)$/);
  if(!m)return null;
  const line=Number(m[1]), level=Number(m[2]);
  if(line<WH_MIN_LINE||line>WH_MAX_LINE||level<1||level>WH_LEVELS)return null;
  return {line,level,key:line+'-'+level};
}
function warehouseGrid(){
  const occ=new Map(), other=new Map(); let maxLine=WH_MAX_LINE;
  state.orders.forEach(o=>{
    if(o.status==='تم التسليم'||o.archived)return;
    const loc=(o.placementLocation||'').trim(); if(!loc)return;
    const pl=parseLocation(loc);
    if(pl){ maxLine=Math.max(maxLine,pl.line); if(!occ.has(pl.key))occ.set(pl.key,[]); occ.get(pl.key).push(o); }
    else{ if(!other.has(loc))other.set(loc,[]); other.get(loc).push(o); }
  });
  return {occ,other,maxLine};
}
function pendingGroups(){
  const live=state.orders.filter(o=>o.status!=='تم التسليم'&&!o.archived);
  const hasMfg=o=>!!(o.qtyMfg||'').toString().trim(), hasPl=o=>!!(o.placementLocation||'').trim();
  const callsN=o=>(o.customerCalls||[]).length;
  const ratings=state.orderRatings||{};
  const byReceipt=new Map(); state.orders.forEach(o=>{ if(o.receiptNo)byReceipt.set(String(o.receiptNo),o); });
  const lowRated=[]; Object.keys(ratings).forEach(rn=>{
    const r=ratings[rn]; const o=byReceipt.get(String(rn));
    if(o&&r&&Number(r.stars)>=1&&Number(r.stars)<=2)lowRated.push({...o,_stars:Number(r.stars),_comment:r.comment||'',_ts:r.ts||''});
  });
  return {
    mfgNoPlace:live.filter(o=>o.processingType==='فاكيوم'&&hasMfg(o)&&!hasPl(o)),
    placeNoMfg:live.filter(o=>!hasMfg(o)&&hasPl(o)),
    called:live.filter(o=>callsN(o)&&!hasMfg(o)),
    badMobile:live.filter(o=>!isValidSaudiMobile(o.mobile||'')),
    lowRated:lowRated,
    inventory:[],
    warehouseMap:live.filter(o=>(o.placementLocation||'').trim())
  };
}

function shiftIsoDay(iso,n){ return new Date(Date.parse(iso+'T00:00:00Z')+n*86400000).toISOString().slice(0,10); }
function dailyFlowChartHtml(){
  const today=todayIso(); const days=[]; for(let i=13;i>=0;i--)days.push(shiftIsoDay(today,-i));
  const rec={},mfg={},del={}; days.forEach(d=>{ rec[d]=0; mfg[d]=0; del[d]=0; });
  state.orders.forEach(o=>{
    if(o.date&&rec[o.date]!==undefined)rec[o.date]++;
    if((o.qtyMfg||'').toString().trim()&&o.mfgDate&&mfg[o.mfgDate]!==undefined)mfg[o.mfgDate]++;
    if(o.status==='تم التسليم'&&o.statusDate){ const d=o.statusDate.slice(0,10); if(del[d]!==undefined)del[d]++; }
  });
  const maxV=Math.max(1,...days.map(d=>Math.max(rec[d],mfg[d],del[d])));
  const tot=m=>days.reduce((s,d)=>s+m[d],0);
  const busiest=days.reduce((b,d)=>(rec[d]+mfg[d]+del[d]>(rec[b]+mfg[b]+del[b]))?d:b,days[0]);
  const bar=(v,c,t)=>`<div class="wk14-bar" style="height:${Math.round((v/maxV)*110)}px;background:${c};" title="${t}: ${v}">${v?`<span>${v}</span>`:''}</div>`;
  return `<div class="chart-card" style="margin-top:20px;">
    <div class="chart-title">📅 آخر 14 يوم — مستلم / مصنّع / مسلَّم <span style="font-size:12px;color:var(--ink-soft);font-weight:700;">— الإجمالي: ${tot(rec)} / ${tot(mfg)} / ${tot(del)}</span></div>
    <div class="wk14-legend"><span><i style="background:#2C7DA0"></i>مستلم</span><span><i style="background:#2F7A4D"></i>مصنّع</span><span><i style="background:#E67E22"></i>مسلَّم</span></div>
    <div class="wk14-chart">${days.map(d=>`<div class="wk14-col"><div class="wk14-bars">${bar(rec[d],'#2C7DA0','مستلم')}${bar(mfg[d],'#2F7A4D','مصنّع')}${bar(del[d],'#E67E22','مسلَّم')}</div><div class="wk14-lbl${d===today?' wk14-today':''}">${d.slice(8,10)}/${d.slice(5,7)}</div></div>`).join('')}</div>

  </div>`;
}

function wasteReportHtml(start,end){
  const num=v=>Number(v)||0;
  const inRange=state.orders.filter(o=>(o.qtyMfg||'').toString().trim()&&o.mfgDate&&o.mfgDate>=start&&o.mfgDate<=end);
  const withWaste=inRange.filter(o=>num(o.wasteQty)>0);
  if(!withWaste.length)return `<div class="chart-card" style="margin-top:14px;"><div class="chart-title">♻️ الفاقد / المرفوض</div><div class="hint">مفيش فاقد مسجّل في الفترة دي. تقدر تسجّله من تعديل الطلب (خانة "فاقد/مرفوض").</div></div>`;
  const agg=(keyFn)=>{
    const m={};

  const tw=withWaste.reduce((s,o)=>s+num(o.wasteQty),0), tm=inRange.reduce((s,o)=>s+num(o.qtyMfg),0);
  return `<div class="chart-card" style="margin-top:14px;"><div class="chart-title">♻️ الفاقد / المرفوض <span style="font-size:12px;color:var(--ink-soft);font-weight:700;">— إجمالي الفاقد ${round2(tw)} من ${round2(tm+tw)} (${round2(tw/(tm+tw)*100)}٪)</span></div>${tbl('حسب القسم',byType)}${tbl('حسب نوع التمر',byDate)}<div class="hint" style="margin-top:6px;">النسبة = الفاقد ÷ (المصنّع + الفاقد). محسوبة على الطلبات اللي اتصنّعت في الفترة.</div></div>`;
}

function inDeliveredPeriod(dateStr,periodValue){
  if(!dateStr)return false;
  if(periodValue==='all')return true;

  const days=periodValue==='week'?7:30;
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-days); cutoff.setHours(0,0,0,0);
  return new Date(dateStr)>=cutoff;

function getFilteredRegistryOrders(){
  const showArchived=!!state.registryShowArchived;
  const allOrders=sortedOrders(showArchived?state.orders:state.orders.filter(o=>!o.archived));
  const term=(state.registrySearchTerm||'').trim().toLowerCase();
  const rf=state.registryFilter||'all';
  const statusF=state.registryStatusFilter||'all';
  const period=state.registryPeriod||'3';
  let base=allOrders;
  if(rf==='urgent')base=allOrders.filter(isUrgentPending);
  else if(rf==='nearing')base=allOrders.filter(o=>isNearingDelay(o));
  else if(rf==='overdue')base=allOrders.filter(o=>isOverdue(o));
  else if(rf==='needs-reminder')base=allOrders.filter(o=>isNearingDelay(o)||isOverdue(o));
  /* "المستودع" (التسكين) خاص بالفاكيوم بس فعليًا — باقي الأنواع (دبس/عجينة/تعقيم) مالهاش تسكين مستودع
     بنفس الطريقة، فمش منطقي نحسبهم ضمن "مصنّع ولم يُسكَّن" */
  else if(rf==='mfg-not-placed')base=allOrders.filter(o=>o.processingType==='فاكيوم'&&(o.qtyMfg||'').toString().trim()&&!(o.placementLocation||'').trim()&&o.status!=='تم التسليم');
  else if(rf==='remaining')base=allOrders.filter(o=>!(o.qtyMfg||'').toString().trim()&&o.status!=='تم التسليم');
  else if(rf==='delivered')base=allOrders.filter(o=>o.status==='تم التسليم');
  else if(rf==='delivered-today')base=allOrders.filter(o=>o.status==='تم التسليم'&&o.statusDate&&isToday(o.statusDate));
  /* "تم التصنيع" هنا بيحسب أي طلب اتكتبت له كمية مصنعة، حتى لو اتسلّم بعد كده — نفس التعريف المستخدم
     بالظبط في صفحات التصنيع (فاكيوم/دبس/عجينة/تعقيم)، عشان العدد يكون متسق: مجموع كل أنواع التصنيع
     في سجل الطلبات لازم يفضل ≥ أي نوع لوحده، مش أقل منه */
  else if(rf==='mfg-done')base=allOrders.filter(o=>(o.qtyMfg||'').toString().trim());
  else if(rf==='wa-sent-today')base=allOrders.filter(o=>o.whatsappSentAt&&isToday(o.whatsappSentAt));

  else if(waFilter==='wa-not-sent')base=base.filter(o=>!o.whatsappSentAt);

    const sf=smartSearchFields(term);
    if(sf)return sf.some(f=>(o[f]||'').toString().toLowerCase().includes(term));
    return (o.receiptNo||'').toLowerCase().includes(term)||
    (o.customerName||'').toLowerCase().includes(term)||
    (o.mobile||'').includes(term);
  }):base;
  /* فلتر "إخفاء المسلّم" — مستقل عن باقي الفلاتر (زي فلتر الواتساب)، مفيد جدًا وانت بتدوري برقم جوال
     عميل في خانة البحث وعايزة تشوفي بس اللي لسه معلّق عنده، من غير كل تاريخه القديم المُسلَّم */

  if(hideDelivered)orders=orders.filter(o=>o.status!=='تم التسليم');

     النهارده مدة أكبر من أو تساوي عدد الأيام المكتوب */
  const durationDays=Number(state.registryDurationFilter||0);

    orders=orders.filter(o=>{
      if(!o.mfgDate||!o.date)return false;

    if(o.status!=='تم التسليم')return false;

  }).length;
  if(cutoff!==null&&!term&&rf==='all'&&statusF==='all'){
    orders=orders.filter(o=>o.status!=='تم التسليم'||!o.date||new Date(o.date)>=cutoff);
